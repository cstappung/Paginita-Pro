<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tráiler Juegos v3</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --neg: #0a0a0f; --nar: #ff5a1f; --ama: #ffd21f; --bla: #f6f3ee; --cel: #33d1ff; --ros: #ff3d7f; --ver: #5cff7a; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #esc { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--neg); font-family: 'Space Grotesk', sans-serif; color: var(--bla); }
  #esc * { box-sizing: border-box; }
  .capa { position: absolute; inset: 0; }
  .toma { position: absolute; overflow: hidden; }
  .toma img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .fondo-borroso img { filter: blur(38px) saturate(1.3) brightness(.3); }
  .titulo { position: absolute; font-family: 'Anton', sans-serif; text-transform: uppercase; line-height: .86; letter-spacing: .005em; white-space: nowrap; }
  .mono { font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: .18em; }
  .chip { position: absolute; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; padding: 10px 18px; }
  .centro { position: absolute; left: 0; right: 0; text-align: center; }
  .barra { position: absolute; left: 0; right: 0; background: #000; }
  #grano { position: absolute; inset: -64px; background-size: 256px 256px; opacity: .07; mix-blend-mode: overlay; pointer-events: none; }
  #vin { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }
  #flash { position: absolute; inset: 0; background: #fff; pointer-events: none; }
  .marco-nav { position: absolute; border-radius: 22px; overflow: hidden; box-shadow: 0 60px 140px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.12); background: #111; }
  .marco-nav .barra-nav { position: absolute; left: 0; right: 0; top: 0; height: 54px; background: #1c1b22; display: flex; align-items: center; gap: 12px; padding: 0 22px; }
  .marco-nav .barra-nav i { width: 16px; height: 16px; border-radius: 50%; display: block; }
  .marco-nav .url { margin-left: 24px; flex: 1; height: 34px; border-radius: 17px; background: #2a2931; color: #cfcbd6; font: 500 20px 'JetBrains Mono', monospace; display: flex; align-items: center; padding: 0 20px; }
  .bsod { position: absolute; inset: 0; background: #0a6ed1; padding: 150px 220px; font-family: 'Space Grotesk', sans-serif; }
  .bsod .cara { font-size: 300px; line-height: 1; font-weight: 500; }
  .bsod p { font-size: 64px; line-height: 1.25; margin: 50px 0 0; max-width: 1400px; font-weight: 500; }
  .bsod small { display: block; margin-top: 70px; font-size: 32px; opacity: .85; }
  .letras { position: absolute; isolation: isolate; background: #000; mix-blend-mode: screen; overflow: hidden; }
  .letras .txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Anton', sans-serif; color: #fff; text-transform: uppercase; line-height: 1; }
  .letras img { position: absolute; mix-blend-mode: multiply; }
  .insignia { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: var(--nar); display: flex; align-items: center; justify-content: center; font: 700 76px 'Space Grotesk', sans-serif; color: #fff; }
  .panel-rk { position: absolute; background: #121626; border: 2px solid rgba(80,220,255,.25); border-radius: 26px; padding: 34px 40px; box-shadow: 0 40px 120px rgba(0,0,0,.6); }
  .panel-rk h3 { margin: 0 0 22px; font: 700 30px 'JetBrains Mono', monospace; letter-spacing: .16em; color: #33d1ff; text-transform: uppercase; }
  .fila-rk { position: absolute; left: 40px; right: 40px; height: 92px; display: flex; align-items: center; gap: 26px; border-bottom: 1px solid rgba(255,255,255,.08); font: 600 44px 'Space Grotesk', sans-serif; color: #e9ecf5; padding: 0 14px; }
  .fila-rk .pos { width: 60px; font: 700 46px 'JetBrains Mono', monospace; }
  .fila-rk .av { width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 700 30px 'Space Grotesk'; color: #fff; }
  .fila-rk .pts { margin-left: auto; font: 700 40px 'JetBrains Mono', monospace; color: #9aa3b8; }
  .fila-rk.yo { background: linear-gradient(90deg, rgba(255,210,31,.28), rgba(255,90,31,.12)); border-radius: 18px; border-bottom: 0; }
  .fila-rk.yo .pts { color: var(--ama); }
  .chip-leg { position: absolute; font: 700 30px 'Space Grotesk', sans-serif; padding: 12px 22px; border-radius: 40px; background: rgba(20,16,30,.8); border: 2px solid #ffd21f; color: #ffd21f; box-shadow: 0 0 30px rgba(255,210,31,.35); }
  .confeti { position: absolute; width: 18px; height: 10px; border-radius: 2px; }
</style>
</head>
<body>
<div id="esc">
  <div class="capa" id="tomas"></div>
  <div class="capa" id="textos"></div>
  <div class="barra" id="bArriba" style="top:0"></div>
  <div class="barra" id="bAbajo" style="bottom:0"></div>
  <div id="grano"></div>
  <div id="vin"></div>
  <div id="flash"></div>
</div>
<script>
/* Tráiler de lanzamiento de Juegos. Todo se calcula a partir de t (segundos),
   así cada cuadro se puede renderizar por separado. 120 BPM: pulso = 0.5 s. */
const FPS = 30, DUR = 112, W = 1920, H = 1080, PULSO = 0.5;
// Tomas grabadas: carpeta de cuadros a 30 fps (1920×1080) y su duración en cuadros.
// Se completa desde fuera con window.CLIPS = { nombre: { n, enfoque:[x,y,w,h], vertical } }.
const CLIPS = window.CLIPS || {};

const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eOutX = k => k === 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eIn = k => k * k * k;
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const azar = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function cuadro(nombre, seg) {
  const c = CLIPS[nombre]; if (!c) return null;
  const i = ((Math.floor(seg * FPS) % c.n) + c.n) % c.n;   // en bucle
  return `clips/${nombre}/${String(i + 1).padStart(4, '0')}.jpg`;
}

/* Una toma: recorta el enfoque del clip para cubrir la caja (x,y,w,h),
   con empuje de cámara (zoom) y desplazamiento opcional. */
function toma(nombre, seg, caja, o = {}) {
  const c = CLIPS[nombre]; if (!c) return '';
  const [fx, fy, fw, fh] = o.enfoque || c.enfoque || [0, 0, W, H];
  const [bx, by, bw, bh] = caja;
  const zoom = o.zoom || 1;
  const esc = Math.max(bw / fw, bh / fh) * zoom;
  const cx = fx + fw / 2 + (o.dx || 0), cy = fy + fh / 2 + (o.dy || 0);
  const tx = bw / 2 - cx * esc, ty = bh / 2 - cy * esc;
  const filtro = o.filtro ? `filter:${o.filtro};` : '';
  const rot = o.rot ? `transform:${o.rot};` : '';
  return `<div class="toma ${o.clase || ''}" style="left:${bx}px;top:${by}px;width:${bw}px;height:${bh}px;${rot}${o.estilo || ''}">
    <img src="${cuadro(nombre, seg)}" style="width:${W}px;height:${H}px;transform:translate(${tx}px,${ty}px) scale(${esc});${filtro}">${o.encima || ''}</div>`;
}

/* Toma de pantalla completa. Los juegos verticales van como tarjeta sobre su propio fondo borroso. */
function tomaLlena(nombre, seg, k, o = {}) {
  const c = CLIPS[nombre]; if (!c) return '';
  const zoom = lerp(o.z0 || 1.04, o.z1 || 1.12, k);
  if (!c.vertical) return toma(nombre, seg, [0, 0, W, H], { zoom, dx: lerp(0, o.pan || 0, k), filtro: o.filtro });
  const [fx, fy, fw, fh] = c.enfoque;
  const ch = 900, cw = Math.round(ch * fw / fh);
  const x = W - cw - 200;
  return toma(nombre, seg, [0, 0, W, H], { clase: 'fondo-borroso', zoom: 1.3 }) +
    toma(nombre, seg, [x, (H - ch) / 2, cw, ch], { zoom: lerp(1, 1.04, k),
      rot: `perspective(1800px) rotateY(${-lerp(16, 7, eOut(k))}deg) rotateZ(1.5deg) translateY(${lerp(40, 0, eOutX(k * 3 > 1 ? 1 : k * 3))}px)`,
      estilo: 'border-radius:24px;box-shadow:0 50px 120px rgba(0,0,0,.65),0 0 0 3px rgba(255,255,255,.15);' });
}

/* Texto con separación RGB (rojo/cian) que se apaga al asentarse. */
function rgb(px) { return `text-shadow:${px}px 0 0 rgba(255,40,80,.85),${-px}px 0 0 rgba(40,220,255,.85);`; }

function golpe(texto, t, t0, o = {}) {
  // Texto que entra de golpe: escala 1.35→1, separación RGB, leve sacudida
  const k = prog(t, t0, t0 + .18), e = eOutX(k);
  const s = lerp(o.s0 || 1.35, 1, e) * (1 + (t - t0) * (o.deriva || .03));
  const sac = (1 - k) * 18, sx = (azar(t * 30) - .5) * sac, sy = (azar(t * 30 + 9) - .5) * sac;
  const tam = o.tam || 230, col = o.color || 'var(--bla)';
  const y = o.y ?? (H / 2 - tam * .43);
  return `<div class="centro titulo" style="top:${y}px;font-size:${tam}px;color:${col};transform:translate(${sx}px,${sy}px) scale(${s});${rgb((1 - k) * 14 + 2)}${o.estilo || ''}">${texto}</div>`;
}

/* Rótulo de juego: nombre gigante abajo a la izquierda + etiqueta, entra deslizando. */
function rotulo(nombre, etiqueta, t, t0, t1, color, o = {}) {
  const k = eOutX(prog(t, t0, t0 + .28)), sal = eIn(prog(t, t1 - .12, t1));
  const tam = o.tam || 210;
  const x = lerp(-120, 0, k) - sal * 80;
  return `<div class="titulo" style="left:${96 + x}px;bottom:${118 + (o.sube || 0)}px;font-size:${tam}px;opacity:${1 - sal};${rgb(2 + (1 - k) * 10)}">${nombre}</div>
    <div class="chip" style="left:${100 + lerp(-60, 0, eOutX(prog(t, t0 + .08, t0 + .4)))}px;bottom:${118 + tam * .9 + 18 + (o.sube || 0)}px;background:${color};color:#0a0a0f;opacity:${(1 - sal) * prog(t, t0 + .08, t0 + .2)}">${etiqueta}</div>`;
}

const LOGO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pp-g" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffc21f"/><stop offset="0.42" stop-color="#ff5a1f"/><stop offset="1" stop-color="#ff2d7a"/>
    </linearGradient>
    <radialGradient id="pp-l" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/><stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pp-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a1030" stop-opacity="0"/><stop offset="1" stop-color="#7a1030" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#pp-g)"/>
  <circle cx="50" cy="50" r="48" fill="url(#pp-s)"/>
  <circle cx="50" cy="50" r="48" fill="url(#pp-l)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#fff" stroke-opacity="0.38" stroke-width="1.3" stroke-dasharray="62 6 4 6"/>
  <path d="M38 75 V29 h14 a14.5 14.5 0 0 1 0 29 h-8" fill="none" stroke="#7a1030" stroke-opacity="0.25" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.6 2.2)"/>
  <path d="M38 75 V29 h14 a14.5 14.5 0 0 1 0 29 h-8" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M49 37.6 L57.6 43.5 L49 49.4 Z" fill="#ffd21f" stroke="#ffd21f" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M75 63 l1.6 4.4 l4.4 1.6 l-4.4 1.6 l-1.6 4.4 l-1.6 -4.4 l-4.4 -1.6 l4.4 -1.6 z" fill="#fff"/>
  <circle cx="68" cy="77" r="1.6" fill="#fff" fill-opacity="0.8"/>
</svg>
`;
/* ---------- CASINO RECREADO (v3) ----------
   El Avión sube hasta el espacio y cobra ×27,10; en Plinko caen muchas bolas y una dorada
   cae en ×988 con zoom y cámara lenta. No usa tomas: todo se dibuja a partir del tiempo
   (lt = segundos dentro de la escena), con azar() en lugar de Math.random.
   casinoAvion(lt) y casinoPlinko(lt) devuelven { tomas, textos, flash } como escena(t). */
const DUR_AVION = 6.4, DUR_PLINKO = 8.0;

/* ===== piezas comunes: monedas, bombillas, rodillos de tragamonedas, rayos ===== */
const DEFS_CASINO = `<svg width="0" height="0" style="position:absolute"><defs>
  <radialGradient id="cOro" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff6c2"/><stop offset=".35" stop-color="#ffd54a"/><stop offset=".8" stop-color="#e09a12"/><stop offset="1" stop-color="#a86400"/></radialGradient>
  <radialGradient id="cBola" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffd0e2"/><stop offset=".45" stop-color="#ff4f8b"/><stop offset="1" stop-color="#b0124c"/></radialGradient>
  <radialGradient id="cBolaOro" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fffbe0"/><stop offset=".4" stop-color="#ffd21f"/><stop offset="1" stop-color="#c77800"/></radialGradient>
  <radialGradient id="cHalo" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".3" stop-color="#ffd21f" stop-opacity=".55"/><stop offset="1" stop-color="#ffd21f" stop-opacity="0"/></radialGradient>
  <radialGradient id="cHaloRosa" r="50%"><stop offset="0" stop-color="#ff7ab0" stop-opacity=".7"/><stop offset="1" stop-color="#ff4f8b" stop-opacity="0"/></radialGradient>
  <linearGradient id="cTraza" x1="0" x2="1" y1="1" y2="0"><stop offset="0" stop-color="#ff9f43"/><stop offset="1" stop-color="#ff3d6e"/></linearGradient>
  <linearGradient id="cRelleno" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff3d6e" stop-opacity=".38"/><stop offset="1" stop-color="#ff3d6e" stop-opacity="0"/></linearGradient>
  <radialGradient id="cTierra" cx="50%" cy="8%" r="70%"><stop offset="0" stop-color="#3fb4ff"/><stop offset=".25" stop-color="#1e6fc4"/><stop offset=".6" stop-color="#123a75"/><stop offset="1" stop-color="#050c22"/></radialGradient>
  <radialGradient id="cPlaneta" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffc2e8"/><stop offset=".5" stop-color="#c04aa8"/><stop offset="1" stop-color="#3a0d4a"/></radialGradient>
  <g id="cMoneda"><circle r="20" fill="url(#cOro)" stroke="#a86400" stroke-width="2.5"/><circle r="14" fill="none" stroke="#fff2a8" stroke-opacity=".7" stroke-width="2"/>
    <path d="M0 -8 L2.4 -2.6 8 -2.4 3.6 1.2 5 7 0 3.8 -5 7 -3.6 1.2 -8 -2.4 -2.4 -2.6Z" fill="#c98200"/></g>
</defs></svg>`;

// Una moneda que gira (el giro achata el ancho) en (x,y), tamaño r (radio en px)
const moneda = (x, y, r, giro, op = 1) =>
  `<use href="#cMoneda" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(giro * 9 % 30).toFixed(0)}) scale(${(r / 20 * Math.max(.08, Math.abs(Math.cos(giro)))).toFixed(3)} ${(r / 20).toFixed(3)})" opacity="${op.toFixed(2)}"/>`;

/* Explosión de monedas desde (x0,y0) en el instante t0: arcos con gravedad. */
function explosion(t, t0, x0, y0, n, o = {}) {
  let s = ''; const k = t - t0; if (k < 0) return '';
  const fuerza = o.fuerza || 1, sem = o.sem || 0, g = o.g || 1500;
  for (let i = 0; i < n; i++) {
    const d = (azar(i * 3.1 + sem) * .25);               // salen escalonadas
    const u = k - d; if (u < 0) continue;
    const a = -Math.PI / 2 + (azar(i * 7.3 + sem) - .5) * (o.abre || 2.6);
    const v = (600 + azar(i * 1.7 + sem) * 1300) * fuerza;
    const x = x0 + Math.cos(a) * v * u, y = y0 + Math.sin(a) * v * u + .5 * g * u * u;
    if (y > H + 60 || x < -60 || x > W + 60) continue;
    const r = 13 + azar(i * 5.9 + sem) * 17;
    s += moneda(x, y, r, u * (6 + azar(i * 2.2 + sem) * 10) + i, Math.min(1, u * 8));
  }
  return s;
}
/* Lluvia de monedas desde arriba entre t0 y t1. */
function lluvia(t, t0, t1, n, sem = 0) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const nace = t0 + azar(i * 4.7 + sem) * (t1 - t0), u = t - nace; if (u < 0) continue;
    const vy = 380 + azar(i * 2.9 + sem) * 600, y = -60 + vy * u + 500 * u * u;
    if (y > H + 60) continue;
    const x = azar(i * 9.1 + sem) * W + Math.sin(u * 3 + i) * 30;
    s += moneda(x, y, 12 + azar(i * 6.3 + sem) * 16, u * (5 + azar(i + sem) * 9) + i * 1.3);
  }
  return s;
}
/* Marco de bombillas de tragamonedas que se persiguen. */
function bombillas(t, op = 1, inset = 26, paso = 48) {
  if (op <= 0) return '';
  const pts = [], w = W - inset * 2, h = H - inset * 2;
  for (let x = 0; x <= w; x += paso) { pts.push([inset + x, inset]); pts.push([inset + x, H - inset]); }
  for (let y = paso; y < h; y += paso) { pts.push([inset, inset + y]); pts.push([W - inset, inset + y]); }
  const fase = Math.floor(t * 10);
  let s = '';
  pts.forEach(([x, y], i) => {
    const on = (i + fase) % 3 !== 0, col = i % 2 ? '#ffd21f' : '#fff6d8';
    if (on) s += `<circle cx="${x}" cy="${y}" r="17" fill="${col}" opacity=".22"/>`;
    s += `<circle cx="${x}" cy="${y}" r="7.5" fill="${on ? col : '#5a4310'}"/>`;
  });
  return `<svg width="${W}" height="${H}" style="position:absolute;left:0;top:0;opacity:${op}">${s}</svg>`;
}
/* Rayos de sol girando detrás del cartel. */
const rayos = (t, cx, cy, r, op, col = '255,210,31') => op <= 0 ? '' :
  `<div style="position:absolute;left:${cx - r}px;top:${cy - r}px;width:${2 * r}px;height:${2 * r}px;border-radius:50%;opacity:${op};
    background:repeating-conic-gradient(from ${(t * 24) % 360}deg, rgba(${col},.32) 0deg 7deg, rgba(${col},0) 7deg 15deg);
    -webkit-mask:radial-gradient(circle, #000 0%, #000 25%, transparent 70%);mask:radial-gradient(circle, #000 0%, #000 25%, transparent 70%)"></div>`;

/* Contador de tragamonedas: cada dígito es un rodillo que gira y frena en orden. */
function rodillos(texto, t, t0, o = {}) {
  const tam = o.tam || 170, alto = Math.round(tam * 1.05), dur = o.dur || .9, sep = o.sep || .16;
  let i = 0, s = '';
  for (const ch of texto) {
    if (!/\d/.test(ch)) { s += ch === '+' ? `<span style="display:inline-block;height:${alto}px;line-height:${alto}px;font-size:.8em;vertical-align:top;margin-right:.08em">+</span>` : `<span style="display:inline-block;height:${alto}px;line-height:${alto}px;margin:0 .02em">${ch}</span>`; continue; }
    const fin = t0 + dur + i * sep, u = prog(t, t0, fin), meta = +ch + 10 * (6 + i);
    let p = meta - 10 * (6 + i) * Math.pow(1 - u, 2.2);
    if (t > fin) p = meta + Math.sin((t - fin) * 26) * .18 * Math.exp(-(t - fin) * 9);   // rebote al frenar
    const vel = t < fin ? 10 * (6 + i) * 2.2 * Math.pow(1 - u, 1.2) / (fin - t0) : 0;
    const base = Math.floor(p), fr = p - base;
    let col = '';
    for (let k = -1; k <= 1; k++) col += `<div style="height:${alto}px;line-height:${alto}px">${(((base + k) % 10) + 10) % 10}</div>`;
    s += `<span style="display:inline-block;height:${alto}px;overflow:hidden;vertical-align:top">
      <div style="transform:translateY(${(-alto - fr * alto).toFixed(1)}px);filter:blur(${Math.min(6, vel * .1).toFixed(1)}px)">${col}</div></span>`;
    i++;
  }
  return s;
}
/* Cartel BIG WIN / MEGA WIN con letras doradas. */
function cartel(texto, t, t0, y, tam = 230) {
  const k = prog(t, t0, t0 + .32); if (k <= 0) return '';
  const e = eOutX(k), lat = 1 + .035 * Math.sin((t - t0) * 9);
  return `<div class="centro" style="top:${y}px;font-family:'Bungee',sans-serif;font-size:${tam}px;line-height:1;transform:scale(${(lerp(2.2, 1, e) * lat).toFixed(3)}) rotate(${lerp(-8, -3, e).toFixed(2)}deg);opacity:${Math.min(1, k * 3)}">
    <span style="position:relative;display:inline-block">
      <span style="position:absolute;left:0;top:0;color:transparent;-webkit-text-stroke:26px #3a1300;filter:drop-shadow(0 18px 0 #1a0700) drop-shadow(0 0 50px rgba(255,140,0,.7))">${texto}</span>
      <span style="position:relative;color:transparent;background:linear-gradient(180deg,#fffbe0 0%,#ffe36b 30%,#ffb11f 55%,#ff7a00 78%,#ffd21f 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:3px #fff4b0">${texto}</span>
    </span></div>`;
}

    barras = lerp(170, 0, eIO(prog(t, 7.4, 8)));
    const frases = [[4, 'Una página.', 'var(--bla)', 'boxhead2', 8], [5, '+40 juegos.', 'var(--ama)', 'yemasz', 6], [6, 'Cero descargas.', 'var(--bla)', 'worms', 5], [7, '¿Listos?', 'var(--nar)', 'hero', 6]];
    const i = Math.min(3, Math.floor(t - 4)), [t0, txt, col, clip, s] = frases[i], lt = t - t0;
    tomas += toma(clip, s + lt, [0, 0, W, H], { zoom: 1.15 + lt * .08, filtro: `brightness(${.28 + Math.max(0, .5 - lt) * .5}) saturate(1.2)` });
    flash = Math.max(0, .45 - lt * 3);
    if (t >= 7.5) { const n = Math.floor((t - 7.5) * 16), c = MOSAICO[n % MOSAICO.length]; tomas = toma(c, 5 + n * .2, [0, 0, W, H], { zoom: 1.2, filtro: 'brightness(.55) contrast(1.2)' }); flash = (n % 2) * .2; }
    textos += golpe(txt, t, t0, { color: col, tam: i === 1 ? 300 : 230, deriva: t >= 7 ? .12 : .03 });
  }
  // ===== 8–18 ACCIÓN =====
  else if (t < 18) {
    const c = CORTES1.find(c => t >= c.a && t < c.b), lt = t - c.a, k = lt / (c.b - c.a);
    tomas += tomaLlena(c.c, c.s + lt, k, { pan: 30 });
    flash = Math.max(0, .45 - lt * 5);
    tomas += oscuro(.45);
    textos += rotulo(c.n, c.e, t, c.a, c.b, c.col, { tam: c.b - c.a < .9 ? 170 : 210 });
  }
  // ===== 18–32 ANTES → DESPUÉS =====
  else if (t < 32) {
    const g = AD.filter(x => t >= x.t0).pop(), r = antesDespues(t, g);
    tomas += r.tomas; textos += r.textos; flash = r.flash;
  }
  // ===== 32–36 MOSAICO =====
  else if (t < 36) {
    const fase2 = t >= 34, cols = fase2 ? 3 : 2, n = cols * cols, gap = 14;
    const cw = (W - gap * (cols + 1)) / cols, chh = (H - gap * (cols + 1)) / cols;
    for (let i = 0; i < n; i++) {
      const ap = (fase2 ? 34 : 32) + i * .0625 * (fase2 ? 1 : 2), k = eOutX(prog(t, ap, ap + .25));
      if (k <= 0) continue;
      const x = gap + (i % cols) * (cw + gap), y = gap + Math.floor(i / cols) * (chh + gap), clip = MOSAICO[(i + (fase2 ? 0 : 4)) % MOSAICO.length];
      tomas += toma(clip, 4 + (t - 32) + i * .3, [x + (1 - k) * cw * .5, y + (1 - k) * chh * .5, cw * k, chh * k], { zoom: 1.05, estilo: 'border-radius:14px;', filtro: 'brightness(.8)' });
    }
    flash = Math.max(0, .4 - (t - (fase2 ? 34 : 32)) * 4);
    textos += golpe(fase2 ? 'O contra todos.' : 'Juega solo.', t, fase2 ? 34 : 32, { tam: 250, estilo: 'text-shadow:0 10px 60px rgba(0,0,0,.8)' });
  }
  // ===== 36–44 PRO HERO (suena CHINCHONCHIN) =====
  else if (t < 44) {
    const lt = t - 36;
    tomas += toma('hero', P.heroDesde + lt, [0, 0, W, H], { zoom: lerp(1.18, 1.05, eOut(prog(t, 36, 38))), filtro: t < 37 ? `brightness(${lerp(.3, 1, prog(t, 36.6, 37))})` : '' });
    flash = Math.max(0, .6 - lt * 3) + Math.max(0, .3 - Math.abs(t - 43.8) * 3);
    if (t < 37.2) textos += golpe('PRO HERO', t, 36, { tam: 340, color: 'var(--ama)', deriva: .05 });
    else {
      tomas += oscuro(.35);
      textos += rotulo('PRO HERO', 'Tu guitarra · tus canciones', t, 37.2, 43.9, 'var(--ama)', { tam: 190 });
      const k = eOutX(prog(t, 37.6, 38.2));
      textos += `<div class="mono" style="position:absolute;left:${lerp(-500, 96, k)}px;top:86px;font-size:28px;font-weight:700;padding:14px 22px;background:rgba(10,10,15,.75);border-left:6px solid var(--ama)">♪ <span translate="no">CHINCHONCHIN</span> · <span translate="no" style="color:var(--ama)">mellowsynesthesia128</span></div>`;
    }
  }
  // ===== 44–60 CASINO (recreado) =====
  else if (t < 60) {
    if (t < 45) {
      const r = casinoAvion(0);
      tomas += `<div style="position:absolute;inset:0;filter:blur(18px) brightness(.45)">${r.tomas}</div>`;
      textos += golpe('CASINO', t, 44, { tam: 360, color: 'var(--ros)', estilo: 'text-shadow:0 0 80px rgba(255,61,127,.6)' });
      textos += `<div class="centro mono" style="top:${H / 2 + 170}px;font-size:40px;font-weight:700;letter-spacing:.4em;color:var(--ama);opacity:${prog(t, 44.25, 44.5)}">¿TE ATREVES?</div>`;
      flash = Math.max(0, .7 - (t - 44) * 3);
    } else {
      const r = t < 45 + DUR_AVION ? casinoAvion(t - 45) : casinoPlinko(Math.min(DUR_PLINKO - .001, t - 45 - DUR_AVION));
      tomas += r.tomas; textos += r.textos; flash = r.flash || 0;
    }
  }
  // ===== 60–66 MASCOTAS: Michi y Pío =====
  else if (t < 66) {
    tomas += `<div class="capa" style="background:radial-gradient(ellipse at 70% 50%, #2f6b3a 0%, #13241a 55%, #0a0a0f 100%)"></div>`;
    if (t < 63) {
      const lt = t - 60, k = lt / 3;
      tomas += tomaLlena('mascota', P.mascotaDesde + lt, k, {});
      const k1 = eOutX(prog(t, 60.1, 60.6));
      textos += `<div class="titulo" style="left:${lerp(-200, 110, k1)}px;top:250px;font-size:190px;${rgb(2)}">Mascotas</div>
        <div class="titulo" style="left:${lerp(-200, 116, eOutX(prog(t, 60.3, 60.8)))}px;top:420px;font-size:88px;color:var(--ver)">Cuídala. Vístela.<br>Que baile.</div>`;
      if (t > 60.9) textos += `<div class="chip-leg" style="left:${lerp(-400, 116, eOutX(prog(t, 60.9, 61.3)))}px;top:690px">★ Sombrero arcano</div>`;
      if (t > 61.3) textos += `<div class="chip-leg" style="left:${lerp(-400, 116, eOutX(prog(t, 61.3, 61.7)))}px;top:770px">★ Zapatillas cometa</div>`;
      flash = Math.max(0, .5 - lt * 3);
    } else {
      const lt = t - 63, seg = lt < 1.5 ? 1.2 + lt : 7.2 + (lt - 1.5);
      tomas += tomaLlena('pollito', seg, lt / 3, {});
      const k1 = eOutX(prog(t, 63.05, 63.5));
      textos += `<div class="titulo" style="left:${lerp(-200, 110, k1)}px;top:250px;font-size:190px;color:#ffd84d;${rgb(2)}" translate="no">Pío</div>
        <div class="titulo" style="left:${lerp(-200, 116, eOutX(prog(t, 63.2, 63.7)))}px;top:420px;font-size:88px;color:var(--bla)">Pollito bebé.<br>${lt < 1.5 ? 'A comer.' : 'A la ducha.'}</div>`;
      textos += `<div class="chip" style="left:${lerp(-400, 116, eOutX(prog(t, 63.6, 64)))}px;top:690px;background:#ffd84d;color:#0a0a0f">Crece a gallina con cada cuidado</div>`;
      flash = Math.max(0, .5 - lt * 3) + (Math.abs(lt - 1.5) < .08 ? .4 : 0);
    }
  }
  // ===== 66–70 SOBRES (PRODROP) =====
  else if (t < 70) {
    const lt = t - 66;
    const seg = lt < 1.6 ? P.sobreDesde + lt : P.sobreLeg - 0.5 + (lt - 1.6);
    tomas += toma('sobre', seg, [0, 0, W, H], { zoom: lerp(1.1, 1.22, prog(t, 66, 70)) });
    flash = Math.max(0, .5 - lt * 3) + (Math.abs(lt - 1.6) < .1 ? .8 : 0);
    if (t < 67.6) textos += golpe('PRODROP', t, 66, { tam: 260, color: 'var(--bla)', y: 820 });
    else textos += `<div class="chip" style="left:96px;top:86px;background:var(--ama);color:#0a0a0f">God pack · Componentes</div>`;
    if (t > 68.05) textos += golpe('★★ LEGENDARIA', t, 68.05, { tam: 190, color: 'var(--ama)', y: 800 });
  }
  // ===== 70–74 UNO =====
  else if (t < 74) {
    const lt = t - 70;
    tomas += toma('uno', P.unoDesde + lt, [0, 0, W, H], { zoom: lerp(1.08, 1.15, lt / 4) });
    tomas += oscuro(.4);
    textos += rotulo('UNO NO MERCY', 'Salas en vivo · 4 jugadores', t, 70, 74, 'var(--nar)', { tam: 200 });
    flash = Math.max(0, .5 - lt * 3);
  }
  // ===== 74–84 SALAS: un vistazo de cada una =====
  else if (t < 84) {
    const i = Math.min(SALAS3.length - 1, Math.floor((t - 74) / 1.25)), t0 = 74 + i * 1.25, lt = t - t0, [nom, clip, s] = SALAS3[i];
    tomas += toma(clip, s + lt, [0, 0, W, H], { zoom: lerp(1.04, 1.12, lt / 1.25), dx: (i % 2 ? 1 : -1) * 30 * lt });
    tomas += `<div class="capa" style="background:linear-gradient(0deg, rgba(5,5,10,.85) 0%, rgba(5,5,10,.2) 38%, transparent 55%)"></div>`;
    textos += `<div class="mono" style="position:absolute;left:96px;top:86px;font-size:28px;font-weight:700;padding:12px 20px;background:rgba(10,10,15,.82);color:var(--nar)">● Salas en vivo — con tus amigos</div>`;
    textos += golpe(nom, t, t0, { tam: 240, color: i % 2 ? 'var(--ama)' : 'var(--bla)', y: H - 330, estilo: 'text-shadow:0 10px 50px rgba(0,0,0,.9)' });
    flash = Math.max(0, .35 - lt * 3);
  }
  // ===== 84–92 EL RÉCORD =====
  else if (t < 92) {
    if (t < 86.5) {
      tomas += toma('record3', P.recordDesde, [0, 0, W, H], { clase: 'fondo-borroso', zoom: 1.3 });
      const k = eOutX(prog(t, 84.1, 84.7));
      textos += panelRanking(t, lerp(W, W - 940, k), 300, {});
      textos += `<div class="titulo" style="left:110px;top:330px;font-size:150px;opacity:${prog(t, 84.3, 84.6)}">El #1</div>
        <div class="titulo" style="left:110px;top:470px;font-size:150px;color:#e8467c;opacity:${prog(t, 84.8, 85.1)}" translate="no">es de Emma.</div>
        <div class="mono" style="position:absolute;left:116px;top:660px;font-size:30px;font-weight:700;opacity:${prog(t, 85.5, 85.8)}">8.110 puntos en Maratón</div>`;
      flash = Math.max(0, .3 - (t - 84) * 3);
    } else if (t < 91.4) {
      const lt = t - 86.5, seg = P.recordDesde + lt * ((P.recordFin - P.recordDesde) / 4.9);
      tomas += toma('record3', seg, [0, 0, W, H], { zoom: lerp(1.05, 1.18, lt / 4.9) });
      tomas += `<div class="capa" style="box-shadow:inset 0 0 ${200 + 120 * Math.sin(lt * 7)}px rgba(255,40,80,${.25 + .15 * Math.sin(lt * 7)})"></div>`;
      textos += `<div class="mono" style="position:absolute;left:96px;top:86px;font-size:30px;font-weight:700;padding:12px 20px;background:rgba(10,10,15,.8)">GUGU GAGA va por ella…</div>`;
      flash = Math.max(0, .25 - lt * 3);
    } else {
      tomas += `<div class="capa" style="background:#000"></div>`;
    }
  }
  // ===== 92–96 NUEVO #1 =====
  else if (t < 96) {
    const lt = t - 92;
    if (t < 94.4) {
      tomas += `<div class="capa" style="background:radial-gradient(ellipse at 50% 40%, #3a2a05 0%, #120c18 60%, #050508 100%)"></div>`;
      textos += panelRanking(t, (W - 900) / 2, 330, { w: 900, sube: eOutX(prog(t, 92.15, 92.9)) });
      textos += golpe('NUEVO #1', t, 92.0, { tam: 230, color: 'var(--ama)', y: 90, estilo: 'text-shadow:0 0 70px rgba(255,210,31,.7)' });
      textos += confeti(t, 92.15);
      flash = Math.max(0, .9 - lt * 3);
    } else {
      // la tabla de verdad del sitio, ya con GUGU GAGA arriba
      const lt2 = t - 94.4;
      tomas += toma('record3', P.recordTabla + lt2, [0, 0, W, H], { zoom: lerp(1.7, 1.85, lt2 / 1.6), dx: 470, dy: -150 });
      textos += `<div class="chip" style="left:96px;top:86px;background:var(--ama);color:#0a0a0f">En vivo en la página</div>`;
      flash = Math.max(0, .5 - lt2 * 4);
    }
  }
  // ===== 96–100 MONTAJE RÁPIDO =====
  else if (t < 100) {
    const i = Math.min(7, Math.floor((t - 96) / PULSO)), t0 = 96 + i * PULSO, [c, s, n] = MONTAJE[i], lt = t - t0;
    tomas += toma(c, s + lt, [0, 0, W, H], { zoom: lerp(1.25, 1.12, eOut(lt / PULSO)), dx: (i % 2 ? 1 : -1) * 40 * lt });
    flash = Math.max(0, .5 - lt * 8);
    textos += `<div class="titulo" style="left:96px;bottom:110px;font-size:130px;${rgb(3)}">${n}</div>`;
  }
  // ===== 100–112 FINAL =====
  else {
    const k = eOutX(prog(t, 100, 100.9)), fuera = prog(t, 110, 111.6);
    tomas += `<div class="capa" style="background:radial-gradient(ellipse at 50% 55%, #2a1020 0%, #0a0a0f 70%)"></div>`;
    const clipDentro = MOSAICO[Math.floor((t - 100) * 2) % MOSAICO.length];
    const tam = 420, ancho = 1500, alto = 440, x = (W - ancho) / 2, y = 330, fc = cuadro(clipDentro, 5 + (t - 100));
    const esc = lerp(1.5, 1, k) + (t - 100) * .008;
    textos += `<img src="${fc}" style="position:absolute;width:1px;height:1px;opacity:.01;left:0;top:0">
      <div class="titulo" style="left:${x}px;top:${y}px;width:${ancho}px;height:${alto}px;display:flex;align-items:center;justify-content:center;font-size:${tam}px;letter-spacing:.01em;color:transparent;background-image:url(${fc});background-size:${W}px ${H}px;background-position:center;-webkit-background-clip:text;background-clip:text;filter:saturate(1.4) brightness(1.15);transform:scale(${esc});opacity:${1 - fuera}">JUEGOS</div>
      <div class="titulo" style="left:${x}px;top:${y}px;width:${ancho}px;height:${alto}px;display:flex;align-items:center;justify-content:center;font-size:${tam}px;letter-spacing:.01em;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.8);transform:scale(${esc});opacity:${1 - fuera}">JUEGOS</div>`;
    const k1 = eOutX(prog(t, 100.3, 101));
    textos += `<div style="position:absolute;left:0;right:0;top:186px;height:110px;display:flex;align-items:center;justify-content:center;gap:24px;opacity:${k1 * (1 - fuera)}">
      <div style="width:104px;height:104px;flex:none;transform:rotate(${lerp(-90, 0, k1)}deg)">${LOGO}</div>
      <div class="titulo" style="position:static;font-family:'Space Grotesk';font-weight:700;text-transform:none;font-size:80px;letter-spacing:-.03em" translate="no">Paginita-Pro</div></div>`;
    if (t >= 102) { const k2 = eOutX(prog(t, 102, 102.4)); textos += `<div class="chip" style="left:50%;top:810px;font-size:56px;padding:18px 40px;background:var(--nar);color:#fff;transform:translateX(-50%) scale(${lerp(1.4, 1, k2)});opacity:${k2 * (1 - fuera)}">Ya disponible</div>`; }
    if (t >= 103) textos += `<div class="centro mono" style="top:940px;font-size:46px;font-weight:700;opacity:${prog(t, 103, 103.4) * (1 - fuera)}">paginita-pro.cl</div>`;
    flash = Math.max(0, .9 - (t - 100) * 2.5) + (t >= 102 ? Math.max(0, .3 - (t - 102) * 3) : 0);
    if (fuera > 0) tomas += `<div class="capa" style="background:#000;opacity:${fuera}"></div>`;
  }
  return { tomas, textos, flash, barras, grano };
}

/* Grano: una textura de ruido fija que se desplaza en cada cuadro. */
(() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const d = x.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); document.getElementById('grano').style.backgroundImage = `url(${c.toDataURL()})`; })();

window.render = async t => {
  const r = escena(t);
  document.getElementById('tomas').innerHTML = r.tomas;
  document.getElementById('textos').innerHTML = r.textos;
  document.getElementById('flash').style.opacity = Math.min(1, r.flash);
  document.getElementById('bArriba').style.height = document.getElementById('bAbajo').style.height = r.barras + 'px';
  const f = Math.floor(t * FPS);
  document.getElementById('grano').style.transform = `translate(${(azar(f) - .5) * 128}px,${(azar(f + 3) - .5) * 128}px)`;
  await Promise.all([...document.querySelectorAll('#esc img')].map(i => i.decode().catch(() => {})));
  await document.fonts.ready;
};
</script>
