<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tráiler Juegos</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --neg: #0a0a0f; --nar: #ff5a1f; --ama: #ffd21f; --bla: #f6f3ee; --cel: #33d1ff; --ros: #ff3d7f; --ver: #5cff7a; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #esc { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--neg); font-family: 'Space Grotesk', sans-serif; color: var(--bla); }
  #esc * { box-sizing: border-box; }
  .capa { position: absolute; inset: 0; }
  .toma { position: absolute; overflow: hidden; }
  .toma img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .fondo-borroso img { filter: blur(38px) saturate(1.3) brightness(.3); }
  .titulo { position: absolute; font-family: 'Anton', sans-serif; text-transform: uppercase; line-height: .86; letter-spacing: .005em; white-space: nowrap; }
  .mono { font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: .18em; }
  .chip { position: absolute; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; padding: 10px 18px; }
  .centro { position: absolute; left: 0; right: 0; text-align: center; }
  .barra { position: absolute; left: 0; right: 0; background: #000; }
  #grano { position: absolute; inset: -64px; background-size: 256px 256px; opacity: .07; mix-blend-mode: overlay; pointer-events: none; }
  #vin { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }
  #flash { position: absolute; inset: 0; background: #fff; pointer-events: none; }
  .marco-nav { position: absolute; border-radius: 22px; overflow: hidden; box-shadow: 0 60px 140px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.12); background: #111; }
  .marco-nav .barra-nav { position: absolute; left: 0; right: 0; top: 0; height: 54px; background: #1c1b22; display: flex; align-items: center; gap: 12px; padding: 0 22px; }
  .marco-nav .barra-nav i { width: 16px; height: 16px; border-radius: 50%; display: block; }
  .marco-nav .url { margin-left: 24px; flex: 1; height: 34px; border-radius: 17px; background: #2a2931; color: #cfcbd6; font: 500 20px 'JetBrains Mono', monospace; display: flex; align-items: center; padding: 0 20px; }
  .bsod { position: absolute; inset: 0; background: #0a6ed1; padding: 150px 220px; font-family: 'Space Grotesk', sans-serif; }
  .bsod .cara { font-size: 300px; line-height: 1; font-weight: 500; }
  .bsod p { font-size: 64px; line-height: 1.25; margin: 50px 0 0; max-width: 1400px; font-weight: 500; }
  .bsod small { display: block; margin-top: 70px; font-size: 32px; opacity: .85; }
  .letras { position: absolute; isolation: isolate; background: #000; mix-blend-mode: screen; overflow: hidden; }
  .letras .txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Anton', sans-serif; color: #fff; text-transform: uppercase; line-height: 1; }
  .letras img { position: absolute; mix-blend-mode: multiply; }
  .insignia { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: var(--nar); display: flex; align-items: center; justify-content: center; font: 700 76px 'Space Grotesk', sans-serif; color: #fff; }
</style>
</head>
<body>
<div id="esc">
  <div class="capa" id="tomas"></div>
  <div class="capa" id="textos"></div>
  <div class="barra" id="bArriba" style="top:0"></div>
  <div class="barra" id="bAbajo" style="bottom:0"></div>
  <div id="grano"></div>
  <div id="vin"></div>
  <div id="flash"></div>
</div>
<script>
/* Tráiler de lanzamiento de Juegos. Todo se calcula a partir de t (segundos),
   así cada cuadro se puede renderizar por separado. 120 BPM: pulso = 0.5 s. */
const FPS = 30, DUR = 52, W = 1920, H = 1080, PULSO = 0.5;
// Tomas grabadas: carpeta de cuadros a 30 fps (1920×1080) y su duración en cuadros.
// Se completa desde fuera con window.CLIPS = { nombre: { n, enfoque:[x,y,w,h], vertical } }.
const CLIPS = window.CLIPS || {};

const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eOutX = k => k === 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eIn = k => k * k * k;
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const azar = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function cuadro(nombre, seg) {
  const c = CLIPS[nombre]; if (!c) return null;
  const i = ((Math.floor(seg * FPS) % c.n) + c.n) % c.n;   // en bucle
  return `clips/${nombre}/${String(i + 1).padStart(4, '0')}.jpg`;
}

/* Una toma: recorta el enfoque del clip para cubrir la caja (x,y,w,h),
   con empuje de cámara (zoom) y desplazamiento opcional. */
function toma(nombre, seg, caja, o = {}) {
  const c = CLIPS[nombre]; if (!c) return '';
  const [fx, fy, fw, fh] = o.enfoque || c.enfoque || [0, 0, W, H];
  const [bx, by, bw, bh] = caja;
  const zoom = o.zoom || 1;
  const esc = Math.max(bw / fw, bh / fh) * zoom;
  const cx = fx + fw / 2 + (o.dx || 0), cy = fy + fh / 2 + (o.dy || 0);
  const tx = bw / 2 - cx * esc, ty = bh / 2 - cy * esc;
  const filtro = o.filtro ? `filter:${o.filtro};` : '';
  const rot = o.rot ? `transform:${o.rot};` : '';
  return `<div class="toma ${o.clase || ''}" style="left:${bx}px;top:${by}px;width:${bw}px;height:${bh}px;${rot}${o.estilo || ''}">
    <img src="${cuadro(nombre, seg)}" style="width:${W}px;height:${H}px;transform:translate(${tx}px,${ty}px) scale(${esc});${filtro}">${o.encima || ''}</div>`;
}

/* Toma de pantalla completa. Los juegos verticales van como tarjeta sobre su propio fondo borroso. */
function tomaLlena(nombre, seg, k, o = {}) {
  const c = CLIPS[nombre]; if (!c) return '';
  const zoom = lerp(o.z0 || 1.04, o.z1 || 1.12, k);
  if (!c.vertical) return toma(nombre, seg, [0, 0, W, H], { zoom, dx: lerp(0, o.pan || 0, k), filtro: o.filtro });
  const [fx, fy, fw, fh] = c.enfoque;
  const ch = 900, cw = Math.round(ch * fw / fh);
  const x = W - cw - 200;
  return toma(nombre, seg, [0, 0, W, H], { clase: 'fondo-borroso', zoom: 1.3 }) +
    toma(nombre, seg, [x, (H - ch) / 2, cw, ch], { zoom: lerp(1, 1.04, k),
      rot: `perspective(1800px) rotateY(${-lerp(16, 7, eOut(k))}deg) rotateZ(1.5deg) translateY(${lerp(40, 0, eOutX(k * 3 > 1 ? 1 : k * 3))}px)`,
      estilo: 'border-radius:24px;box-shadow:0 50px 120px rgba(0,0,0,.65),0 0 0 3px rgba(255,255,255,.15);' });
}

/* Texto con separación RGB (rojo/cian) que se apaga al asentarse. */
function rgb(px) { return `text-shadow:${px}px 0 0 rgba(255,40,80,.85),${-px}px 0 0 rgba(40,220,255,.85);`; }

function golpe(texto, t, t0, o = {}) {
  // Texto que entra de golpe: escala 1.35→1, separación RGB, leve sacudida
  const k = prog(t, t0, t0 + .18), e = eOutX(k);
  const s = lerp(o.s0 || 1.35, 1, e) * (1 + (t - t0) * (o.deriva || .03));
  const sac = (1 - k) * 18, sx = (azar(t * 30) - .5) * sac, sy = (azar(t * 30 + 9) - .5) * sac;
  const tam = o.tam || 230, col = o.color || 'var(--bla)';
  const y = o.y ?? (H / 2 - tam * .43);
  return `<div class="centro titulo" style="top:${y}px;font-size:${tam}px;color:${col};transform:translate(${sx}px,${sy}px) scale(${s});${rgb((1 - k) * 14 + 2)}${o.estilo || ''}">${texto}</div>`;
}

/* Rótulo de juego: nombre gigante abajo a la izquierda + etiqueta, entra deslizando. */
function rotulo(nombre, etiqueta, t, t0, t1, color, o = {}) {
  const k = eOutX(prog(t, t0, t0 + .28)), sal = eIn(prog(t, t1 - .12, t1));
  const tam = o.tam || 210;
  const x = lerp(-120, 0, k) - sal * 80;
  return `<div class="titulo" style="left:${96 + x}px;bottom:${118 + (o.sube || 0)}px;font-size:${tam}px;opacity:${1 - sal};${rgb(2 + (1 - k) * 10)}">${nombre}</div>
    <div class="chip" style="left:${100 + lerp(-60, 0, eOutX(prog(t, t0 + .08, t0 + .4)))}px;bottom:${118 + tam * .9 + 18 + (o.sube || 0)}px;background:${color};color:#0a0a0f;opacity:${(1 - sal) * prog(t, t0 + .08, t0 + .2)}">${etiqueta}</div>`;
}

/* ---------- LA LÍNEA DE TIEMPO ---------- */
const CORTES1 = [ // drop 1 (8–20 s)
  { a: 8.0,  b: 10.0, c: 'boxhead',     s: 4.6, n: 'PRO BOXHEAD',      e: 'Zombis · diablos · ×28',        col: 'var(--nar)' },
  { a: 10.0, b: 11.0, c: 'yemas',       s: 3.0, n: 'YEMAS',            e: 'Shooter 3D de huevos',           col: 'var(--ama)' },
  { a: 11.0, b: 12.0, c: 'haxball',     s: 3.0, n: 'HAXBALL',          e: 'Fútbol de discos',               col: 'var(--ver)' },
  { a: 12.0, b: 13.5, c: 'worms',       s: 2.0, n: 'CIRCUIT BREAKERS', e: 'Artillería por turnos',          col: 'var(--cel)' },
  { a: 13.5, b: 14.5, c: 'fanal',       s: 3.0, n: 'FANAL',            e: 'Una travesía hacia el alba',     col: 'var(--ama)' },
  { a: 14.5, b: 16.0, c: 'prodefender', s: 5.0, n: 'PRO DEFENDER',     e: '5 reinos · 100 rondas',          col: 'var(--ver)' },
  { a: 16.0, b: 17.0, c: 'tetris',      s: 4.0, n: 'TETRIS CLUB',      e: 'Maratón · sprint · ultra',       col: 'var(--cel)', lado: 'izq' },
  { a: 17.0, b: 18.0, c: 'bbtan',       s: 6.0, n: 'BBTAN',            e: 'Rebota. Rompe. Sube.',           col: 'var(--ros)' },
  { a: 18.0, b: 18.5, c: 'aleteo',      s: 0.8, n: 'ALETEO',           e: 'Solo Club',                      col: 'var(--ama)', lado: 'izq' },
  { a: 18.5, b: 19.0, c: 'snake',       s: 3.0, n: 'SNAKE',            e: 'Solo Club',                      col: 'var(--ver)' },
  { a: 19.0, b: 19.5, c: 'dosmil',      s: 4.0, n: '2048',             e: 'Solo Club',                      col: 'var(--ama)', lado: 'izq' },
  { a: 19.5, b: 20.0, c: 'sortem',      s: 3.0, n: 'SORTEM',           e: 'Arcade edition',                 col: 'var(--ros)' },
];
const CORTES2 = [ // drop 2, golpes de un pulso (32–36 s)
  ['worms', 6.5, 'CIRCUIT BREAKERS'], ['haxball', 6.5, 'HAXBALL'], ['yemas', 7.5, 'YEMAS'], ['boxhead', 9.0, 'PRO BOXHEAD'],
  ['fanal', 7.0, 'FANAL'], ['prodefender', 7.5, 'PRO DEFENDER'], ['bbtan', 7.0, 'BBTAN'], ['tetris', 7.0, 'TETRIS CLUB'],
];
const SALAS = ['UNO', 'CATAN', 'AJEDREZ', 'CLUE', 'POKÉMON', 'CACHO', 'PRESIDENTE', 'MEMAZO'];
const ECONOMIA = [['MONEDAS', 'var(--ama)'], ['LOGROS', 'var(--nar)'], ['MASCOTAS', 'var(--ver)'], ['CASINO', 'var(--ros)'],
                  ['SOBRES', 'var(--cel)'], ['MERCADO', 'var(--ama)'], ['PERFILES', 'var(--nar)'], ['RANKINGS', 'var(--bla)']];
const MOSAICO = ['boxhead', 'worms', 'haxball', 'yemas', 'prodefender', 'fanal', 'tetris', 'bbtan', 'sortem'];

function escena(t) {
  let tomas = '', textos = '', flash = 0, barras = 0, grano = true;

  // ===== INTRO 0–4: insignia del Laboratorio sobre el salón borroso =====
  if (t < 4) {
    tomas += toma('salon', 1 + t * .8, [0, 0, W, H], { clase: 'fondo-borroso', zoom: lerp(1.2, 1.35, t / 4) });
    barras = lerp(250, 170, eIO(prog(t, 0, 4)));
    const k = eOutX(prog(t, .15, .9));
    const op = 1 - prog(t, 3.6, 3.95);
    if (t < 2) {
      textos += `<div class="insignia" style="left:${W / 2 - 520}px;top:${H / 2 - 100}px;width:200px;height:200px;font-size:128px;transform:scale(${lerp(.4, 1, k)});opacity:${k * op}">L</div>
        <div class="titulo" style="left:${W / 2 - 280}px;top:${H / 2 - 96}px;font-family:'Space Grotesk';font-weight:700;text-transform:none;font-size:200px;letter-spacing:-.02em;opacity:${k};clip-path:inset(0 ${100 - eOut(prog(t, .3, 1.2)) * 100}% 0 0)">Laboratorio</div>`;
      tomas += `<div class="capa" style="background:#000;opacity:${1 - prog(t, 0, .6)}"></div>`;
    } else {
      const k2 = eOut(prog(t, 2, 3.2));
      textos += `<div class="centro mono" style="top:${H / 2 - 40}px;font-size:56px;font-weight:700;color:var(--nar);letter-spacing:${lerp(.1, .55, k2)}em;opacity:${prog(t, 2, 2.2) * op}">presenta</div>
        <div class="centro mono" style="top:${H / 2 + 50}px;font-size:30px;letter-spacing:${lerp(.2, .4, k2)}em;opacity:${prog(t, 2.5, 2.8) * op * .7}">salón de juegos · temporada 2026</div>`;
    }
  }
  // ===== SUBIDA 4–8: frases de golpe sobre destellos de juego =====
  else if (t < 8) {
    barras = lerp(170, 0, eIO(prog(t, 7.4, 8)));
    const frases = [[4, 'Una página.', 'var(--bla)', 'boxhead', 7], [5, '+40 juegos.', 'var(--ama)', 'worms', 5], [6, 'Cero descargas.', 'var(--bla)', 'haxball', 5], [7, '¿Listos?', 'var(--nar)', 'yemas', 6]];
    const i = Math.min(3, Math.floor(t - 4)), [t0, txt, col, clip, s] = frases[i];
    const lt = t - t0;
    tomas += toma(clip, s + lt, [0, 0, W, H], { zoom: 1.15 + lt * .08, filtro: `brightness(${.28 + Math.max(0, .5 - lt) * .5}) saturate(1.2)` });
    flash = Math.max(0, .55 - lt * 3);
    if (t >= 7.5) { // estroboscopio antes del drop
      const n = Math.floor((t - 7.5) * 16), c = MOSAICO[n % MOSAICO.length];
      tomas = toma(c, 5 + n * .2, [0, 0, W, H], { zoom: 1.2, filtro: 'brightness(.55) contrast(1.2)' });
      flash = (n % 2) * .25;
    }
    textos += golpe(txt, t, t0, { color: col, tam: i === 1 ? 300 : 230, deriva: t >= 7 ? .12 : .03 });
  }
  // ===== DROP 1 8–20: cortes con rótulo =====
  else if (t < 20) {
    const c = CORTES1.find(c => t >= c.a && t < c.b);
    const lt = t - c.a, k = lt / (c.b - c.a);
    tomas += tomaLlena(c.c, c.s + lt, k, { lado: c.lado, pan: 30 });
    flash = Math.max(0, .45 - lt * 5);
    tomas += `<div class="capa" style="background:linear-gradient(20deg, rgba(0,0,0,.75) 0%, rgba(0,0,0,.35) 35%, transparent 60%)"></div>`;
    textos += rotulo(c.n, c.e, t, c.a, c.b, c.col, { tam: c.b - c.a < .9 ? 170 : 210 });
    textos += `<div class="mono" style="position:absolute;right:96px;top:84px;font-size:22px;font-weight:700;opacity:.8">${String(CORTES1.indexOf(c) + 1).padStart(2, '0')} / ${CORTES1.length}</div>`;
  }
  // ===== MOSAICO 20–24 =====
  else if (t < 24) {
    const fase2 = t >= 22, cols = fase2 ? 3 : 2, n = cols * cols, gap = 14;
    const cw = (W - gap * (cols + 1)) / cols, chh = (H - gap * (cols + 1)) / cols;
    for (let i = 0; i < n; i++) {
      const aparece = (fase2 ? 22 : 20) + i * .0625 * (fase2 ? 1 : 2);
      const k = eOutX(prog(t, aparece, aparece + .25));
      if (k <= 0) continue;
      const x = gap + (i % cols) * (cw + gap), y = gap + Math.floor(i / cols) * (chh + gap);
      const clip = MOSAICO[(i + (fase2 ? 0 : 4)) % MOSAICO.length];
      tomas += toma(clip, 6 + (t - 20) + i * .3, [x + (1 - k) * cw * .5, y + (1 - k) * chh * .5, cw * k, chh * k], { zoom: 1.05, estilo: 'border-radius:14px;' , filtro: 'brightness(.8)' });
    }
    flash = Math.max(0, .5 - (t - (fase2 ? 22 : 20)) * 4);
    textos += golpe(fase2 ? 'O contra todos.' : 'Juega solo.', t, fase2 ? 22 : 20, { tam: 250, estilo: 'text-shadow:0 10px 60px rgba(0,0,0,.8)' });
  }
  // ===== QUIEBRE 24–28: Solo Club y el castigo =====
  else if (t < 28) {
    if (t < 26) {
      tomas += toma('prodefender', 3 + (t - 24) * .5, [0, 0, W, H], { clase: 'fondo-borroso', zoom: 1.3 });
      const k = eOutX(prog(t, 24, 24.6));
      textos += `<div class="centro titulo" style="top:300px;font-size:300px;color:transparent;-webkit-text-stroke:4px var(--bla);transform:scale(${lerp(1.2, 1, k) + (t - 24) * .03});letter-spacing:${lerp(.2, .02, k)}em">Solo Club</div>
        <div class="centro mono" style="top:640px;font-size:30px;font-weight:700;opacity:${prog(t, 24.5, 24.8)}">rankings en vivo · récords verificados · recompensa diaria</div>`;
      flash = Math.max(0, .5 - (t - 24) * 3);
    } else if (t < 27) {
      tomas += toma('tetris', 3 + (t - 26), [0, 0, W, H], { zoom: 1.4, filtro: 'brightness(.2) saturate(.3)' });
      textos += golpe('¿Haces trampa?', t, 26, { tam: 240, color: 'var(--bla)' });
    } else {
      const g = t > 27.75 ? Math.floor((t - 27.75) * 30) : -1;
      const dx = g >= 0 ? (azar(g) - .5) * 120 : 0;
      textos += `<div class="bsod" style="transform:translateX(${dx}px);${g % 2 === 1 ? 'filter:hue-rotate(160deg) invert(.1)' : ''}"><div class="cara">:(</div>
        <p>Tu récord tuvo un problema y no se guardó. Lo revisamos jugada por jugada.</p><small>Código de detención: RECORD_NO_VERIFICADO · El Laboratorio te está mirando</small></div>`;
      grano = true;
    }
  }
  // ===== DROP 2a 28–32: salas en vivo =====
  else if (t < 32) {
    const fondos = [['haxball', 4], ['worms', 4], ['yemas', 5], ['boxhead', 7]];
    const [fc, fs] = fondos[Math.min(3, Math.floor(t - 28))];
    tomas += toma(fc, fs + (t - 28) % 1, [0, 0, W, H], { zoom: 1.12, filtro: 'brightness(.3) saturate(1.3)' });
    const i = Math.min(SALAS.length - 1, Math.floor((t - 28) / PULSO)), t0 = 28 + i * PULSO;
    textos += `<div class="mono" style="position:absolute;left:96px;top:96px;font-size:28px;font-weight:700;color:var(--nar)">● Salas en vivo — con tus amigos</div>`;
    textos += golpe(SALAS[i], t, t0, { tam: 320, color: i % 2 ? 'var(--ama)' : 'var(--bla)' });
    textos += `<div class="mono" style="position:absolute;right:96px;bottom:96px;font-size:24px;opacity:.75">sala ${String(i + 1).padStart(2, '0')} · ${2 + (i * 3) % 6} jugadores</div>`;
    flash = Math.max(0, .35 - (t - t0) * 3);
  }
  // ===== DROP 2b 32–36: golpes de un pulso =====
  else if (t < 36) {
    const i = Math.min(7, Math.floor((t - 32) / PULSO)), t0 = 32 + i * PULSO, [c, s, n] = CORTES2[i];
    const lt = t - t0;
    tomas += toma(c, s + lt, [0, 0, W, H], { zoom: lerp(1.25, 1.12, eOut(lt / PULSO)), dx: (i % 2 ? 1 : -1) * 40 * lt });
    flash = Math.max(0, .6 - lt * 8);
    textos += `<div class="titulo" style="left:96px;bottom:110px;font-size:130px;${rgb(3)}">${n}</div>`;
  }
  // ===== 36–40: el sitio de verdad en un navegador =====
  else if (t < 40) {
    textos += '';
    const k = eOutX(prog(t, 36, 36.8));
    tomas += `<div class="capa" style="background:radial-gradient(ellipse at 70% 40%, #ff5a1f 0%, #8a1d3a 40%, #0a0a0f 80%)"></div>`;
    const bw = 1040, bh = Math.round(bw * 9 / 16) + 54;
    const rot = `perspective(2200px) rotateY(${lerp(-28, -16, eOut(prog(t, 36, 40)))}deg) rotateX(6deg) translateY(${lerp(120, 0, k)}px)`;
    tomas += `<div class="marco-nav" style="left:${W - bw - 60}px;top:${(H - bh) / 2 + 30}px;width:${bw}px;height:${bh}px;transform:${rot};opacity:${k}">
      <div class="barra-nav"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><div class="url">paginita-pro.cl/juegos</div></div>
      ${toma('salon', 3 + (t - 36) * 2.2, [0, 54, bw, bh - 54], { zoom: 1 })}</div>`;
    const t2 = t >= 38;
    textos += `<div class="titulo" style="left:100px;top:${t2 ? 300 : 360}px;font-size:122px;${rgb(2)};transform:translateX(${lerp(-80, 0, eOutX(prog(t, 36, 36.4)))}px)">Todo en<br>el navegador.</div>`;
    if (t2) textos += `<div class="titulo" style="left:100px;top:560px;font-size:80px;color:var(--ama);transform:translateX(${lerp(-80, 0, eOutX(prog(t, 38, 38.3)))}px);${rgb((1 - prog(t, 38, 38.2)) * 10)}">Sin instalar nada.</div>`;
    flash = Math.max(0, .4 - (t - 36) * 3) + (t2 ? Math.max(0, .25 - (t - 38) * 3) : 0);
  }
  // ===== 40–44: la economía =====
  else if (t < 44) {
    const i = Math.min(7, Math.floor((t - 40) / PULSO)), t0 = 40 + i * PULSO, [txt, col] = ECONOMIA[i];
    const c = MOSAICO[(i * 2) % MOSAICO.length];
    tomas += toma(c, 8 + (t - 40), [0, 0, W, H], { zoom: 1.3, filtro: 'brightness(.22) saturate(.6) blur(4px)' });
    tomas += `<div class="capa" style="background:${col};opacity:.14;mix-blend-mode:screen"></div>`;
    textos += golpe(txt, t, t0, { tam: 340, color: col });
    // regla de puntos para el ritmo
    let pts = ''; for (let j = 0; j < 8; j++) pts += `<i style="display:inline-block;width:${j === i ? 46 : 14}px;height:14px;border-radius:7px;margin:0 6px;background:${j <= i ? 'var(--bla)' : 'rgba(255,255,255,.25)'}"></i>`;
    textos += `<div class="centro" style="top:${H - 150}px">${pts}</div>`;
    flash = Math.max(0, .3 - (t - t0) * 3);
  }
  // ===== FINAL 44–52 =====
  else {
    const k = eOutX(prog(t, 44, 44.9));
    const fuera = prog(t, 50.2, 51.6);
    tomas += `<div class="capa" style="background:radial-gradient(ellipse at 50% 55%, #2a1020 0%, #0a0a0f 70%)"></div>`;
    // JUEGOS con el juego corriendo dentro de las letras
    const clipDentro = MOSAICO[Math.floor((t - 44) * 2) % MOSAICO.length];
    const tam = 420, ancho = 1500, alto = 440, x = (W - ancho) / 2, y = 330;
    const fc = cuadro(clipDentro, 5 + (t - 44));
    textos += `<img src="${fc}" style="position:absolute;width:1px;height:1px;opacity:.01;left:0;top:0">
      <div class="titulo" style="left:${x}px;top:${y}px;width:${ancho}px;height:${alto}px;display:flex;align-items:center;justify-content:center;font-size:${tam}px;letter-spacing:.01em;color:transparent;background-image:url(${fc});background-size:${W}px ${H}px;background-position:center;-webkit-background-clip:text;background-clip:text;filter:saturate(1.4) brightness(1.15);transform:scale(${lerp(1.5, 1, k) + (t - 44) * .012});opacity:${1 - fuera}">JUEGOS</div>`;
    textos += `<div class="titulo" style="left:${x}px;top:${y}px;width:${ancho}px;height:${alto}px;display:flex;align-items:center;justify-content:center;font-size:${tam}px;letter-spacing:.01em;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.8);transform:scale(${lerp(1.5, 1, k) + (t - 44) * .012});opacity:${(1 - fuera)}">JUEGOS</div>`;
    const k1 = eOutX(prog(t, 44.3, 45));
    textos += `<div class="insignia" style="left:${W / 2 - 250}px;top:200px;width:84px;height:84px;font-size:52px;opacity:${k1 * (1 - fuera)}">L</div>
      <div class="titulo" style="left:${W / 2 - 150}px;top:204px;font-family:'Space Grotesk';font-weight:700;text-transform:none;font-size:72px;letter-spacing:-.02em;opacity:${k1 * (1 - fuera)}">Laboratorio</div>`;
    if (t >= 46) {
      const k2 = eOutX(prog(t, 46, 46.4));
      textos += `<div class="chip" style="left:50%;top:810px;font-size:56px;padding:18px 40px;background:var(--nar);color:#fff;transform:translateX(-50%) scale(${lerp(1.4, 1, k2)});opacity:${k2 * (1 - fuera)}">Ya disponible</div>`;
    }
    if (t >= 47) textos += `<div class="centro mono" style="top:940px;font-size:46px;font-weight:700;opacity:${prog(t, 47, 47.4) * (1 - fuera)}">paginita-pro.cl</div>`;
    flash = Math.max(0, .9 - (t - 44) * 2.5) + (t >= 46 ? Math.max(0, .3 - (t - 46) * 3) : 0);
    if (fuera > 0) tomas += `<div class="capa" style="background:#000;opacity:${fuera}"></div>`;
  }
  return { tomas, textos, flash, barras, grano };
}

/* Grano: una textura de ruido fija que se desplaza en cada cuadro. */
(() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const d = x.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); document.getElementById('grano').style.backgroundImage = `url(${c.toDataURL()})`; })();

window.render = async t => {
  const r = escena(t);
  document.getElementById('tomas').innerHTML = r.tomas;
  document.getElementById('textos').innerHTML = r.textos;
  document.getElementById('flash').style.opacity = Math.min(1, r.flash);
  document.getElementById('bArriba').style.height = document.getElementById('bAbajo').style.height = r.barras + 'px';
  const f = Math.floor(t * FPS);
  document.getElementById('grano').style.transform = `translate(${(azar(f) - .5) * 128}px,${(azar(f + 3) - .5) * 128}px)`;
  await Promise.all([...document.querySelectorAll('#esc img')].map(i => i.decode().catch(() => {})));
  await document.fonts.ready;
};
</script>
