<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
<script src="../../../i18n.js?v=202610091548"></script>
<script src="../../audio/mando.js?v=mando-2"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2048 — junta las fichas</title>
  <meta name="description" content="Desliza las fichas, junta dos iguales y llega al 2048.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23edc22e'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='900' font-size='11' text-anchor='middle' fill='%23fff'%3E2048%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
  <link rel="stylesheet" href="../conexion.css?v=club-2">
  <script src="../../audio/volumen.js?v=vol-1"></script>
  <script src="../conexion.js?v=club-11"></script>
  <link rel="stylesheet" href="estilo.css?v=dosmil-1">
</head>
<body>
  <div class="shell">
    <div class="layout">
      <main>
        <!-- Cabecera: no es .shell>header ni .intro, porque conexion.css las oculta dentro de Juegos. -->
        <div class="cab">
          <h1 class="logo" translate="no">2048</h1>
          <p class="lema">Junta dos iguales y llega al 2048</p>
        </div>

        <div class="scorebar" role="group" aria-label="Marcador">
          <div class="dato"><small>PUNTOS</small><strong id="nPuntos" translate="no">0</strong><b id="popSuma" class="pop-suma" translate="no" aria-hidden="true"></b></div>
          <div class="dato"><small>MEJOR</small><strong id="nMejor" translate="no">0</strong></div>
          <div class="dato"><small>FICHA</small><strong id="nFicha" translate="no">—</strong></div>
          <button type="button" id="btnNueva" class="mini" title="Empezar de nuevo">↻ Nueva</button>
          <button type="button" id="sound-button" aria-pressed="true" aria-label="Desactivar efectos" title="Efectos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/>
              <path class="ondas" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
              <path class="cruz" d="m16 9 6 6m0-6-6 6"/>
            </svg>
          </button>
        </div>

        <div id="escenario" class="escenario" tabindex="0" role="application" aria-label="El tablero. Desliza o usa las flechas para mover las fichas.">
          <div id="tablero" class="tablero" translate="no" aria-hidden="true"></div>

          <div id="pausa" class="capa" hidden>
            <div class="tarjeta">
              <p class="tit">PAUSA</p>
              <button type="button" id="btnSeguir" class="boton">▶ Seguir</button>
            </div>
          </div>

          <div id="gano" class="capa gano" role="dialog" aria-modal="false" aria-labelledby="ganoTitulo" hidden>
            <p id="ganoTitulo" class="tit">¡2048!</p>
            <p class="frase">Llegaste. La partida sigue si quieres más.</p>
            <button type="button" id="btnSigue" class="boton">▶ Seguir jugando</button>
          </div>

          <div id="fin" class="capa fin" role="dialog" aria-modal="false" aria-labelledby="finTitulo" hidden>
            <p id="finTitulo" class="tit">SIN JUGADAS</p>
            <div class="tarjeta">
              <small>PUNTOS</small><strong id="finPuntos" translate="no">0</strong>
              <small>FICHA MÁS ALTA</small><strong id="finFicha" translate="no">0</strong>
              <em id="finNuevo" class="nuevo" hidden>¡NUEVO RÉCORD!</em>
            </div>
            <p id="finFrase" class="frase"></p>
            <button type="button" id="btnOtra" class="boton">↻ Otra partida</button>
          </div>
        </div>

        <p class="nota" id="nota"></p>
      </main>
      <aside></aside>
    </div>
  </div>
  <script src="motor.js?v=dosmil-1"></script>
  <script src="juego.js?v=dosmil-1"></script>
</body>
</html>
