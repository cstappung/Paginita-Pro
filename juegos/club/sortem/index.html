<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>sortEm — Arcade Edition</title>
  <link rel="stylesheet" href="../conexion.css?v=club-1">
  <script src="../conexion.js?v=club-3"></script>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#10051f;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    body{display:grid;place-items:center;padding:54px 12px 18px;overflow-x:hidden}
    nav{position:fixed;z-index:5;top:0;left:0;right:0;height:42px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#160826e8;border-bottom:1px solid #8338ec88;backdrop-filter:blur(8px)}
    nav a{color:#00f5ff;text-decoration:none;font-weight:700}
    nav span{font-size:12px;color:#c8a9e8}
    /* El lienzo es 800×600 y Phaser lo escala con FIT: aquí solo se decide
       el tamaño de la caja. Tan grande como quepa a lo ancho y a lo alto de
       la pantalla; el alto dentro de Juegos lo mide el script de abajo en la
       ventana de arriba, porque 100vh en el iframe es el iframe mismo. */
    .shell{width:100%;max-width:1700px;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:20px}
    .marco{position:relative;flex:0 0 auto;width:min(100%,calc((100vh - 72px)*4/3))}
    #game{width:100%;aspect-ratio:4/3;box-shadow:0 0 0 2px #8338ec,0 18px 70px #ff006e2e;background:#1a0a2e;overflow:hidden}
    #game canvas{display:block}
    .pantalla{position:absolute;z-index:3;top:8px;right:8px;width:34px;height:34px;border:1px solid #8338ec;border-radius:8px;background:#1a0a2ecc;color:#00f5ff;font-size:18px;line-height:1;cursor:pointer;opacity:.55;transition:opacity .15s}
    .pantalla:hover,.pantalla:focus-visible{opacity:1}
    .marco:fullscreen{width:100vw;height:100vh;display:grid;place-items:center;background:#10051f}
    .marco:fullscreen #game{width:min(100vw,100vh*4/3);box-shadow:none}
    .shell>.club-volver{display:none}
    .club-ranking{background:#1a0a2e;border-color:#8338ec;color:#e9dcff;flex:1 1 100%;max-width:800px;margin:0}
    .club-integrado body{padding:0;display:block}
    .club-integrado .shell{max-width:none;margin:0 auto}
    .club-integrado .marco{width:min(100%,calc(var(--alto-juego,600px)*4/3))}
    .club-integrado .club-ranking{margin:0}
    .club-integrado nav{display:none}
    .error{width:min(800px,100%);padding:24px;border:1px solid #ff006e;background:#2d1b4e;color:#fff;line-height:1.6}
  </style>
</head>
<body>
  <nav><a href="../../../juegos.html">← Juegos</a><span>sortEm · Arcade Edition</span></nav>
  <div class="shell">
    <div class="marco" id="marco">
      <main id="game" aria-label="Juego sortEm"></main>
      <button class="pantalla" id="pantalla" type="button" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
    </div>
  </div>
  <script>
    (function(){
      var marco=document.getElementById('marco'),boton=document.getElementById('pantalla');
      var arriba=null;try{if(window.top!==window&&window.top.innerHeight)arriba=window.top;}catch(e){}
      function mide(){if(arriba)document.documentElement.style.setProperty('--alto-juego',Math.max(300,arriba.innerHeight-24)+'px');}
      mide();window.addEventListener('resize',mide);
      if(arriba){arriba.addEventListener('resize',mide);window.addEventListener('pagehide',function(){try{arriba.removeEventListener('resize',mide);}catch(e){}});}
      var pide=marco.requestFullscreen||marco.webkitRequestFullscreen;
      if(!pide){boton.hidden=true;return;}
      boton.onclick=function(){
        if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
        else pide.call(marco);
      };
    })();
  </script>
  <script>
    window.addEventListener('error',function(){
      var game=document.getElementById('game');
      if(game&&!game.querySelector('canvas')) game.innerHTML='<div class="error"><b>No se pudo cargar sortEm.</b><br>Comprueba tu conexión y vuelve a intentarlo.</div>';
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
  <script src="game.js?v=club-2"></script>
</body>
</html>
