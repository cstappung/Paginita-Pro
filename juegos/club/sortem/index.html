<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
<script src="../../../i18n.js?v=202610060028"></script>
<script src="../../audio/mando.js?v=mando-2"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>sortEm — Arcade Edition</title>
  <link rel="stylesheet" href="../conexion.css?v=club-2">
  <script src="../../audio/volumen.js?v=vol-1"></script>
  <script src="../conexion.js?v=club-11"></script>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#10051f;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    body{display:grid;place-items:center;padding:54px 12px 18px;overflow-x:hidden}
    nav{position:fixed;z-index:5;top:0;left:0;right:0;height:42px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#160826e8;border-bottom:1px solid #8338ec88;backdrop-filter:blur(8px)}
    nav a{color:#00f5ff;text-decoration:none;font-weight:700}
    nav span{font-size:12px;color:#c8a9e8}
    /* El lienzo es 1000×600 y Phaser lo escala con FIT: aquí solo se decide
       la caja, tan grande como quepa a lo ancho y a lo alto. Dentro de Juegos
       el iframe ocupa la ventana entera (html.jg-sortem en juegos.html), así
       que 100vh es la pantalla y no hace falta medir la de arriba. Solo el
       juego: la clasificación está en la pestaña Clasificación del sitio. */
    .shell{width:100%;display:flex;justify-content:center}
    .marco{width:min(100%,calc((100vh - 72px)*5/3))}
    #game{width:100%;aspect-ratio:5/3;box-shadow:0 0 0 2px #8338ec,0 18px 70px #ff006e2e;background:#1a0a2e;overflow:hidden}
    #game canvas{display:block}
    .club-ranking,.shell>.club-volver{display:none}
    .club-integrado,.club-integrado body{height:100%;overflow:hidden}
    .club-integrado body{padding:0;display:grid;place-items:center}
    .club-integrado .marco{width:min(100vw,100vh*5/3)}
    .club-integrado #game{box-shadow:none}
    .club-integrado nav{display:none}
    .club-integrado .shell>.club-volver{display:block;position:fixed;z-index:5;top:10px;left:12px;margin:0;padding:6px 10px;border:1px solid #8338ec;border-radius:8px;background:#1a0a2ecc;color:#00f5ff;font:700 12px ui-monospace,Menlo,Consolas,monospace;opacity:.6;transition:opacity .15s}
    .club-integrado .shell>.club-volver:hover,.club-integrado .shell>.club-volver:focus-visible{opacity:1}
    .error{width:min(800px,100%);padding:24px;border:1px solid #ff006e;background:#2d1b4e;color:#fff;line-height:1.6}
  </style>
</head>
<body>
  <nav><a href="../../../juegos.html">← Juegos</a><span>sortEm · Arcade Edition</span></nav>
  <div class="shell">
    <div class="marco">
      <main id="game" aria-label="Juego sortEm"></main>
    </div>
  </div>
  <script>
    window.addEventListener('error',function(){
      var game=document.getElementById('game');
      if(game&&!game.querySelector('canvas')) game.innerHTML='<div class="error"><b>No se pudo cargar sortEm.</b><br>Comprueba tu conexión y vuelve a intentarlo.</div>';
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
  <script src="motor.js?v=sortem-6"></script>
  <script src="game.js?v=sortem-6"></script>
</body>
</html>
