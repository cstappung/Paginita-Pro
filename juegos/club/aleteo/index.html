<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
<script src="../../../i18n.js?v=202610080411"></script>
<script src="../../audio/mando.js?v=mando-2"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aleteo — vuela de vuelta al nido</title>
  <meta name="description" content="Un pajarito vuelve al nido entre tubos. Mientras más lejos llega, más oscuro se pone el cielo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233fb6f5'/%3E%3Cellipse cx='15' cy='17' rx='10' ry='8' fill='%23ffd23f' stroke='%23173052' stroke-width='2'/%3E%3Ccircle cx='19' cy='14' r='2.4' fill='%23fff' stroke='%23173052'/%3E%3Cpath d='M23 17h6l-6 3z' fill='%23ff7a1a' stroke='%23173052'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
  <link rel="stylesheet" href="../conexion.css?v=club-2">
  <script src="../../audio/volumen.js?v=vol-1"></script>
  <script src="../conexion.js?v=club-11"></script>
  <link rel="stylesheet" href="estilo.css?v=aleteo-2">
</head>
<body>
  <div class="shell">
    <div class="layout">
      <main>
        <!-- Cabecera: no es .shell>header ni .intro, porque conexion.css las oculta dentro de Juegos. -->
        <div class="cab">
          <h1 class="logo"><span class="logo-ave" aria-hidden="true"></span><span id="logoT" class="logo-t" translate="no">ALETEO</span></h1>
          <p id="lema" class="lema">Vuela de vuelta al nido</p>
        </div>

        <div class="scorebar" role="group" aria-label="Marcador">
          <div class="dato"><small id="etMejor">MEJOR</small><strong id="nMejor" translate="no">0</strong></div>
          <div class="dato"><small id="etMedalla">MEDALLA</small><strong id="nMedalla">—</strong></div>
          <div class="dato"><small id="etVuelos">VUELOS</small><strong id="nVuelos" translate="no">0</strong></div>
          <button type="button" id="sound-button" aria-pressed="true" aria-label="Desactivar música y efectos" title="Música y efectos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/>
              <path class="ondas" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
              <path class="cruz" d="m16 9 6 6m0-6-6 6"/>
            </svg>
          </button>
        </div>

        <!-- El escenario: el lienzo y las capas que van encima. -->
        <div id="escenario" class="escenario">
          <canvas id="lienzo" tabindex="0" role="application" aria-label="El cielo. Aletea para pasar entre los tubos." translate="no"></canvas>
          <p id="piensa" class="piensa" aria-live="polite"></p>

          <div id="listo" class="capa listo">
            <p class="listo-tit">¿Listo?</p>
            <div class="mano" aria-hidden="true"><i></i></div>
            <p id="listoTecla" class="listo-tecla">Clic o Espacio para aletear</p>
          </div>

          <div id="pausa" class="capa pausa" hidden>
            <div class="tarjeta">
              <p class="tit">PAUSA</p>
              <button type="button" id="btnSeguir" class="boton">▶ Seguir</button>
            </div>
          </div>

          <div id="fin" class="capa fin" role="dialog" aria-modal="false" aria-labelledby="finTitulo" hidden>
            <p id="finTitulo" class="tit fin-tit">FIN DEL VUELO</p>
            <div class="tarjeta fin-tarjeta">
              <div class="fin-medalla">
                <small id="finMedallaEt">MEDALLA</small>
                <div id="finMedalla" class="medalla vacia"><b>—</b></div>
              </div>
              <div class="fin-cifras">
                <small>PUNTOS</small>
                <strong id="finPuntos" translate="no">0</strong>
                <small><span id="finMejorEt">MEJOR</span> <em id="finNuevo" class="nuevo" hidden>NUEVO</em></small>
                <strong id="finMejor" translate="no">0</strong>
              </div>
            </div>
            <p id="finFrase" class="fin-frase"></p>
            <button type="button" id="btnOtra" class="boton">↻ Volar otra vez</button>
          </div>
        </div>

        <p class="nota" id="nota"></p>
      </main>
      <aside></aside>
    </div>
  </div>
  <script src="lore.js?v=aleteo-1"></script>
  <script src="motor.js?v=aleteo-1"></script>
  <script src="musica.js?v=aleteo-1"></script>
  <script src="juego.js?v=aleteo-3"></script>
</body>
</html>
