html[data-tema=oscuro] .jg-ban{box-shadow:0 0 0 1px var(--os-borde),0 14px 40px #0008}

/* ---- Últimos tops: quién se subió al podio del club ---- */
.jg-tops{grid-area:tops;min-width:0;margin:0 0 22px;padding:14px 16px 10px;border:1px solid #e4dfeb;border-radius:18px;background:#fff}
.jg-tops header{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:8px}
.jg-tops h2{margin:0;font-size:17px;letter-spacing:-.2px;color:var(--jg-ink)}
.jg-tops header small{flex:1;font-size:12px;color:var(--jg-muted)}
.jg-tops header a{font-size:12.5px;font-weight:700;color:var(--jg-purple);text-decoration:none}
.jg-tops header a:hover{text-decoration:underline}
.jg-tops-lista{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 14px}
.jg-tops-lista>.jg-nada{grid-column:1/-1;margin:4px 0 6px;font-size:13px;color:var(--jg-muted)}
.jg-tops-lista>.jg-nada a{color:var(--jg-purple)}
/* El marco dice el puesto: oro con un aura que respira para el 1.º,
   plata y cobre lisos para el 2.º y el 3.º. */
.jg-top{position:relative;display:flex;align-items:center;gap:10px;min-width:0;padding:7px 8px;border-radius:12px;background:#f7f5fb;border:2px solid transparent}
.jg-top.p1{border-color:#e2b23a;background:linear-gradient(90deg,#fff4cf,#fffaf0);box-shadow:0 0 0 1px #fff3c4 inset,0 0 10px 1px #f5c54299;animation:jg-top-aura 2.4s ease-in-out infinite}
.jg-top.p1:after{content:"";position:absolute;inset:-5px;border-radius:16px;pointer-events:none;background:conic-gradient(from var(--jg-ang,0deg),#ffd86b00 0 70%,#ffe9a0 82%,#ffd86b00 94%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);padding:3px;animation:jg-top-gira 3.2s linear infinite;opacity:.9}
.jg-top.p1 .jg-top-quien{border-radius:50%;box-shadow:0 0 0 2px #e2b23a,0 0 10px 2px #f5c542aa}
.jg-top.p2{border-color:#b9c0cb;background:linear-gradient(90deg,#eef1f5,#f7f8fa)}
.jg-top.p2 .jg-top-quien{border-radius:50%;box-shadow:0 0 0 2px #b9c0cb}
.jg-top.p3{border-color:#c07a45;background:linear-gradient(90deg,#f8e6d8,#fbf4ee)}
.jg-top.p3 .jg-top-quien{border-radius:50%;box-shadow:0 0 0 2px #c07a45}
@property --jg-ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes jg-top-gira{to{--jg-ang:360deg}}
@keyframes jg-top-aura{0%,100%{box-shadow:0 0 0 1px #fff3c4 inset,0 0 8px 0 #f5c54288}50%{box-shadow:0 0 0 1px #fff3c4 inset,0 0 18px 4px #f5c542cc}}
@media(prefers-reduced-motion:reduce){.jg-top.p1,.jg-top.p1:after{animation:none}}
.jg-top-med{font-size:20px;line-height:1;flex:none}
.jg-top-quien{flex:none;cursor:pointer;display:inline-flex}
.jg-top-txt{min-width:0;font-size:12.5px;line-height:1.35;color:#4b4560}
.jg-top-txt b{color:var(--jg-ink);cursor:pointer}
.jg-top-txt b:hover{text-decoration:underline}
.jg-top-txt small{display:block;font-size:11.5px;color:var(--jg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:720px){.jg-tops header small{flex-basis:100%;order:3}.jg-tops{padding:12px}}
html[data-tema=oscuro] .jg-tops{background:var(--os-sup);border-color:var(--os-borde)}

/* ---- Monedas: saldo en la cabecera, top en el vestíbulo, pestaña #monedas ---- */
.jg-saldo{color:#f5c542!important;font-weight:700;font-variant-numeric:tabular-nums}
.jg-racha-chip{display:inline-flex;align-items:center;margin-left:7px;padding:1px 7px 1px 5px;border-radius:99px;background:#ff7a1a26;color:#ff9a3d;font-size:12px;font-weight:800}
.jg-racha-chip.falta{filter:grayscale(.6);animation:jgRachaTitila 1.6s ease-in-out infinite}
@keyframes jgRachaTitila{50%{filter:none;background:#ff7a1a44}}
.jg-racha{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"f t" "b b" "d d";gap:8px 10px;align-items:center;margin:0 0 10px;padding:10px 12px;border-radius:14px;text-decoration:none!important;color:#7a2e05;background:linear-gradient(120deg,#fff3e0,#ffe2c2);border:1px solid #ffc78a}
.jg-racha:hover{border-color:#ff9a3d}
.jg-racha-fuego{grid-area:f;font-size:28px;line-height:1;filter:drop-shadow(0 2px 6px #ff7a1a66)}
.jg-racha.lista .jg-racha-fuego{animation:jgFuego 1.8s ease-in-out infinite}
.jg-racha:not(.lista):not(.peligro) .jg-racha-fuego{filter:grayscale(1);opacity:.6}
@keyframes jgFuego{50%{transform:scale(1.12) rotate(-4deg)}}
.jg-racha-tx{grid-area:t;display:grid;gap:1px;min-width:0}
.jg-racha-tx b{font-size:15px;color:#b4410a}
.jg-racha-tx small{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-size:12px;color:#8a4a1e}
.jg-racha-tx .jg-moneda{width:1em;height:1em}
.jg-racha-dias{grid-area:d;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}

.jg-tab-cartas{white-space:nowrap}
.jg-pdc{position:relative;margin:0;aspect-ratio:5/7;border-radius:9px;overflow:hidden;background:#140c2b;border:2px solid var(--cc);box-shadow:0 4px 14px #0003;isolation:isolate}
.jg-pdc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.jg-pdc.t2{box-shadow:0 0 0 1px #fff3 inset,0 4px 18px #c26bff55}
.jg-pdc.t3{border-color:transparent;background:linear-gradient(#140c2b,#140c2b) padding-box,conic-gradient(from var(--jg-pdc-a,0deg),#ffcc3d,#ff8ad8,#9be9ff,#a7ffcf,#ffcc3d) border-box;box-shadow:0 4px 22px #ffcc3d66}
@property --jg-pdc-a{syntax:'<angle>';inherits:false;initial-value:0deg}
.jg-pdc.t3{animation:jgPdcGira 5s linear infinite}
@keyframes jgPdcGira{to{--jg-pdc-a:360deg}}
.jg-pdc.t3::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(115deg,transparent 35%,#ffffff55 48%,transparent 60%);background-size:250% 100%;animation:jgPdcBrillo 3.2s ease-in-out infinite}
@keyframes jgPdcBrillo{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.jg-pdc figcaption{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px 6px 5px;background:linear-gradient(transparent,#000c 60%);color:#fff;line-height:1.15}
.jg-pdc figcaption b{display:block;font-size:10.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-pdc figcaption small{display:block;font-size:9px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cc)}
.jg-pdc-media{position:absolute;top:4px;left:4px;z-index:3;min-width:20px;height:20px;padding:0 4px;border-radius:6px;display:grid;place-items:center;font:800 12px/1 'IBM Plex Mono',monospace;color:#fff;background:#0b0618e6;box-shadow:0 0 0 1px #fff6}

.jg-pf-cartas-fila .jg-pdc-media{min-width:28px;height:28px;font-size:16px;top:7px;left:7px}
.jg-pdc-nota{position:absolute;top:4px;right:4px;z-index:3;min-width:20px;height:20px;padding:0 4px;border-radius:6px;display:grid;place-items:center;font:800 12px/1 'IBM Plex Mono',monospace;color:#10051f;background:var(--gc);box-shadow:0 0 0 2px #fff,0 2px 8px #0006}

@media (prefers-reduced-motion:reduce){.jg-pdc.t3,.jg-pdc.t3::after{animation:none}}
