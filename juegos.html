@keyframes jgGira{to{transform:rotate(1turn)}}
@keyframes jgNeon{50%{filter:brightness(1.25) saturate(1.3)}}
@keyframes jgLatido{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
@keyframes jgTitila{50%{opacity:.25}}
@keyframes jgMini{from{opacity:0;transform:translateY(6px) scale(.98)}}
@keyframes jgHoja{from{transform:translateY(110%)}}

/* La mini tarjeta */
.jg-mini:focus{outline:none}
.jg-mini{position:fixed;z-index:75;width:304px;max-width:calc(100vw - 16px);background:#fff;color:var(--jg-ink,#232137);border-radius:18px;box-shadow:0 22px 60px #1b123059,0 0 0 1px #1b12301a;overflow:hidden;animation:jgMini .18s ease-out;text-align:left}
.jg-mini.hoja{left:8px!important;right:8px;top:auto!important;bottom:8px;width:auto;max-width:none;animation:jgHoja .24s ease-out}
.jg-mini-quieta{position:relative;width:100%;max-width:none;animation:none;box-shadow:0 10px 30px #1b123026,0 0 0 1px #1b12301a}
.jg-mini-x{position:absolute;top:8px;right:8px;z-index:3;width:28px;height:28px;border-radius:50%;border:0;background:#0007;color:#fff;font-size:13px;cursor:pointer}
.jg-mini-fondo{height:84px}
.jg-mini-cab{position:relative;display:flex;gap:12px;align-items:flex-end;padding:0 16px;margin-top:-40px}
.jg-mini-cab .jg-av>img,.jg-mini-cab .jg-av>i{outline:3px solid #fff}
.jg-mini-id{min-width:0;padding-bottom:6px;display:flex;align-items:center;gap:6px}
.jg-mini-id b{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-mini-id small{font:600 10px inherit;color:#fff;background:var(--jg-purple,#7042df);border-radius:99px;padding:2px 7px}
.jg-mini-bio{margin:8px 16px 0;font-size:12.5px;line-height:1.45;color:#4b4760;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.jg-mini-bio.jg-nada{color:#9b97ab;font-style:italic}
.jg-nada{font-size:12.5px;color:#9b97ab;font-style:italic;line-height:1.5}
.jg-mini-vit>.jg-nada,.jg-pf-sec>.jg-nada{margin:0}
.jg-pf-sec>header .btn2,.jg-ped-nota .btn2{height:28px;padding:0 10px;font-size:12px}
.jg-mini-num{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 16px 10px}
.jg-mini-num span{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px;border-radius:12px;background:#f5f3fa;font-size:10.5px;color:#7a7590}
.jg-mini-num b{font-size:17px;color:var(--jg-ink,#232137)}
.jg-mini-vit{display:grid;gap:6px;padding:0 16px}

.jg-mini-btns{display:flex;gap:8px;padding:12px 16px 16px}
.jg-mini-btns .btn,.jg-mini-btns .btn2{flex:1;height:36px}
.jg-mini-quieta .jg-mini-vit{padding-bottom:16px}

/* Las piezas de la vitrina */
.jg-vit{display:flex;gap:10px;align-items:center;min-width:0;padding:7px 10px;border-radius:12px;background:#f6f4fb;border:1px solid #ece8f3;border-left:3px solid #c9b8f5}
.jg-vit.t-r,.jg-vit.t-s{border-left-color:#f4c542}
.jg-vit-i{flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#fff;font-size:18px;line-height:1}
.jg-vit-tx{display:flex;flex-direction:column;min-width:0}
.jg-vit-tx b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-vit-tx small{font-size:11px;color:#7a7590;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-vit-tx em{font-style:normal;font-size:11px;color:#a29db5;margin-top:2px}
.jg-vit.grande{padding:14px;border-radius:16px;gap:14px}
.jg-vit.grande .jg-vit-i{width:52px;height:52px;border-radius:14px;font-size:28px;box-shadow:0 2px 8px #1b12301a}
.jg-vit.grande .jg-vit-tx b{font-size:15px}

/* La página */
.jg-pf{max-width:940px;margin:0 auto;padding-bottom:30px}
.jg-pf-barra{display:flex;gap:8px;align-items:center;margin:4px 0 14px}
.jg-pf-barra .grow{flex:1}
.jg-pf-hero{position:relative;min-height:210px;border-radius:22px;overflow:hidden;display:flex;align-items:flex-end;padding:26px 28px;box-shadow:0 10px 30px #1b123026}
.jg-pf-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#0000004d);pointer-events:none}
.jg-pf-hero:not(.oscuro)::before{background:linear-gradient(180deg,transparent 35%,#ffffff8c)}
.jg-pf-hero-in{position:relative;display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.jg-pf-hero-in>.jg-av>img,.jg-pf-hero-in>.jg-av>i{outline:4px solid #fff}
.jg-pf-id{min-width:0;padding-bottom:4px}
.jg-pf-id h1{margin:0;font-size:32px;line-height:1.1;letter-spacing:-.5px;color:#231a33;overflow-wrap:anywhere}
.jg-pf-id p{margin:8px 0 0;max-width:560px;font-size:14px;line-height:1.5;color:#3b3450}
.jg-pf-hero.oscuro .jg-pf-id h1{color:#fff;text-shadow:0 2px 14px #0008}
.jg-pf-hero.oscuro .jg-pf-id p{color:#ffffffe0;text-shadow:0 1px 8px #0008}
.jg-pf-id p.jg-nada{font-style:italic;opacity:.75;color:inherit}
.jg-pf-num{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.jg-pf-num>div{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid #e4dfeb;box-shadow:inset 0 3px 0 var(--c)}
.jg-pf-num b{font-size:24px;line-height:1.1}.jg-pf-num b small{font-size:13px;color:#9b97ab;font-weight:600}
.jg-pf-num span{font-size:11.5px;color:#7a7590}
.jg-pf-carga{margin-top:16px;text-align:center}
.jg-pf-sec{margin-top:14px;padding:18px 20px;border-radius:18px;background:#fff;border:1px solid #e4dfeb}
.jg-pf-sec>header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.jg-pf-sec>header h2{margin:0;font-size:16px;flex:1}
.jg-pf-sec>header small{font-size:12px;color:#7a7590}
.jg-pf-vit{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.jg-pf-tablas{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.jg-pf-tablas li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:#f8f7fb;border:1px solid #eeeaf4}
.jg-pf-tablas li.p1{background:linear-gradient(90deg,#fff6d0,#fffdf3);border-color:#f2d77a}
.jg-pf-tablas li.p2{background:linear-gradient(90deg,#eef1f5,#fafbfc);border-color:#d5dbe3}
.jg-pf-tablas li.p3{background:linear-gradient(90deg,#fbeadf,#fffaf6);border-color:#ebc6a8}
.jg-pf-puesto{flex:0 0 auto;min-width:30px;text-align:center;font-weight:700;font-size:15px;color:#7a7590}
.jg-pf-tablas li.top .jg-pf-puesto{font-size:20px}
.jg-pf-tn{flex:1;min-width:0;display:flex;flex-direction:column}
.jg-pf-tn b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.jg-pf-tn small{font-size:11px;color:#7a7590}
.jg-pf-tv{font:600 12px 'IBM Plex Mono',monospace;color:#4b4760;white-space:nowrap}
.jg-pf-logros{display:grid;gap:14px}
.jg-pf-lj>header{display:flex;gap:8px;align-items:baseline;margin-bottom:7px}.jg-pf-lj>header b{font-size:13px}.jg-pf-lj>header small{font-size:11px;color:#9b97ab}
.jg-pf-lchips{display:flex;flex-wrap:wrap;gap:6px}
.jg-pf-lchip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 6px;border-radius:99px;background:#f5f3fa;border:1px solid #ebe6f3;font-size:12px;font-weight:600}
.jg-pf-lchip i{font-style:normal;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:#fff;font-size:13px}
.jg-pf-lchip.raro{background:linear-gradient(90deg,#fff6d0,#fff);border-color:#f2d77a}
@media(max-width:760px){
  .jg-pf-hero{min-height:0;padding:70px 18px 18px}
  .jg-pf-hero-in{gap:14px}
  .jg-pf-id h1{font-size:24px}
  .jg-pf-num{grid-template-columns:repeat(3,1fr)}
  .jg-pf-num>div{padding:10px 12px}.jg-pf-num b{font-size:19px}
  .jg-pf-sec{padding:14px}
  .jg-pf-barra .btn2[data-copiar]{display:none}
}

/* El editor del perfil */
.jg-modal.jg-perfil-ed{width:880px}
.jg-ped{display:grid;grid-template-columns:304px 1fr;gap:20px;margin-top:14px;align-items:start}
.jg-ped-prev{position:sticky;top:0}
.jg-ped-prev>small{display:block;margin-bottom:6px;font:600 10.5px inherit;letter-spacing:.6px;text-transform:uppercase;color:#9b97ab}
.jg-ped-tabs{display:flex;gap:4px;background:#ebe7f3;border-radius:100px;padding:4px;margin-bottom:14px}
.jg-ped-tabs button{flex:1;border:0;background:transparent;border-radius:100px;padding:7px 10px;font:600 12.5px inherit;color:#6b6679;cursor:pointer}
.jg-ped-tabs button[aria-selected=true]{background:#fff;color:var(--jg-ink,#232137);box-shadow:0 1px 4px #2a1e4418}
.jg-ped-panel[hidden]{display:none}
.jg-campo textarea{width:100%;box-sizing:border-box;resize:vertical;min-height:54px;padding:8px 10px;border:1px solid #e2e8ec;border-radius:9px;font:13px/1.4 inherit;color:inherit;background:#fff}
.jg-campo>span small{font-weight:400;color:#9b97ab;margin-left:6px}
.jg-ped-rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.jg-ped-op{display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px 8px 10px;border-radius:14px;border:2px solid #ece8f3;background:#fff;cursor:pointer;font:inherit;color:inherit;text-align:center}
.jg-ped-op:hover{border-color:#cdbff1}
.jg-ped-op.on{border-color:var(--jg-purple,#7042df);box-shadow:0 0 0 3px #7042df22}
.jg-ped-op b{font-size:12px}
.jg-ped-op small{font-size:10.5px;color:#8f8aa3;line-height:1.3}
.jg-ped-op.cerrado{cursor:not-allowed;background:#faf9fc}
.jg-ped-op.cerrado .jg-av,.jg-ped-op.cerrado .jg-ped-muestra{filter:grayscale(.7);opacity:.6}
.jg-ped-op.fondo{padding-top:10px}
.jg-ped-muestra{display:block;width:100%;height:52px;border-radius:10px;box-shadow:inset 0 0 0 1px #0000001a}
.jg-ped-nota{margin:0 0 10px;font-size:12.5px;color:#6b6679;line-height:1.5}

.jg-ped-vit{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;max-height:340px;overflow:auto;padding:2px}
.jg-ped-vop{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid #ece8f3;background:#fff;cursor:pointer}
.jg-ped-vop input{margin:0}
.jg-ped-vop>span:last-of-type{display:flex;flex-direction:column;min-width:0}
.jg-ped-vop b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-ped-vop small{font-size:11px;color:#7a7590;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-ped-vop.on{border-color:var(--jg-purple,#7042df);background:#f6f2ff}
.jg-ped-vop em{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--jg-purple,#7042df);color:#fff;font:700 11px/1 inherit;font-style:normal}
.jg-ped-vop .jg-vit-i{background:#f5f3fa}
@media(max-width:760px){
  .jg-ped{grid-template-columns:1fr}
  .jg-ped-prev{position:static}
  .jg-ped-vit{max-height:none}
}
@media(prefers-reduced-motion:reduce){
  .jg-av::before,.jg-av::after,.jg-av>img,.jg-av>i,.jg-mini{animation:none!important}
}
/* Y su gemelo oscuro: solo el cromo; los marcos y fondos son arte. */
html[data-tema=oscuro] .jg-mini{background:var(--os-sup);color:var(--os-tx);box-shadow:0 22px 60px #000a,0 0 0 1px var(--os-borde)}
html[data-tema=oscuro] .jg-mini-cab .jg-av>img,html[data-tema=oscuro] .jg-mini-cab .jg-av>i{outline-color:var(--os-sup)}
html[data-tema=oscuro] .jg-mini-bio{color:var(--os-tx2)}
html[data-tema=oscuro] .jg-nada,html[data-tema=oscuro] .jg-mini-bio.jg-nada{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-mini-num span{background:var(--os-sup2);color:var(--os-tx3)}
html[data-tema=oscuro] .jg-mini-num b,html[data-tema=oscuro] .jg-pf-num b{color:var(--os-tx)}
html[data-tema=oscuro] .jg-vit{background:var(--os-sup2);border-color:var(--os-borde)}
html[data-tema=oscuro] .jg-vit-i,html[data-tema=oscuro] .jg-pf-lchip i{background:var(--os-sup3)}
html[data-tema=oscuro] .jg-vit-tx small,html[data-tema=oscuro] .jg-pf-tn small,html[data-tema=oscuro] .jg-pf-num span{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-pf-num>div,html[data-tema=oscuro] .jg-pf-sec{background:var(--os-sup);border-color:var(--os-borde)}
html[data-tema=oscuro] .jg-pf-tablas li{background:var(--os-sup2);border-color:var(--os-borde)}
html[data-tema=oscuro] .jg-pf-tablas li.p1{background:linear-gradient(90deg,#3a3010,var(--os-sup2));border-color:#6b5a1c}
html[data-tema=oscuro] .jg-pf-tablas li.p2{background:linear-gradient(90deg,#2c3038,var(--os-sup2));border-color:#4a505c}
html[data-tema=oscuro] .jg-pf-tablas li.p3{background:linear-gradient(90deg,#3a2618,var(--os-sup2));border-color:#6b4a30}
html[data-tema=oscuro] .jg-pf-tv{color:var(--os-tx2)}
html[data-tema=oscuro] .jg-pf-lchip{background:var(--os-sup2);border-color:var(--os-borde);color:var(--os-tx)}
html[data-tema=oscuro] .jg-pf-lchip.raro{background:linear-gradient(90deg,#3a3010,var(--os-sup2));border-color:#6b5a1c}
html[data-tema=oscuro] .jg-pf-hero-in>.jg-av>img,html[data-tema=oscuro] .jg-pf-hero-in>.jg-av>i{outline-color:var(--os-fondo)}
html[data-tema=oscuro] .jg-ped-tabs{background:var(--os-sup2)}
html[data-tema=oscuro] .jg-ped-tabs button{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-ped-tabs button[aria-selected=true]{background:var(--os-sup3);color:#fff}
html[data-tema=oscuro] .jg-ped-op,html[data-tema=oscuro] .jg-ped-vop{background:var(--os-sup2);border-color:var(--os-borde)}
html[data-tema=oscuro] .jg-ped-op.cerrado{background:var(--os-sup)}
html[data-tema=oscuro] .jg-ped-vop.on{background:#2a2142;border-color:#8b6cff}
html[data-tema=oscuro] .jg-ped-nota,html[data-tema=oscuro] .jg-ped-op small{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-campo textarea{background:var(--os-sup2);border-color:var(--os-borde2);color:var(--os-tx)}
/* ============================================================
   Ajedrez
   ============================================================ */
/* El tablero a la izquierda y la hoja de jugadas a la derecha; en
   pantalla estrecha la hoja baja debajo. Las placas de los jugadores
   van pegadas al tablero, arriba el de enfrente y abajo tú, como se
   sienta uno a una mesa. */
.jg-aj .jg-tablero.jg-aj-mesa{display:grid;grid-template-columns:minmax(260px,560px) 230px;justify-content:center;justify-items:stretch;align-items:start;gap:22px;padding:22px 18px}
.jg-aj-col{display:flex;flex-direction:column;gap:8px;min-width:0;width:100%}
.jg-aj-tab{position:relative;width:100%}
.jg-aj-svg{display:block;width:100%;max-width:none;border-radius:6px;box-shadow:0 0 0 6px #5b3d24,0 14px 30px #2a1a0c40;touch-action:none;user-select:none;-webkit-user-select:none}
.jg-aj-ult{fill:#f6d047;opacity:.42}
.jg-aj-sel{fill:#4b9cf5;opacity:.45}
.jg-aj-jaque{fill:#e53935;opacity:.55;filter:blur(10px)}
.jg-aj-punto{fill:#1b1208;opacity:.22;pointer-events:none}
.jg-aj-cap{fill:none;stroke:#1b1208;stroke-width:9;opacity:.24;pointer-events:none}
.jg-aj-coord{font:700 21px 'IBM Plex Sans',system-ui,sans-serif;pointer-events:none}
.jg-aj-pz{pointer-events:none}
.jg-aj-mia{cursor:grab}
.jg-aj-fant{pointer-events:none;filter:drop-shadow(0 8px 6px #0006)}
/* La pieza que movió el otro llega deslizándose desde su origen. Va
   en el <g> interior: el exterior lleva el translate de su casilla. */
.jg-aj-llega{animation:jgAjLlega .28s cubic-bezier(.2,.7,.3,1)}
@keyframes jgAjLlega{from{transform:translate(var(--dx),var(--dy))}}
@media (prefers-reduced-motion:reduce){.jg-aj-llega{animation:none}}

.jg-aj-placa{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 2px}
.jg-aj-av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;overflow:hidden;background:var(--c);color:#fff;font-weight:700;box-shadow:0 0 0 2px var(--c)}
.jg-aj-av img{width:100%;height:100%;object-fit:cover}
.jg-aj-quien{display:flex;flex-direction:column;gap:2px;min-width:0}
.jg-aj-quien b{font-size:14px;color:var(--jg-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-aj-caps{display:flex;align-items:center;flex-wrap:wrap;min-height:18px}
.jg-aj-caps em{font-style:normal;font-size:12px;font-weight:700;color:var(--jg-muted);margin-left:5px}
.jg-aj-mini{width:21px;height:21px;margin-right:-7px}
.jg-aj-bando{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid #d9d3e3;color:#6f687f;white-space:nowrap}
.jg-aj-bando.on{background:#1e1d22;border-color:#1e1d22;color:#fff}
.jg-aj-bando.on.w{background:#fbf7ee;border-color:#1e1d22;color:#1e1d22;box-shadow:0 0 0 2px #f6d047}
.jg-aj-bando.on.b{box-shadow:0 0 0 2px #f6d047}

.jg-aj-lado{display:flex;flex-direction:column;gap:12px;min-width:0}
.jg-aj-hoja{border:1px solid #e4dfeb;border-radius:12px;background:#fff;overflow:hidden}
.jg-aj-hoja-t{padding:9px 12px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#716a7f;border-bottom:1px solid #eee9f3}
.jg-aj-movs{list-style:none;margin:0;padding:4px 0;max-height:430px;overflow:auto;font:500 13px 'IBM Plex Mono',ui-monospace,monospace}
.jg-aj-movs li{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;padding:3px 12px}
.jg-aj-movs li:nth-child(even){background:#f6f4fa}
.jg-aj-movs .n{color:#9a94a8}
.jg-aj-movs .on{font-weight:700;color:var(--jg-purple)}
.jg-aj-movs .jg-aj-vacia{display:block;color:#9a94a8;font-family:inherit;font-size:12px}
.jg-aj-aviso{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;border:1px solid #e4dfeb;background:#faf8fd;font-size:12.5px;color:#5b5470;line-height:1.45}
.jg-aj-aviso.on{border-color:#c9b7f6;background:#efe7ff;color:#3b2a66}
.jg-aj-aviso span{display:flex;gap:8px}
.jg-aj-btns{display:flex;gap:8px;flex-wrap:wrap}
.jg-aj-btns .btn2{height:32px}
.jg-aj-btns .btn2:disabled{opacity:.45;cursor:default}
.jg-aj-peligro,.jg-aj-btns .jg-aj-peligro:hover{border-color:#d64545;color:#d64545}
.jg-aj-punto-t{border:1px solid #0f172855}

.jg-aj-corona{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1b120ac4;border-radius:6px;color:#fff;font-weight:700;font-size:15px}
.jg-aj-corona-ops{display:flex;gap:10px}
.jg-aj-op{width:clamp(56px,14vw,84px);aspect-ratio:1;border-radius:12px;border:2px solid #f6d047;background:#eed9b4;cursor:pointer;padding:6px}
.jg-aj-op:hover{background:#f6e6c4;transform:translateY(-2px)}
.jg-aj-op svg{width:100%;height:100%}

@media (max-width:820px){
  .jg-aj .jg-tablero.jg-aj-mesa{grid-template-columns:minmax(0,1fr);padding:14px 8px}
  .jg-aj-col{max-width:560px;margin:0 auto}
  .jg-aj-movs{max-height:150px}
  .jg-aj-svg{box-shadow:0 0 0 4px #5b3d24}
  .jg-aj .jg-barra{flex-wrap:wrap}
}

/* El reloj de cada jugador. Gris mientras no corre, oscuro con el
   turno, rojo cuando queda poco (y ese rojo late si es el que corre). */
.jg-aj-reloj{font:700 21px 'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;min-width:92px;text-align:right;padding:5px 12px;border-radius:9px;background:#ebe7f2;color:#7a738a;letter-spacing:-.5px}
.jg-aj-reloj.on{background:#1e1d22;color:#fff;box-shadow:0 0 0 2px #f6d047}
.jg-aj-reloj.poco{color:#c62828;background:#fde3e1}
.jg-aj-reloj.poco.on{background:#c62828;color:#fff;box-shadow:0 0 0 2px #ff8a80;animation:jgAjPoco 1s steps(2) infinite}
@keyframes jgAjPoco{50%{background:#a31d1d}}
/* El premovimiento va en rojo apagado: es una intención, no una jugada. */
.jg-aj-pre{fill:#d0453a;opacity:.42}
.jg-aj-sel.pre{fill:#d0453a;opacity:.5}
.jg-aj-punto.pre{fill:#7d1a12;opacity:.32}
.jg-aj-cap.pre{stroke:#7d1a12;opacity:.3}
.jg-aj-piezas{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--jg-muted)}
.jg-aj-piezas select{flex:1;height:32px;border:1px solid #ddd9e8;border-radius:8px;background:#fff;color:var(--jg-ink);font:inherit;padding:0 8px}
@media (prefers-reduced-motion:reduce){.jg-aj-reloj.poco.on{animation:none}}
@media (max-width:820px){.jg-aj-reloj{font-size:18px;min-width:78px;padding:4px 9px}.jg-aj-piezas{max-width:320px}}
html[data-tema=oscuro] .jg-aj-reloj{background:var(--os-sup3);color:var(--os-tx3)}
html[data-tema=oscuro] .jg-aj-reloj.on{background:#f4f1fa;color:#17141f}
html[data-tema=oscuro] .jg-aj-reloj.poco{background:#4a1b1b;color:#ff8a80}
html[data-tema=oscuro] .jg-aj-reloj.poco.on{background:#c62828;color:#fff}
html[data-tema=oscuro] .jg-aj-piezas select{background:var(--os-sup2);border-color:var(--os-borde2);color:var(--os-tx)}

/* La portada: cinco piezas en abanico sobre madera. */
.jg-portada-ajedrez{background:radial-gradient(ellipse at center,#8a6440,#2f1d10 75%)}
.jg-art-aj{display:flex;align-items:flex-end;transform:rotate(-8deg)}
.jg-art-aj svg{width:58px;height:62px;margin:0 -6px;filter:drop-shadow(0 8px 6px #0007)}
.jg-art-aj svg:nth-child(2){width:78px;height:84px}
.jg-art-aj svg:nth-child(4){width:84px;height:90px}

/* Tema oscuro: solo el marco; el tablero es de madera en los dos. */
html[data-tema=oscuro] .jg-aj-hoja,html[data-tema=oscuro] .jg-aj-aviso{background:var(--os-sup2);border-color:var(--os-borde2);color:var(--os-tx2)}
html[data-tema=oscuro] .jg-aj-hoja-t{border-bottom-color:var(--os-borde2);color:var(--os-tx3)}
html[data-tema=oscuro] .jg-aj-movs li:nth-child(even){background:#ffffff08}
html[data-tema=oscuro] .jg-aj-movs .on{color:#c4b1ff}
html[data-tema=oscuro] .jg-aj-aviso.on{background:#2a2144;border-color:#4b3a7a;color:#e3d9ff}
html[data-tema=oscuro] .jg-aj-bando{border-color:var(--os-borde2);color:var(--os-tx3)}
html[data-tema=oscuro] .jg-aj-punto-t{border-color:#ffffff66}

/* ============================================================
   Novedades: los tres últimos juegos, lo primero del vestíbulo
   ============================================================ */
/* Ocupa las dos columnas de la rejilla, encima de la marquesina y de
   las salas: va antes que nada porque es lo que cambia de una visita a
   otra. Repite las áreas de `.jg-ves` con una fila más delante. */
.jg-ves{grid-template-areas:"nov nov" "mq lado" "cat lado"}
.jg-nov{grid-area:nov;margin-bottom:28px}
.jg-nov-cab{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:14px}
.jg-nov-cab .jg-eyebrow{flex-basis:100%;color:var(--jg-purple)}
html[data-tema=oscuro] .jg-nov-cab .jg-eyebrow{color:#c4b1ff}
.jg-nov-cab h2{margin:0;font-size:26px;letter-spacing:-.5px;color:var(--jg-ink)}
.jg-nov-cab p{margin:0;font-size:13px;color:var(--jg-muted)}
.jg-nov-lista{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.jg-nov-c{position:relative;display:flex;flex-direction:column;overflow:hidden;border:1px solid #e5e0ee;border-radius:18px;background:#fff;box-shadow:0 1px 2px #2a1e440a;transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s}
.jg-nov-c:hover{transform:translateY(-4px);box-shadow:0 16px 34px #39226d16}
.jg-nov-c:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c);z-index:1}
.jg-nov-c .jg-portada{height:150px;border-radius:0;flex-shrink:0}
.jg-nov-c .jg-portada>*{zoom:.82}
.jg-nov-cuerpo{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px;flex:1}
.jg-nov-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--jg-muted)}
.jg-nov-sello{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;color:#fff;background:var(--c)}
.jg-nov-cuerpo h3{margin:2px 0 0;font-size:19px;letter-spacing:-.3px;color:var(--jg-ink)}
.jg-nov-cuerpo p{margin:0;font-size:12.5px;line-height:1.5;color:#5f5a70;flex:1}
.jg-nov-cuerpo small{font-size:11.5px;color:var(--jg-muted)}
.jg-nov-pie{display:flex;gap:8px;margin-top:8px}
.jg-nov-pie .btn{flex:1}
/* La tarjeta del catálogo a la que lleva «Opciones» brilla un momento. */
.jg-of-brilla{animation:jgOfBrilla 1.6s ease-out}
@keyframes jgOfBrilla{0%,30%{box-shadow:0 0 0 4px var(--c),0 16px 34px #39226d22}100%{box-shadow:0 0 0 0 transparent}}
@media(max-width:1080px){.jg-nov-c .jg-portada{height:126px}.jg-nov-c .jg-portada>*{zoom:.68}}
@media(max-width:900px){
  .jg-ves{grid-template-areas:"nov" "mq" "lado" "cat"}
  .jg-nov-lista{grid-template-columns:1fr;gap:12px}
  .jg-nov-c{flex-direction:row}
  .jg-nov-c:hover{transform:none}
  .jg-nov-c:before{inset:0 auto 0 0;width:4px;height:auto}
  .jg-nov-c .jg-portada{width:118px;height:auto;min-height:100%}
  .jg-nov-c .jg-portada>*{zoom:.5}
  .jg-nov-cuerpo{padding:12px 14px}
  .jg-nov-cuerpo p{font-size:12px}
}
@media (prefers-reduced-motion:reduce){.jg-nov-c,.jg-nov-c:hover{transition:none;transform:none}.jg-of-brilla{animation:none}}
html[data-tema=oscuro] .jg-nov-c{background:var(--os-sup);border-color:var(--os-borde);box-shadow:none}
html[data-tema=oscuro] .jg-nov-c:hover{box-shadow:0 16px 34px #0008}
html[data-tema=oscuro] .jg-nov-cuerpo p{color:var(--os-tx2)}
html[data-tema=oscuro] .jg-nov-cab h2,html[data-tema=oscuro] .jg-nov-cuerpo h3{color:var(--os-tx)}

/* ---- Monedas: saldo en la cabecera, top en el vestíbulo, pestaña #monedas ---- */
.jg-saldo{color:#f5c542!important;font-weight:700;font-variant-numeric:tabular-nums}
.jg-moneda{width:1.1em;height:1.1em;vertical-align:-.2em;flex:none;display:inline-block}
.jg-mo-ves header .jg-moneda{width:20px;height:20px}
.jg-mo-hero strong .jg-moneda{width:.8em;height:.8em;vertical-align:-.05em}
.jg-mo-ves header span{font-size:16px}
.jg-lado-caja.jg-mo-ves>#vesMonedas{display:block;overflow:visible;padding:8px 10px 12px}
#vesMonedas>.jg-nada{padding:10px 8px;margin:0}
.jg-mo-top{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.jg-mo-top li{display:grid;grid-template-columns:30px auto minmax(0,1fr) auto;align-items:center;gap:9px;padding:6px 8px;border-radius:10px}
.jg-mo-top li.jg-yo{background:#f5c54222;box-shadow:inset 0 0 0 1px #f5c54266}
.jg-mo-top.chico li{grid-template-columns:24px auto minmax(0,1fr) auto;gap:8px;padding:4px 6px}
.jg-mo-pos{text-align:center;font-size:13px;color:#8a8499;font-variant-numeric:tabular-nums}
.jg-mo-nom{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.jg-mo-cant{font-variant-numeric:tabular-nums;font-size:13.5px;color:#a8740f;white-space:nowrap}
.jg-mo-tuyo{margin-top:6px;padding-top:6px;border-top:1px dashed #e4dfeb}
.jg-mo-ver{display:block;margin:10px 6px 0;font-size:12.5px;font-weight:600;color:#7042df;text-decoration:none}
.jg-mo-ver:hover{text-decoration:underline}
.jg-mo{max-width:1100px;margin:0 auto;padding:8px 0 40px}
.jg-mo-hero{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;padding:26px 28px;border-radius:22px;color:#fff;background:radial-gradient(circle at 85% 15%,#f5c54255,transparent 55%),linear-gradient(135deg,#2a1a52,#141029)}
.jg-mo-hero small{letter-spacing:.14em;font-size:11px;color:#f5c542;font-weight:700}
.jg-mo-hero strong{display:block;font-size:44px;line-height:1.05;font-variant-numeric:tabular-nums;margin:4px 0}
.jg-mo-hero p{margin:0;color:#d9d2f0;font-size:14px}
.jg-mo-racha{max-width:420px;background:#ffffff14;border:1px solid #ffffff22;border-radius:14px;padding:12px 14px}
.jg-mo-partes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.jg-mo-partes>div{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;background:#fff;border:1px solid #e4dfeb;border-radius:14px;padding:12px 14px}
.jg-mo-partes span{grid-row:span 3;font-size:24px}
.jg-mo-partes b{font-size:20px;font-variant-numeric:tabular-nums}
.jg-mo-partes small{font-weight:700;font-size:12.5px}
.jg-mo-partes em{font-style:normal;font-size:11.5px;color:#8a8499;line-height:1.35}
.jg-mo-cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:900px){.jg-mo-cols{grid-template-columns:minmax(0,1fr)}.jg-mo-hero strong{font-size:36px}}
.jg-mo-caja{background:#fff;border:1px solid #e4dfeb;border-radius:18px;padding:16px 18px}
.jg-mo-caja h2{margin:0 0 10px;font-size:16px}
.jg-mo-reglas h3{margin:14px 0 4px;font-size:13.5px}
.jg-mo-reglas p{margin:4px 0;font-size:13px;line-height:1.55;color:#5a5569}
.jg-mo-pesos{list-style:none;margin:6px 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px;font-size:12.5px}
.jg-mo-pesos li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #e4dfeb;padding:3px 0}
.jg-mo-pesos b{font-variant-numeric:tabular-nums;color:#a8740f}
html[data-tema=oscuro] .jg-mo-partes>div,html[data-tema=oscuro] .jg-mo-caja{background:var(--os-sup);border-color:var(--os-borde);color:var(--os-tx)}
html[data-tema=oscuro] .jg-mo-reglas p,html[data-tema=oscuro] .jg-mo-partes em{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-mo-pesos li{border-color:var(--os-borde2)}
html[data-tema=oscuro] .jg-mo-cant,html[data-tema=oscuro] .jg-mo-pesos b{color:#f5c542}
html[data-tema=oscuro] .jg-mo-tuyo{border-color:var(--os-borde2)}
html[data-tema=oscuro] .jg-mo-ver{color:#c4b1ff}
</style>
</head>

      <button class="btn-ghost" id="btnLogout">Salir</button>

  <div id="viewLogin">

      <button class="tab" id="tabMonedas"><svg class="jg-moneda" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#f5b819" stroke="#9a6a08" stroke-width="1.6"/><circle cx="10" cy="10" r="5.6" fill="#ffd54a" stroke="#c98d10" stroke-width="1.2"/><path d="M8.6 7.2v5.6M11.4 7.2v5.6" stroke="#9a6a08" stroke-width="1.4" stroke-linecap="round"/><path d="M5.2 6.4a6.2 6.2 0 0 1 3.6-2.5" stroke="#fff7d6" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg> Monedas</button>
