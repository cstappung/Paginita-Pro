<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<script src="i18n.js?v=202610260127"></script>
<script src="juegos/audio/mando.js?v=mando-2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juegos — Paginita Pro</title>
<link rel="icon" type="image/png" sizes="32x32" href="marca/favicon-32.png" data-favicon="marca/favicon-32.png" data-favicon-hw="marca/favicon-halloween-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="marca/favicon-64.png" data-favicon="marca/favicon-64.png" data-favicon-hw="marca/favicon-halloween-64.png">
<link rel="apple-touch-icon" href="marca/apple-touch-icon.png">
<!-- Instalable como app (manifest.webmanifest): en Android y el PC con «Instalar», en el iPhone con «Agregar a inicio». Abre Juegos. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Paginita Pro">
<script>
/* El tema se pone antes de pintar nada: si esperara al bundle, la
   página saldría blanca un instante antes de oscurecerse. Sin elección
   guardada sigue al sistema; el botón ☾/☀ de la cabecera la guarda. */
try { var t = localStorage.getItem("jg.tema");
  if (t === "oscuro" || (t !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.dataset.tema = "oscuro";
} catch (e) {}
/* El modo Halloween (juegos/halloween.js), del 1 de octubre al 1 de
   noviembre: también antes de pintar, o la página saldría un instante sin
   disfrazar. Repite `estadoHalloween` en una línea; la prueba
   tests/halloween.test.cjs comprueba que digan lo mismo. */
(function () { var f = /[?&]halloween=([01])/.exec(location.search), d = new Date(), m = d.getMonth(), g = "";
  try { g = localStorage.getItem("jg.halloween") || ""; } catch (e) {}
  if (f ? f[1] === "1" : m === 9 || (m === 10 && d.getDate() === 1)) document.documentElement.dataset.halloween = g === "no" ? "off" : "on";
  /* Y el ícono de la pestaña, que también se disfraza (halloween.js lo
     cambia de nuevo si se apaga desde la cinta). */
  if (document.documentElement.dataset.halloween === "on")
    for (var l = document.querySelectorAll("link[data-favicon-hw]"), i = 0; i < l.length; i++) l[i].href = l[i].getAttribute("data-favicon-hw");
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Lilita+One&family=Caveat:wght@500;700&family=Bungee&family=Cinzel:wght@900&family=Anton&family=Creepster&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Juegos — la hoja de estilo de las seis piezas

     Las clases `.jg-*` las escriben los módulos (escondite, cartas,
     cuadritos, reversi, ranks y el propio arranque) y se definen
     aquí, no en
     JavaScript: una hoja en el HTML se cachea con la página y no
     cuesta un `injectCSS()` como en CSV·Scope, donde el documento es
     un `.dc.html` generado y no hay dónde meterla.

     El armazón (cabecera, tarjeta de login, .card, .row, .btn…) es el
     mismo de informes.html a propósito: las dos páginas son la misma
     aplicación con distinto contenido, y copiar la piel es más barato
     que un archivo común de dos reglas.
     ============================================================ */
  html,body{margin:0;padding:0;height:100%}
  *{box-sizing:border-box}
  body{background:#f2f5f7;color:#1f2933;font-family:'IBM Plex Sans',sans-serif}
  a{color:#0d9488;text-decoration:none}
  a:hover{text-decoration:underline}
  button{font-family:'IBM Plex Sans',sans-serif}
  #app{min-height:100vh;display:flex;flex-direction:column}

  .head{display:flex;align-items:center;gap:16px;height:52px;padding:0 22px;background:#10201f;color:#e8f0ef;flex-shrink:0}
  .logo{display:flex;align-items:center;gap:8px;color:#e8f0ef}
  .logo:hover{color:#fff;text-decoration:none}
  /* El logo de Paginita Pro (marca/); el de Halloween se cambia por CSS. */
  .logo-img{display:block;flex:none;width:30px;height:30px;transition:transform .2s ease}
  .logo:hover .logo-img{transform:rotate(-8deg) scale(1.06)}
  .logo-img.logo-hw{display:none}
  .head-nav{display:flex;gap:16px;font-size:12.5px;color:#9fb5b2;margin-left:10px}
  .head-nav a{color:#9fb5b2}
  .head-nav a:hover{color:#fff;text-decoration:none}
  .head-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px}
  .avatar{width:28px;height:28px;border-radius:50%;background:#0d9488;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;overflow:hidden}
  .btn-ghost{border:none;background:transparent;color:#9fb5b2;cursor:pointer;font-size:12px;padding:5px 8px;border-radius:5px}
  .btn-ghost:hover{background:#ffffff1a;color:#fff}

  main{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:24px 26px 60px}
  h1{font-size:22px;font-weight:600;margin:0 0 5px}
  .lead{font-size:13px;color:#5a6772;margin:0 0 20px;line-height:1.6;max-width:74ch}

  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .tab{padding:8px 14px;border:1px solid #d4dce2;border-radius:8px;background:#fff;font-size:12.5px;font-weight:600;color:#42505c;cursor:pointer}
  .tab.on{border-color:#0d9488;background:#e9f4f2;color:#0d9488}
  .grow{flex:1}
  .inp{height:34px;padding:0 11px;border:1px solid #d4dce2;border-radius:6px;font-size:12.5px;font-family:inherit;background:#fff;color:#1f2933}
  .inp:focus{outline:none;border-color:#0d9488}
  .btn{height:34px;padding:0 14px;border:none;border-radius:6px;background:#0d9488;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer}
  .btn:hover{background:#0f766e}
  .btn2{height:34px;padding:0 12px;border:1px solid #d4dce2;border-radius:6px;background:#fff;color:#42505c;font-size:12.5px;font-weight:600;cursor:pointer}
  .btn2:hover{border-color:#0d9488;color:#0d9488}
  .btn2:disabled,.btn:disabled{opacity:.5;cursor:default}

  .card{background:#fff;border:1px solid #e2e8ec;border-radius:10px;overflow:hidden}
  .row{padding:13px 16px;border-bottom:1px solid #f0f4f6}
  .row:last-child{border-bottom:none}
  .row-top{display:flex;align-items:center;gap:10px}
  .row-title{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.45;word-break:break-word}
  .row-meta{margin-top:5px;font-size:11.5px;color:#8a97a3;line-height:1.6;font-weight:400}
  .pill{flex-shrink:0;font-size:10px;font-weight:700;letter-spacing:.04em;border-radius:99px;padding:3px 8px}
  .mini{border:none;background:transparent;color:#b3bec7;cursor:pointer;font-size:12px;padding:3px 6px;border-radius:5px}
  .mini:hover{background:#f0f4f6;color:#42505c}
  .mini.del:hover{color:#c0392b}
  .vacio{padding:34px 16px;text-align:center;font-size:12.5px;color:#8a97a3;line-height:1.7}
  .aviso{padding:14px 16px;border-radius:9px;background:#fff8ec;border:1px solid #e2c08d66;font-size:12.5px;color:#6b5320;line-height:1.6;margin-bottom:16px}
  .aviso code{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:#00000010;padding:1px 5px;border-radius:4px}

  /* ============================================================
     Vestíbulo
     ============================================================ */

  /* Los desplegables de la tarjeta (cupo, tamaño). Van dentro de la
     tarjeta y no en un diálogo aparte porque son dos elecciones y un
     paso más antes de jugar se nota. */

  .jg-h2{font-size:13px;font-weight:600;color:#5a6772;letter-spacing:.03em;text-transform:uppercase;margin:0 0 10px}
  .jg-p{background:color-mix(in srgb,var(--c,#888) 12%,#fff);border:1px solid color-mix(in srgb,var(--c,#888) 34%,#fff);color:var(--c,#888);font-size:12px;line-height:1}

  /* ============================================================
     Cabecera de la partida
     ============================================================ */
  .jg-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .jg-quienes{display:flex;gap:6px;flex-wrap:wrap}
  .jg-quien-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#42505c;background:#fff;border:1px solid #e2e8ec;border-left:3px solid var(--c,#888);border-radius:99px;padding:4px 11px}
  .jg-quien-chip>img,.jg-quien-chip>i{width:18px;height:18px;border-radius:50%;object-fit:cover;flex-shrink:0}
  .jg-quien-chip>i{display:grid;place-items:center;font:700 10px inherit;font-style:normal;color:#fff;background:var(--c,#888)}
  /* Quien ya no está —se fue o lo echaron— sigue en la fila, tachado:
     quitarlo movería a los demás y nadie sabría qué pasó. */
  .jg-quien-chip.fuera{opacity:.5;text-decoration:line-through;border-left-style:dashed}
  .jg-voto-n{font:600 10.5px 'IBM Plex Mono',monospace;color:#b4232a;background:#fde8e8;border-radius:99px;padding:1px 6px}
  .jg-voto{border:1px solid #e2e8ec;background:#f6f7f9;color:#8a97a3;border-radius:50%;width:22px;height:22px;padding:0;display:grid;place-items:center;font-size:11px;cursor:pointer;margin-right:-5px}
  .jg-voto:hover{background:#fde8e8;border-color:#f3b4b4;color:#b4232a}
  .jg-voto.on{background:#b4232a;border-color:#b4232a;color:#fff}
  /* Con el dedo, 22 px es poco: la zona de toque crece 5 px por lado
     sin que el botón ni la fila de jugadores cambien de tamaño. */
  @media(pointer:coarse){.jg-voto{position:relative}.jg-voto::after{content:"";position:absolute;inset:-5px;border-radius:50%}}
  .jg-mirando{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:11px 16px;border-radius:12px;background:#eef4ff;border:1px solid #c9dafc;color:#2d4a86;font-size:12.5px;line-height:1.5}
  .jg-mirando>span:first-child{font-size:16px}
  .jg-ojo{font-size:14px;line-height:1}
  .jg-fin-exp{color:#b4232a;font-weight:600}
  /* El chat va debajo del tablero, no al lado: al lado le robaba ancho
     justo a los tableros que más lo necesitan. */
  .jg-chat[hidden]{display:none!important}   /* (sala privada de BT3: ni el chat) */
  .jg-chat{margin-top:18px;background:#fff;border:1px solid #e4dfeb;border-radius:16px;overflow:hidden}
  .jg-chat>header{display:flex;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid #efebf5}
  .jg-chat>header h2{font-size:13.5px;margin:0}.jg-chat>header small{font-size:11px;color:#8a97a3}
  .jg-chat-lista{max-height:220px;overflow:auto;overscroll-behavior:contain;padding:10px 16px;display:grid;gap:6px;align-content:start}
  .jg-chat-lista .vacio{padding:14px 0}
  .jg-chat-msg{font-size:12.5px;line-height:1.5;color:#34404b;overflow-wrap:anywhere}
  .jg-chat-msg b{color:var(--c,#555);margin-right:6px}
  .jg-chat-msg b small{font:500 9.5px 'IBM Plex Mono',monospace;color:#8a97a3;background:#f2f4f6;border-radius:99px;padding:1px 6px;margin-left:3px}
  .jg-chat-msg.mio{padding-left:8px;box-shadow:inset 2px 0 var(--c,#555)}
  .jg-chat-form{display:flex;gap:8px;padding:10px 16px;border-top:1px solid #efebf5}
  .jg-chat-form .inp{flex:1;min-width:0}
  .jg-invita{margin-top:16px;padding:16px;background:#fff;border:1px solid #e2e8ec;border-radius:10px;font-size:12.5px;color:#5a6772;line-height:1.6}
  .jg-enlace{display:flex;gap:8px;margin-top:10px}
  .jg-enlace .inp{flex:1;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
  .jg-empezar{margin-top:12px}

  /* El cartel del final es una capa fija sobre la pantalla, no un
     recuadro debajo del tablero: un tablero de cuadritos grande mide
     más de lo que se ve, así que ahí abajo el cartel caía bajo el
     pliegue y la partida parecía acabar sin decir nada. La columna es
     `minmax(0,1fr)` y no la implícita (`auto`): esa crece hasta el
     ancho fijo del cartel, y en un móvil de 360 px el `max-width:100%`
     se medía contra ella y el cartel salía por la derecha. */
  .jg-fin-capa{position:fixed;inset:0;z-index:60;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:18px;background:#0f172899;backdrop-filter:blur(2px);animation:jgVela .2s ease-out}
  .jg-fin{position:relative;width:400px;max-width:100%;max-height:calc(100vh - 36px);overflow:auto;padding:26px 24px 22px;border-radius:14px;text-align:center;box-shadow:0 18px 50px #0f172840;animation:jgEntra .35s ease-out}
  .jg-fin-gano{background:linear-gradient(160deg,#e9f7f2,#d5f0e6);border:1px solid #0d948855}
  .jg-fin-perdi{background:linear-gradient(160deg,#fff,#f2f5f7);border:1px solid #e2e8ec}
  .jg-fin-empate{background:linear-gradient(160deg,#fffaf0,#fdf1dc);border:1px solid #e2c08d66}
  .jg-fin-mirando{background:linear-gradient(160deg,#fff,#eef3f7);border:1px solid #d4dce2}
  /* La ✕ cierra el cartel para esa partida: mirar el tablero final es
     la mitad de la gracia. */
  .jg-fin-x{position:absolute;top:8px;right:8px;width:28px;height:28px;border:none;border-radius:7px;background:#0f172812;color:#42505c;font-size:13px;line-height:1;cursor:pointer}
  .jg-fin-x:hover{background:#0f172822}
  .jg-fin-cara{font-size:46px;line-height:1;margin-bottom:8px;animation:jgCara .5s cubic-bezier(.2,1.5,.4,1)}
  .jg-fin-t{font-size:24px;font-weight:700;line-height:1.2}
  .jg-fin-gano .jg-fin-t{color:#0d9488}
  .jg-fin-perdi .jg-fin-t{color:#5a6772}
  .jg-fin-empate .jg-fin-t{color:#8a6a2a}
  .jg-fin-mirando .jg-fin-t{color:#42505c}
  .jg-fin-sub{font-size:13.5px;font-weight:600;color:#42505c;margin-top:4px}
  .jg-fin-m{font-size:12.5px;color:#5a6772;margin-top:6px;line-height:1.55}
  .jg-fin-marca{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px;padding-top:14px;border-top:1px solid #0f172815}
  .jg-fin-btns{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}

  /* El cartel de «faltan reglas» reusa el del final de partida, pero su
     texto es de leer, no de celebrar: alineado a la izquierda, y el
     enlace a la consola es un `<a>` con pinta de botón. */
  .jg-reglas .jg-fin-m{text-align:left;margin-top:10px}
  .jg-reglas .jg-fin-m code{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:#0f172814;padding:1px 5px;border-radius:4px;word-break:break-word}
  .jg-fin-btns a.btn{display:inline-flex;align-items:center;text-decoration:none}
  .aviso .jg-fin-m{color:inherit;font-size:12.5px;margin-top:8px;line-height:1.6}
  .aviso .jg-fin-m code{background:#00000010}

  /* El editor del perfil reusa la capa del cartel del final — misma
     penumbra, misma entrada, misma ✕ — porque es el mismo gesto:
     algo que se pone delante de la partida y se quita. Lo propio de
     aquí es el cuerpo en dos columnas y la rejilla de colores. */
  .jg-modal-capa{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:18px;background:#0f172899;backdrop-filter:blur(2px);animation:jgVela .2s ease-out}
  .jg-modal{position:relative;width:460px;max-width:100%;max-height:calc(100vh - 36px);overflow:auto;padding:24px 22px 20px;border-radius:14px;background:#fff;border:1px solid #e2e8ec;box-shadow:0 18px 50px #0f172840;animation:jgEntra .35s ease-out;text-align:left}
  .jg-modal-t{font-size:19px;font-weight:700;color:#1f2933}
  .jg-modal-s{font-size:12px;color:#5a6772;line-height:1.55;margin:6px 0 0}
  /* El hueco del error existe siempre (no se muestra y se oculta): si
     apareciera de la nada, el botón Guardar se movería bajo el dedo
     justo cuando se acaba de fallar al pulsarlo. */
  .jg-modal-err{min-height:16px;margin-top:10px;font-size:12px;color:#c0392b;line-height:1.5}

  .jg-perfil-cuerpo{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}
  .jg-perfil-foto{display:flex;flex-direction:column;align-items:center;gap:6px;width:116px;flex:0 0 auto}
  .jg-perfil-foto .btn2,.jg-perfil-foto .btn-ghost{width:100%;text-align:center;font-size:11.5px;padding:0 8px}
  /* `.btn-ghost` nace con el color de la cabecera, que es oscura; aquí
     el fondo es blanco y ese gris claro no se lee. */
  .jg-perfil-foto .btn-ghost{height:28px;color:#5a6772}
  .jg-perfil-foto .btn-ghost:hover{background:#0f172810;color:#0d9488}
  /* La vista previa es la misma bola que luego se ve en la cabecera y
     en el marcador, en grande: lo que se está eligiendo es eso. */
  .jg-perfil-av{width:96px;height:96px;border-radius:50%;overflow:hidden;background:#eef3f7;border:1px solid #e2e8ec;display:grid;place-items:center}
  .jg-perfil-av img{width:100%;height:100%;object-fit:cover;display:block}
  .jg-perfil-av i{width:100%;height:100%;display:grid;place-items:center;font-style:normal;font-size:38px;font-weight:600;color:#fff}

  .jg-perfil-campos{flex:1;min-width:200px;display:flex;flex-direction:column;gap:14px}
  .jg-campo{display:flex;flex-direction:column;gap:6px}
  .jg-campo>span{font-size:11.5px;font-weight:600;color:#42505c}
  .jg-campo input[type=text]{height:34px;padding:0 11px;border:1px solid #d4dce2;border-radius:6px;font-size:13px;font-family:inherit;background:#fff;color:#1f2933}
  .jg-campo input[type=text]:focus{outline:none;border-color:#0d9488;box-shadow:0 0 0 3px #0d948822}
  .jg-colores{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .jg-color{aspect-ratio:1;border:2px solid transparent;border-radius:50%;cursor:pointer;padding:0}
  .jg-color:hover{transform:scale(1.12)}
  /* El elegido se marca con un aro por fuera, no con un borde propio:
     un borde del color del fondo no se ve, y uno blanco por dentro
     encoge la muestra justo del que se quiere comparar. */
  .jg-color.on{border-color:#fff;box-shadow:0 0 0 2px #1f2933}
  .jg-color-libre{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#5a6772}
  .jg-color-libre input[type=color]{width:30px;height:24px;padding:0;border:1px solid #d4dce2;border-radius:5px;background:#fff;cursor:pointer}

  @keyframes jgEntra{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes jgVela{from{opacity:0}to{opacity:1}}
  @keyframes jgCara{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}

  /* ============================================================
     Piezas comunes a los cuatro juegos
     ============================================================ */
  .jg-barra{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border:1px solid #e2e8ec;border-radius:10px 10px 0 0;border-bottom:none;font-size:13px}
  .jg-fase{color:#42505c;display:flex;align-items:center;gap:7px}
  .jg-fase b{color:#1f2933}
  .jg-grow{flex:1}
  .jg-pie{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:#fff;border:1px solid #e2e8ec;border-radius:0 0 10px 10px;border-top:none;min-height:56px}
  .jg-nota{font-size:12px;color:#8a97a3;line-height:1.55}
  .jg-btn{height:34px;padding:0 16px;border:none;border-radius:6px;background:#0d9488;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer}
  .jg-btn:hover{background:#0f766e}
  .jg-btn:disabled{opacity:.45;cursor:default}
  .jg-gana{color:#0d9488}
  .jg-pierde{color:#c0392b}

  /* ============================================================
     Escondite
     ============================================================ */
  .jg-esc{display:flex;flex-direction:column}
  .jg-reloj{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:#42505c;font-variant-numeric:tabular-nums}
  .jg-reloj.urge{color:#c0392b;animation:jgLate 1s steps(2,end) infinite}
  @keyframes jgLate{50%{opacity:.35}}
  /* El lienzo es el marco del canvas: `position:relative` es lo que
     permite que la capa de avisos se ponga encima sin desplazarlo. */
  .jg-lienzo{position:relative;line-height:0;background:#0d1117;border-left:1px solid #e2e8ec;border-right:1px solid #e2e8ec;overflow:hidden}
  .jg-lienzo canvas{display:block;width:100%;cursor:crosshair}
  .jg-capa{position:absolute;inset:0;display:grid;place-items:center;background:#0d1117cc;color:#e6edf3;font-size:14px;font-weight:600}
  .jg-castigo{font-size:12.5px;font-weight:600;color:#c0392b}
  /* Frío/templado/caliente/casi. Se lee de un vistazo por el color, así
     que el color es el dato y la palabra la confirmación. */
  .jg-calor{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid currentColor}
  .jg-calor-frio{color:#2563eb;background:#eff6ff}
  .jg-calor-templado{color:#7c6a1f;background:#fefbe8}
  .jg-calor-caliente{color:#c2410c;background:#fff5ed}
  .jg-calor-casi{color:#be123c;background:#fff1f4;animation:jgLate .8s steps(2,end) infinite}

  /* ============================================================
     Cartas de los tres elementos
     ============================================================ */
  .jg-cartas{display:flex;flex-direction:column}
  .jg-ronda{font-size:12px;font-weight:600;color:#8a97a3;letter-spacing:.03em}
  .jg-trampa{padding:10px 16px;background:#fdecea;border-left:3px solid #c0392b;color:#8c2f22;font-size:12px;line-height:1.55}
  /* La mesa es siempre oscura, en los dos temas: un tapete de dojo con
     las dos filas —la del rival arriba, la mía abajo— y el choque en
     medio. Cada fila es el tablero de lo ganado y la mano, que es lo
     que en el CardJitsu se tiene delante todo el rato. */
  .jg-cartas .jg-mesa{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;
    padding:18px 20px 22px;border-left:1px solid #e2e8ec;border-right:1px solid #e2e8ec;
    background:radial-gradient(ellipse 70% 55% at 50% 50%,#3a2f55 0%,#241d38 55%,#16121f 100%)}
  .jg-cartas .jg-punto{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
  .jg-ley{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
  .jg-ley-r{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;
    font-size:11.5px;font-weight:600;color:#cfc6e4;background:#ffffff10;border:1px solid #ffffff1c;
    transition:transform .25s,background .25s,box-shadow .25s,color .25s}
  .jg-ley-r i{font-style:normal;font-size:14px}
  .jg-ley-r.on{color:#fff;background:var(--el,#b58cff);border-color:transparent;transform:scale(1.12);
    box-shadow:0 0 18px var(--el,#b58cff)}
  .jg-ley-n.on{--el:#8a6fd0}
  .jg-ca-fila{display:grid;grid-template-columns:minmax(250px,320px) 1fr;gap:18px;align-items:center}
  /* Tablero de fichas y mano lado a lado piden unos 800 px de mesa. Con
     el chat a la derecha (ventanas de 1050 a 1215 px) o en una tableta
     no los hay, y la quinta carta y el borde del tablero quedaban
     cortados: se mide la mesa, no la ventana, y se apilan. */
  .jg-cartas .jg-mesa{container-type:inline-size}
  @container (max-width:800px){.jg-ca-fila{grid-template-columns:minmax(0,1fr)}}
  .jg-mano{display:flex;gap:10px;flex-wrap:nowrap;justify-content:center;align-items:flex-end;min-height:150px}
  .jg-mano-otro{min-height:86px;gap:6px}
  .jg-duelo{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}

  /* El tablero: tres columnas, una por elemento, con las fichas ganadas
     en su color de palo. Debajo, con qué cerraría el trío cada uno. */
  .jg-tb{background:#0000004d;border:1px solid #ffffff14;border-radius:14px;padding:10px 12px;color:#e8e2f4}
  .jg-tb-cab{display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:8px}
  .jg-tb-cab span:last-child{margin-left:auto;color:#a99cc6;font-size:11.5px}
  .jg-tb-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .jg-tb-col{border-top:3px solid var(--el);background:#ffffff08;border-radius:0 0 8px 8px;padding:5px 4px 6px;min-height:58px}
  .jg-tb-ico{text-align:center;font-size:15px;line-height:1;margin-bottom:5px}
  .jg-tb-fichas{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
  .jg-tb-vacio{color:#ffffff30;font-size:14px}
  .jg-ficha{display:inline-flex;align-items:center;gap:1px;padding:2px 5px 2px 3px;border-radius:6px;
    background:var(--col,#888);color:#fff;font-size:12px;font-weight:800;line-height:1.2;
    text-shadow:0 1px 2px #000a;box-shadow:inset 0 -2px 0 #0003,0 1px 3px #0006;vertical-align:middle}
  .jg-ficha i{font-style:normal;font-size:10px}
  .jg-llega{animation:jgLlega .7s cubic-bezier(.2,1.6,.4,1)}
  @keyframes jgLlega{from{transform:scale(2.6) translateY(-10px);opacity:0}to{transform:none;opacity:1}}
  .jg-tb-falta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;color:#cfc6e4}
  .jg-tb-falta b{font-weight:700}
  .jg-tb-falta.bien b{color:#7ee8a1}
  .jg-tb-falta.mal b{color:#ff9d8f}
  .jg-tb-f{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;background:#ffffff12}
  .jg-tb-f i{font-style:normal}
  .jg-tb-f u{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--col);box-shadow:0 0 0 1.5px #fff6}
  .jg-tb-falta.mal .jg-tb-f{animation:jgAviso 1.6s ease-in-out infinite}
  @keyframes jgAviso{50%{background:#ff6b5a33}}

  /* Una carta: la ilustración dentro de un marco del color de palo —el
     que decide el trío, visible desde lejos— y el sello del elemento
     arriba a la derecha, porque en el dibujo el agua y la nieve son las
     dos azules. La proporción es la del dibujo, 164×242. */
  .jg-carta{position:relative;width:96px;height:142px;border-radius:11px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;user-select:none;
    box-shadow:0 6px 16px #0008;transition:transform .18s,box-shadow .18s,opacity .18s}
  .jg-arte{background:var(--col,#888);padding:5px 5px 17px}
  .jg-arte::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    box-shadow:inset 0 0 0 1px #ffffff55,inset 0 -3px 0 #0003}
  .jg-c-img{width:100%;height:100%;object-fit:cover;border-radius:6px;display:block;background:#00000055;pointer-events:none}
  .jg-c-el{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;
    display:grid;place-items:center;font-size:15px;background:var(--el,#555);
    border:2px solid #fff;box-shadow:0 2px 6px #0008;z-index:1}
  .jg-c-palo{position:absolute;left:0;right:0;bottom:1px;height:15px;line-height:15px;
    font-size:9px;letter-spacing:.1em;text-transform:uppercase;text-align:center;font-weight:800;
    color:#fff;text-shadow:0 1px 2px #000,0 0 4px #0008;pointer-events:none}
  .jg-carta.jg-arte{overflow:visible}
  .jg-dorso{border:3px solid #d8c7f5;color:#e9dcff;font-size:26px;
    background:radial-gradient(circle at 50% 45%,#6c4bb6 0 22%,transparent 23%),
      repeating-linear-gradient(45deg,#3b2d5c 0 7px,#46376b 7px 14px)}
  .jg-pequena{width:56px;height:83px;border-radius:8px}
  .jg-pequena.jg-arte{padding:3px 3px 11px}
  .jg-pequena .jg-c-palo{font-size:6.5px;height:11px;line-height:11px;letter-spacing:.04em}
  .jg-pequena .jg-c-el{width:20px;height:20px;font-size:11px;top:-5px;right:-5px}
  .jg-pequena.jg-dorso{font-size:16px;border-width:2px}
  .jg-mano-otro .jg-carta:nth-child(odd){transform:rotate(-2deg)}
  .jg-mano-otro .jg-carta:nth-child(even){transform:rotate(2deg) translateY(2px)}
  .jg-jugable{cursor:pointer}
  .jg-jugable:hover{transform:translateY(-10px) rotate(-1.5deg);box-shadow:0 16px 28px #000a}
  .jg-elegida,.jg-elegida:hover{transform:translateY(-22px) scale(1.06);
    box-shadow:0 0 0 3px #ffd76a,0 0 26px #ffd76a88,0 18px 30px #000a;z-index:2}
  .jg-quieta,.jg-quieta:hover{cursor:default;opacity:.5;transform:none;box-shadow:0 6px 16px #0008}
  .jg-tenue{opacity:.35}
  .jg-lista{box-shadow:0 0 0 2px #4ade80,0 6px 16px #0008}
  .jg-boca-abajo{transform:rotate(-4deg);box-shadow:0 0 0 2px #4ade80,0 6px 16px #0008}
  .jg-nueva{animation:jgNueva .8s cubic-bezier(.2,1.4,.4,1)}
  @keyframes jgNueva{from{transform:translateY(-70px) rotate(10deg);opacity:0;box-shadow:0 0 30px #fff}to{transform:none;opacity:1}}
  /* La carta que, si gana esta ronda, cierra el trío. */
  .jg-decisiva{box-shadow:0 0 0 2px #ffd76a,0 0 22px #ffb300aa,0 6px 16px #0008}
  .jg-decisiva.jg-quieta{opacity:.7}
  .jg-c-cinta{position:absolute;left:50%;top:-11px;transform:translateX(-50%);padding:2px 8px;border-radius:999px;
    background:linear-gradient(#ffe38a,#f5b42a);color:#4a2c00;font-size:10px;font-weight:800;white-space:nowrap;
    box-shadow:0 2px 6px #0008;z-index:2;animation:jgCinta 1.2s ease-in-out infinite alternate}
  @keyframes jgCinta{to{transform:translateX(-50%) scale(1.1)}}
  .jg-brilla{animation:jgBrilla 1.1s ease-in-out infinite alternate}
  @keyframes jgBrilla{from{box-shadow:0 0 0 0 #ffd76a00}to{box-shadow:0 0 16px 4px #ffd76acc}}

  .jg-espera{display:flex;align-items:center;gap:26px}
  .jg-plaza{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:#cfc6e4}
  .jg-cartas .jg-hueco{width:56px;height:83px;border-radius:8px;border:2px dashed #ffffff33;
    display:grid;place-items:center;text-align:center;font-size:10px;color:#ffffff66;padding:4px}
  .jg-piensa{animation:jgPiensa 1.4s ease-in-out infinite}
  @keyframes jgPiensa{50%{border-color:#ffffff88;color:#ffffffaa}}
  .jg-vs{font-size:22px;font-weight:900;color:#ffd76a;letter-spacing:.06em;text-shadow:0 0 14px #ffb30066;font-style:italic}
  .jg-ultima{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
    font-size:11.5px;color:#a99cc6;padding:5px 12px;border-radius:999px;background:#0000003a}

  /* ---- El choque, por tiempos (ver CHOQUE en cartas.js) ----
     0 s entran boca abajo · .52 s se dan la vuelta · 1.15 s la ganadora
     embiste y el elemento actúa sobre la perdedora · 1.5 s el veredicto ·
     2.7 s la ganada vuela a su tablero. */
  .jg-choque{position:relative;display:flex;align-items:center;justify-content:center;gap:22px}
  .jg-ch-lado{display:flex;flex-direction:column;align-items:center;gap:8px;perspective:700px}
  .jg-ch-yo{animation:jgEntraYo .45s cubic-bezier(.2,1.2,.4,1) both}
  .jg-ch-otro{animation:jgEntraOtro .45s cubic-bezier(.2,1.2,.4,1) both}
  @keyframes jgEntraYo{from{transform:translate(-60px,90px) rotate(-12deg);opacity:0}}
  @keyframes jgEntraOtro{from{transform:translate(60px,-90px) rotate(12deg);opacity:0}}
  .jg-ch-nombre{font-size:12px;font-weight:700;color:#e8e2f4}
  .jg-ch-carta{position:relative}
  .jg-ch-carta .jg-carta{width:120px;height:177px}
  .jg-ch-carta .jg-arte{padding:6px 6px 19px}
  .jg-ch-carta .jg-c-el{width:34px;height:34px;font-size:18px}
  .jg-flip{position:relative;width:120px;height:177px;transform-style:preserve-3d;
    animation:jgVuelta .5s .2s ease-in-out both}
  @keyframes jgVuelta{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
  .jg-cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .jg-reves{transform:rotateY(180deg)}
  /* La ganadora embiste hacia la otra y luego vuela a su tablero: la mía
     hacia abajo, la del rival hacia arriba. */
  .jg-ch-yo.jg-ch-gana .jg-ch-carta{animation:jgEmbisteD .5s 1s ease-in both,jgVuelaAbajo .8s 2.7s ease-in forwards}
  .jg-ch-otro.jg-ch-gana .jg-ch-carta{animation:jgEmbisteI .5s 1s ease-in both,jgVuelaArriba .8s 2.7s ease-in forwards}
  @keyframes jgEmbisteD{0%{transform:none}35%{transform:translateX(-14px) rotate(-5deg)}70%{transform:translateX(34px) scale(1.12) rotate(4deg)}100%{transform:scale(1.08)}}
  @keyframes jgEmbisteI{0%{transform:none}35%{transform:translateX(14px) rotate(5deg)}70%{transform:translateX(-34px) scale(1.12) rotate(-4deg)}100%{transform:scale(1.08)}}
  @keyframes jgVuelaAbajo{from{transform:scale(1.08)}to{transform:translate(-120px,220px) scale(.25) rotate(-20deg);opacity:0}}
  @keyframes jgVuelaArriba{from{transform:scale(1.08)}to{transform:translate(120px,-220px) scale(.25) rotate(20deg);opacity:0}}
  .jg-ch-gana .jg-carta{animation:jgAura .6s 1.3s ease-out both}
  @keyframes jgAura{to{box-shadow:0 0 0 3px #ffd76a,0 0 34px #ffd76a,0 10px 24px #000a}}
  .jg-ch-pierde .jg-ch-carta{animation:jgRecibe .5s 1.3s ease-out both,jgApaga .6s 2.3s ease-in forwards}
  @keyframes jgRecibe{20%{transform:translateX(0) rotate(0)}40%{transform:translateX(-8px) rotate(-4deg)}60%{transform:translateX(7px) rotate(3deg)}100%{transform:translateY(8px) rotate(-3deg)}}
  @keyframes jgApaga{to{transform:translateY(8px) rotate(-6deg) scale(.88);opacity:.18;filter:grayscale(1)}}
  .jg-ch-empate .jg-ch-carta{animation:jgTiembla .5s 1.1s ease-in-out both,jgApaga .6s 2.8s ease-in forwards}
  @keyframes jgTiembla{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  /* Lo que el elemento ganador le hace a la perdedora. */
  .jg-fx{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;opacity:0}
  .jg-fx-fuego{background:linear-gradient(0deg,#ff5a1f 0%,#ffb02e 38%,#ffd76a00 75%);mix-blend-mode:screen;
    animation:jgFuego 1.1s 1.25s ease-out forwards}
  @keyframes jgFuego{0%{opacity:0;transform:scaleY(.2);transform-origin:bottom}30%{opacity:1;transform:scaleY(1.1)}
    60%{opacity:.9;transform:scaleY(.9)}100%{opacity:.55;transform:scaleY(1);filter:brightness(.6)}}
  .jg-fx-agua{background:linear-gradient(180deg,#5ec8ff 0%,#1a7fd4cc 55%,#0b4a8a 100%);
    animation:jgAgua 1s 1.25s ease-out forwards}
  @keyframes jgAgua{0%{opacity:0;clip-path:inset(0 0 100% 0)}35%{opacity:.9;clip-path:inset(0 0 0 0)}100%{opacity:.7;clip-path:inset(0 0 0 0)}}
  .jg-fx-nieve{background:linear-gradient(135deg,#ffffffee,#c9e6ffcc 40%,#8fc3ff99);
    box-shadow:inset 0 0 0 3px #eaf6ff,inset 0 0 22px #fff;animation:jgHielo .9s 1.25s ease-out forwards}
  @keyframes jgHielo{0%{opacity:0;transform:scale(1.3)}40%{opacity:1;transform:scale(.98)}100%{opacity:.8;transform:none}}
  .jg-fx-num{background:
      linear-gradient(115deg,transparent 46%,#fff 47%,#fff 48.5%,transparent 49.5%),
      linear-gradient(60deg,transparent 58%,#fffc 59%,#fffc 60%,transparent 61%),#0005;
    animation:jgRompe .5s 1.25s steps(2,end) forwards}
  @keyframes jgRompe{from{opacity:0}to{opacity:1}}
  .jg-ch-centro{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:150px;max-width:210px;text-align:center}
  .jg-ch-vs{font-size:26px;font-weight:900;font-style:italic;color:#ffd76a;text-shadow:0 0 16px #ffb300aa;
    animation:jgVs 1.2s both}
  @keyframes jgVs{0%{transform:scale(2.5);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:.25;transform:scale(.8)}}
  .jg-veredicto{font-size:21px;font-weight:900;color:#fff;animation:jgVeredicto .55s 1.5s cubic-bezier(.2,1.7,.4,1) both}
  @keyframes jgVeredicto{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
  .jg-choque.jg-gana .jg-veredicto{color:#7ee8a1;text-shadow:0 0 18px #4ade8088}
  .jg-choque.jg-pierde .jg-veredicto{color:#ff9d8f;text-shadow:0 0 18px #ff5a4a66}
  .jg-choque.jg-empate .jg-veredicto{color:#ffd76a}
  .jg-ch-porque{font-size:12px;line-height:1.45;color:#d9d0ec;animation:jgEntra .4s 1.85s ease-out both}
  .jg-golpea{animation:jgSacude .5s 1.15s ease-out}
  @keyframes jgSacude{0%,100%{transform:none}15%{transform:translateX(-7px)}
    35%{transform:translateX(6px)}55%{transform:translateX(-4px)}75%{transform:translateX(2px)}}
  .jg-estallido,.jg-humo{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:3}
  .jg-estallido{animation:jgTarde 0s 1.15s both}
  @keyframes jgTarde{from{visibility:hidden}to{visibility:visible}}
  .jg-onda{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;
    border:3px solid var(--elc,#fff);animation:jgOnda .85s 1.15s ease-out both}
  @keyframes jgOnda{from{transform:scale(.3);opacity:.95}to{transform:scale(15);opacity:0}}
  .jg-rayos{position:absolute}
  .jg-rayos i{position:absolute;left:-2.5px;top:-2.5px;width:5px;height:5px;border-radius:3px;
    background:var(--el,#fff);box-shadow:0 0 9px var(--elc,#fff);animation:jgRayo .75s 1.15s ease-out both}
  @keyframes jgRayo{
    from{transform:rotate(var(--a,0deg)) translateY(0) scaleY(1);opacity:1}
    to{transform:rotate(var(--a,0deg)) translateY(calc(var(--r,1) * -96px)) scaleY(3.4);opacity:0}}
  .jg-golpe-t{display:block;margin-top:4px;font-size:30px;font-weight:900;color:#ffd76a;
    text-shadow:0 2px 12px #ffb300cc;animation:jgGolpeT .55s 1.4s cubic-bezier(.2,1.7,.4,1) both}
  @keyframes jgGolpeT{from{transform:scale(2.6) rotate(-9deg);opacity:0}to{transform:none;opacity:1}}
  .jg-humo i{position:absolute;left:-23px;top:-23px;width:46px;height:46px;border-radius:50%;
    background:radial-gradient(circle at 40% 38%,#ffffffcc,#b9c6d3a0 54%,#8a99a800 72%);
    opacity:0;animation:jgHumo 1.7s ease-out calc(var(--d,0ms) + 1.15s) forwards}
  @keyframes jgHumo{
    0%{opacity:0;transform:translate(0,0) scale(calc(var(--s,1) * .35))}
    18%{opacity:.85}
    100%{opacity:0;transform:translate(var(--x,0px),-64px) scale(calc(var(--s,1) * 1.9))}}

  /* El remate: el trío carta a carta y, al que gana, lluvia de elementos. */
  .jg-remate{display:flex;flex-direction:column;align-items:center;gap:10px;animation:jgEntra .4s ease-out}
  .jg-remate-t{font-size:30px;font-weight:900;animation:jgVeredicto .6s cubic-bezier(.2,1.7,.4,1) both}
  .jg-remate.jg-gana .jg-remate-t{color:#ffd76a;text-shadow:0 0 24px #ffb300aa}
  .jg-remate.jg-pierde .jg-remate-t{color:#ff9d8f}
  .jg-remate-s{font-size:12.5px;color:#d9d0ec}
  .jg-remate-trio{display:flex;gap:14px;margin-top:6px}
  .jg-rt{animation:jgTrio .6s calc(var(--k,0) * 200ms + 300ms) cubic-bezier(.2,1.5,.4,1) both}
  @keyframes jgTrio{from{transform:translateY(60px) rotate(calc(var(--k,0) * 8deg - 8deg)) scale(.4);opacity:0}}
  .jg-remate.jg-pierde .jg-remate-trio .jg-carta{filter:saturate(.7)}
  .jg-confeti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
  .jg-confeti i{position:absolute;top:-30px;left:var(--x);font-style:normal;font-size:22px;
    animation:jgLluvia 2.6s var(--d) ease-in forwards;opacity:0}
  @keyframes jgLluvia{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:1}
    100%{opacity:0;transform:translateY(560px) rotate(var(--r))}}
  @media(max-width:720px){
    .jg-cartas .jg-mesa{padding:14px 8px 18px;gap:10px}
    /* `minmax(0,1fr)` y no `1fr`: con `1fr` el tablero de fichas no
       bajaba de su ancho mínimo y en 320 px se salía por la derecha. */
    .jg-ca-fila{grid-template-columns:minmax(0,1fr);gap:8px}
    .jg-tb-cols{grid-template-columns:repeat(3,minmax(0,1fr))}
    .jg-ca-otro .jg-mano-otro{order:-1;min-height:0}
    .jg-mano-otro .jg-carta{width:34px;height:50px;border-width:2px;font-size:0}
    .jg-mano{gap:5px;min-height:112px;padding-right:6px}
    .jg-mano .jg-carta:not(.jg-pequena){width:58px;height:86px;border-radius:8px}
    .jg-mano .jg-arte:not(.jg-pequena){padding:3px 3px 12px}
    .jg-mano .jg-arte .jg-c-palo{font-size:7px;height:12px;line-height:12px;letter-spacing:.03em}
    .jg-mano .jg-c-el{width:22px;height:22px;font-size:12px;top:-5px;right:-5px}
    .jg-c-cinta{font-size:8.5px;padding:1px 6px}
    .jg-tb{padding:8px 9px}
    .jg-tb-col{min-height:44px}
    .jg-duelo{min-height:220px}
    .jg-choque{gap:8px}
    .jg-ch-carta .jg-carta,.jg-flip{width:92px;height:136px}
    .jg-ch-centro{min-width:0;max-width:130px}
    .jg-veredicto{font-size:16px}
    .jg-ch-porque{font-size:11px}
    .jg-remate-trio{gap:8px}
    .jg-remate-trio .jg-carta{width:72px;height:106px}
    .jg-ch-yo.jg-ch-gana .jg-ch-carta{animation-name:jgEmbisteDm,jgVuelaAbajo}
    .jg-ch-otro.jg-ch-gana .jg-ch-carta{animation-name:jgEmbisteIm,jgVuelaArriba}
    @keyframes jgEmbisteDm{0%{transform:none}35%{transform:translateX(-6px) rotate(-4deg)}70%{transform:translateX(14px) scale(1.06) rotate(3deg)}100%{transform:scale(1.04)}}
    @keyframes jgEmbisteIm{0%{transform:none}35%{transform:translateX(6px) rotate(4deg)}70%{transform:translateX(-14px) scale(1.06) rotate(-3deg)}100%{transform:scale(1.04)}}
  }
  /* Cinco cartas de 58 px no caben en una pantalla de 320: la quinta
     quedaba cortada por el borde de la mesa. */
  @media(max-width:359px){
    .jg-mano{gap:4px}
    .jg-mano .jg-carta:not(.jg-pequena){width:51px;height:76px}
  }

  /* ============================================================
     Cuadritos
     ============================================================ */
  .jg-cuad{display:flex;flex-direction:column}
  .jg-marcador{display:flex;gap:14px;align-items:center}
  .jg-m{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#42505c;border-left:3px solid var(--c,#888);padding-left:8px}
  .jg-m b{font-size:16px;font-family:'IBM Plex Mono',monospace}
  /* El punto que acaba de entrar: la caja recién cerrada da un golpe y el
     marcador de quien la ganó late una vez. Solo se repinta con cada
     jugada (firma), así que la animación corre una vez por punto. */
  .jg-caja-nueva{animation:jgCajaNueva .6s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:center}
  @keyframes jgCajaNueva{0%{transform:scale(.2);opacity:0}60%{opacity:.55}100%{transform:scale(1)}}
  .jg-m-sube b{display:inline-block;animation:jgSube .7s ease-out}
  @keyframes jgSube{0%{transform:scale(1)}35%{transform:scale(1.45);color:var(--c)}100%{transform:scale(1)}}
  .jg-estrella.ultima{animation:jgCaptura .55s ease-out}
  @keyframes jgCaptura{0%{transform:scale(1.25);box-shadow:0 0 0 0 currentColor}100%{transform:scale(1);box-shadow:0 0 0 14px transparent}}
  @media (prefers-reduced-motion:reduce){.jg-caja-nueva,.jg-m-sube b,.jg-estrella.ultima{animation:none}}
  /* Con seis nombres en la barra hace falta decir de quién se espera:
     el del turno lleva el nombre en negro y el que abandonó, tachado. */
  .jg-m-turno{color:#1f2933;font-weight:700}
  .jg-m-turno b{color:var(--c,#888)}
  .jg-m-fuera{opacity:.42}
  .jg-m-fuera span{text-decoration:line-through}
  .jg-marcador{flex-wrap:wrap;row-gap:6px}
  .jg-punto-t{width:9px;height:9px;border-radius:50%;display:inline-block}
  .jg-tablero{display:grid;place-items:center;padding:20px 16px;background:#fff;border-left:1px solid #e2e8ec;border-right:1px solid #e2e8ec}
  .jg-svg{width:100%;max-width:440px;height:auto;touch-action:manipulation}
  .jg-caja{opacity:.16}
  .jg-caja-l{font-size:26px;font-weight:700;opacity:.4;text-anchor:middle;dominant-baseline:central;font-family:'IBM Plex Sans',sans-serif}
  .jg-raya{stroke-width:7;stroke-linecap:round}
  .jg-ult{stroke-width:9;filter:drop-shadow(0 0 4px currentColor)}
  /* El hueco es una zona de clic gorda y transparente: pintarla sería
     dibujar el tablero lleno de rayas que no están puestas. */
  .jg-hueco{stroke:transparent;stroke-width:16;stroke-linecap:round}
  .jg-libre{cursor:pointer}
  .jg-libre:hover{stroke:var(--turno,#0f62fe);stroke-opacity:.35;stroke-width:7}
  .jg-cierra.jg-libre:hover{stroke-opacity:.75}
  .jg-svg .jg-punto{fill:#cbd5dd}

  /* ============================================================
     Pool 8
     ============================================================ */
  .jg-pool{display:flex;flex-direction:column;gap:10px;max-width:1180px;margin:0 auto;width:100%}
  .jg-pl-hud{display:flex;align-items:stretch;justify-content:center;gap:10px;flex-wrap:wrap}
  .jg-pl-vs{align-self:center;font-size:12px;font-weight:700;color:#8a97a3;text-transform:uppercase;letter-spacing:1px}
  .jg-pl-equipo{flex:1 1 260px;max-width:430px;background:#fff;border:2px solid #e4dfeb;border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:4px;transition:border-color .2s,box-shadow .2s}

  .jg-pl-nom.fuera{text-decoration:line-through;opacity:.5}
  .jg-pl-nom.toca{color:#1f8a4c}
  .jg-pl-grupo{font-size:11px;font-weight:700;color:#8a97a3;text-transform:uppercase;letter-spacing:.8px;min-height:14px}
  .jg-pl-bolas{display:flex;gap:3px;flex-wrap:wrap;min-height:22px}
  .jg-pl-mb{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;position:relative;overflow:hidden;
    background:radial-gradient(circle at 32% 28%,#ffffffcc 0,#fff0 38%),var(--c);box-shadow:inset -2px -3px 4px #0005,0 1px 2px #0004;transition:opacity .3s,filter .3s}
  .jg-pl-mb.ray{background:radial-gradient(circle at 32% 28%,#ffffffcc 0,#fff0 38%),linear-gradient(180deg,#f7f5ee 0 26%,var(--c) 26% 74%,#f7f5ee 74%)}
  .jg-pl-mb b{font-size:10px;line-height:1;width:12px;height:12px;border-radius:50%;background:#f7f5ee;color:#111;display:flex;align-items:center;justify-content:center}
  .jg-pl-mb.fuera{opacity:.22;filter:grayscale(.7)}
  .jg-pl-estado{text-align:center;font-weight:600;font-size:14px;min-height:20px;color:var(--jg-ink)}
  .jg-pl-mesa{width:100%;display:flex;justify-content:center}
  .jg-pl-mesa canvas{display:block;border-radius:22px;box-shadow:0 18px 34px #0004,0 2px 0 2px #2b170b;cursor:crosshair;max-width:100%}
  .jg-pl-ctl{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:stretch}
  .jg-pl-ctl.off .jg-pl-caja{opacity:.45;pointer-events:none}
  .jg-pl-ctl.mirando{display:none}
  .jg-pl-caja{background:#fff;border:2px solid #e4dfeb;border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:opacity .2s}
  .jg-pl-et{font-size:11px;font-weight:700;color:#8a97a3;text-transform:uppercase;letter-spacing:.8px}
  .jg-pl-efecto-caja canvas{width:96px;height:96px;cursor:pointer;touch-action:none}
  .jg-pl-fuerza-caja{min-width:210px}
  .jg-pl-fuerza-v{font-size:22px;font-weight:800;color:#1f8a4c;line-height:1}
  .jg-pl-fuerza-v b{font-weight:800}
  .jg-pl-fuerza-caja input[type=range]{width:100%;height:14px;border-radius:7px;appearance:none;-webkit-appearance:none;outline:none;
    background:linear-gradient(90deg,#3bbf6b 0,#e8c53a 55%,#d63b30 100%);}
  .jg-pl-fuerza-caja input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:26px;border-radius:7px;background:#fff;border:3px solid #232137;cursor:pointer}
  .jg-pl-fuerza-caja input[type=range]::-moz-range-thumb{width:18px;height:22px;border-radius:7px;background:#fff;border:3px solid #232137;cursor:pointer}
  .jg-pl-fila{display:flex;gap:6px}
  .jg-pl-b{width:42px;height:38px;padding:0;font-size:20px;background:#232137}
  .jg-pl-acciones{flex-direction:column;border:none;background:none;padding:0}
  .jg-pl-golpe{height:52px;padding:0 34px;font-size:16px;background:#1f8a4c;border-radius:12px}
  .jg-pl-golpe:disabled{background:#9aa5a0;cursor:not-allowed}
  .jg-pl-mover{background:#232137}
  .jg-pl-pie{text-align:center;min-height:18px}
  @media (max-width:640px){.jg-pl-equipo{flex-basis:100%;max-width:none}.jg-pl-caja{padding:6px 8px}.jg-pl-fuerza-caja{min-width:0;flex:1 1 150px}}

  /* Menú de Pool: barra, tacos con cofres y novedades */

  .jg-pl-barra{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}

  .jg-pl-mn{height:30px;font-size:12px;background:#232137}

  .jg-pl-m-cuerpo h4{margin:0;font-size:15px}.jg-pl-m-cuerpo h4 small{font-weight:600;color:#8a97a3;font-size:12px;margin-left:6px}
  .jg-pl-m-cuerpo h5{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:#1f8a4c}
  .jg-pl-m-cuerpo ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.55}

  .jg-pl-cofre-img{font-size:64px;line-height:1;filter:drop-shadow(0 6px 6px #0004)}
  .jg-pl-cofre-img.abre{animation:jgPlCofre .55s ease-in-out infinite}
  @keyframes jgPlCofre{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-12deg) scale(1.12)}75%{transform:rotate(12deg) scale(1.12)}}
  .jg-pl-cofre-d{display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:13px}
  .jg-pl-cofre-d small{color:#8a97a3}

  .jg-pl-res{display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid var(--r);border-radius:14px;padding:12px;background:radial-gradient(circle,#fff0,#0000),#1f8a4c;color:#fff;box-shadow:0 0 28px var(--r);animation:jgPlRes .6s ease-out}
  .jg-pl-res small{font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--r);background:#000a;border-radius:20px;padding:2px 10px}
  .jg-pl-res canvas{max-width:100%}
  @keyframes jgPlRes{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .jg-pl-probas{width:100%;border-collapse:collapse;font-size:12.5px}

  /* La portada: el triángulo, la blanca y el taco sobre el paño. */

  .jg-art-pool .mesa{position:absolute;inset:6px;border:7px solid #5a2e15;border-radius:14px;box-shadow:0 10px 24px #0007,inset 0 0 18px #0006}

  .jg-art-pool .rack i.ray{background:radial-gradient(circle at 32% 28%,#fffc 0,#fff0 40%),linear-gradient(180deg,#f7f5ee 0 26%,var(--c) 26% 74%,#f7f5ee 74%)}
  .jg-art-pool .rack i:nth-child(1){left:0;top:29px;--c:#f7c612}
  .jg-art-pool .rack i:nth-child(2){left:23px;top:16px;--c:#d82828}
  .jg-art-pool .rack i:nth-child(3){left:23px;top:42px;--c:#161618}
  .jg-art-pool .rack i:nth-child(4){left:46px;top:3px;--c:#0e7e42}
  .jg-art-pool .rack i:nth-child(5){left:46px;top:29px;--c:#6a2c92}
  .jg-art-pool .rack i:nth-child(6){left:46px;top:55px;--c:#1452c4}

  /* ============================================================
     Reversi
     ============================================================ */
  .jg-rev{display:flex;flex-direction:column}
  /* El tablero es cuadrado y de ocho por ocho: dejarle los 440 px de
     cuadritos lo deja con casillas de 55 px, que en un móvil es todo
     lo que hay. En pantalla grande no crece más porque una ficha de
     ocho centímetros no ayuda a leer nada. */
  .jg-rev-svg{max-width:460px}
  .jg-rev-fondo{fill:#1f6f5c}
  /* La cuadrícula se dibuja con el borde de cada casilla y no con
     líneas: así el último surco del borde queda dentro del fondo
     redondeado, sin sobresalir por la esquina. */
  .jg-rev-cas{fill:none;stroke:#14503f;stroke-width:2}
  .jg-rev-hito{fill:#14503f}
  .jg-rev-f{stroke:#0000001f;stroke-width:2}
  /* La ficha recién puesta lleva aro claro: sin eso, en un tablero
     que cambia de color a la mitad no hay forma de saber cuál fue la
     jugada. */
  .jg-rev-ult{stroke:#ffd166;stroke-width:6}
  /* Las volteadas giran una vez, no en bucle: la firma de la pintada
     lleva dentro la última casilla, así que el SVG se rehace una vez
     por jugada y la animación arranca sola justo cuando toca. */
  .jg-rev-gira{animation:jgVoltea .42s ease-out;transform-box:fill-box;transform-origin:center}
  @keyframes jgVoltea{
    0%{transform:scaleX(1)}
    50%{transform:scaleX(.06)}
    100%{transform:scaleX(1)}
  }
  .jg-rev-libre{cursor:pointer}
  .jg-rev-pista{fill:none;stroke-width:4;stroke-dasharray:7 7;opacity:.55}
  .jg-rev-n{font-size:34px;font-weight:700;text-anchor:middle;dominant-baseline:central;
    font-family:'IBM Plex Mono',monospace;opacity:.55;pointer-events:none}
  .jg-rev-libre:hover .jg-rev-pista{opacity:1;stroke-dasharray:none;fill:currentColor;fill-opacity:.12}
  .jg-rev-libre:hover .jg-rev-n{opacity:1}
  /* El punto de la barra de fase es la ficha de quien tiene el turno,
     y una blanca sobre fondo blanco no se ve: de ahí el borde. */
  .jg-rev-punto{border:1px solid #0f172833}
  .jg-rev-m{gap:7px}
  .jg-rev-chip{width:13px;height:13px;border-radius:50%;display:inline-block;flex-shrink:0;
    border:1px solid #0f172833}

  /* ============================================================
     Ranks
     ============================================================ */
  .jg-ranks{display:flex;flex-direction:column}

  /* Categorías de los juegos individuales: control segmentado, no <select>. */

  .jg-rk-fila{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

  .jg-rk-seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:10px;background:#eef2f5}

  .jg-rk-seg button:hover{background:#ffffffaa}
  .jg-rk-seg button.on{background:#fff;color:#0f1720;box-shadow:0 1px 3px #0f172422,inset 0 -2px 0 var(--c,#0d9488)}
  .jg-aviso{padding:14px 16px;border-radius:9px;background:#fff8ec;border:1px solid #e2c08d66;font-size:12.5px;color:#6b5320;line-height:1.6;margin-bottom:16px}
  .jg-aviso code{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:#00000010;padding:1px 5px;border-radius:4px}
  .jg-tabla-caja{background:#fff;border:1px solid #e2e8ec;border-radius:10px;overflow-x:auto}
  .jg-tabla{width:100%;border-collapse:collapse;font-size:12.5px}
  .jg-tabla th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#8a97a3;padding:11px 12px;border-bottom:1px solid #e2e8ec;white-space:nowrap}
  .jg-tabla td{padding:10px 12px;border-bottom:1px solid #f0f4f6;white-space:nowrap}
  .jg-tabla tr:last-child td{border-bottom:none}
  .jg-th-n{width:44px;text-align:center;color:#8a97a3;font-variant-numeric:tabular-nums}
  .jg-jug{display:flex;align-items:center;gap:9px;white-space:nowrap}
  .jg-foto{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0}
  .jg-sin{background:#0d9488;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
  .jg-num{text-align:right;font-variant-numeric:tabular-nums}
  .jg-gan{color:#0d9488;font-weight:600}
  .jg-pts{font-weight:700;color:#1f2933}
  /* El porcentaje se lee mejor con la barra al lado que solo: una
     columna de números de dos cifras no dice quién va bien de un
     vistazo. */
  .jg-barra-pc{display:inline-block;width:44px;height:5px;border-radius:99px;background:#eef1f4;margin-right:7px;vertical-align:middle;overflow:hidden}
  .jg-barra-pc i{display:block;height:100%;background:#0d9488}
  .jg-yo{background:#f3faf9}
  .jg-yo .jg-jug{font-weight:700}
  .jg-vacio{padding:34px 16px;text-align:center;font-size:12.5px;color:#8a97a3;line-height:1.7}
  .jg-nota-larga{margin-top:18px;font-size:11.5px;color:#8a97a3;line-height:1.7;max-width:78ch}

  /* ---- El salón de la fama ----
     Un escenario oscuro encima de la tabla: la tabla informa, esto tiene
     que dar ganas. El #1 va en el centro y más alto (2-1-3, como un podio
     de verdad), con corona, halo y rayos girando detrás; los puestos
     vacíos se pintan igual, en discontinuo, preguntando «¿tú?». */
  .jg-rk{position:relative;overflow:hidden;isolation:isolate;margin-bottom:16px;padding:22px 16px 18px;border-radius:14px;
    background:radial-gradient(ellipse 70% 60% at 50% 18%,#4a3486 0%,#221a4a 42%,#0d0c1e 100%);
    color:#e9e6ff;box-shadow:0 18px 40px -22px #1a1040,inset 0 1px 0 #ffffff14}
  .jg-rk[hidden]{display:none}
  .jg-rk::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 28% 64%,#fff7 50%,transparent 51%),
      radial-gradient(1.5px 1.5px at 78% 30%,#fffa 50%,transparent 51%),radial-gradient(1px 1px at 88% 70%,#fff6 50%,transparent 51%),
      radial-gradient(1px 1px at 62% 12%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 40%,#fff5 50%,transparent 51%);
    animation:jgRkTitila 4s ease-in-out infinite alternate}
  .jg-rk-rayos{position:absolute;left:50%;top:40%;width:760px;height:760px;margin:-380px 0 0 -380px;z-index:-1;pointer-events:none;opacity:.5;
    background:repeating-conic-gradient(from 0deg,#ffd76a26 0deg 7deg,transparent 7deg 22deg);
    -webkit-mask:radial-gradient(circle,#000 0,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 0,#000 18%,transparent 62%);
    animation:jgRkGira 40s linear infinite}
  .jg-rk-cab{text-align:center;margin-bottom:10px}
  .jg-rk-cab span{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:#f4c542;
    padding:3px 12px;border-top:1px solid #f4c54255;border-bottom:1px solid #f4c54255}
  .jg-rk-cab h2{margin:6px 0 0;font-size:26px;font-weight:800;letter-spacing:.02em;line-height:1.1;
    background:linear-gradient(180deg,#fff 20%,#ffe08a 60%,#c9912a);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 10px #f4c54255)}
  .jg-rk-cab small{display:block;margin-top:3px;font-size:11.5px;color:#b9b2e8}

  .jg-rk-podio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:10px;max-width:560px;margin:0 auto}
  .jg-rk-p{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
  .jg-rk-av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;overflow:hidden;flex-shrink:0;
    background:#2b2560;font-size:22px;font-weight:800;color:#fff;border:3px solid var(--rk-m1);
    box-shadow:0 0 0 3px #0d0c1e,0 0 18px var(--rk-brillo)}
  .jg-rk-av>img{width:100%;height:100%;object-fit:cover}
  .jg-rk-nom{display:block;max-width:100%;margin-top:7px;font-size:13px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jg-rk-nom em{font-style:normal;font-weight:600;color:#9ee8dc}
  .jg-rk-tit{font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--rk-m1)}
  .jg-rk-pts{margin-top:3px;font-size:11px;color:#c8c2f0;font-variant-numeric:tabular-nums}
  .jg-rk-pts b{font-size:20px;font-weight:800;color:#fff}
  .jg-rk-p small{font-size:10.5px;color:#a49dd6;font-variant-numeric:tabular-nums;white-space:nowrap}
  .jg-rk-bloque{position:relative;overflow:hidden;width:100%;margin-top:9px;height:var(--rk-alto);border-radius:8px 8px 3px 3px;
    background:linear-gradient(100deg,var(--rk-g));box-shadow:inset 0 2px 0 #ffffff80,inset 0 -8px 16px #00000040,0 10px 22px -10px #000;
    display:grid;place-items:start center;padding-top:8px}
  .jg-rk-bloque b{font-size:34px;font-weight:900;line-height:1;color:#ffffffd9;text-shadow:0 2px 0 #00000045,0 0 12px #ffffff60}
  .jg-rk-bloque::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);
    background:linear-gradient(90deg,transparent,#ffffff70,transparent);animation:jgRkBrillo 4.5s ease-in-out infinite}
  .jg-rk-oro{--rk-m1:#f4c542;--rk-brillo:#f4c542aa;--rk-alto:132px;--rk-g:#8a6a1c,#f7e08a 28%,#c99a2e 52%,#fff3b8 72%,#a57a20}
  .jg-rk-plata{--rk-m1:#d6dde6;--rk-brillo:#cbd5e166;--rk-alto:96px;--rk-g:#6b7280,#f1f5f9 30%,#9ca3af 55%,#ffffff 75%,#7b8492}
  .jg-rk-bronce{--rk-m1:#e89a5c;--rk-brillo:#e89a5c66;--rk-alto:70px;--rk-g:#6b3b1a,#f0b27a 30%,#a15c2a 55%,#ffd2a6 75%,#7e4420}
  .jg-rk-plata .jg-rk-bloque::after{animation-delay:1.2s}
  .jg-rk-bronce .jg-rk-bloque::after{animation-delay:2.1s}
  /* El #1 no es solo más alto: más grande, con halo que late. */
  .jg-rk-oro .jg-rk-av{width:78px;height:78px;font-size:30px;animation:jgRkHalo 2.6s ease-in-out infinite}
  .jg-rk-oro .jg-rk-nom{font-size:15px}
  .jg-rk-oro .jg-rk-pts b{font-size:26px;color:#ffe08a;text-shadow:0 0 14px #f4c54288}
  .jg-rk-corona{width:50px;height:34px;margin-bottom:-6px;position:relative;z-index:1;
    filter:drop-shadow(0 3px 6px #0008) drop-shadow(0 0 10px #f4c54288);animation:jgRkFlota 3s ease-in-out infinite}
  .jg-rk-p.yo .jg-rk-av{box-shadow:0 0 0 3px #0d0c1e,0 0 0 6px #2dd4bf,0 0 22px #2dd4bf99}
  .jg-rk-p.libre .jg-rk-av{background:transparent;border:2px dashed #ffffff40;box-shadow:none;color:#ffffff55;animation:none}
  .jg-rk-p.libre .jg-rk-nom{color:#ffffff66;font-weight:600}
  .jg-rk-p.libre .jg-rk-tit{color:#9ee8dc}
  .jg-rk-p.libre .jg-rk-bloque{background:#ffffff0d;border:2px dashed #ffffff26;box-shadow:none}
  .jg-rk-p.libre .jg-rk-bloque b{color:#ffffff30;text-shadow:none}
  .jg-rk-p.libre .jg-rk-bloque::after{display:none}
  /* Con marco, el avatar del podio cede el aro a su marco: sin borde ni
     recorte (el marco animado sobresale), y el marco toma el tamaño. */
  .jg-rk-av.con-marco{border:0;background:none;overflow:visible;box-shadow:none}
  .jg-rk-av.con-marco>.jg-av{--t:58px!important}
  .jg-rk-oro .jg-rk-av.con-marco>.jg-av{--t:78px!important}
  .jg-rk-oro .jg-rk-av.con-marco{animation:none}
  .jg-rk-p.yo .jg-rk-av.con-marco{box-shadow:none}
  .jg-rk-p.yo .jg-rk-av.con-marco>.jg-av{filter:drop-shadow(0 0 8px #2dd4bf)}

  /* «Tu posición»: lo que falta, dicho como algo que se puede hacer. */
  .jg-rk-tu{display:flex;align-items:center;gap:12px;max-width:560px;margin:14px auto 0;padding:11px 14px;border-radius:10px;
    background:#ffffff0f;border:1px solid #ffffff1f;text-align:left}
  .jg-rk-tu i{font-style:normal;flex-shrink:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;
    background:#2dd4bf22;color:#5eead4}
  .jg-rk-tu b{display:block;font-size:13px;color:#fff}
  .jg-rk-tu span{display:block;font-size:12px;color:#c8c2f0;line-height:1.5}
  .jg-rk-tu.podio{background:linear-gradient(90deg,#f4c54226,#f4c5420a);border-color:#f4c54259}
  .jg-rk-tu.podio i{background:#f4c54233;color:#ffe08a}

  /* La entrada: las peanas suben escalonadas (bronce, plata, oro), el
     resto aparece encima y la corona cae la última. Una vez por juego. */
  .jg-rk.entra .jg-rk-bloque{transform-origin:bottom;animation:jgRkSube .7s cubic-bezier(.2,.9,.3,1.15) both}
  .jg-rk.entra .jg-rk-p>:not(.jg-rk-bloque):not(.jg-rk-corona){animation:jgRkAparece .45s ease-out both}
  .jg-rk.entra .jg-rk-bronce .jg-rk-bloque{animation-delay:.05s}
  .jg-rk.entra .jg-rk-plata .jg-rk-bloque{animation-delay:.2s}
  .jg-rk.entra .jg-rk-oro .jg-rk-bloque{animation-delay:.35s}
  .jg-rk.entra .jg-rk-bronce>:not(.jg-rk-bloque):not(.jg-rk-corona){animation-delay:.45s}
  .jg-rk.entra .jg-rk-plata>:not(.jg-rk-bloque):not(.jg-rk-corona){animation-delay:.6s}
  .jg-rk.entra .jg-rk-oro>:not(.jg-rk-bloque):not(.jg-rk-corona){animation-delay:.8s}
  /* El halo del #1 no puede perderse porque la entrada ocupe su `animation`. */
  .jg-rk.entra .jg-rk-oro:not(.libre)>.jg-rk-av{animation:jgRkAparece .45s ease-out .8s both,jgRkHalo 2.6s ease-in-out 1.3s infinite}
  .jg-rk.entra .jg-rk-corona{animation:jgRkCae .6s cubic-bezier(.3,1.5,.5,1) 1.1s both,jgRkFlota 3s ease-in-out 1.7s infinite}
  .jg-rk.entra .jg-rk-tu{animation:jgRkAparece .5s ease-out 1.2s both}

  /* En la tabla, los tres primeros llevan su metal. */
  .jg-rk-med{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:11.5px;font-weight:800;color:#3b2a06;
    box-shadow:inset 0 1px 0 #fff9,0 1px 3px #0003}
  .jg-rk-med.jg-rk-oro{background:linear-gradient(135deg,#fff3b8,#f4c542 55%,#b8861f)}
  .jg-rk-med.jg-rk-plata{background:linear-gradient(135deg,#fff,#cbd5e1 55%,#8a94a3);color:#2f3742}
  .jg-rk-med.jg-rk-bronce{background:linear-gradient(135deg,#ffd9b3,#e0955a 55%,#8e4f22);color:#3b1d08}
  .jg-tabla tr.jg-rk-top:nth-child(1) td{background:#fffbeb}
  .jg-tabla tr.jg-rk-top:nth-child(2) td{background:#f8fafc}
  .jg-tabla tr.jg-rk-top:nth-child(3) td{background:#fff7ef}
  .jg-tabla tr.jg-rk-top:nth-child(1) .jg-pts{color:#a1700f}

  @keyframes jgRkGira{to{transform:rotate(360deg)}}
  @keyframes jgRkTitila{from{opacity:.55}to{opacity:1}}
  @keyframes jgRkBrillo{0%,55%{left:-60%}85%,100%{left:130%}}
  @keyframes jgRkHalo{0%,100%{box-shadow:0 0 0 3px #0d0c1e,0 0 16px #f4c54288}50%{box-shadow:0 0 0 3px #0d0c1e,0 0 30px #f4c542d0}}
  @keyframes jgRkFlota{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
  @keyframes jgRkSube{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes jgRkAparece{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes jgRkCae{from{opacity:0;transform:translateY(-40px) scale(1.6) rotate(-20deg)}to{opacity:1;transform:none}}
  @media (max-width:640px){
    .jg-rk{padding:18px 10px 14px}
    .jg-rk-cab h2{font-size:21px}
    .jg-rk-podio{gap:6px}
    .jg-rk-av{width:44px;height:44px;font-size:17px}
    .jg-rk-oro .jg-rk-av{width:60px;height:60px;font-size:24px}
    .jg-rk-av.con-marco>.jg-av{--t:44px!important}
    .jg-rk-oro .jg-rk-av.con-marco>.jg-av{--t:60px!important}
    .jg-rk-nom{font-size:11.5px}.jg-rk-oro .jg-rk-nom{font-size:13px}
    .jg-rk-pts b{font-size:16px}.jg-rk-oro .jg-rk-pts b{font-size:20px}
    .jg-rk-p small{display:none}
    .jg-rk-oro{--rk-alto:104px}.jg-rk-plata{--rk-alto:76px}.jg-rk-bronce{--rk-alto:56px}
    .jg-rk-bloque b{font-size:26px}
    .jg-rk-corona{width:40px;height:27px}
  }
  @media (prefers-reduced-motion:reduce){
    .jg-rk *,.jg-rk::before{animation:none!important}
    .jg-rk-rayos{transform:rotate(8deg)}
  }

  @media (max-width:640px){
    /* El tablero se lleva todo el ancho: con seis jugadores el
       marcador ya se parte en dos filas y el margen lateral es lo
       único que se puede dar. */
    .jg-tablero{padding:14px 8px}
    .jg-marcador{gap:9px}
    .jg-m{padding-left:6px;gap:4px}
    .jg-m b{font-size:14px}
    /* El cartel del final es una capa fija, así que en un móvil tiene
       que caber en la pantalla, no en la página. */
    .jg-fin{padding:22px 16px 18px}
    .jg-fin-cara{font-size:38px}
    .jg-fin-t{font-size:20px}
    .jg-fin-btns{flex-direction:column}
    .jg-fin-btns .btn{width:100%}
    /* En un móvil las dos columnas del perfil no caben: la foto pasa
       a ser una fila propia, centrada, y los colores se reparten en
       ocho de ancho completo para que se puedan tocar con el dedo. */
    .jg-modal{padding:20px 15px 16px}
    .jg-perfil-cuerpo{gap:14px}
    .jg-perfil-foto{width:100%;flex-direction:row;flex-wrap:wrap;justify-content:center}
    .jg-perfil-foto .btn2,.jg-perfil-foto .btn-ghost{width:auto;flex:1;min-width:120px}
    .jg-perfil-av{flex:0 0 auto}

  }

  /* Arcade: exclusivo de Juegos. */
  :root{--jg-ink:#232137;--jg-purple:#7042df;--jg-muted:#706d81}
  body{background:#f5f4fa;color:var(--jg-ink)}
  .head{height:auto;min-height:64px;padding:12px 28px;flex-wrap:wrap;background:#171522;gap:12px;border-bottom:1px solid #ffffff12}
  .head-nav a{color:#b8b2c8}.head-right{gap:8px}.btn-ghost{color:#cbc4de}
  /* El idioma va suelto en la cabecera, no dentro de .head-right: en un
     teléfono baja a la fila de las secciones, y así la fila de los botones
     cabe en 320 px sin empujar «Salir» fuera de la pantalla. */
  .head>.jg-idioma{display:flex;margin-left:auto}
  .head>.jg-idioma~.head-right{margin-left:0}
  /* El reproductor: botón con ecualizador en la cabecera y panel con el repertorio.
     El panel es oscuro en los dos temas, como la cabecera de la que sale. */
  .jg-rep-btn{display:inline-flex;align-items:center;gap:7px;max-width:210px;padding:6px 11px;border-radius:100px;background:#ffffff0d;border:1px solid #ffffff14;color:#e4ddf6}
  .jg-rep-btn:hover{background:#ffffff1a}
  .jg-rep-btn.apagado{color:#8f89a3}
  .jg-rep-nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .jg-rep-flecha{font-size:9px;opacity:.6}
  .jg-eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px;width:15px;flex:0 0 auto}
  .jg-eq i{display:block;width:2.5px;height:30%;border-radius:2px;background:#b598ff;transform-origin:bottom}
  .sonando .jg-eq i{animation:jgEq .9s ease-in-out infinite}
  .jg-eq i:nth-child(2){animation-delay:-.35s!important}.jg-eq i:nth-child(3){animation-delay:-.6s!important}.jg-eq i:nth-child(4){animation-delay:-.15s!important}
  @keyframes jgEq{0%,100%{height:25%}25%{height:95%}50%{height:45%}75%{height:75%}}
  .jg-rep{position:fixed;z-index:90;display:flex;flex-direction:column;background:linear-gradient(170deg,#241f36,#15121f 70%);color:#ece6fb;border:1px solid #ffffff1c;border-radius:18px;box-shadow:0 24px 60px #0007,0 0 0 1px #0003;overflow:hidden;opacity:0;transform:translateY(-8px) scale(.98);transform-origin:top right;transition:opacity .18s ease,transform .18s ease}
  .jg-rep.abierto{opacity:1;transform:none}
  .jg-rep-ahora{display:flex;gap:13px;align-items:center;padding:16px 16px 10px}
  .jg-rep-disco{width:54px;height:54px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#9d7bff,#5b34c9 55%,#2c1d63);box-shadow:0 8px 22px #7042df55,inset 0 1px 0 #ffffff40}
  .jg-rep-disco .jg-eq{height:24px;width:26px;gap:3px}.jg-rep-disco .jg-eq i{width:4px;background:#fff}
  .jg-rep.sonando .jg-rep-disco{animation:jgLatido 2.4s ease-in-out infinite}
  @keyframes jgLatido{50%{box-shadow:0 8px 30px #9164ffaa,inset 0 1px 0 #ffffff40}}
  .jg-rep-txt{min-width:0}
  .jg-rep-k{font:500 9.5px 'IBM Plex Mono',monospace;letter-spacing:1.8px;text-transform:uppercase;color:#a99bd0}
  .jg-rep-tit{font-size:16px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .jg-rep-sub{font-size:11.5px;color:#a8a1bd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .jg-rep-ctrl{display:flex;align-items:center;gap:6px;padding:4px 14px 10px}
  .jg-rep-b{width:34px;height:34px;border-radius:50%;border:0;background:#ffffff12;color:#fff;cursor:pointer;font-size:13px;display:grid;place-items:center;transition:background .15s,transform .15s}
  .jg-rep-b:hover{background:#ffffff24}.jg-rep-b:active{transform:scale(.92)}
  .jg-rep-b.pp{width:42px;height:42px;font-size:16px;background:#fff;color:#241f36}
  .jg-rep-b.pp:hover{background:#e9e2ff}
  .jg-rep-vol{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12px}
  .jg-rep-vol input{width:92px;accent-color:#b598ff;cursor:pointer}
  .jg-rep-fx{margin:8px 0 0;justify-content:flex-end;opacity:.9}.jg-rep-fx span{font-size:12px}
  .jg-rep-modos{display:flex;gap:4px;margin:0 14px 10px;padding:3px;border-radius:100px;background:#0000003d}
  .jg-rep-modos button{flex:1;border:0;border-radius:100px;background:transparent;color:#b3abc9;font-size:11px;padding:6px 4px;cursor:pointer;white-space:nowrap}
  .jg-rep-modos button.on{background:#ffffff1f;color:#fff}
  .jg-rep-modos button:disabled{opacity:.4;cursor:default}
  .jg-rep-aviso{margin:0 14px 10px;padding:8px 10px;border-radius:10px;background:#f7c94b1f;color:#f2d98c;font-size:11.5px}
  .jg-rep-lista{overflow:auto;padding:4px 8px 10px;border-top:1px solid #ffffff12;overscroll-behavior:contain}

  @media(max-width:600px){.jg-orb-hud,.jg-orb-marcador{padding-left:12px;padding-right:12px}.jg-orb-mando{gap:10px}.jg-orb-mando label{width:100%;justify-content:space-between}.jg-orb-mando input[type=range]{flex:1}.jg-orb-lanza{width:100%}}
