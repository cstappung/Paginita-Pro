/* ---- Los rieles del salón (juegos/rieles.js) ----
   En un PC ancho (≥ 1400 px, el mismo corte que `ANCHO` en rieles.js) y
   solo en las vistas de menú (`html.jg-rieles`): a la izquierda el
   carrusel de las mejores partidas del día, a la derecha el chat general. El
   contenido se estrecha para dejarles sitio en vez de quedar debajo. Más
   angosto, las repeticiones no salen y el chat es un botón 💬 que abre un
   panel (en el celular, una hoja desde abajo). Ese botón sale también en
   las demás vistas (una partida, un juego del club): `html.jg-cg-flota`,
   que pone rieles.js siempre que el chat no va acoplado al riel. La
   pantalla completa de un juego lo esconde (el bloque de abajo). Los
   tableros de las repeticiones son siempre oscuros, como las pantallas de
   los juegos. */
.jg-riel,.jg-cg-fab,.jg-cg-fondo{display:none}
.jg-riel{flex-direction:column;gap:10px;min-height:0;box-sizing:border-box}
.jg-riel-cab{display:flex;align-items:center;gap:8px;padding:0 4px;flex-shrink:0}
.jg-riel-cab h2{margin:0;font-size:13.5px;letter-spacing:-.2px}
.jg-riel-cab small{font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.4px;color:var(--jg-muted,#6b6679);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-riel-puerta{display:grid;gap:10px;justify-items:start;padding:16px;font-size:12.5px;line-height:1.5;color:var(--jg-muted,#6b6679);background:#fff;border:1px solid #e4dfeb;border-radius:16px}
.jg-riel-puerta p{margin:0}
.jg-riel-izq.invitado .jg-rp-lista{display:none}
/* El carrusel: arriba una partida grande (el juego y quién, la escena, de
   dónde viene y su marca, las flechas y la barra de lo que lleva), debajo
   la alineación de hoy. El color de cada juego (`--c`) es el de su
   portada en el salón. */
.jg-rp-lista{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.jg-rp{flex:1 1 0;min-height:118px;display:flex;flex-direction:column;gap:6px}
.jg-rp-cab{display:flex;align-items:center;gap:8px;padding:0 2px;min-width:0;flex-shrink:0}
.jg-rp-cab>a{display:flex;align-items:baseline;gap:6px;color:inherit;min-width:0;overflow:hidden}
.jg-rp-cab>a:hover{text-decoration:none}.jg-rp-cab>a:hover b{color:var(--jg-purple,#6d3fd4)}
.jg-rp-cab b{font-size:13px;white-space:nowrap}
.jg-rp-cab>a span{font-size:11px;color:var(--jg-muted,#6b6679);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.jg-rp-quien{display:flex;align-items:center;gap:6px;min-width:0;max-width:58%;margin-left:auto;font-size:12px;flex-shrink:0}
.jg-rp-quien .jg-av{flex-shrink:0}
.jg-rp-quien b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.jg-rp-lienzo{position:relative;flex:1;min-height:0;cursor:pointer}
.jg-rp.entra .jg-rp-lienzo{animation:jgRpEntra .35s ease-out}
@keyframes jgRpEntra{from{opacity:0;transform:translateX(16px)}}
.jg-rp-lienzo canvas{position:absolute;inset:0;display:block}
.jg-rp-msg{position:absolute;inset:0;margin:0;display:grid;place-content:center;gap:8px;padding:12px;text-align:center;font-size:12px;line-height:1.45;color:var(--jg-muted,#6b6679);border:1px dashed #d8d2e4;border-radius:12px}
.jg-rp-msg:empty{display:none}
.jg-rp.cargando .jg-rp-msg{animation:jgRpLate 1.4s ease-in-out infinite}
@keyframes jgRpLate{50%{opacity:.45}}
.jg-rp-pausa{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border:0;border-radius:50%;background:#000a;color:#fff;font-size:16px;cursor:pointer;display:none}
.jg-rp.pausada .jg-rp-pausa{display:block}
.jg-rp-jugar{font-size:12px;font-weight:600}
.jg-rp-pie{display:flex;align-items:center;gap:8px;min-width:0;flex-shrink:0;padding:0 2px}
.jg-rp-origen{flex:1;min-width:0;font-size:11.5px;color:var(--jg-muted,#6b6679);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-rp-origen b{font-weight:600;color:var(--jg-ink,#1d1830)}
.jg-rp-ctl{display:flex;gap:3px;flex-shrink:0}
.jg-rp-ctl button{width:28px;height:28px;display:grid;place-items:center;padding:0;border:0;border-radius:8px;background:#f1eef7;color:#3d3650;font-size:15px;line-height:1;cursor:pointer}
.jg-rp-ctl button:hover{background:#e6e0f2}
.jg-rp-ctl .jg-rp-pp{font-size:9px;letter-spacing:-1px}
.jg-rp.cargando .jg-rp-pp,.jg-rp.vacia .jg-rp-pp{visibility:hidden}
.jg-rp-barra{height:3px;border-radius:3px;background:#efebf5;overflow:hidden;flex-shrink:0}
.jg-rp-barra i{display:block;height:100%;background:var(--c,#6d3fd4);transform-origin:left;transform:scaleX(0)}
.jg-rp-hoy{margin:2px 2px 0;font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.6px;text-transform:uppercase;color:var(--jg-muted,#6b6679);flex-shrink:0}
.jg-rp-linea{list-style:none;margin:0;padding:0;display:grid;gap:2px;flex-shrink:0}
.jg-rp-linea button{position:relative;width:100%;display:grid;grid-template-columns:8px auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 8px;border:0;border-radius:10px;background:transparent;font:inherit;font-size:12px;color:inherit;text-align:left;cursor:pointer;overflow:hidden}
.jg-rp-linea button:hover{background:#f6f3fb}
.jg-rp-linea button.activa{background:color-mix(in srgb,var(--c) 16%,#fff)}
.jg-rp-punto{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px #0000001a}
.jg-rp-linea b{font-size:12.5px;white-space:nowrap}
.jg-rp-l-quien{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--jg-muted,#6b6679)}
.jg-rp-l-quien.nadie{font-style:italic}
.jg-rp-l-marca{font:600 11px 'IBM Plex Mono',monospace;color:#3d3650;white-space:nowrap}
.jg-rp-l-barra{position:absolute;left:0;bottom:0;width:100%;height:2px;background:var(--c);transform-origin:left;transform:scaleX(var(--p,0));opacity:0}
.jg-rp-linea button.activa .jg-rp-l-barra{opacity:1}

.jg-cg{flex-direction:column;background:#fff;border:1px solid #e4dfeb;border-radius:16px;overflow:hidden}
.jg-cg>.jg-riel-cab{padding:12px 14px;border-bottom:1px solid #efebf5}
.jg-cg-cierra{display:none;border:0;background:transparent;font-size:15px;color:var(--jg-muted,#6b6679);cursor:pointer;width:32px;height:32px;border-radius:8px}
.jg-cg-cierra:hover{background:#0000000d}
.jg-cg-lista{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:10px 12px;display:grid;gap:10px;align-content:start;scrollbar-width:thin}
.jg-cg-lista .vacio{padding:18px 4px;font-size:12px;text-align:center}
.jg-cg-lista .jg-riel-puerta{border:0;padding:8px 4px}
.jg-cg-msg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:12.5px;line-height:1.45;color:#34404b}
.jg-cg-msg p{margin:0;display:flex;align-items:baseline;gap:6px;min-width:0}
.jg-cg-msg b{color:var(--c,#555);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.jg-cg-msg time{font-size:10px;color:#8a97a3;white-space:nowrap}
.jg-cg-msg>div>span{display:block;overflow-wrap:anywhere}
.jg-cg-msg.mio>div>span{background:#f2eef9;border-radius:4px 10px 10px 10px;padding:4px 8px;margin-top:2px;width:fit-content;max-width:100%}
.jg-cg-nota{margin:0;padding:6px 14px;font-size:11.5px;color:#b45309;background:#fff7ed;border-top:1px solid #fde7c7}
.jg-cg-nota:empty{display:none}
.jg-cg-form{display:flex;gap:6px;padding:10px 12px;border-top:1px solid #efebf5;flex-shrink:0}
.jg-cg-form[hidden]{display:none}
.jg-cg-form .inp{flex:1;min-width:0;height:38px}
.jg-cg-form .btn{height:38px;min-width:76px;padding:0 12px;font-variant-numeric:tabular-nums}
.jg-cg-form .btn:disabled{opacity:.55;cursor:default}

@media(min-width:1400px){
  html.jg-rieles{--riel:clamp(250px,calc((100vw - 1232px) / 2 - 32px),400px)}
  html.jg-rieles main{max-width:min(1232px,calc(100vw - 2 * var(--riel) - 48px))}
  html.jg-rieles .jg-riel{display:flex;position:fixed;z-index:20;width:var(--riel);top:max(14px,calc(66px - var(--jg-scroll,0px)));bottom:14px}
  html.jg-rieles .jg-riel-izq{left:16px}
  html.jg-rieles .jg-riel-der{right:16px}
  html.jg-rieles .jg-riel-der.invitado{bottom:auto}
  /* El ⚑ de informes se corre a la izquierda del chat: si no, tapa «Enviar». */
  html.jg-rieles .rp-fab{right:calc(var(--riel) + 28px)}
}
/* La burbuja del chat general y su panel, en cualquier vista que no lo
   lleve acoplado al riel. */
html.jg-cg-flota .jg-cg-fab{display:grid;place-items:center;position:fixed;right:16px;bottom:62px;z-index:55;width:50px;height:50px;border:0;border-radius:50%;background:var(--jg-purple,#6d3fd4);color:#fff;cursor:pointer;box-shadow:0 8px 24px #2a1e4433;transition:transform .15s}
html.jg-cg-flota .jg-cg-fab:hover{transform:translateY(-2px)}
html.jg-cg-flota .jg-cg-fab svg{width:22px;height:22px}
.jg-cg-n{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#ef4444;color:#fff;font:700 11px/20px 'IBM Plex Sans',sans-serif;box-shadow:0 0 0 2px #fff;animation:jgCgPunto .35s ease-out}
.jg-cg-n[hidden]{display:none}
html.jg-cg-flota.jg-cg-abierto .jg-cg{display:flex;position:fixed;z-index:66;right:16px;bottom:120px;width:min(380px,calc(100vw - 32px));height:min(560px,calc(100dvh - 150px));box-shadow:0 18px 50px #2a1e4440;animation:jgVela .18s ease-out}
html.jg-cg-flota.jg-cg-abierto .jg-cg-cierra{display:block}
html.jg-cg-flota.jg-cg-abierto .jg-cg-fab{background:#3b2a66}
html.jg-cg-abierto .rp-fab{display:none}
/* En una sala de PC el chat de la sala es la columna de la derecha: la
   burbuja va a la izquierda para no taparle el «Enviar». */
@media(min-width:1051px){
  html.jg-cg-flota[data-vista=partida] .jg-cg-fab{right:auto;left:16px;bottom:16px}
  html.jg-cg-flota[data-vista=partida].jg-cg-abierto .jg-cg{right:auto;left:16px;bottom:76px}
}
@media(max-width:720px){
  html.jg-cg-flota .jg-cg-fab{bottom:calc(62px + env(safe-area-inset-bottom))}
  /* Sobre la barra de pestañas de abajo de las vistas de menú. */
  html.jg-cg-flota:is([data-vista=vestibulo],[data-vista=ranks],[data-vista=logros],[data-vista=monedas],[data-vista=perfil],[data-vista=cartas],[data-vista=mascotas],[data-vista=mercado],[data-vista=casino]) .jg-cg-fab{bottom:calc(128px + env(safe-area-inset-bottom))}
  html.jg-cg-flota.jg-cg-abierto .jg-cg-fondo{display:block;position:fixed;inset:0;z-index:65;background:#0f172866;animation:jgVela .2s ease-out}
  html.jg-cg-flota.jg-cg-abierto .jg-cg{left:0;right:0;bottom:0;width:auto;height:min(78dvh,640px);border-radius:20px 20px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom);animation:jgCgSube .22s ease-out}
  html.jg-cg-flota.jg-cg-abierto .jg-cg-fab{display:none}
  .jg-cg-form .inp{font-size:16px}
}
/* Pantalla completa: ni burbuja ni panel (la sala inmersiva, el Tetris
   inmersivo, el modo celular del club, PRODROP y Mascotas). */
html:is(.jg-inm,.jg-tt-inm,.jg-club-inm,.jg-club-pleno,.jg-prodrop,.jg-mascotas) :is(.jg-cg-fab,.jg-cg,.jg-cg-fondo){display:none!important}
@keyframes jgCgPunto{from{transform:scale(.4)}60%{transform:scale(1.2)}}

/* ---- Los super chats (rieles-datos.js, `SUPER_CHAT`) ----
   Todo el mensaje lleva el contorno: dorado el Destacado, un degradado que
   gira el Estelar. El borde es un fondo `border-box` bajo uno
   `padding-box`, así el contorno sigue el radio. */
.jg-cg-msg.super{--sup-fondo:#fff;position:relative;padding:8px 10px 9px;border:2px solid transparent;border-radius:12px;row-gap:4px}
.jg-cg-msg.s-brillo{background:linear-gradient(var(--sup-fondo),var(--sup-fondo)) padding-box,linear-gradient(135deg,#f59e0b,#fde047 45%,#f59e0b) border-box;box-shadow:0 0 0 1px #f59e0b22,0 6px 18px #f59e0b2e}
.jg-cg-msg.s-estelar{background:linear-gradient(var(--sup-fondo),var(--sup-fondo)) padding-box,linear-gradient(120deg,#ec4899,#8b5cf6,#06b6d4,#f59e0b,#ec4899) border-box;background-size:100% 100%,300% 300%;animation:jgCgEstelar 6s linear infinite;box-shadow:0 0 14px #8b5cf640,0 6px 20px #ec489926}
.jg-cg-msg.super .jg-cg-sup{grid-column:1/-1;display:flex;align-items:center;gap:6px;font:700 10.5px/1.2 'IBM Plex Sans',sans-serif;letter-spacing:.2px;font-style:normal;color:#92400e}
.jg-cg-msg.s-estelar .jg-cg-sup{color:#7c3aed}
.jg-cg-sup small{margin-left:auto;font:500 10px 'IBM Plex Mono',monospace;color:#8a97a3;white-space:nowrap}
.jg-cg-msg.super>div>span{font-weight:600;color:#1f2430}
.jg-cg-msg.super.mio>div>span{background:none;padding:0;margin-top:0;border-radius:0}
@keyframes jgCgEstelar{to{background-position:0 0,300% 0}}
/* El selector, encima del formulario. */
.jg-cg-sbtn{flex-shrink:0;width:38px;height:38px;border:1px solid #e4dfeb;border-radius:10px;background:#fff;color:#8b5cf6;font-size:17px;cursor:pointer;transition:background .15s,color .15s}
.jg-cg-sbtn:hover{background:#f5f0ff}
.jg-cg-sbtn.activo{background:linear-gradient(135deg,#ec4899,#8b5cf6);border-color:transparent;color:#fff}
.jg-cg-super{padding:10px 12px 2px;border-top:1px solid #efebf5;flex-shrink:0;animation:jgVela .15s ease-out}
.jg-cg-super[hidden]{display:none}
.jg-cg-super>p{margin:0 0 8px;display:flex;align-items:baseline;gap:8px;font-size:12px}
.jg-cg-super>p span{font-size:11px;color:var(--jg-muted,#6b6679)}
.jg-cg-ops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.jg-cg-op{--sup-fondo:#fff;display:grid;gap:2px;padding:7px 6px;border:2px solid #e4dfeb;border-radius:10px;background:var(--sup-fondo);text-align:center;cursor:pointer;font:inherit;color:#34404b}
.jg-cg-op b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-cg-op small{font:500 10px 'IBM Plex Mono',monospace;color:#8a97a3}
.jg-cg-op.s-brillo{border-color:transparent;background:linear-gradient(var(--sup-fondo),var(--sup-fondo)) padding-box,linear-gradient(135deg,#f59e0b,#fde047,#f59e0b) border-box}
.jg-cg-op.s-estelar{border-color:transparent;background:linear-gradient(var(--sup-fondo),var(--sup-fondo)) padding-box,linear-gradient(120deg,#ec4899,#8b5cf6,#06b6d4,#f59e0b) border-box}
.jg-cg-op.sel{--sup-fondo:#f5f0ff;box-shadow:0 0 0 3px #8b5cf633}
.jg-cg-op.s-normal.sel{border-color:#8b5cf6}
.jg-cg-op:disabled{opacity:.45;cursor:not-allowed}
.jg-cg-form .btn.super{background:linear-gradient(135deg,#ec4899,#8b5cf6);border-color:transparent;color:#fff}
@keyframes jgCgSube{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.jg-rp.cargando .jg-rp-msg,.jg-rp.entra .jg-rp-lienzo,html.jg-cg-flota.jg-cg-abierto .jg-cg,.jg-cg-n,.jg-cg-msg.s-estelar,.jg-cg-super{animation:none}}

html[data-tema=oscuro] .jg-cg,html[data-tema=oscuro] .jg-riel-puerta{background:var(--os-sup);border-color:var(--os-borde)}
html[data-tema=oscuro] .jg-riel-cab small,html[data-tema=oscuro] .jg-rp-cab>a span,html[data-tema=oscuro] .jg-rp-msg,html[data-tema=oscuro] .jg-riel-puerta,html[data-tema=oscuro] .jg-cg-msg time,html[data-tema=oscuro] .jg-cg-cierra{color:var(--os-tx3)}

html[data-tema=oscuro] .jg-rp-origen,html[data-tema=oscuro] .jg-rp-hoy,html[data-tema=oscuro] .jg-rp-l-quien{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-rp-ctl button{background:var(--os-sup2);color:var(--os-tx)}
html[data-tema=oscuro] .jg-rp-ctl button:hover{background:var(--os-sup3)}
html[data-tema=oscuro] .jg-rp-barra{background:var(--os-sup2)}
html[data-tema=oscuro] .jg-rp-linea button:hover{background:var(--os-sup2)}

html[data-tema=oscuro] .jg-cg-sbtn.activo{background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff}

html[data-tema=oscuro] .jg-cg-super>p span,html[data-tema=oscuro] .jg-cg-sup small,html[data-tema=oscuro] .jg-cg-op small{color:var(--os-tx3)}

/* ---------- el panel de administración (juegos/admin.js, #admin) ---------- */
.jg-adm{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.jg-adm-cab h1{margin:0;font-size:24px}.jg-adm-cab p{margin:4px 0 0;color:var(--jg-muted,#6b6679);font-size:13.5px}
.jg-adm-aviso{background:#fff4d6;border:1px solid #e8c770;border-radius:12px;padding:10px 14px;margin:0;font-size:13.5px}
.jg-adm-tabs{display:flex;gap:8px;flex-wrap:wrap}
.jg-adm-tabs .btn2.on{background:#242031;color:#fff;border-color:#242031}
.jg-adm-tabs b{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:#c8102e;color:#fff;font-size:11px;line-height:18px}

.jg-adm-lista>li{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:#fff;border:1px solid #e4dfeb;border-radius:14px;padding:10px 14px}
.jg-adm-lista>li.viejo{opacity:.65}
.jg-adm-lista>li>div{min-width:0;overflow-wrap:anywhere}
.jg-adm-motivos{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:#9a2b2b}

.jg-adm-nota{color:var(--jg-muted,#6b6679);font-size:12.5px}
.jg-adm-pre{max-height:320px;overflow:auto;font-size:11px;background:#f6f4f9;padding:10px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.jg-adm-player{margin-top:10px}
.jg-adm-lienzo{width:100%;max-width:560px;margin:0 auto;background:#0d1020;border-radius:12px;overflow:hidden}
.jg-adm-lienzo canvas{display:block}

.jg-adm-form .inp{width:100%;box-sizing:border-box}
.jg-adm-form .btn{justify-self:start}
.jg-adm-presets{display:flex;gap:6px;flex-wrap:wrap;font-weight:400}

@media(max-width:600px){.jg-adm-lista>li{flex-direction:column}.jg-adm-btns{justify-content:flex-start}}

/* ============================================================
   🏪 El mercado (`#mercado`, juegos/mercado.js): cartas de PRODROP y
   objetos, bailes y mascotas de Mascotas. Mobile first: una columna de
   filtros que se desplazan de lado, y una grilla que crece con el ancho.
   Las miniaturas de Mascotas son fotos del visor (`.jg-mk-foto`), con el
   emoji mientras llegan. El detalle es una capa con el visor en vivo.
   ============================================================ */
.jg-mk{max-width:1100px;margin:0 auto;padding:4px 0 24px;display:flex;flex-direction:column;gap:12px}
/* El encabezado: una franja oscura con brillo, el saldo y, a la derecha,
   las tres cartas más caras a la venta en abanico (solo si cabe). */
.jg-mk-cab{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:150px;padding:20px 22px;border-radius:22px;overflow:hidden;color:#fff;isolation:isolate;
  background:radial-gradient(120% 140% at 85% 20%,#c2408f88,transparent 55%),radial-gradient(90% 120% at 10% 110%,#2f6bff55,transparent 60%),linear-gradient(125deg,#1d1238,#3d1f7d 55%,#5a2a9e);box-shadow:0 14px 36px #2a1e4433}
.jg-mk-cab::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(#ffffff2e 1px,transparent 1.4px) 0 0/22px 22px;-webkit-mask:linear-gradient(90deg,#000,transparent 70%);mask:linear-gradient(90deg,#000,transparent 70%);opacity:.5}
.jg-mk-cab::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 30%,#ffffff1c 45%,transparent 60%);background-size:260% 100%;animation:jgMkBrillo 7s ease-in-out infinite}
.jg-mk-cab-tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.jg-mk-cab-k{font:500 10px 'IBM Plex Mono',monospace;letter-spacing:2.2px;text-transform:uppercase;color:#d9c8ff}
.jg-mk-cab h1{margin:0;font-size:30px;letter-spacing:-.8px;color:#fff}
.jg-mk-cab p{margin:0;color:#e6dcff;font-size:13.5px}
.jg-mk-cab-acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.jg-mk-saldo,.jg-mk-cab-ir{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:99px;font-size:13px;font-weight:700;color:#fff;text-decoration:none;background:#ffffff1a;border:1px solid #ffffff2e;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .15s}
.jg-mk-saldo{background:#ffcc3d26;border-color:#ffcc3d66;color:#ffe69a}
.jg-mk-saldo .jg-moneda{width:16px;height:16px}
.jg-mk-cab-ir:hover{background:#ffffff33}
.jg-mk-abanico{position:relative;flex:0 0 230px;height:150px;margin:-10px 4px -14px 0}
.jg-mk-ab{position:absolute;left:50%;top:50%;width:84px;margin:-60px 0 0 -42px;transform:translateX(calc(var(--k) * 62px)) rotate(calc(var(--k) * 11deg)) translateY(calc(var(--k) * var(--k) * 8px));filter:drop-shadow(0 10px 18px #0007);animation:jgMkFlota 5s ease-in-out infinite;animation-delay:calc(var(--k) * .8s)}
.jg-mk-ab:nth-child(2){z-index:1}
.jg-mk-ab .jg-pdc figcaption,.jg-mk-ab .jg-mk-funda{display:none}
@keyframes jgMkFlota{50%{translate:0 -7px}}
@keyframes jgMkBrillo{0%,40%{background-position:120% 0}100%{background-position:-120% 0}}
@media(max-width:620px){.jg-mk-abanico{display:none}.jg-mk-cab{min-height:0}}
.jg-mk-seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:#f1edf8;overflow-x:auto;scrollbar-width:none}
.jg-mk-seg button{flex:1;min-width:max-content;border:0;background:transparent;border-radius:10px;padding:8px 12px;font:600 14px inherit;color:#5b5670;cursor:pointer}
.jg-mk-seg button[aria-pressed=true]{background:#fff;color:var(--jg-purple,#7042df);box-shadow:0 1px 4px #2a1e4422}
.jg-mk-seg.chico button{padding:6px 10px;font-size:13px}
.jg-mk-tabs{display:flex;gap:4px;border-bottom:1px solid #e6e1ee}
.jg-mk-tabs button{border:0;background:transparent;padding:9px 12px;font:600 14px inherit;color:#6b6679;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.jg-mk-tabs button[aria-selected=true]{color:var(--jg-purple,#7042df);border-bottom-color:var(--jg-purple,#7042df)}
.jg-mk-tabs b{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:#e8453c;color:#fff;font-size:11px}
.jg-mk-aviso{margin:0;padding:10px 12px;border-radius:12px;background:#fff4dc;border:1px solid #f1d28a;font-size:13px}
.jg-mk-filtros{display:flex;flex-direction:column;gap:8px}
.jg-mk-fila{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.jg-mk-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #e1dbea;background:#fff;border-radius:999px;padding:5px 11px;font:600 12.5px inherit;color:#4b4760;cursor:pointer}
.jg-mk-chip i{font-style:normal;color:var(--c)}
.jg-mk-chip.on{border-color:var(--c,var(--jg-purple,#7042df));background:color-mix(in srgb,var(--c,#7042df) 14%,#fff);color:#232137}
.jg-mk-sel{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#6b6679}
.jg-mk-sel select{font:inherit;padding:5px 8px;border-radius:9px;border:1px solid #e1dbea;background:#fff;color:#232137}
.jg-mk-q{flex:1 1 180px;min-width:0;font:inherit;font-size:14px;padding:7px 11px;border-radius:10px;border:1px solid #e1dbea;background:#fff;color:#232137}
.jg-mk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.jg-mk-it{display:flex;flex-direction:column;gap:7px;padding:8px;border-radius:16px;border:1px solid #e5e0ee;background:#fff;text-align:left;cursor:pointer;color:inherit;font:inherit;transition:transform .18s,box-shadow .18s,border-color .18s;animation:jgMkEntra .42s cubic-bezier(.2,.9,.3,1.15) backwards;animation-delay:calc(min(var(--i,0),16) * 32ms)}
.jg-mk-it:hover{transform:translateY(-3px);box-shadow:0 12px 28px #2a1e441f}
@keyframes jgMkEntra{from{opacity:0;transform:translateY(16px) scale(.97)}}
/* Las cartas: una vitrina oscura con la luz del color de su rareza. */
.jg-mk-it.t-carta:hover{border-color:color-mix(in srgb,var(--rc) 70%,#fff);box-shadow:0 14px 32px color-mix(in srgb,var(--rc) 38%,transparent)}
.jg-mk-it.t-carta .jg-mk-img{flex:1;aspect-ratio:auto;padding:14px 16px 16px;border-radius:12px;background:radial-gradient(85% 60% at 50% 42%,color-mix(in srgb,var(--rc) 34%,#2a1f45),#130d22 78%);overflow:visible}
.jg-mk-it.r0 .jg-mk-img{background:radial-gradient(85% 60% at 50% 42%,#3a3550,#16121f 78%)}
.jg-mk-it.r2 .jg-mk-img::before,.jg-mk-it.r3 .jg-mk-img::before{content:"";position:absolute;inset:8% 4%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--rc) 55%,transparent),transparent);filter:blur(10px);animation:jgMkLatido 3.2s ease-in-out infinite;pointer-events:none}
.jg-mk-it.r3 .jg-mk-img::after{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;background:radial-gradient(#ffe79a 1.2px,transparent 2px) 0 0/47px 59px,radial-gradient(#fff 1px,transparent 1.6px) 23px 31px/71px 83px,radial-gradient(#ffd36b 1.4px,transparent 2.2px) 61px 7px/97px 113px;opacity:.6;animation:jgMkSube 11s linear infinite;-webkit-mask:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
@keyframes jgMkLatido{50%{opacity:.55;transform:scale(.93)}}
@keyframes jgMkSube{to{background-position:0 -590px,23px -499px,61px -671px}}
.jg-mk-it.t-carta .jg-mk-tx b{font-size:14px}
.jg-mk-rar{font-weight:700;color:var(--rt)}
.jg-mk-it.mia{border-color:#c9b6ff;background:#faf7ff}
.jg-mk-img{display:grid;place-items:center;aspect-ratio:1;border-radius:10px;background:#f7f4fb;overflow:hidden;position:relative}
.jg-mk-img .jg-pdc{width:100%}
/* ---- La carta viva (`cartaViva` en mercado.js) ----
   Se inclina hacia el puntero (`--rx/--ry`) y un reflejo la sigue
   (`--mx/--my`). Rara: una franja de luz que la cruza. Épica: holo
   arcoíris y destellos. Legendaria: además la imagen iridiscente, como en
   el abridor. Graduada: dentro de su funda, con la nota en la etiqueta. */
.jg-mk-cv{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;position:relative;display:block;width:100%;perspective:700px}
.jg-mk-cv-in{position:relative;display:block;transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
.jg-mk-cv.mueve .jg-mk-cv-in{transition:transform .08s linear}
.jg-mk-grid .jg-mk-cv .jg-pdc figcaption{display:none}
.jg-mk-cv .jg-pdc{border-radius:7px}
.jg-mk-cv :is(.jg-mk-cv-holo,.jg-mk-cv-chispa,.jg-mk-cv-luz,.jg-mk-cv-iri){position:absolute;inset:0;z-index:1;pointer-events:none}
.jg-mk-cv-luz{background:radial-gradient(circle at var(--mx) var(--my),#ffffffa0,#fff0 48%);mix-blend-mode:soft-light;opacity:0;transition:opacity .3s}
.jg-mk-cv.mueve .jg-mk-cv-luz{opacity:1}
.jg-mk-cv.r1 .jg-mk-cv-holo{background:linear-gradient(115deg,transparent 38%,#ffffff70 48%,#bfe9ff55 52%,transparent 62%);background-size:300% 100%;mix-blend-mode:screen;animation:jgMkCruza 4.6s ease-in-out infinite}
.jg-mk-cv:is(.r2,.r3) .jg-mk-cv-holo{background:repeating-linear-gradient(115deg,#ff6b8f,#ffd36b 7%,#7dffb0 14%,#6bd2ff 21%,#c58bff 28%,#ff6b8f 35%);background-size:420% 420%;mix-blend-mode:color-dodge;opacity:.28;animation:jgMkHolo 6s linear infinite}
.jg-mk-cv:is(.r2,.r3).mueve .jg-mk-cv-holo{animation:none;background-position:var(--mx) var(--my);opacity:.3}
.jg-mk-cv-chispa{background:radial-gradient(#fff 1px,transparent 1.8px) 7px 11px/41px 53px,radial-gradient(#fff 1.3px,transparent 2px) 29px 37px/67px 79px,radial-gradient(#fffbe0 .9px,transparent 1.6px) 50px 18px/89px 61px;mix-blend-mode:screen;opacity:.8;animation:jgMkTitila 3.4s ease-in-out infinite,jgMkDeriva 18s linear infinite}
.jg-mk-cv-iri{mix-blend-mode:color-dodge;opacity:.45}
.jg-mk-cv-iri img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(2.2) contrast(1.2);animation:jgMkIri 5s ease-in-out infinite alternate}
@keyframes jgMkCruza{0%,55%{background-position:130% 0}100%{background-position:-130% 0}}
@keyframes jgMkHolo{to{background-position:420% 0}}
@keyframes jgMkTitila{50%{opacity:.25}}
@keyframes jgMkDeriva{to{background-position:48px -95px,96px -121px,139px -104px}}
@keyframes jgMkIri{from{filter:saturate(2.2) contrast(1.2) hue-rotate(-30deg)}to{filter:saturate(2.2) contrast(1.2) hue-rotate(30deg)}}
.jg-mk-cv.r2 .jg-pdc{box-shadow:0 0 0 1px #fff4 inset,0 0 18px color-mix(in srgb,var(--cc) 60%,transparent)}
.jg-mk-cv.r3 .jg-pdc{box-shadow:0 0 22px #ffcc3d88,0 0 50px #ff8ad844}
/* La funda de graduada: plástico con la etiqueta arriba y la nota. */
.jg-mk-cv.gr .jg-mk-cv-in{padding:4px 5px 6px;border-radius:10px;background:linear-gradient(160deg,#ffffff3a,#ffffff0e 40%,#ffffff22);border:1px solid #ffffff66;box-shadow:inset 0 1px 0 #fff8,0 6px 18px #0005;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.jg-mk-funda{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:6px;margin-bottom:5px;padding:4px 7px;border-radius:5px;background:linear-gradient(180deg,#fdfcff,#e7e3f0);color:#1b1530;box-shadow:inset 0 0 0 1.5px var(--gc)}
.jg-mk-funda small{font:800 7.5px/1 system-ui,sans-serif;letter-spacing:.14em;color:#6b6280}
.jg-mk-funda em{grid-row:2;font:800 9.5px/1.15 system-ui,sans-serif;font-style:normal;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-mk-funda b{grid-row:1/3;grid-column:2;font:900 21px/1 'IBM Plex Mono',monospace;color:#1b1530;text-shadow:0 0 8px var(--gc)}
.jg-mk-cv.gr .jg-pdc-nota{display:none}
.jg-mk-img.chica .jg-mk-funda{display:none}
.jg-mk-img.chica .jg-mk-cv.gr .jg-mk-cv-in{padding:2px}
.jg-mk-img.chica .jg-mk-cv.gr .jg-pdc-nota{display:grid;min-width:15px;height:15px;font-size:9.5px}
.jg-mk-img.chica{width:64px;flex:none}
.jg-mk-img.chica .jg-pdc figcaption{display:none}
.jg-mk-foto{position:relative;display:grid;place-items:center;width:100%;height:100%}
.jg-mk-foto img{width:88%;height:88%;object-fit:contain}
/* las piezas de Batalla de Rock: la foto viene con su fondo, en un cuadro redondeado */
.jg-mk-foto.rk img{border-radius:14%;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.jg-mk-emoji{font-size:44px;line-height:1}
.jg-mk-img.chica .jg-mk-emoji{font-size:28px}
.jg-mk-muestra{position:absolute;left:6px;bottom:6px;display:flex;gap:2px}
.jg-mk-muestra i{width:10px;height:10px;border-radius:50%;border:1px solid #0003}
.jg-mk-leg,.jg-mk-eterna{position:absolute;top:5px;right:6px;font-size:13px;color:#f2b00c;text-shadow:0 1px 2px #0004}
.jg-mk-eterna{right:auto;left:6px}
.jg-mk-tx{display:flex;flex-direction:column;min-width:0}
.jg-mk-tx b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-mk-tx small{font-size:11.5px;color:#7a7590;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-mk-pie{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.jg-mk-p{display:inline-flex;align-items:center;gap:4px;font-size:14px;white-space:nowrap;padding:3px 9px 3px 5px;border-radius:99px;background:#fff6db;color:#5c4300}
.jg-mk-p .jg-moneda{width:15px;height:15px}
.jg-mk-p.caro{color:#b3412f;background:#fdebe7}
.jg-mk-tuya{font-size:11px;font-weight:700;color:var(--jg-purple,#7042df);background:#efe9fb;border-radius:99px;padding:2px 8px}
.jg-mk-quien{display:inline-flex;align-items:center;gap:5px;min-width:0;font-size:12px}
.jg-mk-quien b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-mk-pie .jg-mk-quien{max-width:58%}
.jg-mk-mas{align-self:center}
.jg-mk-vacio{text-align:center;padding:30px 10px;color:#7a7590}
.jg-mk-vacio b{display:block;font-size:34px}
.jg-mk-nota{margin:0;font-size:12.5px;color:#7a7590}
.jg-mk-nota.err{color:#b3412f}
.jg-mk-lista{display:flex;flex-direction:column;gap:8px}
.jg-mk-fv{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:#fff;border:1px solid #e5e0ee}
.jg-mk-fv-tx{display:flex;flex-direction:column;flex:1;min-width:0;font-size:13px}
.jg-mk-fv-tx small{color:#7a7590;font-size:11.5px}
.jg-mk-fv-p{display:inline-flex;align-items:center;gap:4px;font-weight:700;white-space:nowrap}
.jg-mk-fv-p .jg-moneda{width:14px;height:14px}
.jg-mk-est{align-self:flex-start;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:#eee;color:#555}
.jg-mk-est.act{background:#e8f0ff;color:#2e5bd8}.jg-mk-est.ok{background:#e3f7e8;color:#23874f}.jg-mk-est.mal{background:#fde6e3;color:#b3412f}
.jg-mk-mini{padding:5px 10px;font-size:12.5px}
.jg-mk-como{padding:12px 14px;border-radius:14px;background:#f6f2ff;border:1px solid #e1d8f7;font-size:13px;line-height:1.45;color:#3f3a52}
.jg-mk-como ol{margin:6px 0 0;padding-left:20px}
.jg-mk-precio{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.jg-mk-precio .jg-moneda{width:14px;height:14px}
.jg-mk-precio input{width:84px;padding:5px 7px;border-radius:9px;border:1px solid #d7d0e6;font:inherit;font-size:13px}
@media (max-width:560px){.jg-mk-vende{flex-wrap:wrap}.jg-mk-vende .jg-mk-fv-tx{flex-basis:calc(100% - 70px)}.jg-mk-vende .jg-mk-precio{margin-left:auto}}
.jg-mk-trato{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;background:#fff;border:1px solid #e5e0ee}
.jg-mk-trato header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.jg-mk-trato header small{color:#7a7590;font-size:12px}
.jg-mk-trato-c{display:flex;align-items:center;gap:8px}
.jg-mk-lado{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.jg-mk-lado>small{font-size:11.5px;color:#7a7590}
.jg-mk-cosas{display:flex;gap:6px;flex-wrap:wrap}
.jg-mk-cosas .jg-mk-img.chica{width:54px}
.jg-mk-nada{font-size:12px;color:#9b97ab;font-style:italic}
.jg-mk-flecha{font-size:20px;color:#9b97ab}
.jg-mk-acc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.jg-mk-capa{position:fixed;inset:0;z-index:72;background:#160f2499;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:jgMkCapa .18s ease-out}
.jg-mk-det{position:relative;width:100%;max-height:92vh;overflow:auto;background:#fff;color:var(--jg-ink,#232137);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:14px;animation:jgHoja .24s ease-out}
.jg-mk-x{position:absolute;top:10px;right:10px;z-index:2;width:32px;height:32px;border-radius:50%;border:0;background:#0000000f;font-size:14px;cursor:pointer;color:inherit}
.jg-mk-det-vis{position:relative;display:grid;place-items:center;min-height:220px;border-radius:16px;background:radial-gradient(circle at 50% 40%,#fff8ee,#f1eaf9)}
/* El detalle de una carta: la vitrina mientras carga el visor de PRODROP
   (la carta con su aura de partículas, en un iframe sin fondo). */
.jg-mk-det-vis.carta{min-height:min(400px,64vh);overflow:hidden;background:radial-gradient(70% 55% at 50% 45%,color-mix(in srgb,var(--rc) 40%,#2a1f45),#0f0a1c 80%)}
.jg-mk-det.r0 .jg-mk-det-vis.carta{background:radial-gradient(70% 55% at 50% 45%,#3a3550,#120e1c 80%)}
.jg-mk-det-cv{width:min(200px,46vw);transition:opacity .4s}
.jg-mk-det-vis.carta .jg-pdc figcaption{display:none}
.jg-mk-pd{position:absolute;inset:0;opacity:0;transition:opacity .45s}
.jg-mk-det-vis.pd-listo .jg-mk-pd{opacity:1}
.jg-mk-det-vis.pd-listo .jg-mk-det-cv{opacity:0}
.jg-mk-etis{display:flex;flex-wrap:wrap;gap:5px}
.jg-mk-eti{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:#f1edf8;color:#5b5670}
.jg-mk-eti.rar{background:color-mix(in srgb,var(--rc) 22%,#fff);color:var(--rt)}
.jg-mk-eti.nota{background:color-mix(in srgb,var(--gc) 30%,#fff);color:#1b1530;box-shadow:inset 0 0 0 1.5px var(--gc)}
.jg-mk-eti.dios{background:linear-gradient(90deg,#ffcc3d,#ff8ad8);color:#1a0b33}
.jg-mk-det-vis .jg-mk-foto.grande{width:200px;height:200px}
.jg-mk-det-vis.vivo .jg-mk-foto{position:absolute;inset:0;margin:auto}
.jg-mk-det-vis.vivo:has(.visor-listo) .jg-mk-foto{visibility:hidden}
.jg-mk-vivo{position:absolute;inset:0}
/* `color-scheme:normal`: con la página en oscuro y el visor en claro, el
   navegador pinta el iframe opaco (blanco) en vez de transparente. */
.jg-visor{display:block;width:100%;height:100%;border:0;background:transparent;color-scheme:normal}
.jg-mk-det-tx{display:flex;flex-direction:column;gap:8px}
.jg-mk-det-tx h2{margin:0;font-size:22px}
.jg-mk-det-tx p{margin:0}
.jg-mk-det-p{display:flex;align-items:center;gap:6px;font-size:22px}
.jg-mk-det-p .jg-moneda{width:22px;height:22px}
.jg-mk-tc{max-width:none}
.jg-mk-tc-c h2{margin:0 0 10px;font-size:20px}
.jg-mk-gente{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.jg-mk-persona{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px;border-radius:12px;border:1px solid #e5e0ee;background:#fff;cursor:pointer;font:inherit;color:inherit;text-align:left}
.jg-mk-persona small{color:#7a7590;font-size:12px}
.jg-mk-tc-cab{display:flex;align-items:center;gap:10px;margin:0 30px 10px 0}
.jg-mk-tc-cols{display:grid;gap:12px}
.jg-mk-tc-cols h3{margin:0 0 6px;font-size:15px}
.jg-mk-tc-cols h3 small{color:#7a7590;font-weight:500}
.jg-mk-rej{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;max-height:36vh;overflow:auto;padding:2px}
.jg-mk-elige{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;border-radius:10px;border:2px solid transparent;background:#f7f4fb;cursor:pointer;font:inherit;color:inherit}
.jg-mk-elige .jg-mk-img.chica{width:100%}
.jg-mk-elige small{font-size:10.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-mk-elige.on{border-color:var(--jg-purple,#7042df);background:#efe9fb}
.jg-mk-toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:12px;background:#232137;color:#fff;font-size:14px;box-shadow:0 10px 30px #0004;animation:jgMkCapa .2s ease-out}
.jg-mk-toast.mal{background:#b3412f}
@keyframes jgMkCapa{from{opacity:0}}
@media(min-width:720px){
  .jg-mk-capa{align-items:center;padding:24px}
  .jg-mk-det{max-width:760px;border-radius:20px;grid-template-columns:minmax(0,300px) 1fr;align-items:start;padding:22px}
  .jg-mk-det-vis{min-height:300px}
  .jg-mk-tc{grid-template-columns:1fr;max-width:860px}
  .jg-mk-tc-cols{grid-template-columns:1fr 1fr}
  .jg-mk-toast{bottom:24px}
}
@media(prefers-reduced-motion:reduce){.jg-mk-capa,.jg-mk-det,.jg-mk-toast,.jg-mk-it,.jg-mk-cab::after,.jg-mk-ab,.jg-mk-img::before,.jg-mk-img::after,.jg-mk-cv *{animation:none!important}.jg-mk-it:hover{transform:none}.jg-mk-cv-in{transform:none!important}}

html[data-tema=oscuro] .jg-mk-chip.on{background:color-mix(in srgb,var(--c,#7042df) 26%,var(--os-sup));color:var(--os-tx)}

html[data-tema=oscuro] .jg-mk-p{background:#3a2f12;color:#ffe08a}
html[data-tema=oscuro] .jg-mk-p.caro{background:#3d1d18;color:#ff9b8a}

html[data-tema=oscuro] .jg-mk-eti{background:var(--os-sup2);color:var(--os-tx3)}

html[data-tema=oscuro] :is(.jg-mk-tx small,.jg-mk-nota,.jg-mk-fv-tx small,.jg-mk-lado>small,.jg-mk-trato header small,.jg-mk-persona small,.jg-mk-vacio,.jg-mk-sel,.jg-mk-tc-cols h3 small){color:var(--os-tx3)}
html[data-tema=oscuro] .jg-mk-tuya{background:#2c2440;color:#c9b6ff}

html[data-tema=oscuro] .jg-mk-x{background:#ffffff14}
html[data-tema=oscuro] .jg-mk-est{background:#ffffff14;color:var(--os-tx2)}
html[data-tema=oscuro] .jg-mk-est.act{background:#1f2c4d;color:#9cb8ff}
