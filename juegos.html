html[data-tema=oscuro] .jg-pf-hero-in>.jg-av>img,html[data-tema=oscuro] .jg-pf-hero-in>.jg-av>i{outline-color:var(--os-fondo)}
html[data-tema=oscuro] .jg-ped-tabs{background:var(--os-sup2)}
html[data-tema=oscuro] .jg-ped-tabs button{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-ped-tabs button[aria-selected=true]{background:var(--os-sup3);color:#fff}
html[data-tema=oscuro] .jg-ped-op,html[data-tema=oscuro] .jg-ped-vop{background:var(--os-sup2);border-color:var(--os-borde)}
html[data-tema=oscuro] .jg-ped-op.cerrado{background:var(--os-sup)}
html[data-tema=oscuro] .jg-ped-vop.on{background:#2a2142;border-color:#8b6cff}
html[data-tema=oscuro] .jg-ped-nota,html[data-tema=oscuro] .jg-ped-op small{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-campo textarea{background:var(--os-sup2);border-color:var(--os-borde2);color:var(--os-tx)}
/* ============================================================
   Ajedrez
   ============================================================ */
/* El tablero a la izquierda y la hoja de jugadas a la derecha; en
   pantalla estrecha la hoja baja debajo. Las placas de los jugadores
   van pegadas al tablero, arriba el de enfrente y abajo tú, como se
   sienta uno a una mesa. */
.jg-aj .jg-tablero.jg-aj-mesa{display:grid;grid-template-columns:minmax(260px,560px) 230px;justify-content:center;justify-items:stretch;align-items:start;gap:22px;padding:22px 18px}
.jg-aj-col{display:flex;flex-direction:column;gap:8px;min-width:0;width:100%}
.jg-aj-tab{position:relative;width:100%}
.jg-aj-svg{display:block;width:100%;max-width:none;border-radius:6px;box-shadow:0 0 0 6px #5b3d24,0 14px 30px #2a1a0c40;touch-action:none;user-select:none;-webkit-user-select:none}
.jg-aj-ult{fill:#f6d047;opacity:.42}
.jg-aj-sel{fill:#4b9cf5;opacity:.45}
.jg-aj-jaque{fill:#e53935;opacity:.55;filter:blur(10px)}
.jg-aj-punto{fill:#1b1208;opacity:.22;pointer-events:none}
.jg-aj-cap{fill:none;stroke:#1b1208;stroke-width:9;opacity:.24;pointer-events:none}
.jg-aj-coord{font:700 21px 'IBM Plex Sans',system-ui,sans-serif;pointer-events:none}
.jg-aj-pz{pointer-events:none}
.jg-aj-mia{cursor:grab}
.jg-aj-fant{pointer-events:none;filter:drop-shadow(0 8px 6px #0006)}
/* La pieza que movió el otro llega deslizándose desde su origen. Va
   en el <g> interior: el exterior lleva el translate de su casilla. */
.jg-aj-llega{animation:jgAjLlega .28s cubic-bezier(.2,.7,.3,1)}
@keyframes jgAjLlega{from{transform:translate(var(--dx),var(--dy))}}
@media (prefers-reduced-motion:reduce){.jg-aj-llega{animation:none}}

.jg-aj-placa{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 2px}
.jg-aj-av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;overflow:hidden;background:var(--c);color:#fff;font-weight:700;box-shadow:0 0 0 2px var(--c)}
.jg-aj-av img{width:100%;height:100%;object-fit:cover}
.jg-aj-quien{display:flex;flex-direction:column;gap:2px;min-width:0}
.jg-aj-quien b{font-size:14px;color:var(--jg-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-aj-caps{display:flex;align-items:center;flex-wrap:wrap;min-height:18px}
.jg-aj-caps em{font-style:normal;font-size:12px;font-weight:700;color:var(--jg-muted);margin-left:5px}
.jg-aj-mini{width:21px;height:21px;margin-right:-7px}
.jg-aj-bando{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid #d9d3e3;color:#6f687f;white-space:nowrap}
.jg-aj-bando.on{background:#1e1d22;border-color:#1e1d22;color:#fff}
.jg-aj-bando.on.w{background:#fbf7ee;border-color:#1e1d22;color:#1e1d22;box-shadow:0 0 0 2px #f6d047}
.jg-aj-bando.on.b{box-shadow:0 0 0 2px #f6d047}

.jg-aj-lado{display:flex;flex-direction:column;gap:12px;min-width:0}
.jg-aj-hoja{border:1px solid #e4dfeb;border-radius:12px;background:#fff;overflow:hidden}
.jg-aj-hoja-t{padding:9px 12px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#716a7f;border-bottom:1px solid #eee9f3}
.jg-aj-movs{list-style:none;margin:0;padding:4px 0;max-height:430px;overflow:auto;font:500 13px 'IBM Plex Mono',ui-monospace,monospace}
.jg-aj-movs li{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;padding:3px 12px}
.jg-aj-movs li:nth-child(even){background:#f6f4fa}
.jg-aj-movs .n{color:#9a94a8}
.jg-aj-movs .on{font-weight:700;color:var(--jg-purple)}
.jg-aj-movs .jg-aj-vacia{display:block;color:#9a94a8;font-family:inherit;font-size:12px}
.jg-aj-aviso{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;border:1px solid #e4dfeb;background:#faf8fd;font-size:12.5px;color:#5b5470;line-height:1.45}
.jg-aj-aviso.on{border-color:#c9b7f6;background:#efe7ff;color:#3b2a66}
.jg-aj-aviso span{display:flex;gap:8px}
.jg-aj-btns{display:flex;gap:8px;flex-wrap:wrap}
.jg-aj-btns .btn2{height:32px}
.jg-aj-btns .btn2:disabled{opacity:.45;cursor:default}
.jg-aj-peligro,.jg-aj-btns .jg-aj-peligro:hover{border-color:#d64545;color:#d64545}
.jg-aj-punto-t{border:1px solid #0f172855}

.jg-aj-corona{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1b120ac4;border-radius:6px;color:#fff;font-weight:700;font-size:15px}
.jg-aj-corona-ops{display:flex;gap:10px}
.jg-aj-op{width:clamp(56px,14vw,84px);aspect-ratio:1;border-radius:12px;border:2px solid #f6d047;background:#eed9b4;cursor:pointer;padding:6px}
.jg-aj-op:hover{background:#f6e6c4;transform:translateY(-2px)}
.jg-aj-op svg{width:100%;height:100%}

@media (max-width:820px){
  .jg-aj .jg-tablero.jg-aj-mesa{grid-template-columns:minmax(0,1fr);padding:14px 8px}
  .jg-aj-col{max-width:560px;margin:0 auto}
  .jg-aj-movs{max-height:150px}
  .jg-aj-svg{box-shadow:0 0 0 4px #5b3d24}
  .jg-aj .jg-barra{flex-wrap:wrap}
}

/* El reloj de cada jugador. Gris mientras no corre, oscuro con el
   turno, rojo cuando queda poco (y ese rojo late si es el que corre). */
.jg-aj-reloj{font:700 21px 'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;min-width:92px;text-align:right;padding:5px 12px;border-radius:9px;background:#ebe7f2;color:#7a738a;letter-spacing:-.5px}
.jg-aj-reloj.on{background:#1e1d22;color:#fff;box-shadow:0 0 0 2px #f6d047}
.jg-aj-reloj.poco{color:#c62828;background:#fde3e1}
.jg-aj-reloj.poco.on{background:#c62828;color:#fff;box-shadow:0 0 0 2px #ff8a80;animation:jgAjPoco 1s steps(2) infinite}
@keyframes jgAjPoco{50%{background:#a31d1d}}
/* El premovimiento va en rojo apagado: es una intención, no una jugada. */
.jg-aj-pre{fill:#d0453a;opacity:.42}
.jg-aj-sel.pre{fill:#d0453a;opacity:.5}
.jg-aj-punto.pre{fill:#7d1a12;opacity:.32}
.jg-aj-cap.pre{stroke:#7d1a12;opacity:.3}
.jg-aj-piezas{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--jg-muted)}
.jg-aj-piezas select{flex:1;height:32px;border:1px solid #ddd9e8;border-radius:8px;background:#fff;color:var(--jg-ink);font:inherit;padding:0 8px}
@media (prefers-reduced-motion:reduce){.jg-aj-reloj.poco.on{animation:none}}
@media (max-width:820px){.jg-aj-reloj{font-size:18px;min-width:78px;padding:4px 9px}.jg-aj-piezas{max-width:320px}}
html[data-tema=oscuro] .jg-aj-reloj{background:var(--os-sup3);color:var(--os-tx3)}
html[data-tema=oscuro] .jg-aj-reloj.on{background:#f4f1fa;color:#17141f}
html[data-tema=oscuro] .jg-aj-reloj.poco{background:#4a1b1b;color:#ff8a80}
html[data-tema=oscuro] .jg-aj-reloj.poco.on{background:#c62828;color:#fff}
html[data-tema=oscuro] .jg-aj-piezas select{background:var(--os-sup2);border-color:var(--os-borde2);color:var(--os-tx)}

/* La portada: cinco piezas en abanico sobre madera. */
.jg-portada-ajedrez{background:radial-gradient(ellipse at center,#8a6440,#2f1d10 75%)}
.jg-art-aj{display:flex;align-items:flex-end;transform:rotate(-8deg)}
.jg-art-aj svg{width:58px;height:62px;margin:0 -6px;filter:drop-shadow(0 8px 6px #0007)}
.jg-art-aj svg:nth-child(2){width:78px;height:84px}
.jg-art-aj svg:nth-child(4){width:84px;height:90px}

/* Tema oscuro: solo el marco; el tablero es de madera en los dos. */
html[data-tema=oscuro] .jg-aj-hoja,html[data-tema=oscuro] .jg-aj-aviso{background:var(--os-sup2);border-color:var(--os-borde2);color:var(--os-tx2)}
html[data-tema=oscuro] .jg-aj-hoja-t{border-bottom-color:var(--os-borde2);color:var(--os-tx3)}
html[data-tema=oscuro] .jg-aj-movs li:nth-child(even){background:#ffffff08}
html[data-tema=oscuro] .jg-aj-movs .on{color:#c4b1ff}
html[data-tema=oscuro] .jg-aj-aviso.on{background:#2a2144;border-color:#4b3a7a;color:#e3d9ff}
html[data-tema=oscuro] .jg-aj-bando{border-color:var(--os-borde2);color:var(--os-tx3)}
html[data-tema=oscuro] .jg-aj-punto-t{border-color:#ffffff66}

/* ============================================================
   Novedades: los tres últimos juegos, lo primero del vestíbulo
   ============================================================ */
/* Ocupa todo el ancho del salón, encima de los juegos: va antes que
   nada porque es lo que cambia de una visita a otra. */
.jg-nov{grid-area:nov;margin-bottom:28px}
.jg-nov-cab{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:14px}
.jg-nov-cab .jg-eyebrow{flex-basis:100%;color:var(--jg-purple)}
html[data-tema=oscuro] .jg-nov-cab .jg-eyebrow{color:#c4b1ff}
.jg-nov-cab h2{margin:0;font-size:26px;letter-spacing:-.5px;color:var(--jg-ink)}
.jg-nov-cab p{margin:0;font-size:13px;color:var(--jg-muted)}
.jg-nov-lista{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.jg-nov-c{position:relative;display:flex;flex-direction:column;overflow:hidden;border:1px solid #e5e0ee;border-radius:18px;background:#fff;box-shadow:0 1px 2px #2a1e440a;transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s}
.jg-nov-c:hover{transform:translateY(-4px);box-shadow:0 16px 34px #39226d16}
.jg-nov-c:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c);z-index:1}
.jg-nov-c .jg-portada{height:150px;border-radius:0;flex-shrink:0}
.jg-nov-c .jg-portada>*{zoom:.82}
.jg-nov-cuerpo{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px;flex:1}
.jg-nov-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--jg-muted)}
.jg-nov-sello{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;color:#fff;background:var(--c)}
.jg-nov-cuerpo h3{margin:2px 0 0;font-size:19px;letter-spacing:-.3px;color:var(--jg-ink)}
.jg-nov-cuerpo p{margin:0;font-size:12.5px;line-height:1.5;color:#5f5a70;flex:1}
.jg-nov-cuerpo small{font-size:11.5px;color:var(--jg-muted)}
.jg-nov-pie{display:flex;gap:8px;margin-top:8px}
.jg-nov-pie .btn{flex:1}
@media(max-width:1080px){.jg-nov-c .jg-portada{height:126px}.jg-nov-c .jg-portada>*{zoom:.68}}
@media(max-width:900px){

  .jg-nov-lista{grid-template-columns:1fr;gap:12px}
  .jg-nov-c{flex-direction:row}
  .jg-nov-c:hover{transform:none}
  .jg-nov-c:before{inset:0 auto 0 0;width:4px;height:auto}
  .jg-nov-c .jg-portada{width:118px;height:auto;min-height:100%}
  .jg-nov-c .jg-portada>*{zoom:.5}
  .jg-nov-cuerpo{padding:12px 14px}
  .jg-nov-cuerpo p{font-size:12px}
}
@media (prefers-reduced-motion:reduce){.jg-nov-c,.jg-nov-c:hover{transition:none;transform:none}}
html[data-tema=oscuro] .jg-nov-c{background:var(--os-sup);border-color:var(--os-borde);box-shadow:none}
html[data-tema=oscuro] .jg-nov-c:hover{box-shadow:0 16px 34px #0008}
html[data-tema=oscuro] .jg-nov-cuerpo p{color:var(--os-tx2)}
html[data-tema=oscuro] .jg-nov-cab h2,html[data-tema=oscuro] .jg-nov-cuerpo h3{color:var(--os-tx)}

/* ---- Monedas: saldo en la cabecera, top en el vestíbulo, pestaña #monedas ---- */
.jg-saldo{color:#f5c542!important;font-weight:700;font-variant-numeric:tabular-nums}
.jg-racha-chip{display:inline-flex;align-items:center;margin-left:7px;padding:1px 7px 1px 5px;border-radius:99px;background:#ff7a1a26;color:#ff9a3d;font-size:12px;font-weight:800}
.jg-racha-chip.falta{filter:grayscale(.6);animation:jgRachaTitila 1.6s ease-in-out infinite}
@keyframes jgRachaTitila{50%{filter:none;background:#ff7a1a44}}
.jg-racha{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"f t" "b b" "d d";gap:8px 10px;align-items:center;margin:0 0 10px;padding:10px 12px;border-radius:14px;text-decoration:none!important;color:#7a2e05;background:linear-gradient(120deg,#fff3e0,#ffe2c2);border:1px solid #ffc78a}
.jg-racha:hover{border-color:#ff9a3d}
.jg-racha-fuego{grid-area:f;font-size:28px;line-height:1;filter:drop-shadow(0 2px 6px #ff7a1a66)}
.jg-racha.lista .jg-racha-fuego{animation:jgFuego 1.8s ease-in-out infinite}
.jg-racha:not(.lista):not(.peligro) .jg-racha-fuego{filter:grayscale(1);opacity:.6}
@keyframes jgFuego{50%{transform:scale(1.12) rotate(-4deg)}}
.jg-racha-tx{grid-area:t;display:grid;gap:1px;min-width:0}
.jg-racha-tx b{font-size:15px;color:#b4410a}
.jg-racha-tx small{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-size:12px;color:#8a4a1e}
.jg-racha-tx .jg-moneda{width:1em;height:1em}
.jg-racha-dias{grid-area:d;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.jg-racha-dias i{display:block;padding:2px 0;border-radius:6px;background:#ffd9b0;color:#a0571f;font:800 10.5px/1.3 system-ui,sans-serif;font-style:normal;text-align:center}
.jg-racha-dias i.on{color:#fff}
.jg-racha-btn{grid-area:b;display:flex;align-items:center;justify-content:center;gap:5px;width:100%;padding:9px 12px;border:0;border-radius:11px;cursor:pointer;font:800 14px/1.2 system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,#ff9a3d,#f06a0a);box-shadow:0 3px 0 #b4410a,0 6px 14px #ff7a1a55;animation:jgReclama 1.8s ease-in-out infinite}
.jg-racha-btn:hover{filter:brightness(1.07)}
.jg-racha-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b4410a}
.jg-racha-btn .jg-moneda{width:1.1em;height:1.1em}
.jg-racha-btn.hecho,.jg-racha-btn:disabled{cursor:default;animation:none;color:#8a4a1e;background:#ffe7cc;box-shadow:none;font-size:13px;filter:none;transform:none}
@keyframes jgReclama{0%,100%{box-shadow:0 3px 0 #b4410a,0 6px 14px #ff7a1a55}50%{box-shadow:0 3px 0 #b4410a,0 6px 22px #ff7a1aaa}}
.jg-racha-dias i.on{background:linear-gradient(90deg,#ff7a1a,#ffb23d)}
.jg-racha-dias i.hoy{background:#ffb23d;animation:jgRachaTitila 1.2s ease-in-out infinite}
.jg-racha.peligro{border-color:#ff9a3d;box-shadow:0 0 0 3px #ff9a3d22}
html[data-tema=oscuro] .jg-racha{background:linear-gradient(120deg,#3a1d0a,#4a250c);border-color:#7a3a10;color:#ffd2a8}
html[data-tema=oscuro] .jg-racha-tx b{color:#ffb070}
html[data-tema=oscuro] .jg-racha-tx small{color:#e8b48a}
html[data-tema=oscuro] .jg-racha-dias i{background:#5a3015;color:#e8b48a}
html[data-tema=oscuro] .jg-racha-dias i.on{color:#fff}
html[data-tema=oscuro] .jg-racha-btn.hecho,html[data-tema=oscuro] .jg-racha-btn:disabled{background:#5a3015;color:#ffd2a8}
html[data-tema=oscuro] .jg-racha-dias i.on{background:linear-gradient(90deg,#ff7a1a,#ffb23d)}
html[data-tema=oscuro] .jg-racha-dias i.hoy{background:#ffb23d}
.jg-mo-racha-c{min-width:min(100%,340px)}
.jg-mo-racha-c .jg-racha{margin:0}
.jg-mo-hero .jg-racha small{letter-spacing:0;text-transform:none;font-weight:500;font-size:12px;opacity:1}
.jg-mo-toast.racha{background:linear-gradient(135deg,#7a2e05,#ff7a1a)}
.jg-mo-toast.podio{background:linear-gradient(135deg,#7a5a00,#e8a317)}
.jg-mo-toast.club{background:linear-gradient(135deg,#123a4a,#1f8a9a)}
.jg-mo-toast small{display:flex;align-items:center;gap:4px}
.jg-mo-toast .jg-moneda{width:1.05em;height:1.05em}
@media (prefers-reduced-motion:reduce){.jg-racha-chip.falta,.jg-racha.lista .jg-racha-fuego,.jg-racha-dias i.hoy,.jg-racha-btn{animation:none}}
.jg-moneda{width:1.1em;height:1.1em;vertical-align:-.2em;flex:none;display:inline-block}
.jg-mo-ves header .jg-moneda{width:20px;height:20px}
.jg-mo-hero strong .jg-moneda{width:.8em;height:.8em;vertical-align:-.05em}
.jg-mo-ves header span{font-size:16px}
.jg-lado-caja.jg-mo-ves>#vesMonedas{display:block;overflow:visible;padding:8px 10px 12px}
#vesMonedas>.jg-nada{padding:10px 8px;margin:0}
.jg-mo-top{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.jg-mo-top li{display:grid;grid-template-columns:30px auto minmax(0,1fr) auto;align-items:center;gap:9px;padding:6px 8px;border-radius:10px}
.jg-mo-top li.jg-yo{background:#f5c54222;box-shadow:inset 0 0 0 1px #f5c54266}
.jg-mo-top.chico li{grid-template-columns:24px auto minmax(0,1fr) auto;gap:8px;padding:4px 6px}
.jg-mo-pos{text-align:center;font-size:13px;color:#8a8499;font-variant-numeric:tabular-nums}
.jg-mo-nom{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.jg-mo-cant{font-variant-numeric:tabular-nums;font-size:13.5px;color:#a8740f;white-space:nowrap}
.jg-mo-tuyo{margin-top:6px;padding-top:6px;border-top:1px dashed #e4dfeb}
.jg-mo-ver{display:block;margin:10px 6px 0;font-size:12.5px;font-weight:600;color:#7042df;text-decoration:none}
.jg-mo-ver:hover{text-decoration:underline}
.jg-mo{max-width:1100px;margin:0 auto;padding:8px 0 40px}
.jg-mo-hero{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;padding:26px 28px;border-radius:22px;color:#fff;background:radial-gradient(circle at 85% 15%,#f5c54255,transparent 55%),linear-gradient(135deg,#2a1a52,#141029)}
.jg-mo-hero small{letter-spacing:.14em;font-size:11px;color:#f5c542;font-weight:700}
.jg-mo-hero strong{display:block;font-size:44px;line-height:1.05;font-variant-numeric:tabular-nums;margin:4px 0}
.jg-mo-hero p{margin:0;color:#d9d2f0;font-size:14px}
.jg-mo-racha{max-width:420px;background:#ffffff14;border:1px solid #ffffff22;border-radius:14px;padding:12px 14px}
.jg-mo-partes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
