/* ============================================================
   Pokémon (`juegos/pokemon.js` y `pokemon/equipos.js`)
   La mesa y el editor son oscuros en los dos temas, como la del UNO:
   los sprites de Showdown están pensados para un fondo de hierba y
   cielo, y el panel de mandos imita al de un combate. Por eso no hay
   gemelo `html[data-tema=oscuro] .jg-pk-*`; lo compartido (`.jg-barra`,
   `.jg-pie`, `.jg-nota`) se repinta con `:root .jg-pk`, que gana a las
   reglas (0,2,1) del bloque oscuro.
   ============================================================ */
.jg-portada-pokemon{background:radial-gradient(ellipse at 50% 65%,#4fb0e8,#16457a 72%)}
.jg-art-pk{position:relative;width:100%;height:100%}
.jg-art-pk i{position:absolute;left:12%;right:12%;bottom:16%;height:22%;border-radius:50%;background:#7fcf6a;box-shadow:0 0 0 6px #5aa64a55}
.jg-art-pk b{position:absolute;top:10%;right:12%;width:44px;height:44px;border-radius:50%;background:linear-gradient(#e3350d 50%,#fff 50%);border:4px solid #222;box-shadow:inset 0 0 0 0 #222}
.jg-art-pk b::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#fff;border:3px solid #222}
.jg-art-pk img{position:absolute;image-rendering:pixelated;filter:drop-shadow(0 6px 4px #0006)}
.jg-art-pk img:nth-of-type(1){right:16%;bottom:34%;height:62%}
.jg-art-pk img:nth-of-type(2){left:12%;bottom:12%;height:52%}
.jg-art-pk em{position:absolute;left:10px;top:8px;font:900 13px system-ui;letter-spacing:2px;color:#ffcb05;text-shadow:2px 2px 0 #2a75bb}

.jg-pk{--pk-fondo:#121826;--pk-sup:#1a2234;--pk-sup2:#232d44;--pk-borde:#2e3a56;--pk-tx:#e8edf7;--pk-tx2:#a9b4c9;background:var(--pk-fondo);color:var(--pk-tx);border-radius:14px;overflow:hidden}
:root .jg-pk .jg-barra{background:#0d1320;border:0;border-bottom:1px solid #ffffff12;border-radius:0;color:var(--pk-tx);gap:10px;flex-wrap:wrap}
:root .jg-pk .jg-fase{color:var(--pk-tx);font-weight:600;display:flex;gap:8px;align-items:center}
:root .jg-pk .jg-pie{background:transparent;border:0;color:var(--pk-tx2);min-height:40px;padding:8px 16px}
:root .jg-pk .jg-nota{color:var(--pk-tx2)}
.jg-pk .btn2,.jg-pk-ed .btn2{background:var(--pk-sup2,#232d44);border-color:#3a4766;color:#e8edf7}
.jg-pk-peligro{color:#ff8a80!important}
.jg-pk-fmt{font:600 11px 'IBM Plex Mono',monospace;padding:3px 8px;border-radius:99px;background:#2a75bb;color:#fff}
.jg-pk-barbot{display:flex;gap:6px}
.jg-pk-aviso{padding:46px 20px;text-align:center;color:var(--pk-tx2);display:grid;gap:10px;justify-items:center}
.jg-pk-poke{width:40px;height:40px;border-radius:50%;background:linear-gradient(#e3350d 50%,#fff 50%);border:4px solid #222;animation:jgPkGira 1s linear infinite}
@keyframes jgPkGira{to{transform:rotate(360deg)}}
.jg-pk-lista{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:6px}

/* El campo: la escena se monta una vez (ver `asegurarCampo`). Los
   sprites son 2D, se escalan por enteros y con `pixelated` para que el
   pixel art no se emborrone. La escala va en el <img>; las animaciones,
   en la capa `.jg-pk-anim` de encima, para no pisarse los `transform`. */
.jg-pk-escena{min-height:320px}
.jg-pk-campo{--cielo1:#8fd3ff;--cielo2:#d9f1ff;--suelo1:#9bd77d;--suelo2:#5fae4f;--base:#6cbf55;--borde:#3f8a35;
  position:relative;height:430px;overflow:hidden;background:linear-gradient(var(--cielo1),var(--cielo2) 40%,var(--suelo1) 40%,var(--suelo2));image-rendering:pixelated}
.jg-pk-campo.bioma-playa{--cielo1:#6ec6ff;--cielo2:#c8ecff;--suelo1:#f4dc9c;--suelo2:#e3bf6f;--base:#eccb7e;--borde:#c39a49}
.jg-pk-campo.bioma-playa::after{content:"";position:absolute;left:0;right:0;top:40%;height:7%;background:repeating-linear-gradient(90deg,#3d9be0 0 18px,#5fb3ef 18px 30px);opacity:.9}
.jg-pk-campo.bioma-cueva{--cielo1:#2c2533;--cielo2:#4a3f52;--suelo1:#6b5a4d;--suelo2:#3e332b;--base:#7c6a5b;--borde:#4a3c31}
.jg-pk-campo.bioma-nieve{--cielo1:#b9d7ee;--cielo2:#eef6fc;--suelo1:#f3f8fc;--suelo2:#cfe1ee;--base:#e6f0f8;--borde:#9fbcd2}
.jg-pk-campo.bioma-atardecer{--cielo1:#ff9a62;--cielo2:#ffd59a;--suelo1:#a4b85f;--suelo2:#6b7f3a;--base:#8fa252;--borde:#5c6d2d}
.jg-pk-campo.bioma-gimnasio{--cielo1:#3a4a6b;--cielo2:#6a7fa6;--suelo1:#c9ccd6;--suelo2:#9ea3b3;--base:#e9ebf2;--borde:#7c8296}
.jg-pk-campo.bioma-gimnasio .jg-pk-base{background:radial-gradient(closest-side,#fff 0 30%,transparent 31%),radial-gradient(closest-side,var(--base) 0 96%,var(--borde) 97%)}
.jg-pk-nubes{position:absolute;inset:0 0 56% 0;background:radial-gradient(28px 12px at 15% 30%,#fffc 60%,transparent 62%),radial-gradient(40px 14px at 22% 34%,#fffc 60%,transparent 62%),radial-gradient(34px 12px at 70% 22%,#fffb 60%,transparent 62%),radial-gradient(46px 15px at 78% 26%,#fffb 60%,transparent 62%);animation:jgPkNubes 60s linear infinite;opacity:.9}
.bioma-cueva .jg-pk-nubes,.bioma-gimnasio .jg-pk-nubes{display:none}
@keyframes jgPkNubes{from{background-position:0 0}to{background-position:600px 0}}
.jg-pk-base{position:absolute;border-radius:50%;background:radial-gradient(closest-side,var(--base) 0 93%,var(--borde) 94%);box-shadow:inset 0 -10px 0 #0002}
.jg-pk-base.suya{right:7%;top:37%;width:36%;height:14%}
.jg-pk-base.mia{left:3%;bottom:6%;width:46%;height:17%}
/* Clima: capas encima del cielo. */
.jg-pk-clima-fx{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .6s}
[data-clima=raindance] .jg-pk-clima-fx,[data-clima=primordialsea] .jg-pk-clima-fx{opacity:.55;background:repeating-linear-gradient(105deg,transparent 0 9px,#d6ecff 9px 10px,transparent 10px 22px);background-size:200px 200px;animation:jgPkLluvia .4s linear infinite}
@keyframes jgPkLluvia{to{background-position:-40px 200px}}
[data-clima=sunnyday] .jg-pk-clima-fx,[data-clima=desolateland] .jg-pk-clima-fx{opacity:1;background:radial-gradient(circle at 85% 8%,#fff7c2cc,#ffd25a55 20%,transparent 45%)}
[data-clima=sandstorm] .jg-pk-clima-fx{opacity:.6;background:repeating-linear-gradient(170deg,#d8b06a55 0 6px,transparent 6px 14px),#c9a25f44;animation:jgPkLluvia 1.2s linear infinite}
[data-clima=hail] .jg-pk-clima-fx,[data-clima=snow] .jg-pk-clima-fx{opacity:.8;background-image:radial-gradient(#fff 1.5px,transparent 2px),radial-gradient(#fff 1px,transparent 1.5px);background-size:40px 40px,26px 26px;animation:jgPkNieve 3s linear infinite}
@keyframes jgPkNieve{to{background-position:20px 120px,-10px 80px}}
[data-terreno=electricterrain] .jg-pk-base{box-shadow:0 0 0 3px #f7d02c88,inset 0 -10px 0 #0002}
[data-terreno=grassyterrain] .jg-pk-base{box-shadow:0 0 0 3px #7ac74c99,inset 0 -10px 0 #0002}
[data-terreno=psychicterrain] .jg-pk-base{box-shadow:0 0 0 3px #f9558799,inset 0 -10px 0 #0002}
[data-terreno=mistyterrain] .jg-pk-base{box-shadow:0 0 0 3px #f4b6dd99,inset 0 -10px 0 #0002}
.jg-pk-clima{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;gap:6px;z-index:6}
.jg-pk-chip{font-size:11px;padding:2px 8px;border-radius:99px;background:#0d1320cc;color:#fff;white-space:nowrap}
/* Los sprites */
.jg-pk-spr{position:absolute;z-index:2;display:grid;place-items:end center}
.jg-pk-spr.suya{right:11%;top:10%;width:30%;height:31%}
.jg-pk-spr.mia{left:8%;bottom:11%;width:38%;height:38%}
.jg-pk-spr.vacia img{visibility:hidden}
.jg-pk-anim{position:relative;display:grid;place-items:end center;width:100%;height:100%}
.jg-pk-spr img{image-rendering:pixelated;transform-origin:bottom center;max-width:none}
.jg-pk-spr.suya img{transform:scale(2) translateY(var(--pie,0px))}
.jg-pk-spr.mia img{transform:scale(2.5) translateY(var(--pie,0px))}
.jg-pk-anim.sale{animation:jgPkSale .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes jgPkSale{0%{transform:scale(.05);filter:brightness(6)}55%{filter:brightness(3)}100%{transform:none;filter:none}}
.jg-pk-spr.mia .jg-pk-anim.ataca{animation:jgPkAtacaMia .55s ease-in-out}
.jg-pk-spr.suya .jg-pk-anim.ataca{animation:jgPkAtacaSuya .55s ease-in-out}
@keyframes jgPkAtacaMia{40%{transform:translate(18%,-10%)}}
@keyframes jgPkAtacaSuya{40%{transform:translate(-18%,10%)}}
.jg-pk-anim.concentra{animation:jgPkConc .6s ease-in-out}
@keyframes jgPkConc{30%,70%{transform:translateY(-6%);filter:brightness(1.6)}}
.jg-pk-anim.golpe{animation:jgPkGolpe .55s steps(1)}
@keyframes jgPkGolpe{0%,40%,80%{opacity:0}20%,60%,100%{opacity:1}10%,50%{transform:translateX(-4%)}30%,70%{transform:translateX(4%)}}
.jg-pk-anim.parpadea{animation:jgPkParp .4s steps(1)}
@keyframes jgPkParp{0%,50%{opacity:.25}25%,75%{opacity:1}}
.jg-pk-anim.cae{animation:jgPkCae .8s ease-in forwards}
@keyframes jgPkCae{to{transform:translateY(60%);opacity:0;clip-path:inset(0 0 60% 0)}}
.jg-pk-fx{position:absolute;inset:0;pointer-events:none;border-radius:50%;opacity:0}
.jg-pk-fx.impacto{animation:jgPkImpacto .45s ease-out}
@keyframes jgPkImpacto{0%{background:radial-gradient(circle,var(--t) 0 10%,transparent 11%);opacity:1}100%{background:radial-gradient(circle,transparent 0 40%,var(--t) 41% 46%,transparent 47%);opacity:0}}
.jg-pk-fx.cura{animation:jgPkCura .6s ease-out}
@keyframes jgPkCura{0%{opacity:1;box-shadow:inset 0 0 0 0 #7cf2a3aa}50%{box-shadow:inset 0 0 40px 10px #7cf2a3aa}100%{box-shadow:none}}
.jg-pk-fx.sube,.jg-pk-fx.baja{border-radius:30%;background-size:100% 100%,28px 28px}
.jg-pk-fx.sube{animation:jgPkSube 1.1s ease-out;background-image:linear-gradient(0deg,#ff7a2a99,transparent 75%),repeating-linear-gradient(0deg,transparent 0 9px,#ffb36acc 9px 15px)}
.jg-pk-fx.baja{animation:jgPkBaja 1.1s ease-out;background-image:linear-gradient(180deg,#2a8cff99,transparent 75%),repeating-linear-gradient(0deg,transparent 0 9px,#7cc4ffcc 9px 15px)}
@keyframes jgPkSube{0%{background-position:0 0,0 0;opacity:0}12%{opacity:1}80%{opacity:.9}100%{background-position:0 0,0 -110px;opacity:0}}
@keyframes jgPkBaja{0%{background-position:0 0,0 0;opacity:0}12%{opacity:1}80%{opacity:.9}100%{background-position:0 0,0 110px;opacity:0}}
.jg-pk-anim.tsube{animation:jgPkTSube 1.1s ease-out}
.jg-pk-anim.tbaja{animation:jgPkTBaja 1.1s ease-out}
@keyframes jgPkTSube{0%,100%{filter:none;transform:none}15%{transform:translateY(-7%)}30%{transform:none;filter:drop-shadow(0 0 8px #ff8a3a) sepia(.6) saturate(3) hue-rotate(-20deg) brightness(1.25)}45%{transform:translateY(-5%)}60%{transform:none;filter:drop-shadow(0 0 8px #ff8a3a) sepia(.6) saturate(3) hue-rotate(-20deg) brightness(1.25)}}
@keyframes jgPkTBaja{0%,100%{filter:none;transform:none}20%{transform:scale(1.04,.9)}30%{filter:drop-shadow(0 0 8px #3a9cff) sepia(.5) saturate(3) hue-rotate(170deg) brightness(.9)}45%{transform:none}60%{transform:scale(1.03,.93);filter:drop-shadow(0 0 8px #3a9cff) sepia(.5) saturate(3) hue-rotate(170deg) brightness(.9)}}
.jg-pk-rotulo{position:absolute;left:50%;top:20%;z-index:4;white-space:nowrap;font:800 15px/1 system-ui,sans-serif;padding:4px 10px;border-radius:999px;color:#fff;pointer-events:none;text-shadow:0 1px 2px #0008;box-shadow:0 2px 10px #0006;transform:translate(-50%,0);opacity:0}
.jg-pk-rotulo.sube{background:#e8661a;animation:jgPkRotSube 1.45s ease-out forwards}
.jg-pk-rotulo.baja{background:#1f78d6;animation:jgPkRotBaja 1.45s ease-out forwards}
@keyframes jgPkRotSube{0%{opacity:0;transform:translate(-50%,30px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}
@keyframes jgPkRotBaja{0%{opacity:0;transform:translate(-50%,-30px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,40px)}}
.jg-pk-fx.tera{animation:jgPkTera 1s ease-out}
@keyframes jgPkTera{0%{opacity:1;box-shadow:0 0 0 0 var(--t);background:radial-gradient(circle,#fff,transparent 60%)}60%{box-shadow:0 0 50px 20px var(--t)}100%{box-shadow:none;background:none}}
.jg-pk-fx.estado{animation:jgPkCura .6s ease-out;filter:hue-rotate(200deg)}
.jg-pk-campo.sacude{animation:jgPkSacude .4s}
@keyframes jgPkSacude{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.jg-pk-campo.destello{animation:jgPkDest .4s}
@keyframes jgPkDest{30%{filter:brightness(1.6) saturate(1.4)}}
/* Las fichas, al estilo de las cajas de los juegos. */
.jg-pk-ficha{position:absolute;z-index:4;width:min(250px,44%);padding:7px 12px 8px;border-radius:10px;background:#f8f8f0;color:#1e2330;border:3px solid #39404e;box-shadow:4px 4px 0 #0004;font-size:12px}
.jg-pk-ficha[hidden]{display:none}
.jg-pk-ficha.suya{left:4%;top:5%;border-radius:10px 22px 10px 10px}
.jg-pk-ficha.mia{right:4%;bottom:19%;border-radius:22px 10px 10px 10px}
.jg-pk-ficha small{display:block;margin-top:4px;color:#4b5263;line-height:1.3}
.jg-pk-ficha small:empty,.jg-pk-boosts:empty{display:none}
.jg-pk-fnom{display:flex;gap:8px;align-items:baseline}.jg-pk-fnom b{font-size:14px}.jg-pk-fnom .lv{color:#4b5263}
.jg-pk-tipos{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.jg-pk-tipo{font:700 10px system-ui;letter-spacing:.3px;padding:2px 7px;border-radius:5px;background:var(--t);color:#fff;text-shadow:0 1px 1px #0006;text-transform:uppercase}
.jg-pk-tera{font:700 10px system-ui;padding:2px 6px;border-radius:5px;background:linear-gradient(90deg,#9be7ff,#ffd6f6);color:#2a2f45}
.jg-pk-vida{position:relative;height:9px;border-radius:5px;background:#4b5263;overflow:hidden;border:2px solid #39404e}
.jg-pk-vida::before{content:"PS";position:absolute;left:-1px;top:-2px;font:800 8px system-ui;color:#f2c037;z-index:1;display:none}
.jg-pk-vida i{display:block;height:100%;transition:width .8s ease,background .8s}
.jg-pk-vnum{text-align:right;font:600 11px 'IBM Plex Mono',monospace;margin-top:2px}
.jg-pk-estado{font:700 10px system-ui;padding:1px 6px;border-radius:4px;color:#fff;background:#888}
.jg-pk-estado.e-brn{background:#ee8130}.jg-pk-estado.e-par{background:#d6b500}.jg-pk-estado.e-slp{background:#8a8a9c}.jg-pk-estado.e-frz{background:#5fb7d6}.jg-pk-estado.e-psn,.jg-pk-estado.e-tox{background:#a33ea1}
.jg-pk-boosts{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.jg-pk-boost{font:600 10px system-ui;padding:1px 5px;border-radius:4px}.jg-pk-boost.sube{background:#d6f5df;color:#17663a}.jg-pk-boost.baja{background:#fde0de;color:#9b1c14}
/* Los entrenadores y su equipo, en una franja encima del campo: dentro
   tapaban los sprites. */
.jg-pk-tira{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;background:#0d1320;border-bottom:1px solid #ffffff12;flex-wrap:wrap}
.jg-pk-entren{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:99px;background:#1a2234;color:#fff;font-size:12px;flex-wrap:wrap}
.jg-pk-entren.suya{flex-direction:row-reverse;padding:3px 3px 3px 10px}
/* El cuadro de diálogo, abajo, como en los juegos. */
.jg-pk-cuadro{position:absolute;left:8px;right:8px;bottom:8px;z-index:7;min-height:46px;padding:9px 14px;border-radius:10px;background:#1d2433f2;color:#fff;border:3px solid #c9d2e4;box-shadow:inset 0 0 0 2px #39404e;font:600 14px system-ui;display:flex;align-items:center}
.jg-pk-cuadro:empty{display:none}
.jg-pk-cuadro p{margin:0}
.jg-pk-cuadro p.aparece{animation:jgPkTexto .35s steps(14)}
@keyframes jgPkTexto{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.jg-pk-spr.mia{bottom:18%}.jg-pk-base.mia{bottom:12%}
/* La presentación: los dos entrenadores frente a frente. */
.jg-pk-intro{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:space-around;background:linear-gradient(115deg,#e3350dee 0 49.6%,#fff 49.6% 50.4%,#2a75bbee 50.4%);animation:jgPkIntro 2.1s ease-in-out forwards}
.jg-pk-intro[hidden]{display:none}
@keyframes jgPkIntro{0%{clip-path:inset(0 50% 0 50%)}15%,85%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0);opacity:0}}
.jg-pk-intro-ent{display:grid;justify-items:center;gap:6px;color:#fff;font:800 18px system-ui;text-shadow:2px 2px 0 #0006}
.jg-pk-intro-ent.suya{animation:jgPkDesdeIzq .5s ease-out}.jg-pk-intro-ent.mia{animation:jgPkDesdeDer .5s ease-out}
@keyframes jgPkDesdeIzq{from{transform:translateX(-120%)}}@keyframes jgPkDesdeDer{from{transform:translateX(120%)}}
.jg-pk-intro-vs{font:900 54px system-ui;color:#ffcb05;text-shadow:3px 3px 0 #2a75bb,-2px -2px 0 #fff;animation:jgPkSale .6s .3s both}
/* Entrenadores: sprites 2D de Showdown, a escala entera. */
.jg-pk-ent{position:relative;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c);overflow:hidden;flex-shrink:0}
.jg-pk-ent img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;image-rendering:pixelated;z-index:1}
.jg-pk-ent b{font:800 15px system-ui;color:#fff}
.jg-pk-ent.chico{width:28px;height:28px}
.jg-pk-ent.grande{width:96px;height:96px;border-radius:16px;background:radial-gradient(circle at 50% 35%,#fff6,transparent 70%),var(--c)}
.jg-pk-ent.grande img,.jg-pk-ent.enorme img{object-fit:contain;object-position:bottom}
.jg-pk-ent.grande b{font-size:34px}
.jg-pk-ent.enorme{width:160px;height:160px;border-radius:0;background:none;overflow:visible}
.jg-pk-ent.enorme b{font-size:60px;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:var(--c)}
.jg-fr{--pk-fondo:#121826;--pk-sup:#1a2234;--pk-sup2:#232d44;--pk-borde:#2e3a56;--pk-tx:#e8edf7;--pk-tx2:#a9b4c9;--fr-ac:#f97316;background:radial-gradient(ellipse at 50% -10%,#3b1d0a 0,transparent 55%),var(--pk-fondo);color:var(--pk-tx);border-radius:14px;padding:16px;min-height:60vh;display:grid;gap:16px;align-content:start}
.jg-fr .btn2{background:var(--pk-sup2);border-color:#3a4766;color:var(--pk-tx)}
.jg-fr .btn2.on{background:var(--fr-ac);border-color:var(--fr-ac);color:#1a0d02;font-weight:700}
.jg-fr .btn{background:linear-gradient(180deg,#fb923c,#ea580c);border-color:#c2410c;color:#fff}
.jg-fr .btn[disabled]{opacity:.45;cursor:not-allowed}
.jg-fr .jg-nota{color:var(--pk-tx2)}
.jg-fr-cab{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.jg-fr-cab>div{flex:1;min-width:180px}
.jg-fr-cab small{color:var(--fr-ac);font-weight:800;letter-spacing:.14em;font-size:11px}
.jg-fr-cab h2{margin:2px 0;font-size:22px}
.jg-fr-cab p{margin:0;color:var(--pk-tx2);font-size:14px}
.jg-fr-nivel{display:flex;gap:8px;flex-wrap:wrap}
.jg-fr-insts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.jg-fr-inst{background:var(--pk-sup);border:2px solid var(--pk-borde);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start;cursor:pointer;transition:border-color .15s,transform .15s}
.jg-fr-inst:hover{transform:translateY(-2px)}
.jg-fr-inst.on{border-color:var(--fr-ac);box-shadow:0 0 0 3px #f9731633}
.jg-fr-inst-ico{font-size:36px;line-height:1}
.jg-fr-inst h3{margin:0;font-size:18px}
.jg-fr-inst p{margin:0;color:var(--pk-tx2);font-size:13px;line-height:1.4}
.jg-fr-inst dl{display:flex;gap:16px;margin:4px 0}
.jg-fr-inst dl div{display:grid}
.jg-fr-inst dt{font-size:11px;color:var(--pk-tx2);text-transform:uppercase;letter-spacing:.06em}
.jg-fr-inst dd{margin:0;font:800 22px system-ui;color:#fde68a}
.jg-fr-mini{font-size:12px;padding:4px 10px;justify-self:start}
.jg-fr-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;background:var(--pk-sup);border:1px solid var(--pk-borde);border-radius:14px;padding:16px}
.jg-fr-info h4,.jg-fr-h4{margin:0 0 6px;font-size:12px;color:var(--pk-tx2);text-transform:uppercase;letter-spacing:.08em}
.jg-fr-info p{margin:4px 0}
.jg-fr-tabla{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.jg-fr-tabla th,.jg-fr-tabla td{padding:4px 8px;border-bottom:1px solid var(--pk-borde);text-align:left}
.jg-fr-tabla th{color:var(--pk-tx2);font-weight:600}
.jg-fr-equipos{display:flex;gap:8px;flex-wrap:wrap}
.jg-fr-sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.jg-fr-set{background:var(--pk-sup);border:2px solid var(--pk-borde);border-radius:12px;padding:10px;display:grid;justify-items:center;gap:4px;color:var(--pk-tx);cursor:pointer;font:inherit;text-align:center}
.jg-fr-set.on{border-color:var(--fr-ac);background:#2b1a10}
.jg-fr-set b{font-size:14px}
.jg-fr-spr{width:72px;height:72px;object-fit:contain;image-rendering:pixelated}
.jg-fr-movs{color:var(--pk-tx2);font-size:11px;line-height:1.35}
.jg-fr-err{margin:0;padding:10px 10px 10px 28px;background:#3b0d12;border:1px solid #7f1d1d;border-radius:10px;color:#fecaca;font-size:13px}
.jg-fr-pie{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.jg-fr-duelo{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px;padding:20px 12px;border-radius:16px;background:linear-gradient(180deg,#1b2440,#0f1424);border:1px solid var(--pk-borde)}
.jg-fr-duelo.as{background:linear-gradient(180deg,#3a2a06,#160f02);border-color:#b45309;box-shadow:0 0 30px #f59e0b33 inset}
.jg-fr-rival,.jg-fr-yo{display:grid;justify-items:center;gap:4px;text-align:center}
.jg-fr-rival small,.jg-fr-yo small{color:var(--pk-tx2);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.jg-fr-rival b{font-size:20px}
.jg-fr-vs{font:900 34px system-ui;color:var(--fr-ac);text-shadow:0 2px 0 #000;align-self:center}
.jg-fr-mis{display:flex;gap:2px}
.jg-fr-mis .jg-fr-spr{width:56px;height:56px}
.jg-fr-aviso{margin:0;padding:10px 14px;border-radius:10px;background:#2b1a10;border:1px solid #9a3412;color:#fed7aa;text-align:center}
.jg-fr-progreso{display:flex;gap:8px;justify-content:center}
.jg-fr-progreso span{width:16px;height:16px;border-radius:50%;background:var(--pk-sup2);border:2px solid var(--pk-borde)}
.jg-fr-progreso span.hecho{background:#22c55e;border-color:#16a34a}
.jg-fr-progreso span.ahora{background:var(--fr-ac);border-color:#fdba74;animation:jgFrLate 1s ease-in-out infinite alternate}
@keyframes jgFrLate{to{transform:scale(1.25)}}
.jg-fr-res{display:grid;justify-items:center;gap:8px;text-align:center;padding:28px 16px;border-radius:16px;background:var(--pk-sup);border:1px solid var(--pk-borde)}
.jg-fr-res.gana{background:radial-gradient(circle at 50% 0,#14532d,var(--pk-sup) 70%)}
.jg-fr-res.pierde{background:radial-gradient(circle at 50% 0,#450a0a,var(--pk-sup) 70%)}
.jg-fr-res h3{margin:0;font-size:22px}
.jg-fr-res p{margin:0;color:var(--pk-tx2)}
.jg-fr-res-ico{font-size:52px}
.jg-fr .jg-fr-monedas{font:800 24px system-ui;color:#fde68a}
.jg-fr-monedas small{font-size:12px;color:var(--pk-tx2);font-weight:400}
.jg-fr-hud{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;font-size:13px;color:var(--pk-tx2);padding:0 4px}
@media (prefers-reduced-motion:reduce){.jg-fr-progreso span.ahora{animation:none}.jg-fr-inst:hover{transform:none}}
@media (max-width:600px){.jg-fr{padding:10px}.jg-fr-duelo{grid-template-columns:1fr;justify-items:center}.jg-fr-duelo .jg-pk-ent.enorme{width:110px;height:110px}.jg-fr-vs{font-size:24px}}
.jg-pk-ent.sombra{background:#2a3247}
.jg-pk-bolas{display:flex;gap:2px}
.jg-pk-bola{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:#ffffff1c}
.jg-pk-bola img.mini{max-width:30px;max-height:30px;margin:-4px;image-rendering:pixelated}
.jg-pk-bola.ko{opacity:.35;filter:grayscale(1)}.jg-pk-bola.activo{box-shadow:0 0 0 2px #ffcb05}
.jg-pk-ball{width:12px;height:12px;border-radius:50%;background:linear-gradient(#e3350d 50%,#fff 50%);border:2px solid #222}

/* Los mandos */
.jg-pk-abajo{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,320px);gap:0;border-top:1px solid #ffffff12}
.jg-pk-control{padding:12px 14px;min-height:120px}
.jg-pk-control h4{margin:10px 0 6px;font-size:12px;color:var(--pk-tx2);text-transform:uppercase;letter-spacing:.6px}
.jg-pk-movs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.jg-pk-mov{position:relative;display:grid;gap:2px;text-align:left;padding:10px 12px;border-radius:10px;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--t),color-mix(in srgb,var(--t) 60%,#000));box-shadow:inset 0 -3px 0 #0003;transition:transform .12s}
.jg-pk-mov:hover:not(:disabled){transform:translateY(-2px)}
.jg-pk-mov:disabled{filter:grayscale(.9) brightness(.6);cursor:not-allowed}
.jg-pk-mov b{font-size:14px;text-shadow:0 1px 1px #0006}.jg-pk-mov small{font-size:11px;opacity:.92}
.jg-pk-mov .pp{position:absolute;right:10px;top:9px;font:600 11px 'IBM Plex Mono',monospace}
.jg-pk-mov .ef{position:absolute;right:8px;bottom:8px;font:700 10px system-ui;padding:1px 6px;border-radius:4px;background:#0006}
.jg-pk-mov .ef2,.jg-pk-mov .ef4{background:#1b8e3e}.jg-pk-mov .ef0{background:#5b1d1d}.jg-pk-mov .ef05,.jg-pk-mov .ef025{background:#6b4a1d}
.jg-pk-extras{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.jg-pk-extras label{display:flex;gap:6px;align-items:center;cursor:pointer;padding:5px 10px;border-radius:8px;background:var(--pk-sup2)}
.jg-pk-cambios{display:flex;gap:6px;flex-wrap:wrap}
.jg-pk-cambio{position:relative;display:flex;align-items:center;gap:6px;padding:4px 10px 6px 4px;border-radius:10px;border:1px solid #3a4766;background:var(--pk-sup2);color:var(--pk-tx);cursor:pointer;font-size:12px;overflow:hidden}
.jg-pk-cambio:hover{border-color:#ffcb05}
.jg-pk-cambio.quieto{cursor:default}
.jg-pk-cambio img.mini{width:36px;height:36px;object-fit:contain;image-rendering:pixelated}
.jg-pk-cambio i{position:absolute;left:0;bottom:0;height:3px;width:var(--v);background:var(--col)}
.jg-pk-cambio.sel{border-color:#ffcb05;box-shadow:0 0 0 2px #ffcb0566}
.jg-pk-fcambio{margin-top:8px;padding:10px 12px;border-radius:12px;border:1px solid #ffcb05;background:var(--pk-sup2);color:var(--pk-tx);animation:jgPkDespliega .22s ease-out;transform-origin:top}
@keyframes jgPkDespliega{from{opacity:0;transform:scaleY(.6)}to{opacity:1;transform:none}}
.jg-pk-fcab{display:flex;gap:10px;align-items:center}
.jg-pk-fcab img.mini{width:56px;height:56px;object-fit:contain;image-rendering:pixelated}
.jg-pk-fcab b{font-size:15px}.jg-pk-fcab .jg-pk-tipos{margin-top:3px}
.jg-pk-fcambio .jg-pk-vida{margin-top:8px}
.jg-pk-fps,.jg-pk-fdat{margin:4px 0 0;font-size:12px;opacity:.85}
.jg-pk-fstats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px;text-align:center;font-weight:700;font-size:13px}
.jg-pk-fstats span{background:#0003;border-radius:6px;padding:3px 0}
.jg-pk-fstats small{display:block;font-weight:500;font-size:10px;opacity:.75}
.jg-pk-fmovs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
.jg-pk-fmov{font-size:12px;padding:3px 8px;border-radius:6px;border-left:4px solid var(--t);background:#0002}
.jg-pk-facc{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.jg-pk-facc button{padding:7px 16px;border-radius:999px;font-weight:700;cursor:pointer;border:1px solid #3a4766;background:transparent;color:var(--pk-tx)}
.jg-pk-facc .jg-pk-fsi{background:#ffcb05;border-color:#ffcb05;color:#222}
.jg-pk-hecho{margin:8px 0;padding:12px;border-radius:10px;background:var(--pk-sup2)}
.jg-pk-relato{max-height:260px;overflow:auto;padding:10px 14px;background:#0d1320;border-left:1px solid #ffffff12;font-size:12.5px;line-height:1.45}
.jg-pk-relato p{margin:0 0 3px;color:#cdd5e5}
.jg-pk-relato p.turno{margin-top:8px;color:#ffcb05;font-weight:700}
.jg-pk-relato p.gana{color:#8ff0a4;font-weight:700}

/* Elegir equipo y entrenador: ficha de entrenador a la izquierda,
   equipos a la derecha, el enfrentamiento abajo. */
.jg-pk-elige{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px;padding:16px;background:radial-gradient(circle at 10% 0,#24324f,transparent 60%),#121826}
.jg-pk-tarjeta-ent{display:grid;gap:10px;align-content:start;padding:14px;border-radius:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 55%,#121826),#1a2234 70%);border:2px solid color-mix(in srgb,var(--c) 70%,#fff 10%);box-shadow:0 10px 30px #0006}
.jg-pk-te-cab{display:grid}.jg-pk-te-cab small{font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.7}.jg-pk-te-cab b{font-size:22px}.jg-pk-te-cab span{font-size:12px;opacity:.8}
.jg-pk-te-img{display:grid;place-items:center;height:170px;border-radius:12px;background:radial-gradient(ellipse at 50% 90%,#0004 0 30%,transparent 31%),radial-gradient(circle at 50% 40%,#ffffff22,transparent 65%)}
.jg-pk-ents{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px}
.jg-pk-entop{padding:3px;border-radius:10px;border:2px solid transparent;background:#0d132055;cursor:pointer;display:grid;place-items:center}
.jg-pk-entop .jg-pk-ent{width:38px;height:38px}
.jg-pk-entop:hover{border-color:#ffffff55}
.jg-pk-entop.on{border-color:#ffcb05;box-shadow:0 0 12px #ffcb0577}
.jg-pk-te-equipos h3{margin:0 0 10px;font-size:16px}.jg-pk-te-equipos h3 small{color:var(--pk-tx2);font-weight:500}
.jg-pk-eqcartas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.jg-pk-eqcarta{display:grid;gap:6px;text-align:left;padding:10px 12px;border-radius:14px;border:2px solid #2e3a56;background:linear-gradient(#1f2940,#182032);color:#e8edf7;cursor:pointer;transition:transform .15s,border-color .15s}
.jg-pk-eqcarta:hover{transform:translateY(-2px);border-color:#4a5b82}
.jg-pk-eqcarta.on{border-color:#ffcb05;box-shadow:0 0 0 1px #ffcb05,0 8px 24px #ffcb0533}
.jg-pk-eqcarta.mal{opacity:.55;cursor:not-allowed}
.jg-pk-eqcab{display:flex;align-items:baseline;gap:8px}.jg-pk-eqcab b{font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.jg-pk-eqcab small{font-size:10.5px;color:#a9b4c9}
.jg-pk-eqcab i{font-style:normal;color:#7ef0a0;font-weight:800}.jg-pk-eqcab em{font-style:normal;font-size:10.5px;color:#ff9c8f}
.jg-pk-eqfila6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.jg-pk-eqfila6 span{min-width:0;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,#ffffff14,#ffffff05);overflow:hidden}
.jg-pk-eqfila6 span.vacio{background:none;box-shadow:inset 0 0 0 2px #ffffff10;transform:scale(.55)}
.jg-pk-eqfila6 img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;transform:scale(1.25)}
.jg-pk-eqerr{font-size:10.5px;color:#ff9c8f}
.jg-pk-previa{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.jg-pk-previa-pk{display:grid;justify-items:center;gap:3px;padding:8px 6px;border-radius:12px;background:#1a2234;border:1px solid #2e3a56;text-align:center}
.jg-pk-previa-pk img{height:80px;image-rendering:pixelated}
.jg-pk-previa-pk b{font-size:12px}.jg-pk-previa-pk small{font-size:10.5px;color:#a9b4c9}
.jg-pk-elige-pie{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:6px;border-top:1px solid #ffffff12}
.jg-pk-listo{height:46px;padding:0 26px;font-size:15px;background:linear-gradient(#ff5a36,#e3350d);border-radius:12px;box-shadow:0 4px 0 #9b2208}
.jg-pk-listo:disabled{opacity:.45;box-shadow:none}
.jg-pk-vs{display:flex;align-items:center;gap:14px}
.jg-pk-vs-lado{display:grid;justify-items:center;gap:2px;font-size:12px}
.jg-pk-vs-lado small{color:var(--pk-tx2)}
.jg-pk-vs-ent .jg-pk-ent.grande{width:64px;height:64px}
.jg-pk-vs-x{font:900 22px system-ui;color:#ffcb05;text-shadow:2px 2px 0 #2a75bb}
.jg-pk-espera{display:grid;justify-items:center;gap:12px;padding:40px 16px;text-align:center;color:var(--pk-tx2);background:radial-gradient(circle at 50% 30%,#24324f,#121826 70%)}
.jg-pk-espera .jg-pk-vs-ent .jg-pk-ent.grande{width:110px;height:110px}
.jg-pk-espera .jg-pk-vs-x{font-size:36px}
.jg-pk-mal{color:#ffb4a8;margin:0}

/* El editor de equipos */
.jg-pk-capa{z-index:75}
.jg-pk-ed{position:relative;width:1080px;max-width:100%;max-height:calc(100vh - 36px);display:flex;flex-direction:column;border-radius:14px;background:#121826;color:#e8edf7;border:1px solid #2e3a56;box-shadow:0 18px 50px #0008;overflow:hidden;--pk-sup:#1a2234;--pk-sup2:#232d44;--pk-borde:#2e3a56;--pk-tx2:#a9b4c9}
.jg-pk-ed .jg-nota{color:#a9b4c9}
.jg-pk-cargando{padding:40px;text-align:center}
.jg-pk-edcab{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid #ffffff14}
.jg-pk-edcab h2{margin:0;font-size:18px;flex:1}
.jg-pk-entsel{display:flex;align-items:center;gap:8px}
.jg-pk-x{border:0;background:transparent;color:#e8edf7;font-size:18px;cursor:pointer}
.jg-pk-ed select,.jg-pk-ed input:not([type=checkbox]):not([type=radio]){height:32px;padding:0 8px;border-radius:7px;border:1px solid #3a4766;background:#0d1320;color:#e8edf7;font:inherit;font-size:13px;min-width:0}
.jg-pk-edcuerpo{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:0;flex:1}
.jg-pk-eqlista{padding:12px;border-right:1px solid #ffffff14;overflow:auto;display:grid;align-content:start;gap:6px}
.jg-pk-eqbotones{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.jg-pk-eqfila{display:grid;gap:2px;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid #2e3a56;background:#1a2234;color:#e8edf7;cursor:pointer}
.jg-pk-eqfila.on{border-color:#ffcb05}.jg-pk-eqfila small{color:#a9b4c9;font-size:11px}
.jg-pk-eqed{padding:14px 16px;overflow:auto;display:grid;align-content:start;gap:12px}
.jg-pk-edfila{display:flex;gap:10px;flex-wrap:wrap}
.jg-pk-edfila label,.jg-pk-movs label,.jg-pk-setdatos>label{display:grid;gap:3px;font-size:11px;color:#a9b4c9;flex:1;min-width:140px}
.jg-pk-edfila label.corto{flex:0 0 auto;min-width:70px}
.jg-pk-huecos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.jg-pk-hueco{display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:10px;border:1px solid #2e3a56;background:#1a2234;color:#e8edf7;cursor:pointer;font-size:11px;min-height:70px;overflow:hidden}
.jg-pk-hueco.on{border-color:#ffcb05;box-shadow:0 0 0 1px #ffcb05}
.jg-pk-hueco img{width:46px;height:46px;object-fit:contain;image-rendering:pixelated}
.jg-pk-hueco span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jg-pk-mas{font-size:22px;color:#6b7896;align-self:center}
.jg-pk-set{display:grid;gap:10px;padding:12px;border-radius:12px;background:#1a2234;border:1px solid #2e3a56}
.jg-pk-setcab{display:flex;gap:14px;align-items:center}
.jg-pk-setspr{width:96px;height:96px;object-fit:contain;image-rendering:pixelated;flex-shrink:0}
.jg-pk-setspr.vacio{display:grid;place-items:center;border-radius:12px;background:#0d1320;font-size:30px;color:#6b7896}
.jg-pk-setdatos{flex:1;display:grid;gap:6px}
.jg-pk-ed .jg-pk-movs{grid-template-columns:repeat(2,minmax(0,1fr))}
.jg-pk-ed .jg-pk-movs small{display:flex;gap:6px;align-items:center;color:#a9b4c9}
.jg-pk-stats{border-collapse:collapse;font-size:12px;width:100%}
.jg-pk-stats th,.jg-pk-stats td{padding:3px 6px;text-align:left}
.jg-pk-stats thead th{color:#a9b4c9;font-weight:500}
.jg-pk-stats input{width:64px}
.jg-pk-stats td:last-child{position:relative;min-width:120px}
.jg-pk-stats td i{position:absolute;left:44px;top:50%;height:6px;margin-top:-3px;width:calc(var(--w) * .8);max-width:calc(100% - 50px);border-radius:3px;background:#5fc8f0}
.jg-pk-stats b{display:inline-block;width:36px}
.jg-pk-ed b.mal{color:#ff8a80}
.jg-pk-valida{padding:10px 12px;border-radius:10px;font-size:12.5px}
.jg-pk-valida.bien{background:#16351f;color:#a5ebb7}.jg-pk-valida.mal{background:#3d1418;color:#ffb4a8}
.jg-pk-valida ul{margin:6px 0 0;padding-left:18px}
.jg-pk-edacc{display:flex;gap:8px;flex-wrap:wrap}

/* El tablero puede ser estrecho en una ventana ancha (el chat al lado),
   así que manda su propio ancho y no el de la ventana. */
.jg-pk{container-type:inline-size}
@container (max-width:760px){
  .jg-pk-elige{grid-template-columns:1fr}
  .jg-pk-campo{height:320px}
  .jg-pk-spr.suya img{transform:scale(1.5) translateY(var(--pie,0px))}
  .jg-pk-spr.mia img{transform:scale(2) translateY(var(--pie,0px))}
  .jg-pk-abajo{grid-template-columns:1fr}
  .jg-pk-relato{border-left:0;border-top:1px solid #ffffff12;max-height:180px}
  .jg-pk-campo{min-height:300px}
  .jg-pk-ficha{width:52%;font-size:11px;padding:6px 9px}
  .jg-pk-ficha small{display:none}
  .jg-pk-entren{font-size:11px}
}
@container (max-width:420px){
  .jg-pk-movs{grid-template-columns:1fr}
  .jg-pk-ficha{width:60%}
}
@media (max-width:760px){
  .jg-pk-edcuerpo{grid-template-columns:1fr}
  .jg-pk-eqlista{border-right:0;border-bottom:1px solid #ffffff14;max-height:180px}
  .jg-pk-huecos{grid-template-columns:repeat(3,minmax(0,1fr))}
  .jg-pk-ed .jg-pk-movs{grid-template-columns:1fr 1fr}
}
/* ============================================================
   El salón (el vestíbulo rediseñado) — `salon.js` y `salon-datos.js`

   Móvil primero: lo de abajo es el móvil, y las reglas de pantalla
   ancha van en los `@media (min-width…)`. Cuatro piezas:

   - La barra de modo (Todos · 1 jugador · Multijugador), pegada arriba.
   - La miniatura (`.jg-mn`), la misma para los dos modos. A simple
     vista se distinguen por la insignia de la portada: una persona en
     ámbar («1 jugador») o dos personas en violeta («2–10 jugadores»). El
     color nunca va solo: siempre con icono y texto.
   - La ficha (`.jg-hoja`): hoja que sube desde abajo en el móvil,
     panel a la derecha en pantalla ancha.
   - La barra de pestañas de abajo en el móvil, al alcance del pulgar.

   La miniatura y su portada son contenedores (`container-type`): la
   posición del ▶ y el tamaño del arte salen del ancho de la tarjeta, que
   cambia entre el carrusel, la rejilla y la ficha.
   ============================================================ */
:root{--m-solo:#e59a00;--m-solo-bg:#ffcf5c;--m-solo-tx:#3d2a00;--m-multi:#7042df;--m-multi-bg:#7042df;--m-multi-tx:#fff}

/* ---- La rejilla del salón: una columna en el móvil ---- */
.jg-sal{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"nov" "intro" "modos" "avisos" "solo" "lado" "multi" "tops" "tira" "tiram" "tirar";align-items:start}
.jg-sal-intro{grid-area:intro;margin-bottom:10px}
.jg-sal-intro h1{font-size:26px;letter-spacing:-.8px;margin:8px 0 4px;line-height:1.1;color:var(--jg-ink)}
.jg-sal-intro p{margin:0;font-size:13px;color:var(--jg-muted);line-height:1.5}
.jg-sal-intro .jg-eyebrow{color:var(--jg-purple)}
.jg-sal-avisos{grid-area:avisos;min-width:0}
.jg-sal .jg-ban{grid-area:nov}
.jg-sal .jg-tops{grid-area:tops}
.jg-sal-solo{grid-area:solo}.jg-sal-multi{grid-area:multi}
.jg-sal .jg-ves-lado{grid-area:lado}
.jg-sal .jg-tira{grid-area:tira;margin:8px 0 0}
.jg-sal .jg-tira-m{grid-area:tiram;margin:16px 0 0}
.jg-sal .jg-tira-r{grid-area:tirar;margin:16px 0 0}
.jg-sal-sec{min-width:0;margin-bottom:26px}
/* Un modo esconde la sección que sobra; las novedades no se van nunca. */
/* La columna de salas (salas abiertas, top monedas, tus partidas) se queda
   también en «1 jugador»: el top de monedas y la recompensa diaria son de
   todos los modos. */
.jg-sal[data-modo=solo] .jg-sal-multi,.jg-sal[data-modo=multi] .jg-sal-solo{display:none}

/* ---- La barra de modo ---- */
.jg-modos{grid-area:modos;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;margin:0 -16px 14px;padding:8px 16px;background:color-mix(in srgb,#f5f4fa 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.jg-modos-sel{display:flex;flex:1;gap:3px;padding:4px;border-radius:100px;background:#ebe7f3;min-width:0}
.jg-modos-sel button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 10px;border:0;border-radius:100px;background:transparent;font:600 13px 'IBM Plex Sans',sans-serif;color:#5c566c;cursor:pointer;white-space:nowrap;min-width:0}
.jg-modos-sel button[aria-pressed=true]{background:#fff;color:var(--jg-ink);box-shadow:0 1px 4px #2a1e4424}
.jg-modos-sel b{font:600 11px 'IBM Plex Mono',monospace;color:#8a8399}
.jg-modos-ico{display:inline-grid;place-items:center}.jg-modos-ico svg{width:17px;height:17px}
.jg-modos-ico.m-solo{color:var(--m-solo)}.jg-modos-ico.m-multi{color:var(--m-multi)}
.jg-modos-entrar{flex-shrink:0;height:44px;border-radius:100px;padding:0 16px}
.mo-c{display:none}
@media(max-width:600px){
  .mo-l{display:none}.mo-c{display:inline}
  .jg-modos-sel b{display:none}
  .jg-modos-sel button{font-size:12.5px;padding:0 6px;gap:4px}
  .jg-modos-entrar{padding:0 12px;font-size:12.5px}
}

/* ---- El buscador, en la barra de modo (pegada arriba) ----
   En el PC es un campo a la derecha del selector; en el celular, una lupa
   que al tocarla ocupa la barra entera (`.buscando`) hasta que se cierra.
   La lista cuelga de la barra, que por ser sticky la contiene. */
.jg-bus{position:relative;flex:0 1 300px;min-width:0;display:flex;align-items:center;gap:6px}
.jg-bus-abre,.jg-bus-x{display:none;place-items:center;flex-shrink:0;width:44px;height:44px;border-radius:50%;border:1px solid #e1dcea;background:#fff;color:var(--jg-ink);font-size:15px;cursor:pointer}
.jg-bus-abre svg{width:18px;height:18px}
.jg-bus-campo{flex:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:100px;background:#fff;border:1px solid #e1dcea;color:#8a8399;cursor:text;min-width:0;transition:border-color .15s,box-shadow .15s}
.jg-bus-campo:focus-within{border-color:var(--jg-purple);box-shadow:0 0 0 3px #8860ed2e;color:var(--jg-purple)}
.jg-bus-campo svg{width:16px;height:16px;flex-shrink:0}
.jg-bus-campo input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;padding:0;font:500 14px 'IBM Plex Sans',sans-serif;color:var(--jg-ink)}
.jg-bus-campo input::placeholder{color:#9b95a8}
.jg-bus-campo kbd{font:600 11px 'IBM Plex Mono',monospace;padding:1px 6px;border:1px solid #ddd8e6;border-radius:5px;color:#8a8399;background:#faf9fc}
.jg-bus-campo:focus-within kbd{display:none}
.jg-bus-lista{position:absolute;top:calc(100% + 8px);right:0;z-index:30;width:min(420px,calc(100vw - 32px));max-height:min(62vh,470px);overflow:auto;overscroll-behavior:contain;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid #e4dfeb;border-radius:18px;box-shadow:0 18px 50px #2a1e4430}
.jg-bus-r{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;cursor:pointer}
.jg-bus-r[aria-selected=true]{background:#f1edf8}
.jg-bus-ico{flex:0 0 38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 32%,transparent)}
.jg-bus-txt{flex:1;min-width:0}
.jg-bus-txt b{display:block;font:600 14px/1.3 'IBM Plex Sans',sans-serif;color:var(--jg-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-bus-txt small{display:block;margin-top:2px;font-size:12px;color:var(--jg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-bus-modo{display:inline-flex;align-items:center;gap:3px;margin-right:6px;padding:1px 7px 1px 5px;border-radius:100px;font-weight:600;font-size:11px;vertical-align:1px}
.jg-bus-modo svg{width:12px;height:12px}
.jg-bus-modo.m-solo{background:var(--m-solo-bg);color:var(--m-solo-tx)}
.jg-bus-modo.m-bots{background:#ffe7a8;color:var(--m-solo-tx)}
.jg-bus-modo.m-multi{background:var(--m-multi-bg);color:var(--m-multi-tx)}
.jg-bus-r.bloq b{color:#8a8399}
.jg-bus-candado{flex-shrink:0;display:grid;color:#8a8399}.jg-bus-candado svg{width:14px;height:14px}
.jg-bus-nada{padding:12px;font-size:13px;color:var(--jg-muted);line-height:1.45}
@media(pointer:coarse){.jg-bus-campo kbd{display:none}}
@media(max-width:900px){.jg-bus{flex:0 1 240px}}
@media(max-width:600px){
  .jg-bus{position:static;flex:0 0 auto}
  .jg-bus-abre{display:grid}
  .jg-bus-campo{display:none}
  .jg-modos.buscando .jg-modos-sel,.jg-modos.buscando .jg-modos-entrar,.jg-modos.buscando .jg-bus-abre{display:none}
  .jg-modos.buscando .jg-bus{flex:1}
  .jg-modos.buscando .jg-bus-campo{display:flex}
  .jg-modos.buscando .jg-bus-x{display:grid}
  /* 16 px: con menos, el iPhone hace zoom al enfocar el campo. */
  .jg-bus-campo input{font-size:16px}
  /* El ✕ propio cierra la búsqueda; el del navegador sobraba al lado. */
  .jg-bus-campo input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
  /* Con el teclado abierto queda menos de media pantalla. */
  .jg-bus-lista{left:16px;right:16px;width:auto;top:calc(100% + 2px);max-height:min(48vh,440px)}
}

/* ---- El aviso del invitado: claro, pero discreto ---- */
.jg-invitado-aviso{display:flex;align-items:center;gap:10px;margin:0 0 16px;padding:10px 12px;border-radius:14px;background:#fff8e6;border:1px solid #f1dca8;color:#5f4610;font-size:12.5px;line-height:1.45}
.jg-invitado-ico{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--m-solo-bg);color:var(--m-solo-tx)}
.jg-invitado-ico svg{width:16px;height:16px}
.jg-invitado-aviso>span:nth-child(2){flex:1;min-width:0}
.jg-invitado-aviso button{flex-shrink:0;border:0;background:none;padding:8px 4px;font:700 12.5px 'IBM Plex Sans',sans-serif;color:var(--jg-purple);cursor:pointer;white-space:nowrap}
.jg-invitado-aviso button:hover{text-decoration:underline}
.jg-invitado-aviso .jg-enlace-btn{padding:0;font-size:inherit;text-decoration:underline}

/* ---- Títulos de sección: el icono de modo vuelve a decir cuál es ---- */
.jg-sal-tit{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.jg-sal-tit>div{flex:1;min-width:0}
.jg-sal-tit h2{margin:0;font-size:20px;letter-spacing:-.5px;color:var(--jg-ink)}
.jg-sal-tit p{margin:2px 0 0;font-size:12.5px;color:var(--jg-muted);line-height:1.45}
.jg-sal-ico{flex:0 0 36px;height:36px;border-radius:12px;display:grid;place-items:center}
.jg-sal-ico svg{width:19px;height:19px}
.jg-sal-ico.m-solo{background:var(--m-solo-bg);color:var(--m-solo-tx)}
.jg-sal-ico.m-multi{background:var(--m-multi-bg);color:var(--m-multi-tx)}
.jg-sal-rapida{flex-shrink:0;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jg-sal-rapida small{font-weight:500;opacity:.75;margin-left:4px}
.jg-sal-rapida[hidden]{display:none}
/* En un teléfono chico el botón de «Unirme a…» se comía el título: baja a
   su propia fila, a todo lo ancho, donde además llega mejor el pulgar. */
@media(max-width:420px){.jg-sal-tit{flex-wrap:wrap}.jg-sal-rapida{flex:1 1 100%;max-width:none}}
.jg-sal-ver{flex-shrink:0;border:0;background:none;font:700 12.5px 'IBM Plex Sans',sans-serif;color:var(--jg-purple);cursor:pointer;padding:10px 4px}
.jg-desliza{display:none}
.jg-sal[data-modo=solo] .jg-sal-ver,.jg-sal.jg-sal-inv .jg-sal-ver{display:none}
.jg-sal-multi .jg-filtros{display:inline-flex;margin:0 0 14px}
.jg-filtros button{min-height:36px}

/* ---- El carrusel de un jugador y la rejilla multijugador ---- */
.jg-carrusel{display:grid;grid-auto-flow:column;grid-auto-columns:44%;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 14px;scroll-padding:0 16px;scrollbar-width:none}
.jg-carrusel::-webkit-scrollbar{display:none}
.jg-carrusel>.jg-mn{scroll-snap-align:start}
/* Al invitado, los de un jugador en rejilla como los multijugador (no en
   carrusel): en una fila que se desliza parecían pocos al lado de la
   rejilla de multijugador, y son justo lo que puede jugar. */
.jg-sal[data-modo=solo] .jg-carrusel,.jg-sal.jg-sal-inv .jg-carrusel,.jg-rejilla{display:grid;grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-columns:auto;gap:10px;overflow:visible;margin:0;padding:0}

/* ---- La miniatura ---- */
.jg-mn{position:relative;min-width:0;container-type:inline-size;border-radius:16px;background:#fff;border:1px solid #e5e0ee;box-shadow:0 1px 2px #2a1e440a;transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .2s,border-color .2s}
.jg-mn[hidden]{display:none}
/* Fuera de pantalla, la portada no anima (`vigilaPortadas` en salon.js). */
.jg-mn.dormida *,.jg-mn.dormida *::before,.jg-mn.dormida *::after{animation-play-state:paused!important}
.jg-mn-abre{display:flex;flex-direction:column;width:100%;height:100%;padding:0;margin:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:inherit;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.jg-mn-abre:focus-visible{outline:3px solid var(--c);outline-offset:3px}
/* La portada: 4:3, y el arte (hecho a 165 px de alto) escalado según el ancho. */
.jg-mn-arte{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:auto;aspect-ratio:4/3;overflow:hidden;border-radius:15px 15px 0 0;container-type:inline-size;background:#221936}
.jg-mn-arte>*{zoom:.9}
@container (max-width:240px){.jg-mn-arte>*{zoom:.78}}
@container (max-width:200px){.jg-mn-arte>*{zoom:.68}}
@container (max-width:170px){.jg-mn-arte>*{zoom:.58}}
@container (max-width:145px){.jg-mn-arte>*{zoom:.5}}
@container (min-width:320px){.jg-mn-arte>*{zoom:1}}
/* Los artes que llenan su caja (paisajes) no se encogen: se recortan. */
.jg-mn-arte>:is(.jg-art-worms,.jg-art-land){zoom:1!important}
/* Las portadas del club: su fondo de siempre (`.sp-e-*`) y el nombre en
   su tipografía. `:where` deja que la regla de cada juego (el pixel de
   BBTAN, el neón del sudoku) gane sin pelear especificidad. */
.jg-mn-sp{align-items:flex-end;justify-content:flex-start;padding:12px 12px 14px;background-color:#0c1629;color:#fff}
.jg-mn-sp>strong{zoom:1;position:static}
:where(.jg-mn-sp) strong{display:block;max-width:78%;font-size:clamp(15px,11.5cqi,30px);line-height:1;font-weight:900;font-style:italic;letter-spacing:-.04em;text-transform:uppercase;color:#fff;text-shadow:0 2px 14px #0009;overflow-wrap:anywhere}
.jg-mn-sp strong>span{position:absolute;right:8%;top:18%;font-size:clamp(34px,30cqi,80px);font-style:normal;line-height:1;opacity:.32;transform:rotate(-12deg);color:#f6bc64;text-shadow:0 0 30px currentColor}
/* La escena ilustrada (portadas-solo.js) va debajo del nombre y ocupa toda
   la portada; el emoji transparente de antes sobra con ella. Se anima solo
   al pasar el ratón o con el foco, y siempre en la ficha. Cada pieza que
   se mueve gira o late sobre su propio centro (`fill-box`), y ninguna lleva
   `transform` en el SVG: la animación lo reemplazaría. */
.jg-mn-arte>.jg-sp-svg{position:absolute;inset:0;width:100%;height:100%;zoom:1;display:block}
.jg-mn-sp.con-svg>strong{position:relative;z-index:1;text-shadow:0 2px 3px #000a,0 2px 16px #000c}
.jg-mn-sp.con-svg strong>span{display:none}
.jg-sp-svg [class^="a-"]{transform-box:fill-box;transform-origin:center}
.jg-sp-svg .a-ala{transform-origin:center bottom}
.jg-sp-svg .a-barrera{transform-origin:center top}
.jg-mn:is(:hover,:focus-within) .jg-sp-svg .a-late,.jg-hoja-arte .jg-sp-svg .a-late{animation:jgSpLate 1.4s ease-in-out infinite}
.jg-mn:is(:hover,:focus-within) .jg-sp-svg :is(.a-mueve,.a-vuela),.jg-hoja-arte .jg-sp-svg :is(.a-mueve,.a-vuela){animation:jgSpFlota 1.6s ease-in-out infinite}
.jg-mn:is(:hover,:focus-within) .jg-sp-svg .a-ala,.jg-hoja-arte .jg-sp-svg .a-ala{animation:jgSpAla .22s ease-in-out infinite alternate}
.jg-mn:is(:hover,:focus-within) .jg-sp-svg .a-gira,.jg-hoja-arte .jg-sp-svg .a-gira{animation:jgSpGira 2.4s ease-in-out infinite}
.jg-mn:is(:hover,:focus-within) .jg-sp-svg .a-cae,.jg-hoja-arte .jg-sp-svg .a-cae{animation:jgSpCae 1.8s steps(6) infinite}
.jg-mn:is(:hover,:focus-within) .jg-sp-svg .a-flamea,.jg-hoja-arte .jg-sp-svg .a-flamea{animation:jgSpFlamea .8s ease-in-out infinite alternate}
.jg-mn:is(:hover,:focus-within) .jg-sp-svg .a-chispa,.jg-hoja-arte .jg-sp-svg .a-chispa{animation:jgSpChispa 1.2s steps(2) infinite}
.jg-mn:is(:hover,:focus-within) .jg-sp-svg .a-sale,.jg-hoja-arte .jg-sp-svg .a-sale{animation:jgSpSale 2.6s cubic-bezier(.5,0,.4,1) infinite}
.jg-mn:is(:hover,:focus-within) .jg-sp-svg .a-barrera,.jg-hoja-arte .jg-sp-svg .a-barrera{animation:jgSpBarrera 2.6s ease-in-out infinite}
.jg-mn:is(:hover,:focus-within) .jg-sp-svg .a-lengua,.jg-hoja-arte .jg-sp-svg .a-lengua{animation:jgSpLate .5s steps(2) infinite}
/* Metro Rush: los focos del tren laten (el tren se acerca), el tren retumba,
   las rayas de velocidad se quedan atrás del corredor, las estelas de la
   tabla se estiran desde la cola, una ola de brillo baja por los durmientes
   y el corredor se inclina como al tallar mientras sube y baja; la sombra y
   los focos van al mismo 1.6 s que él, así todo respira junto. */
.jg-mn:is(:hover,:focus-within) .jg-sp-svg .a-foco,.jg-hoja-arte .jg-sp-svg .a-foco{animation:jgSpFoco 1.6s ease-in-out infinite}
.jg-mn:is(:hover,:focus-within) .jg-sp-svg .a-tiembla,.jg-hoja-arte .jg-sp-svg .a-tiembla{animation:jgSpTiembla .12s steps(2) infinite}
.jg-mn:is(:hover,:focus-within) .jg-sp-svg .a-raya,.jg-hoja-arte .jg-sp-svg .a-raya{animation:jgSpRaya .5s linear infinite}
.jg-sp-svg .a-estela{transform-origin:right center}
.jg-sp-svg .a-surfea{transform-origin:center bottom}
.jg-mn:is(:hover,:focus-within) .jg-sp-svg .a-surfea,.jg-hoja-arte .jg-sp-svg .a-surfea{animation:jgSpSurfea 1.6s ease-in-out infinite}
.jg-mn:is(:hover,:focus-within) .jg-sp-svg .a-durmiente,.jg-hoja-arte .jg-sp-svg .a-durmiente{animation:jgSpDurmiente 1.1s ease-in-out infinite}
.jg-mn:is(:hover,:focus-within) .jg-sp-svg .a-estela,.jg-hoja-arte .jg-sp-svg .a-estela{animation:jgSpEstela .3s ease-in-out infinite alternate}
.jg-mn:is(:hover,:focus-within) .jg-sp-svg .a-sombra,.jg-hoja-arte .jg-sp-svg .a-sombra{animation:jgSpSombra 1.6s ease-in-out infinite}
@keyframes jgSpLate{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes jgSpFlota{0%,100%{transform:translateY(3px)}50%{transform:translateY(-6px)}}
@keyframes jgSpAla{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
@keyframes jgSpGira{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
@keyframes jgSpCae{from{transform:translateY(-40px)}to{transform:translateY(40px)}}
@keyframes jgSpFlamea{from{transform:skewY(-6deg)}to{transform:skewY(6deg)}}
@keyframes jgSpChispa{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes jgSpSale{0%,25%{transform:translateX(0)}60%,100%{transform:translateX(150px);opacity:0}}
@keyframes jgSpFoco{0%,100%{opacity:.75;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
@keyframes jgSpTiembla{from{transform:translate(0,0)}to{transform:translate(1.4px,-1px)}}
@keyframes jgSpSurfea{0%,100%{transform:translateY(3px) rotate(1.5deg)}50%{transform:translateY(-6px) rotate(-2.5deg)}}
@keyframes jgSpDurmiente{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes jgSpEstela{from{transform:scaleX(.6)}to{transform:scaleX(1.25)}}
@keyframes jgSpSombra{0%,100%{transform:scaleX(1);opacity:.32}50%{transform:scaleX(.78);opacity:.16}}
@keyframes jgSpRaya{from{transform:translateX(-8px);opacity:1}to{transform:translateX(22px);opacity:0}}
@keyframes jgSpBarrera{0%,20%{transform:rotate(0)}40%,80%{transform:rotate(-80deg)}100%{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){.jg-sp-svg [class^="a-"]{animation:none!important}}
.jg-mn-txt{display:grid;gap:3px;padding:9px 12px 12px;min-width:0}
.jg-mn-nombre{font-size:14.5px;font-weight:650;letter-spacing:-.2px;line-height:1.25;color:var(--jg-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jg-mn-meta{display:flex;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--jg-muted);line-height:1.4}
.jg-mn-meta>span+span:before{content:"·";margin:0 5px;opacity:.7}
.jg-mn-vivo{color:#15803d;font-weight:650}
.jg-mn-vivo i{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:#22c55e;vertical-align:1px;animation:jgVivo 2s infinite}

/* La insignia de modo: arriba a la izquierda en la portada, y la misma
   pieza (sin posición) en la ficha y en las novedades. */
.jg-mn-modo{display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 6px;border-radius:100px;font:700 10.5px/1.3 'IBM Plex Sans',sans-serif;letter-spacing:.01em;white-space:nowrap}
.jg-mn-modo svg{width:13px;height:13px;flex:none}
.jg-mn-modo.m-solo,.jg-mn-modo.m-bots{background:var(--m-solo-bg);color:var(--m-solo-tx)}
.jg-mn-modo.m-bots{background:#ffe7a8}
.jg-mn-modo.m-multi{background:var(--m-multi-bg);color:var(--m-multi-tx)}
.jg-mn>.jg-mn-modo{position:absolute;top:8px;left:8px;z-index:1;pointer-events:none;box-shadow:0 2px 8px #0005}
/* Dónde se juega (`plataformas` en salon.js, datos de `CONTROLES`): una
   píldora blanca debajo de la insignia de modo con «Celular» en celeste y
   «PC» en pizarra, o solo «PC». Celeste porque ninguna otra marca de la
   tarjeta lo usa (ámbar es un jugador, violeta multijugador, verde nuevo,
   oro más jugado). Los svg llevan tamaño explícito: sin él se dibujan a
   todo lo ancho de la tarjeta. */
.jg-mn-plat{display:inline-flex;align-items:stretch;border-radius:100px;background:#fff;font:700 10px/1.3 'IBM Plex Sans',sans-serif;white-space:nowrap;overflow:hidden}
.jg-mn-plat i{display:inline-flex;align-items:center;gap:3px;padding:2px 7px 2px 5px;font-style:normal}
.jg-mn-plat i+i{border-left:1px solid #e2e8f0}
.jg-mn-plat i.cel{color:#075985}
.jg-mn-plat i.pc{color:#334155}
.jg-mn-plat svg{width:12px;height:12px;flex:none}
.jg-mn-plat i.cel svg{color:#0284c7}
.jg-mn-plat i.pc svg{color:#64748b}
.jg-mn>.jg-mn-plat{position:absolute;top:33px;left:8px;z-index:1;pointer-events:none;box-shadow:0 2px 8px #0005;max-width:calc(100% - 16px)}
/* Nuevo y Más jugado: arriba a la derecha. */
.jg-mn-etq{position:absolute;top:8px;right:8px;z-index:1;pointer-events:none;padding:3px 8px;border-radius:100px;font:800 9.5px/1.3 'IBM Plex Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#16a34a;box-shadow:0 2px 8px #0005;overflow:hidden}
.jg-mn-etq:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff8 50%,transparent 70%);transform:translateX(-120%);animation:jgEtqBrillo 3.2s ease-in-out infinite}
.jg-mn-etq.top{background:#f5b819;color:#3a2600;letter-spacing:.03em}
.jg-mn-etq.top:after{display:none}
/* En una tarjeta angosta la estrella sola: el texto pisaba la insignia de modo. */
@container (max-width:250px){.jg-mn-etq.top>span{display:none}}
/* Y en una de teléfono chico (dos columnas a 320 px) «2–10 jugadores» no
   cabía junto a la estrella: queda el icono de dos personas y «2–10». */
@container (max-width:165px){.jg-mn-pal{display:none}}
@keyframes jgEtqBrillo{0%,55%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
.jg-mn.nuevo{border-color:color-mix(in srgb,#16a34a 35%,#e5e0ee)}
/* ▶ Jugar ya: sobre el borde entre portada y texto, a la derecha. 75cqw es
   el alto de la portada (4:3 del ancho de la tarjeta). */
.jg-mn-ya{position:absolute;z-index:2;right:10px;top:calc(75cqw - 22px);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--m-solo-bg);color:var(--m-solo-tx)!important;box-shadow:0 6px 16px #0004,0 0 0 3px #fff;text-decoration:none!important;transition:transform .15s}
.jg-mn-ya svg{width:18px;height:18px;margin-left:2px}
.jg-mn-ya:hover{transform:scale(1.08)}
.jg-mn-ya:active{transform:scale(.94)}
.jg-mn-ya:focus-visible{outline:3px solid var(--jg-purple);outline-offset:2px}
.jg-mn:has(.jg-mn-ya) .jg-mn-txt{padding-right:12px}
.jg-mn:has(.jg-mn-ya) .jg-mn-nombre{margin-right:30px}
/* Bloqueada para invitados: se ve el juego (es la razón para la cuenta),
   apagado, con el candado y lo que pide. */
.jg-mn.bloq .jg-mn-arte{filter:grayscale(.8) brightness(.55)}
.jg-mn-candado{position:absolute;z-index:1;left:0;right:0;top:0;height:75cqw;display:grid;place-content:center;justify-items:center;gap:6px;color:#fff;pointer-events:none;font:700 11.5px 'IBM Plex Sans',sans-serif;text-shadow:0 1px 6px #000a}
.jg-mn-candado svg{width:34px;height:34px;padding:8px;border-radius:50%;background:#0009;box-shadow:0 0 0 1px #fff4}
.jg-mn.bloq .jg-mn-nombre{color:#5c566c}
/* Seleccionada: la tarjeta cuya ficha está abierta. */
.jg-mn.sel{border-color:transparent;box-shadow:0 0 0 3px var(--c),0 14px 30px #39226d24}
.jg-mn.sel .jg-mn-nombre{color:var(--jg-ink)}
/* Pasar el cursor (solo donde hay cursor): sube y dice qué pasa al tocar. */
.jg-mn-pista{display:none}
@media(hover:hover) and (pointer:fine){
  .jg-mn:hover{transform:translateY(-3px);box-shadow:0 14px 30px #39226d1c;border-color:color-mix(in srgb,var(--c) 40%,#e5e0ee)}
  .jg-mn.sel:hover{box-shadow:0 0 0 3px var(--c),0 14px 30px #39226d24}
  .jg-mn-pista{display:block;position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font:700 11.5px 'IBM Plex Sans',sans-serif;color:#fff;text-align:left;background:linear-gradient(transparent,#000b);opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;zoom:1!important}
  .jg-mn:hover .jg-mn-pista,.jg-mn-abre:focus-visible .jg-mn-pista{opacity:1;transform:none}
}

/* ---- La ficha ---- */
.jg-hoja-capa{position:fixed;inset:0;z-index:65;background:#120d1f00;transition:background .22s}
.jg-hoja-capa[hidden]{display:none}
.jg-hoja-capa.cerrando{pointer-events:none}
.jg-hoja-capa.abierta{background:#120d1f8f}
.jg-hoja{position:fixed;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px #120d1f40;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.3,1);outline:none}
.jg-hoja-capa.abierta .jg-hoja{transform:none}
.jg-hoja.arrastra{transition:none}
html.jg-hoja-modal,html.jg-hoja-modal body{overflow:hidden}
/* El botón flotante de reportes caía encima del botón principal de la ficha. */
html.jg-hoja-abierta .rp-fab{display:none}
.jg-hoja-asa{position:absolute;z-index:3;left:0;right:0;top:0;height:26px;display:grid;place-items:center;touch-action:none;cursor:grab}
.jg-hoja-asa i{width:42px;height:5px;border-radius:5px;background:#ffffffcc;box-shadow:0 1px 4px #0006}
.jg-hoja-x{position:absolute;z-index:3;top:10px;right:10px;width:40px;height:40px;border:0;border-radius:50%;background:#0009;color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center}
.jg-hoja-x:hover{background:#000c}
.jg-hoja-arte{flex:0 0 auto;aspect-ratio:16/7;border-radius:0;touch-action:none}
.jg-hoja-arte.jg-mn-sp{padding:16px 18px 18px}
/* `minmax(0,1fr)` y no la columna implícita: esa mide lo que pida el hijo
   más ancho sin partirse (un nombre largo en el podio, la opción más larga
   de un select), y a 320 px empujaba la ficha entera 16 px fuera de la
   pantalla, con el texto y el botón «Unirme» cortados. */
.jg-hoja-cuerpo{flex:1 1 auto;overflow:auto;overscroll-behavior:contain;padding:14px 18px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start;min-height:0}
.jg-hoja-chips{display:flex;flex-wrap:wrap;gap:6px}
.jg-hoja-chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;background:#f2eef9;color:#5c566c;font:600 11px/1.4 'IBM Plex Sans',sans-serif}
.jg-hoja-chip.nuevo{background:#dcfce7;color:#166534}
.jg-hoja-chip.movil,.jg-hoja-chip.pc{gap:4px}
.jg-hoja-chip.movil{background:#e0f2fe;color:#075985}
.jg-hoja-chip.pc{background:#fef3c7;color:#854d0e}
.jg-hoja-chip svg{width:13px;height:13px;flex:none}
.jg-hoja h2{margin:0;font-size:24px;letter-spacing:-.6px;line-height:1.15;color:var(--jg-ink)}
.jg-hoja-lema{margin:-4px 0 0;font-size:13.5px;line-height:1.55;color:#5f5a70}
.jg-hoja-salas{display:flex;align-items:center;gap:10px;margin:0;padding:10px 12px;border-radius:14px;background:#ecfdf3;border:1px solid #bbf7d0;color:#14532d;font-size:12.5px;line-height:1.45}
.jg-hoja-salas>span{flex:1;min-width:0}
.jg-hoja-salas i{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:#22c55e;animation:jgVivo 2s infinite}
.jg-hoja-salas.vacia{display:block;background:#f7f6fb;border-color:#ece8f3;color:var(--jg-muted)}
.jg-hoja-ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.jg-hoja-ops h3{grid-column:1/-1;margin:0;font:700 10.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--jg-muted)}
.jg-hoja-ops label{display:grid;gap:4px;min-width:0;font-size:11.5px;font-weight:600;color:#5c566c}
.jg-hoja-ops select{width:100%;height:42px;padding:0 8px;border:1px solid #ddd9e8;border-radius:10px;background:#fff;color:var(--jg-ink);font:500 13px 'IBM Plex Sans',sans-serif;cursor:pointer}
.jg-hoja-ops select:focus{outline:2px solid var(--c);outline-offset:1px}
.jg-hoja-podio[hidden]{display:none}
.jg-hoja-podio .jg-of-podio{margin:0}
.jg-hoja-modos{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.jg-hoja-modos li{padding:5px 11px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,#fff);border:1px solid color-mix(in srgb,var(--c) 32%,#fff);font-size:12px;font-weight:600;color:var(--jg-ink)}
.jg-hoja-nota{margin:0;font-size:12px;line-height:1.55;color:var(--jg-muted)}
.jg-hoja-nota a{color:var(--jg-purple);font-weight:600}
.jg-enlace-btn{border:0;background:none;padding:0;font:700 12px 'IBM Plex Sans',sans-serif;color:var(--jg-purple);cursor:pointer;text-decoration:underline}
/* Con tres botones (Pokémon suma «Equipos») no caben en 320 px: el
   principal baja a su propia fila, a todo lo ancho, en vez de salirse. */
.jg-hoja-pie{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #efebf5;background:#fff}
.jg-hoja-pie .btn,.jg-hoja-pie .btn2{height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none!important;white-space:nowrap}
.jg-hoja-ya{flex:1;font-size:14px!important}
a.jg-hoja-ya{color:#fff!important}
.jg-hoja[data-modo=solo] .jg-hoja-ya,.jg-hoja[data-modo=bots] .jg-hoja-ya{background:var(--m-solo-bg);color:var(--m-solo-tx)!important}
.jg-hoja[data-modo=solo] .jg-hoja-ya:hover,.jg-hoja[data-modo=bots] .jg-hoja-ya:hover{background:#ffc23a}
/* La ficha bloqueada: el choque del invitado con un multijugador. */
.jg-hoja.bloq .jg-hoja-arte{filter:grayscale(.8) brightness(.55)}
.jg-hoja-cuenta{display:grid;justify-items:center;gap:8px;padding:16px 14px;border-radius:16px;background:#f5f1ff;border:1px solid #e1d6fb;text-align:center}
.jg-hoja-candado{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--m-multi-bg);color:#fff}
.jg-hoja-candado svg{width:22px;height:22px}
.jg-hoja-cuenta h3{margin:0;font-size:16px;letter-spacing:-.2px;color:var(--jg-ink)}
.jg-hoja-cuenta p{margin:0;font-size:12.5px;line-height:1.55;color:#5f5a70}
.jg-hoja-alt{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 6px;border:0;background:none;font:600 12.5px 'IBM Plex Sans',sans-serif;color:var(--jg-purple);cursor:pointer;text-decoration:none}
.jg-hoja-alt svg{width:15px;height:15px}
.jg-hoja-alt:hover{text-decoration:underline}

/* ---- La puerta: lo que ve el invitado en una pantalla con cuenta ---- */
.jg-puerta{max-width:520px;margin:28px auto;padding:32px 24px;border-radius:22px;background:#fff;border:1px solid #e4dfeb;text-align:center;display:grid;justify-items:center;gap:10px}
.jg-puerta-ico{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--m-multi-bg);color:#fff;box-shadow:0 10px 30px #7042df44}
.jg-puerta-ico svg{width:28px;height:28px}
.jg-puerta h2{margin:6px 0 0;font-size:22px;letter-spacing:-.5px;color:var(--jg-ink)}
.jg-puerta p{margin:0;font-size:13.5px;line-height:1.6;color:#5f5a70;max-width:44ch}
.jg-puerta-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.jg-puerta-btns .btn,.jg-puerta-btns .btn2{height:46px;display:inline-flex;align-items:center;text-decoration:none!important}
.jg-puerta .jg-puerta-nota{font-size:12px;color:var(--jg-muted)}

/* ---- La bienvenida del celular (abreBienvenida): elegir antes del salón ---- */
html.jg-bv-abierta,html.jg-bv-abierta body{overflow:hidden}
html.jg-bv-abierta .rp-fab,html:has(#jgInvGuarda) .rp-fab{display:none!important}
.jg-bv-caja:focus{outline:none}
.jg-bv{position:fixed;inset:0;z-index:96;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at top,#ece4ff,#fbfaff 62%);animation:jgVela .2s ease-out}
.jg-bv-caja{width:100%;max-width:440px}
.jg-bv-paso{display:grid;gap:12px;text-align:center}
.jg-bv-paso[hidden]{display:none}
.jg-bv h1,.jg-bv h2{margin:4px 0 0;font-size:28px;line-height:1.15;letter-spacing:-.7px;color:var(--jg-ink)}
.jg-bv h2{font-size:25px}
.jg-bv-paso>p{margin:0;font-size:14.5px;line-height:1.55;color:#5f5a70}
.jg-bv-btns{display:grid;gap:10px;margin-top:10px}
.jg-bv-btns .btn,.jg-bv-btns .btn2{height:52px;border-radius:14px;font-size:15.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.jg-bv-btns .btn{background:var(--jg-purple)}
.jg-bv-inv{border:0;background:none;padding:12px;font:700 14.5px 'IBM Plex Sans',sans-serif;color:var(--jg-purple);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.jg-bv .jg-bv-nota{font-size:12px;color:var(--jg-muted)}
.jg-bv-juegos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.jg-bv-juego{display:grid;gap:2px;padding:0 0 10px;border-radius:16px;overflow:hidden;background:#fff;border:2px solid color-mix(in srgb,var(--c) 45%,#e4dfeb);text-decoration:none;color:var(--jg-ink);box-shadow:0 6px 18px #2a1d5514}
.jg-bv-juego:active{transform:scale(.97)}
.jg-bv-portada{display:block;aspect-ratio:4/3;overflow:hidden;background:#1d1529;margin-bottom:6px}
.jg-bv-portada svg{display:block;width:100%;height:100%}
.jg-bv-portada{position:relative}
.jg-bv-play{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#1a1206;box-shadow:0 3px 10px #0006}
.jg-bv-play svg{width:15px!important;height:15px!important;margin-left:2px}
.jg-bv-juego b{font-size:15px}
.jg-bv-juego small{font-size:12px;color:var(--jg-muted)}

/* ---- El invitado en un destacado: el aviso de arriba y «¿Guardamos esta partida?» ---- */
.jg-inv-tira{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:10px 12px;border-radius:14px;background:#fff8e6;border:1px solid #f1dca8;color:#5f4610;font-size:12.5px;line-height:1.45}
.jg-inv-tira>span{flex:1;min-width:0}
.jg-inv-tira .btn{flex-shrink:0;background:var(--jg-purple)}
@media (max-width:600px){.jg-inv-tira{font-size:12px;padding:8px 10px;gap:8px}.jg-inv-tira .btn{height:34px;padding:0 12px}}
/* El reto de un amigo (reto.js), encima del juego. */
.jg-reto-tira{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:10px 12px;border-radius:14px;background:#efe9ff;border:1px solid #d6c9ff;color:#3b2a7a;font-size:13px;line-height:1.45}
.jg-reto-tira>span:first-child{font-size:20px}
.jg-reto-tira>span:last-child{flex:1;min-width:0}
.jg-invg{position:fixed;left:0;right:0;bottom:0;z-index:92;display:flex;justify-content:center;padding:0 12px max(12px,env(safe-area-inset-bottom));pointer-events:none}
.jg-invg-caja{pointer-events:auto;position:relative;width:100%;max-width:520px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:16px 16px 14px;border-radius:20px;background:#fff;border:1px solid #e4dfeb;box-shadow:0 14px 44px #120d1f4d;animation:jgLogroEntra .45s cubic-bezier(.2,1.4,.4,1)}
.jg-invg-ico{font-size:30px;line-height:1;padding-top:2px}
.jg-instalar-ico{width:44px;height:44px;border-radius:12px}
.jg-invg-txt small{display:block;font-size:12px;font-weight:700;color:var(--jg-purple)}
.jg-invg-txt b{display:block;font-size:17px;letter-spacing:-.3px;color:var(--jg-ink);padding-right:26px}
.jg-invg-txt p{margin:4px 0 0;font-size:13px;line-height:1.5;color:#5f5a70}
.jg-invg-btns{grid-column:1/-1;display:flex;gap:8px;margin-top:10px}
.jg-invg-btns .btn{flex:1;height:46px;border-radius:12px;font-size:14px;background:var(--jg-purple)}
.jg-invg-btns .btn2{height:46px;border-radius:12px}
.jg-invg-x{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;border-radius:50%;background:none;color:var(--jg-muted);font-size:15px;cursor:pointer}
/* «¿Cómo te llamamos?» (pideNombreInvitado): la misma tarjeta del aviso de
   invitado, pero modal, con un velo encima del juego que carga detrás. */
.jg-nom{position:fixed;inset:0;z-index:93;display:flex;align-items:flex-end;justify-content:center;padding:0 12px max(12px,env(safe-area-inset-bottom));background:#120d1f73;animation:jgVela .2s ease-out}
@media (min-width:601px){.jg-nom{align-items:center}}
.jg-nom-caja{margin:0}
.jg-nom-campo{grid-column:1/-1;display:block;margin-top:10px}
.jg-nom-campo input,.jg-bv-nombre input{width:100%;box-sizing:border-box;height:50px;padding:0 14px;border-radius:12px;border:2px solid #d9d1ee;background:#fbfaff;color:var(--jg-ink);font:700 17px 'IBM Plex Sans',sans-serif}
.jg-nom-campo input:focus,.jg-bv-nombre input:focus{outline:none;border-color:var(--jg-purple)}
.jg-bv-nombre{display:grid;gap:6px;text-align:left;font-size:13px;font-weight:700;color:var(--jg-purple)}
html:has(#jgNomInv) .rp-fab{display:none!important}

/* ---- La caja del invitado en la columna de salas ---- */
.jg-lado-cuenta{padding-bottom:16px}
.jg-lado-cuenta header .jg-sal-ico{flex-basis:30px;height:30px;border-radius:10px}
.jg-lado-cuenta header .jg-sal-ico svg{width:16px;height:16px}
.jg-lado-cuenta>p{margin:14px 18px 6px;font-size:12.5px;color:var(--jg-muted)}
.jg-lado-cuenta>ul{margin:0 18px 14px;padding:0;list-style:none;display:grid;gap:7px;font-size:13px;color:var(--jg-ink)}
.jg-lado-cuenta>ul li{padding-left:22px;position:relative;line-height:1.45}
.jg-lado-cuenta>ul li:before{content:"✓";position:absolute;left:0;color:#16a34a;font-weight:800}
.jg-lado-cuenta>.btn{display:flex;align-items:center;justify-content:center;margin:0 18px;width:calc(100% - 36px)}

/* ---- Novedades dentro del salón ---- */
.jg-nov-candado svg,.jg-nov-pie .jg-nov-candado svg{width:14px;height:14px;vertical-align:-2px}
.jg-nov-pie .btn,.jg-nov-pie .btn2{display:inline-flex;align-items:center;justify-content:center;gap:5px;text-decoration:none!important}
.jg-nov-pie .btn2.jg-nov-candado{flex:0 0 auto}

/* ---- Las pestañas: iconos arriba, y abajo del todo en el móvil ---- */
.tab{display:inline-flex;align-items:center;gap:7px}
.tab-i{width:18px;height:18px;flex:none}
.tab .jg-moneda{width:17px;height:17px;vertical-align:0}
.tab-c{display:none}

  .jg-desliza{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid #ddd9e8;background:#fff;color:var(--jg-ink);font-size:18px;cursor:pointer;flex-shrink:0}
  .jg-desliza:hover{border-color:var(--jg-purple);color:var(--jg-purple)}
  .jg-sal[data-modo=solo] .jg-desliza,.jg-sal.jg-sal-inv .jg-desliza{display:none}
  /* La ficha es un panel a la derecha que no tapa el catálogo: se puede
     ir tocando tarjetas y la ficha cambia; sin fondo oscuro detrás. */
  .jg-hoja-capa{inset:auto;background:none!important;transition:none}
  /* Empieza a 76 px: debajo de la cabecera del sitio y de la barra de
     modo pegada, que siguen a mano (iniciar sesión, salir, cambiar de modo). */
  .jg-hoja{left:auto;top:76px;right:12px;bottom:12px;width:min(420px,calc(100vw - 24px));max-height:none;border:1px solid #e4dfeb;border-radius:22px;box-shadow:0 24px 70px #2a1e4438;transform:translateX(24px);opacity:0;transition:transform .22s cubic-bezier(.2,.8,.3,1),opacity .18s}
  .jg-hoja-capa.abierta .jg-hoja{opacity:1}
  .jg-hoja-asa{display:none}
  .jg-hoja-arte{aspect-ratio:2/1;touch-action:auto}
}
/* Un teléfono acostado pasa de 720 px de ancho pero tiene 390 de alto: con
   la portada 2:1 y los botones, al cuerpo de la ficha (salas, opciones) le
   quedaban unos 30 px. Ahí la ficha usa toda la altura y la portada se achica. */
@media(min-width:721px) and (max-height:560px){
  .jg-hoja{top:8px;bottom:8px}
  .jg-hoja-arte{aspect-ratio:auto;height:96px}

@media(min-width:901px){
  /* La columna de salas a la derecha, pegajosa junto a las dos secciones

  /* La columna baja hasta el final (tops y tira incluidos). Chrome sujeta
     un `sticky` a la rejilla entera, no a su área: cuando acababa en

  .jg-sal{grid-template-columns:minmax(0,1fr) 320px;column-gap:28px;grid-template-areas:"nov nov" "intro intro" "modos modos" "avisos avisos" "solo lado" "multi lado" "tops lado" "tira lado" "tiram lado" "tirar lado";grid-template-rows:auto auto auto auto auto auto auto auto auto 1fr}

  .jg-sal[data-modo=multi]{grid-template-areas:"nov nov" "intro intro" "modos modos" "avisos avisos" "multi lado" "tops lado" "tira lado" "tiram lado" "tirar lado";grid-template-rows:auto auto auto auto auto auto auto auto 1fr}

  .jg-modos{justify-content:space-between}
