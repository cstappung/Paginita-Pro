.jg-art-uno i:first-child{margin:0;transform:rotate(-16deg) translateY(10px)}.jg-art-uno i:nth-child(2){transform:rotate(-5deg)}.jg-art-uno i:nth-child(3){transform:rotate(6deg)}.jg-art-uno i:nth-child(4){transform:rotate(17deg) translateY(10px)}
.jg-art-uno i::before{content:'';position:absolute;left:12%;right:12%;top:18%;bottom:18%;border-radius:50%;background:#fff;transform:rotate(28deg)}
.jg-art-uno i:nth-child(4)::before{background:conic-gradient(#d72600 0 25%,#0956bf 0 50%,#379711 0 75%,#e8c300 0)}
.jg-art-uno span{position:relative;font:800 22px 'IBM Plex Mono',monospace;color:var(--t)}.jg-art-uno i:nth-child(4) span{color:#fff;text-shadow:0 1px 3px #000}
.jg-art-uno b{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%) rotate(-6deg);font:900 20px 'IBM Plex Mono',monospace;letter-spacing:1px;color:#ffe14d;text-shadow:2px 2px 0 #d72600}
/* Presidente: baraja francesa sobre la misma mesa oscura que UNO */
.jg-pr-c{background:#fbfaf6;border-color:#fbfaf6;color:#1b1b1f}
.jg-pr-c.roja{color:#c8102e}
.jg-pr-c .ov{background:none;transform:none}.jg-pr-c .ov em{transform:none;color:inherit;text-shadow:none;font-size:30px}
.jg-pr-c .esq{color:inherit;text-shadow:none;display:flex;flex-direction:column;align-items:center;gap:1px}.jg-pr-c .esq s{text-decoration:none;font-size:.9em}
.jg-pr-c.dorso{background:repeating-linear-gradient(45deg,#3b1f6e 0 6px,#52309a 0 12px);border-color:#fbfaf6;color:#ffd76a}

.jg-pr-c.mini .ov em{font-size:16px}.jg-pr-c.tope .ov em{font-size:44px}
.jg-pr-mesa{display:flex;flex-direction:column;align-items:center;gap:10px}
.jg-pr-baza{display:flex;align-items:flex-end;justify-content:center;gap:10px;flex-wrap:wrap}
.jg-pr-grupo{display:flex;flex-direction:column;align-items:center;gap:4px}.jg-pr-grupo>.jg-un-c+.jg-un-c{margin-left:-30px}

.jg-pr-grupo.vieja{opacity:.55}.jg-pr-grupo.vieja>.jg-un-c+.jg-un-c{margin-left:-20px}
.jg-pr-nueva{animation:jgPrEntra .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes jgPrEntra{from{transform:translateY(40px) scale(.7);opacity:0}}
.jg-pr-info{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;text-align:center;font-size:13px}.jg-pr-info b{font-size:15px}
.jg-pr-cambios{list-style:none;margin:4px 0 0;padding:0;font-size:12px;text-align:left}.jg-pr-cambios li.hecho{opacity:.6}.jg-pr-cambios li.anulado{text-decoration:line-through;opacity:.5}
.jg-pr-rol{background:#ffd76a;color:#1b1b1f}
.jg-pr-control{display:flex;flex-direction:column;gap:6px;margin:10px auto;max-width:900px}

/* Cada fila del marcador (Presidente y Spicy): nombre a la izquierda,
   puntos en cifra fija a la derecha. Sin esto heredaba la letra del

.jg-pr-punto{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;background:#ffffff0d;font:500 13px/1.3 "IBM Plex Sans",system-ui,sans-serif;color:#efe8f7}

.jg-portada-presidente{background:radial-gradient(ellipse at center,#3b1f6e,#150c28 75%)}
.jg-art-pr{position:relative;display:flex;align-items:center}

.jg-art-pr i:first-of-type{margin:0;transform:rotate(-15deg) translateY(8px)}.jg-art-pr i:nth-of-type(2){transform:rotate(-5deg)}.jg-art-pr i:nth-of-type(3){transform:rotate(6deg)}.jg-art-pr i:nth-of-type(4){transform:rotate(16deg) translateY(8px)}

.jg-art-sp em{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%) rotate(-4deg);font:900 18px 'IBM Plex Mono',monospace;font-style:normal;letter-spacing:2px;color:#ffcf4a;text-shadow:2px 2px 0 #b0281a}

.jg-tt-lado canvas{background:#111829;border-radius:8px}
.jg-tt-datos{display:flex;flex-direction:column;gap:6px;width:100%}.jg-tt-datos p{margin:0;display:flex;flex-direction:column;background:#111829;border-radius:8px;padding:5px 8px}.jg-tt-datos b{font:800 18px 'IBM Plex Mono',monospace}

.jg-tt-aviso{position:absolute;left:12px;right:0;top:38%;text-align:center;font:900 20px 'IBM Plex Mono',monospace;color:#ffe14d;text-shadow:0 2px 0 #000,0 0 18px #ffe14d99;opacity:0;pointer-events:none}

@keyframes jgTtAviso{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}

/* En el teléfono las dos columnas de 96 px más el pozo no caben (447 px
   en una pantalla de 360): las columnas se estrechan, el pozo encoge con
   lo que queda, y los botones suben justo debajo del pozo, antes de las
   miniaturas de los rivales, que es donde va el pulgar. */
@media(max-width:600px){
  .jg-tt{display:flex;flex-direction:column}
  .jg-tt .jg-tablero.jg-tt-sala{display:contents}
  .jg-tt-yo{order:1;gap:6px;max-width:calc(100% - 12px);margin:10px auto 0}
  .jg-tt-tactil{order:2}
  .jg-tt-rivales{order:3;gap:8px;margin:6px auto 0;padding:0 6px}
  .jg-tt-hist{order:4;margin-top:8px}
  .jg-tt-lado{width:clamp(56px,17vw,96px);flex:none}
  .jg-tt-lado small{font-size:9px;letter-spacing:.04em}
  .jg-tt-lado canvas{width:100%;height:auto}
  .jg-tt-datos p{padding:4px 5px}.jg-tt-datos b{font-size:15px}
  .jg-tt-pozo{min-width:0}
  .jg-tt-pozo canvas{min-width:0;max-width:100%}
  .jg-tt-rival canvas{width:60px;height:auto}
  .jg-tt-tactil button{min-width:44px}
}
/* Con el teléfono tumbado (390 px de alto) los tableros cuadrados medían
   500 o 560 px y no se veían enteros ni a pantalla completa: se acotan
   por el alto, como ya hacía Chain Reaction con su `max-height:78vh`.
   El pozo del Tetris (520 px) igual. Órbita mide el ancho de su caja
   para dibujar, así que se acota la caja y no el lienzo. */
@media(max-height:520px) and (orientation:landscape){
  .jg-tt-pozo canvas{max-height:calc(100vh - 70px);width:auto}
  .jg-svg{max-width:min(500px,calc(100vh - 40px))}
  .jg-aj .jg-aj-col{max-width:calc(100vh - 30px);margin:0 auto}
  .jg-orb-lienzo{max-width:calc((100vh - 40px) * 1.6);margin:0 auto}
}

.sp-canvas-wrap{width:100%;max-width:630px;margin:auto;aspect-ratio:1}.sp-canvas-wrap canvas{width:100%;height:100%;display:block;touch-action:none}.sp-capa{position:absolute;inset:0;z-index:2;background:#080d19e8;backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:sp-entrada .3s ease-out}.sp-capa[hidden]{display:none}.sp-capa h2{font-size:clamp(26px,4vw,46px);letter-spacing:-.04em;margin:15px 0}.sp-capa h2 small{font-size:14px;color:var(--accent)}.sp-capa p{font-size:13px;color:#a7b6ce}.sp-capa button{margin-top:10px}.sp-pad{display:flex;justify-content:center;gap:12px;margin:16px}.sp-pad button{font-size:24px;min-width:52px;min-height:48px;touch-action:manipulation}

/* ============================================================
   Catan

   El tablero es un mar: el hueco `.jg-tablero` va en azul profundo con
   luz desde arriba, y la isla (un SVG) flota encima con su sombra. Los
   jugadores van en una columna a la derecha, sobre el mismo mar, y
   bajan debajo de la isla en pantallas estrechas. Las animaciones son de
   una sola vez (piezas que caen, dados que ruedan y caen, fichas de
   producción que suben) salvo las del agua, que son lentas y en bucle,
   y el latido de los sitios donde se puede construir, que es lo que
   dice «aquí» sin tener que leerlo.
   ============================================================ */
.jg-ct .jg-tablero{padding:0;overflow:hidden;place-items:stretch;background:radial-gradient(ellipse 80% 65% at 45% 35%,#2f7fbd,#17507f 58%,#0c2d4d);border-color:#15406a}
.jg-ct-mesa{display:grid;grid-template-columns:minmax(0,1fr) 250px;min-height:420px}
.jg-ct-isla{position:relative;padding:14px 12px;display:grid;place-items:center;min-width:0;overflow:hidden}
.jg-ct-isla::before{content:'';position:absolute;inset:-20%;background:repeating-radial-gradient(circle at 30% 30%,#ffffff07 0 2px,transparent 3px 28px);animation:ctDeriva 40s linear infinite;pointer-events:none}
@keyframes ctDeriva{to{transform:translate(28px,28px)}}
/* El lienzo mide lo que el SVG: las fichas que suben se colocan en % de
   él, así que siguen en su sitio aunque la isla se desplace en el móvil. */
.jg-ct-scroll{width:100%;display:grid;place-items:center}
.jg-ct-lienzo{position:relative;width:100%;max-width:100%}
.jg-ct-svg{position:relative;width:100%;height:auto;max-height:76vh;display:block;margin:0 auto;filter:drop-shadow(0 14px 22px #0008);user-select:none;-webkit-user-select:none}
.jg-ct-isla.ancha .jg-ct-svg{max-height:66vh}
.jg-ct-isla.eligiendo .ct-hex:not(.ct-mar-h) .ct-losa{filter:brightness(.82) saturate(.85)}

.ct-losa{stroke:#00000040;stroke-width:1.1;transition:filter .3s}
.ct-mar-h .ct-losa{stroke:#ffffff14;stroke-width:.8}
.ct-bisel{stroke:#ffffff3a;stroke-width:1.2;pointer-events:none}
.ct-ola{fill:none;stroke:#ffffff50;stroke-width:1.4;stroke-linecap:round;animation:ctOla 5s ease-in-out infinite alternate}
.ct-ola.b{animation-delay:-2.5s;opacity:.55}
@keyframes ctOla{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
.ct-deco{opacity:.5}
.ct-hex use{pointer-events:none}
.ct-hex{transform-box:fill-box;transform-origin:center}
.ct-hex.robado:not(.ct-mar-h) .ct-losa{filter:grayscale(.55) brightness(.72)}
.ct-hex.robado .ct-ficha{opacity:.55}
.ct-hex.brilla{animation:ctBrilla 1.7s ease-out}
@keyframes ctBrilla{0%{filter:brightness(1)}22%{filter:brightness(1.5) drop-shadow(0 0 10px #fff3a8)}100%{filter:brightness(1)}}
.ct-t-oro .ct-chispa,.ct-chispa{animation:ctChispa 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ctChispa{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}

.ct-ficha circle{fill:#f7ecd0;stroke:#a9884f;stroke-width:1.2}
.ct-ficha>circle{filter:drop-shadow(0 1.5px 1px #0005)}
.ct-ficha text{font:800 12.5px 'IBM Plex Mono',ui-monospace,monospace;text-anchor:middle;fill:#2c2418}
.ct-pips circle{fill:#2c2418;stroke:none}
.ct-ficha.roja text,.ct-ficha.roja .ct-pips circle{fill:#c0392b}

.ct-muelle{stroke:#8a6a44;stroke-width:3.2;stroke-linecap:round;fill:none}
.ct-puerto-c{fill:#f7ecd0;stroke:#6b5234;stroke-width:1.2;filter:drop-shadow(0 2px 2px #0006)}
.ct-puerto-t{font:800 8.5px 'IBM Plex Mono',ui-monospace,monospace;text-anchor:middle;fill:#3a2e22}
.ct-puerto-t2{font:800 6px 'IBM Plex Mono',ui-monospace,monospace;text-anchor:middle;fill:#3a2e22}

.ct-camino-b{stroke:#1d1a17;stroke-width:8.5;stroke-linecap:round}
.ct-camino-c{stroke-width:5.4;stroke-linecap:round}
.ct-camino.ct-nuevo line{stroke-dasharray:1;stroke-dashoffset:1;animation:ctTraza .6s ease-out forwards}
@keyframes ctTraza{to{stroke-dashoffset:0}}
.ct-pieza{transform-box:fill-box;transform-origin:50% 100%;filter:drop-shadow(0 2.5px 1.5px #0007)}
.ct-pieza.ct-nuevo{animation:ctCae .75s cubic-bezier(.3,1.5,.5,1) both}
@keyframes ctCae{0%{transform:translateY(-30px) scale(1.3);opacity:0}55%{transform:translateY(2px) scale(.92);opacity:1}100%{transform:none}}
.ct-flota{transform-box:fill-box;transform-origin:50% 80%;animation:ctMecer 3.4s ease-in-out infinite alternate}
@keyframes ctMecer{from{transform:translateY(-1px) rotate(-4deg)}to{transform:translateY(1.5px) rotate(4deg)}}

.ct-mueble{transition:transform .8s cubic-bezier(.34,1.45,.64,1);pointer-events:none}
.ct-mueble-i{filter:drop-shadow(0 4px 3px #0008);transform-box:fill-box;transform-origin:50% 100%}
.ct-mueble.salta .ct-mueble-i{animation:ctSalto .8s ease-out}
@keyframes ctSalto{0%{transform:none}40%{transform:translateY(-16px) scale(1.12)}80%{transform:translateY(1px) scale(.96)}100%{transform:none}}
#ctPirataG .ct-mueble-i{animation:ctMecer 2.6s ease-in-out infinite alternate}

.ct-hit{fill:transparent;stroke:transparent;cursor:pointer}
.ct-sitio-v .ct-anillo{fill:#ffffffb0;stroke:#fff;stroke-width:2;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:ctLate 1.1s ease-in-out infinite}
.ct-sitio-v:hover .ct-anillo{fill:#ffe066;stroke:#1d1a17}
@keyframes ctLate{0%,100%{transform:scale(.8);opacity:.75}50%{transform:scale(1.15);opacity:1}}
.ct-sitio-e .ct-hit{stroke-width:15}
.ct-sitio-e .ct-anillo{stroke:#fff;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:5 4;pointer-events:none;animation:ctHormiga .7s linear infinite}
.ct-sitio-e.agua .ct-anillo{stroke:#bdf1ff}
.ct-sitio-e:hover .ct-anillo{stroke:#ffe066;stroke-dasharray:none}
.ct-sitio-e.elegido .ct-anillo{stroke:#ffe066;stroke-width:7;stroke-dasharray:none}
@keyframes ctHormiga{to{stroke-dashoffset:-9}}
.ct-sitio-h{fill:#ffe06614;stroke:#ffe066;stroke-width:3;stroke-linejoin:round;cursor:pointer;animation:ctLateH 1.3s ease-in-out infinite}
.ct-sitio-h.agua{stroke:#9fe7ff;fill:#9fe7ff12}
.ct-sitio-h:hover,.ct-sitio-h.fijo{fill:#ffe06640;animation:none}
@keyframes ctLateH{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}

/* Los dados, arriba a la izquierda del mar. */
.jg-ct-dados{position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:10px;z-index:2;pointer-events:none}
.jg-ct-dados:empty{display:none}
.jg-ct-par{display:flex;gap:7px}
.jg-ct-dado{width:32px;height:32px;box-sizing:border-box;padding:5px;border-radius:8px;background:#fbf7ec;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);place-items:center;box-shadow:inset 0 -3px 0 #d8cdb4,0 6px 12px #0006}
.jg-ct-dado.b{background:#f6d77a;box-shadow:inset 0 -3px 0 #d0a93c,0 6px 12px #0006}
.jg-ct-dado i{width:6px;height:6px;border-radius:50%}
.jg-ct-dado i.on{background:#2a2320}
.jg-ct-par.rodando .jg-ct-dado{animation:ctRueda .5s linear infinite}
.jg-ct-par.rodando .jg-ct-dado.b{animation-duration:.43s;animation-direction:reverse}
@keyframes ctRueda{0%{transform:rotate(0)}25%{transform:rotate(90deg) translateY(-5px)}50%{transform:rotate(180deg)}75%{transform:rotate(270deg) translateY(-3px)}100%{transform:rotate(360deg)}}
.jg-ct-par.cae .jg-ct-dado{animation:ctDadoCae .85s cubic-bezier(.3,1.35,.5,1) both}
.jg-ct-par.cae .jg-ct-dado.b{animation-delay:.06s}
@keyframes ctDadoCae{0%{transform:translate(-50px,-40px) rotate(-400deg) scale(1.35);opacity:.3}70%{transform:translate(0,3px) rotate(10deg)}100%{transform:none;opacity:1}}
.jg-ct-dados b{font:800 22px 'IBM Plex Mono',ui-monospace,monospace;color:#fff;text-shadow:0 2px 8px #000a;animation:ctPop .5s cubic-bezier(.3,1.6,.5,1)}
.jg-ct-dados b.siete{color:#ff7a6b}
.jg-ct-dados small{font-size:12px;font-weight:600;color:#e6f2ff;text-shadow:0 1px 4px #000a}

/* Fichas de producción que suben de los hexágonos. */
.jg-ct-fx{position:absolute;inset:0;pointer-events:none;z-index:2}
.jg-ct-flota{position:absolute;display:flex;align-items:center;gap:2px;padding:2px 7px 2px 3px;border-radius:99px;background:#fffdf5;border:2px solid var(--c,#888);font:800 12px 'IBM Plex Mono',ui-monospace,monospace;color:#2c2418;box-shadow:0 6px 14px #0006;transform:translate(-50%,-50%);animation:ctSube 2s ease-out both;white-space:nowrap}
.jg-ct-flota .jg-ct-ico{width:19px;height:19px}
@keyframes ctSube{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}14%{opacity:1;transform:translate(-50%,-65%) scale(1.1)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-210%) scale(.95)}}

/* El cartel del centro: el siete, la carta que se juega, los logros. */
.jg-ct-banner{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.jg-ct-banner-t{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 26px;border-radius:18px;background:#1a1626e6;color:#fff;font:800 20px system-ui,sans-serif;box-shadow:0 18px 40px #0008;animation:ctBanner 1.9s cubic-bezier(.3,1.3,.5,1) both;text-align:center}
.jg-ct-banner-t small{font-size:12px;font-weight:600;color:#c9c2da}
.jg-ct-banner-t .jg-ct-ico.grande{width:46px;height:46px;filter:drop-shadow(0 3px 4px #0006)}
.jg-ct-banner-t.siete{font-size:44px;letter-spacing:-1px;background:#b0261ae8;padding:10px 34px}
.jg-ct-banner-t.turno{background:#d9822be8;font-size:22px}
.jg-ct-banner-t.logro{background:#2b5f2fe8}
@keyframes ctBanner{0%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(1.06)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.jg-ct-toasts{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;pointer-events:none;z-index:3;width:max-content;max-width:90%}
.jg-ct-toast{padding:7px 14px;border-radius:99px;background:#1a1626e0;color:#fff;font-size:12.5px;font-weight:600;box-shadow:0 8px 18px #0006;animation:ctToast 3.6s ease-out both}
@keyframes ctToast{0%{opacity:0;transform:translateY(10px)}10%,82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}

/* Los jugadores. */
.jg-ct-lado{display:grid;align-content:start;gap:8px;padding:12px;background:#08223bb8;border-left:1px solid #ffffff14}
.jg-ct-jug{--c:#888;position:relative;padding:10px 11px 9px 13px;border-radius:12px;background:#ffffff10;border:1px solid #ffffff1c;color:#e8eef5;transition:background .3s,box-shadow .3s,border-color .3s}
.jg-ct-jug::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.jg-ct-jug.on{background:#ffffff22;border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent),0 10px 22px #0006}
.jg-ct-jug.on::before{animation:ctLateBarra 1.3s ease-in-out infinite}
@keyframes ctLateBarra{0%,100%{opacity:.55}50%{opacity:1}}
.jg-ct-jug.fuera{opacity:.45}.jg-ct-jug.fuera b{text-decoration:line-through}
.jg-ct-cab{display:flex;align-items:center;gap:8px;min-width:0}
.jg-ct-cab b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-ct-cab b small{font-weight:500;color:#a9bbcd}
.jg-ct-av{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-weight:800;font-size:12px;color:#1d1a17;box-shadow:inset 0 -2px 0 #0003,0 0 0 2px var(--c);overflow:hidden}
.jg-ct-av img{width:100%;height:100%;object-fit:cover}
.jg-ct-vp{margin-left:auto;min-width:30px;height:30px;padding:0 6px;box-sizing:border-box;border-radius:9px;display:grid;place-items:center;font:800 18px 'IBM Plex Mono',ui-monospace,monospace;background:#0000003a;color:#ffe9a8}
.jg-ct-meta{height:4px;margin:7px 0 6px;border-radius:9px;background:#ffffff18;overflow:hidden}
.jg-ct-meta i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--c),#ffe066);transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.jg-ct-cifras{display:flex;flex-wrap:wrap;gap:4px 11px;font:700 11.5px 'IBM Plex Mono',ui-monospace,monospace;color:#c0cfdd}
.jg-ct-cifras span{display:inline-flex;align-items:center;gap:3px}
.jg-ct-ico{width:16px;height:16px;flex:none;vertical-align:middle}
.jg-ct-ico.col{color:var(--c)}
.jg-ct-insignias{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.jg-ct-ins{display:inline-flex;align-items:center;gap:3px;padding:2px 7px 2px 4px;border-radius:99px;background:#ffe06622;border:1px solid #ffe06655;color:#ffe9a8;font:700 11px 'IBM Plex Mono',ui-monospace,monospace;animation:ctPop .5s cubic-bezier(.3,1.6,.5,1)}
.jg-ct-ins .jg-ct-ico{width:18px;height:18px}
.jg-ct-estado{margin-top:6px;font-size:11px;font-weight:600;color:#ffd79a}
@keyframes ctPop{0%{transform:scale(.6)}60%{transform:scale(1.14)}100%{transform:none}}

/* Barra de arriba. */
.jg-ct-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.jg-ct-chip{padding:4px 10px;border-radius:99px;background:#f4efe6;color:#6a5334;font:600 11px system-ui,sans-serif;white-space:nowrap}
.jg-ct-chip.meta{background:#fff3d6;color:#8a5a0a}
.jg-ct-chip.mar{background:#dcefff;color:#1f5f94}

/* Mi mano. */
.jg-ct-mano{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;padding:14px 18px;background:#fff;border:1px solid #e4dfeb;border-top:none}
.jg-ct-mano[hidden]{display:none}
.jg-ct-mano-t{width:100%;font:700 10px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1.3px;text-transform:uppercase;color:#8a8494;margin-bottom:-4px}
.jg-ct-mano-t small{font-weight:500;letter-spacing:0;text-transform:none;margin-left:6px}
.jg-ct-cartas{display:flex;flex-wrap:wrap;gap:9px}
.jg-ct-carta{position:relative;width:62px;height:84px;box-sizing:border-box;border-radius:10px;display:grid;justify-items:center;align-content:center;gap:3px;background:linear-gradient(160deg,var(--a),var(--b));border:2px solid #fff;box-shadow:0 5px 12px #2a1e4426;color:#fff;transition:transform .15s}
.jg-ct-carta:hover{transform:translateY(-3px)}
.jg-ct-carta .jg-ct-ico{width:34px;height:34px;filter:drop-shadow(0 2px 2px #0004)}
.jg-ct-carta b{position:absolute;top:-9px;right:-9px;min-width:23px;height:23px;box-sizing:border-box;padding:0 5px;border-radius:99px;background:#1f2933;color:#fff;font:800 12px/19px 'IBM Plex Mono',ui-monospace,monospace;text-align:center;border:2px solid #fff}
.jg-ct-carta small{font:800 9px system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;text-shadow:0 1px 2px #0007}
.jg-ct-carta.cero{filter:grayscale(.85);opacity:.4}
.jg-ct-carta.pop{animation:ctCarta .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes ctCarta{0%{transform:translateY(12px) scale(.75)}55%{transform:translateY(-8px) scale(1.12)}100%{transform:none}}
.r-madera{--a:#56a45b;--b:#2b6b35}.r-arcilla{--a:#e5925e;--b:#ad4f27}.r-lana{--a:#b0df82;--b:#69a843}
.r-trigo{--a:#f6d874;--b:#d29d30}.r-mineral{--a:#b1b9c4;--b:#6c7582}.r-oro{--a:#f8dc68;--b:#c9951e}
.jg-ct-deses{display:flex;flex-wrap:wrap;gap:9px}
.jg-ct-des{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;background:linear-gradient(160deg,#fffaf0,#f4e8cc);border:1.5px solid #d9c49a;box-shadow:0 4px 10px #6b4a0a1a;max-width:250px}
.jg-ct-des>.jg-ct-ico{width:32px;height:32px}
.jg-ct-des div{display:grid;gap:1px;min-width:0}
.jg-ct-des b{font-size:12.5px;color:#3a2e22}
.jg-ct-des small{font-size:10.5px;color:#7a6a52;line-height:1.3}
.jg-ct-des.nueva{opacity:.7}
.jg-ct-des.sel{border-color:#d9822b;box-shadow:0 0 0 3px #d9822b44}
.jg-ct-jugar{flex:none;padding:6px 11px;border:0;border-radius:8px;background:#d9822b;color:#fff;font:700 12px system-ui,sans-serif;cursor:pointer;box-shadow:inset 0 -2px 0 #0003}
.jg-ct-jugar:hover{background:#c06f1d}
.jg-ct-oculto{font:600 10px 'IBM Plex Mono',ui-monospace,monospace;color:#9a8a6a}

/* El pie: construir, comerciar, tirar. */
.jg-ct .jg-pie{display:block}
.jg-ct-guia{font-size:13.5px;color:#3a3446;line-height:1.5;margin-bottom:8px}
.jg-ct-acciones{display:flex;flex-wrap:wrap;gap:8px}
.jg-ct-accion{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 9px;border-radius:12px;border:1px solid #e0dbe8;background:#fff;color:#2c2437;font:600 13px system-ui,sans-serif;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.jg-ct-accion>span{display:grid;gap:3px;text-align:left}
.jg-ct-accion small{font-size:10.5px;font-weight:600;color:#8a8494}
.jg-ct-accion:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 16px #2a1e441c;border-color:#d9822b}
.jg-ct-accion.on{border-color:#d9822b;background:#fff6e9;box-shadow:0 0 0 3px #d9822b40}
.jg-ct-accion:disabled{opacity:.4;cursor:default}
.jg-ct-accion .jg-ct-ico.pieza{width:26px;height:26px;filter:drop-shadow(0 2px 1px #0003)}
.jg-ct-accion .jg-ct-coste,.jg-ct-coste{display:inline-flex;flex-wrap:nowrap;gap:1px}
.jg-ct-coste .jg-ct-ico{width:14px;height:14px}
.jg-ct-tirar{display:inline-flex;align-items:center;gap:8px;padding:10px 20px 10px 12px;border:0;border-radius:14px;background:linear-gradient(135deg,#e8993a,#c9651c);color:#fff;font:800 15px system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 20px #c9651c55,inset 0 -3px 0 #0003;animation:ctInvita 1.6s ease-in-out infinite}
.jg-ct-tirar .jg-ct-dado{width:26px;height:26px;padding:4px;box-shadow:inset 0 -2px 0 #d8cdb4}
.jg-ct-tirar .jg-ct-dado i{width:5px;height:5px}
.jg-ct-tirar:hover:not(:disabled) .jg-ct-dado{animation:ctRueda .6s linear infinite}
.jg-ct-tirar:disabled{opacity:.5;animation:none;cursor:default}
@keyframes ctInvita{0%,100%{box-shadow:0 8px 20px #c9651c55,inset 0 -3px 0 #0003}50%{box-shadow:0 8px 30px #e8993a99,inset 0 -3px 0 #0003}}
.jg-ct-fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.jg-ct-fin{justify-content:flex-end;border-top:1px dashed #e4dfeb;padding-top:10px}
.jg-ct-link{border:0;background:none;padding:4px 2px;color:#7042df;font:600 12px system-ui,sans-serif;cursor:pointer;text-decoration:underline}
.jg-ct-tog,.jg-ct-res,.jg-ct-tab{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:10px;border:1px solid #e0dbe8;background:#fff;color:#2c2437;font:600 12.5px system-ui,sans-serif;cursor:pointer}
.jg-ct-res .jg-ct-ico{width:22px;height:22px}
.jg-ct-res small{font:700 11px 'IBM Plex Mono',ui-monospace,monospace;color:#8a8494}
.jg-ct-tog.sel,.jg-ct-res.sel,.jg-ct-tab.on{border-color:#d9822b;background:#fff6e9;box-shadow:0 0 0 2px #d9822b33}
.jg-ct-res:disabled{opacity:.35;cursor:default}
.jg-ct-comercio{margin-top:12px;padding:12px;border-radius:14px;background:#faf8fc;border:1px solid #ece7f3}
.jg-ct-tabs{display:flex;gap:6px;flex-wrap:wrap}
.jg-ct-trato-f{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.jg-ct-lbl{min-width:58px;font:700 10px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1px;text-transform:uppercase;color:#8a8494}
.jg-ct-contadores{display:flex;flex-wrap:wrap;gap:6px}
.jg-ct-contador{display:inline-flex;align-items:center;gap:3px;padding:3px 5px;border-radius:10px;background:#fff;border:1px solid #e6e1ee}
.jg-ct-contador.con{border-color:#d9822b;background:#fff6e9}
.jg-ct-contador.sin{opacity:.45}
.jg-ct-contador .jg-ct-ico{width:22px;height:22px}
.jg-ct-contador b{min-width:16px;text-align:center;font:800 13px 'IBM Plex Mono',ui-monospace,monospace;color:#2c2437}
.jg-ct-contador button{width:22px;height:22px;border:0;border-radius:6px;background:#f0ecf6;color:#2c2437;font:800 14px system-ui,sans-serif;cursor:pointer;padding:0}
.jg-ct-contador button:disabled{opacity:.3;cursor:default}
.jg-ct-trato{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid #e6e1ee;font-size:13px;color:#3a3446}
.jg-ct-trato>div:first-child{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.jg-ct-trato.entra{animation:ctEntra .45s cubic-bezier(.3,1.4,.5,1);border-color:#d9822b}
@keyframes ctEntra{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.jg-ct-cuenta{display:inline-flex;align-items:center;gap:1px;font:800 12px 'IBM Plex Mono',ui-monospace,monospace}
.jg-ct-cuenta .jg-ct-ico{width:20px;height:20px}
.jg-ct-flecha{color:#d9822b;font-weight:800}
.jg-ct-resp{font-size:12px;color:#8a8494}.jg-ct-resp.no{color:#b4232a}.jg-ct-resp.si{color:#2f7d3b;font-weight:600}
.jg-ct-props{display:grid;gap:0}
.jg-ct-panel{margin-top:12px;padding:12px;border-radius:14px;background:#fff8ec;border:1px solid #f0dcb8;font-size:13px;color:#3a3446}
.jg-ct-panel>b{display:block;margin-bottom:8px}
.jg-ct-victima{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;border:2px solid var(--c);background:#fff;color:#2c2437;font:700 13px system-ui,sans-serif;cursor:pointer}
.jg-ct-victima small{font-weight:500;color:#8a8494}
.jg-ct-victima:hover{background:color-mix(in srgb,var(--c) 15%,#fff)}

.jg-ct-hist{margin-top:12px;display:grid;gap:3px;padding:12px 16px;border-radius:12px;background:#faf8fc;border:1px solid #ece7f3;font-size:12px;color:#5a5566}
.jg-ct-hist:empty{display:none}
.jg-ct-hist-t{font:600 10px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1.2px;text-transform:uppercase;color:#8a8494;margin-bottom:2px}
.jg-ct-h{padding-left:8px;border-left:3px solid var(--c,#e4dcef)}
.jg-ct-hist-t+.jg-ct-h{color:#2c2437;font-weight:600}
.jg-ct-h.h-tirada{font-family:'IBM Plex Mono',ui-monospace,monospace}

@media(max-width:900px){
  .jg-ct-mesa{grid-template-columns:1fr}
  .jg-ct-lado{border-left:0;border-top:1px solid #ffffff14;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .jg-ct-svg,.jg-ct-isla.ancha .jg-ct-svg{max-height:none}
}
@media(max-width:600px){
  /* Un cruce tiene que caber bajo un dedo: la isla no baja de un ancho

/* ============================================================
   Modo oscuro

   Se enciende con `data-tema="oscuro"` en <html>: lo pone el guion
   del <head> antes de pintar (si no, la página sale blanca un
   instante) y el botón ☾/☀ de la cabecera. Sin elección guardada
   sigue al sistema (`prefers-color-scheme`); pulsar el botón la
   guarda en `localStorage` (`jg.tema`).

   Sólo se oscurece el armazón —página, tarjetas, salas, chat,
   carteles, tablas—. El arte se queda como está: las portadas ya son
   oscuras, la mesa de Flip 7 es un paño verde y las cartas son
   cartas, que en la vida real son blancas. Todo va en este bloque y
   con el prefijo `html[data-tema=oscuro]`, que gana por especificidad
   a la regla clara sin tocarla: el tema claro sigue siendo el de
   siempre, línea por línea.
   ============================================================ */
html[data-tema=oscuro]{
  color-scheme:dark;
  --jg-ink:#ebe7f5;--jg-muted:#9d96ad;
  --os-fondo:#0f0d15;--os-sup:#18151f;--os-sup2:#211d2b;--os-sup3:#2a2536;
  --os-borde:#2c2738;--os-borde2:#3a3449;--os-tx:#ebe7f5;--os-tx2:#bcb5cc;--os-tx3:#8f889f
}
html[data-tema=oscuro] body{background:var(--os-fondo);color:var(--os-tx)}

html[data-tema=oscuro] .head{background:#0b0a10;border-bottom-color:#ffffff10}
html[data-tema=oscuro] .lead,html[data-tema=oscuro] .row-meta,html[data-tema=oscuro] .vacio,html[data-tema=oscuro] .jg-nota{color:var(--os-tx3)}

/* Pestañas, botones, campos */
html[data-tema=oscuro] .tab{color:var(--os-tx3)}
html[data-tema=oscuro] .tab.on{background:var(--os-sup3);color:#fff}
html[data-tema=oscuro] .inp,html[data-tema=oscuro] .jg-campo input[type=text],html[data-tema=oscuro] .esc-herramientas select{background:var(--os-sup2);border-color:var(--os-borde2);color:var(--os-tx)}
html[data-tema=oscuro] .btn2,html[data-tema=oscuro] .jg-tab,html[data-tema=oscuro] .jg-f7-anula{background:var(--os-sup2);border-color:var(--os-borde2);color:var(--os-tx2)}
html[data-tema=oscuro] .btn2:hover{border-color:#a88bff;color:#c4b1ff}
html[data-tema=oscuro] .jg-tab.on{background:#0d94882b;color:#5eead4}
html[data-tema=oscuro] .jg-rk-cats{background:var(--os-sup);border-color:var(--os-borde)}
html[data-tema=oscuro] .jg-rk-seg{background:var(--os-sup2)}
html[data-tema=oscuro] .jg-rk-seg button{color:var(--os-tx2)}
html[data-tema=oscuro] .jg-rk-seg button:hover{background:#ffffff10}
html[data-tema=oscuro] .jg-rk-seg button.on{background:#ffffff1c;color:#fff}
html[data-tema=oscuro] .mini{color:#6f687f}
html[data-tema=oscuro] .mini:hover{background:var(--os-sup3);color:var(--os-tx2)}
html[data-tema=oscuro] .mini.del:hover,html[data-tema=oscuro] .jg-pierde,html[data-tema=oscuro] .jg-castigo,
html[data-tema=oscuro] .jg-modal-err,html[data-tema=oscuro] .jg-reloj.urge,html[data-tema=oscuro] #loginError{color:#ff8a7a}

/* Superficies: tarjetas, cajas y el marco de cada juego */
html[data-tema=oscuro] .card,html[data-tema=oscuro] .jg-lado-caja,html[data-tema=oscuro] .jg-invita,html[data-tema=oscuro] .jg-chat,html[data-tema=oscuro] .jg-tabla-caja,html[data-tema=oscuro] .jg-modal,html[data-tema=oscuro] .jg-barra,html[data-tema=oscuro] .jg-pie,html[data-tema=oscuro] .jg-f7-hist{background:var(--os-sup);border-color:var(--os-borde)}
html[data-tema=oscuro] .jg-tablero{background:radial-gradient(ellipse at 50% 0,#211d2b,var(--os-sup) 70%);border-color:var(--os-borde)}
html[data-tema=oscuro] .jg-mesa,html[data-tema=oscuro] .jg-lienzo{border-color:var(--os-borde)}

/* Vestíbulo */

/* Sala: tablero estable y conversación lateral, sin encogerlo en móvil. */
main.jg-ancho{max-width:1480px}
.jg-partida-layout{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:24px;align-items:start}
.jg-partida-juego{min-width:0}
.jg-partida-layout>.jg-chat{position:sticky;top:20px;margin:0;display:flex;flex-direction:column;height:min(650px,calc(100dvh - 84px))}

.jg-rkc-n{text-align:center;font-weight:700}
.jg-rkc-quien{display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer}
.jg-rkc-quien>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jg-rkc-barra{height:10px;border-radius:99px;background:#0000000f;overflow:hidden}
.jg-rkc-barra i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#7c5cff,#c084fc,#f5c542)}
.jg-rkc-cuenta{font-variant-numeric:tabular-nums;font-size:15px}
.jg-rkc-extra{grid-column:2/-1;margin-top:-4px;color:var(--jg-muted);font-size:11.5px}
.jg-rkc-raras li{grid-template-columns:34px 52px minmax(0,1fr) minmax(0,1fr)}
.jg-rkc-carta .jg-pdc{width:52px}
.jg-rkc-carta .jg-pdc figcaption{display:none}
.jg-rkc-info{display:grid;min-width:0}
.jg-rkc-info b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jg-rkc-info small{color:var(--jg-muted);font-size:12px}
@media (max-width:600px){.jg-rkc{padding:12px}.jg-rkc-lista li{grid-template-columns:28px minmax(0,1fr) auto}.jg-rkc-barra{grid-column:2/-1;grid-row:2}.jg-rkc-extra{grid-row:3}
  .jg-rkc-raras li{grid-template-columns:28px 46px minmax(0,1fr)}.jg-rkc-raras .jg-rkc-quien{grid-column:3}.jg-rkc-carta .jg-pdc{width:46px}}
html[data-tema=oscuro] .jg-rkc{background:var(--os-sup);border-color:var(--os-borde)}
html[data-tema=oscuro] .jg-rkc-lista li{background:#ffffff08}
html[data-tema=oscuro] .jg-rkc-barra{background:#ffffff14}
.jg-rk-sel{display:inline-flex;align-items:center;gap:7px;padding:7px 13px 7px 9px;border:1px solid #0000001a;border-radius:999px;background:#fff;color:var(--jg-ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,transform .15s}
.jg-rk-sel i{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--c) 18%,transparent);font-size:12px;line-height:1}
.jg-rk-sel:hover{background:color-mix(in srgb,var(--c) 10%,#fff);transform:translateY(-1px)}
.jg-rk-sel.on{background:var(--c);border-color:transparent;color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--c) 45%,transparent)}
.jg-rk-sel.on i{background:#ffffff33}
.jg-rk-sep{align-self:center;width:100%;margin:6px 0 -2px 4px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--jg-muted);white-space:nowrap}
.jg-lg-chip i{font-style:normal;font-size:13px;line-height:1}
.jg-lg-chip.lleno{box-shadow:inset 4px 0 0 var(--c),0 0 0 2px #e8b64a}
.jg-lg-chip.lleno small::after{content:" ★";color:#e8b64a}
/* El podio de la tarjeta destacada: quién manda en el juego más jugado. */
.jg-of-podio{display:block;margin:2px 0 4px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--c) 9%,#f7f6fb);border:1px solid color-mix(in srgb,var(--c) 25%,transparent);color:var(--jg-ink);text-decoration:none!important}
.jg-of-podio:hover{background:color-mix(in srgb,var(--c) 15%,#f7f6fb)}
.jg-of-podio-t{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--jg-muted);margin-bottom:6px}
.jg-of-podio-t b{letter-spacing:0;text-transform:none;color:var(--c);filter:brightness(.8)}
.jg-of-podio ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:3px}
.jg-of-podio li{display:flex;align-items:center;gap:8px;font-size:13px;padding:2px 4px;border-radius:7px}
.jg-of-podio li.yo{background:color-mix(in srgb,var(--c) 22%,transparent);font-weight:700}
.jg-of-podio li>i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:#b8b3c7;flex:0 0 auto}
.jg-of-podio li:nth-child(1)>i{background:linear-gradient(135deg,#f5d36b,#c9951c)}
.jg-of-podio li:nth-child(2)>i{background:linear-gradient(135deg,#dfe3ea,#98a1af)}
.jg-of-podio li:nth-child(3)>i{background:linear-gradient(135deg,#e9a877,#a8612d)}
.jg-of-podio li>span:not(.jg-av){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jg-of-podio li>b{font:600 12px 'IBM Plex Mono',monospace}
.jg-of-podio small{display:block;margin-top:6px;font-size:12px;color:var(--jg-muted)}
html[data-tema=oscuro] .jg-rk-sel{background:var(--os-sup);border-color:var(--os-borde);color:var(--os-tx)}
html[data-tema=oscuro] .jg-rk-sel:hover{background:color-mix(in srgb,var(--c) 14%,var(--os-sup))}
html[data-tema=oscuro] .jg-rk-sel.on{background:var(--c);color:#fff;border-color:transparent}
html[data-tema=oscuro] .jg-of-podio{background:color-mix(in srgb,var(--c) 12%,var(--os-sup2));border-color:color-mix(in srgb,var(--c) 30%,transparent);color:var(--os-tx)}
html[data-tema=oscuro] .jg-of-podio-t b{filter:brightness(1.3)}
@media(max-width:600px){
  /* La cabecera cabía en cuatro líneas: el nombre ya está en la foto. */
  #userName{display:none}
  .head{gap:8px;padding:10px 14px}
  .head-nav{flex-wrap:nowrap;white-space:nowrap;scrollbar-width:none;gap:18px}
  .head-nav::-webkit-scrollbar{display:none}
  .head-right{width:auto;margin-left:auto;flex-wrap:nowrap}
  /* Dos filas: logo y botones arriba; secciones (con su propio scroll) e
     idioma abajo. Con todo en la fila de arriba, a 360 px «Salir» quedaba
     fuera de la pantalla y la página entera se ensanchaba a 389 px. «Perfil»
     sobra aquí: la foto abre la misma tarjeta, con «Ver perfil». */
  .head-nav{order:3;flex:1 0 60%;width:auto;min-width:0}
  .head>.jg-idioma{order:4;margin-left:0}
  .head>.jg-idioma~.head-right{margin-left:auto}
  #btnPerfil{display:none}
  .logo b{display:none}
  .jg-rep-nom,.jg-rep-flecha{display:none}
  .head-right .btn-ghost{padding-left:7px;padding-right:7px}
  .jg-rk-sep{width:auto;margin:0 2px 0 8px}
  .jg-bar-juegos,.jg-lg-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:2px 16px 6px;scroll-snap-type:x proximity}
  .jg-bar-juegos::-webkit-scrollbar,.jg-lg-chips::-webkit-scrollbar{display:none}
  .jg-rk-sel,.jg-lg-chip{flex:0 0 auto;scroll-snap-align:center}
  .jg-lg-chip{white-space:nowrap}
  .jg-tabla{font-size:12px}
  .jg-tabla th,.jg-tabla td{padding-left:8px;padding-right:8px;white-space:nowrap}
  /* Nueve columnas no caben: los puntos, que son la última, quedaban detrás
     de un scroll lateral que nadie hace. Aquí van puesto, jugador y puntos;
     jugadas y ganadas bajan a una línea debajo del nombre (`jg-jug-sub`), lo
     demás (`jg-opc` en ranks.js) se esconde, y un nombre largo se corta con
     «…» en vez de empujar la tabla. */
  .jg-tabla .jg-opc{display:none}
  .jg-jug>span{display:block;max-width:calc(100vw - 200px);overflow:hidden;text-overflow:ellipsis}
  .jg-tabla .jg-jug-sub{display:block;font-weight:400;font-size:11px;color:var(--jg-muted)}
}
.jg-jug-sub{display:none}
/* Con el dedo, los botones de la cabecera y el ✕ de «Tus partidas» medían
   24 px de alto: se tocaba el de al lado. 36 es lo que cabe sin que la fila
   de 320 px deje de entrar en una línea. */
@media(pointer:coarse){
  .head-right .btn-ghost{min-height:36px;min-width:36px;display:inline-flex;align-items:center;justify-content:center}
  .head .i18n-sel{min-height:32px}
  .mini.del{min-width:34px;min-height:34px}
}
html[data-tema=oscuro] .jg-ym-eq.rojo.mio{color:#ff9a8c}
html[data-tema=oscuro] .jg-ym-eq.azul.mio{color:#8cc2ff}

/* ============================================================
   El perfil público (juegos/perfil-vista.js): la foto con su marco,
   la mini tarjeta que se abre al tocar una foto y la página
   #perfil/<uid>. Los marcos son CSS sobre `.jg-av`, que lee `--t` (el
   lado) y `--c` (el color de la persona): por eso el mismo marco vale
   para el chip de 20 px de la sala y el retrato de 116 de la página.
   Lo de fuera de la foto va en ::before (detrás) y ::after (encima).
   ============================================================ */
.jg-av{--t:40px;--c:#0d9488;position:relative;display:inline-grid;place-items:center;width:var(--t);height:var(--t);flex:0 0 auto;border-radius:50%;vertical-align:middle;isolation:isolate}
.jg-av>img,.jg-av>i{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:calc(var(--t)*.42);line-height:1;color:#fff;background:var(--c)}
.jg-av[data-perfil],[data-perfil]{cursor:pointer}
.jg-av::before,.jg-av::after{content:"";position:absolute;pointer-events:none;border-radius:50%}
.jg-av::before{z-index:0}.jg-av::after{z-index:2}
.jg-marco-nada::before,.jg-marco-nada::after{display:none}
.jg-marco-anillo>img,.jg-marco-anillo>i{box-shadow:0 0 0 calc(var(--t)*.035 + 1px) var(--c)}
.jg-marco-doble>img,.jg-marco-doble>i{box-shadow:0 0 0 calc(var(--t)*.03 + 1px) #fff,0 0 0 calc(var(--t)*.07 + 2px) var(--c),0 0 0 calc(var(--t)*.085 + 3px) #fff,0 0 0 calc(var(--t)*.11 + 3px) var(--c)}
.jg-marco-pixel>img,.jg-marco-pixel>i{border-radius:0;clip-path:polygon(0 14%,14% 14%,14% 0,86% 0,86% 14%,100% 14%,100% 86%,86% 86%,86% 100%,14% 100%,14% 86%,0 86%)}
.jg-marco-pixel::before{inset:calc(var(--t)*-.09);border-radius:0;background:repeating-linear-gradient(90deg,var(--c) 0 25%,color-mix(in srgb,var(--c),#000 30%) 25% 50%);clip-path:polygon(0 14%,14% 14%,14% 0,86% 0,86% 14%,100% 14%,100% 86%,86% 86%,86% 100%,14% 100%,14% 86%,0 86%)}
.jg-marco-neon>img,.jg-marco-neon>i{box-shadow:0 0 0 calc(var(--t)*.03 + 1px) #fff,0 0 0 calc(var(--t)*.06 + 2px) var(--c),0 0 calc(var(--t)*.3) calc(var(--t)*.04) var(--c);animation:jgNeon 1.8s ease-in-out infinite}
.jg-marco-arcoiris::before{inset:calc(var(--t)*-.09 - 1px);background:conic-gradient(#ff4d6d,#ffb84d,#ffe94d,#4dff88,#4dc3ff,#9b6bff,#ff4d6d);animation:jgGira 4s linear infinite}
.jg-marco-arcoiris>img,.jg-marco-arcoiris>i{box-shadow:0 0 0 calc(var(--t)*.025 + 1px) #fff}
.jg-marco-corazones::before{inset:calc(var(--t)*-.08 - 1px);background:repeating-conic-gradient(#ff4d8d 0 15deg,#ffb3d1 15deg 30deg)}
.jg-marco-corazones>img,.jg-marco-corazones>i{box-shadow:0 0 0 calc(var(--t)*.025 + 1px) #fff}
.jg-marco-corazones::after{content:"♥";border-radius:0;right:calc(var(--t)*-.1);bottom:calc(var(--t)*-.12);font:700 calc(var(--t)*.36 + 4px)/1 sans-serif;color:#ff2d72;text-shadow:0 0 0 #fff,1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff;animation:jgLatido 1.2s ease-in-out infinite}
.jg-marco-fuego::before{inset:calc(var(--t)*-.13 - 1px);background:conic-gradient(#ff3d00,#ffb300,#ff6d00,#ffd600,#ff1f00,#ffb300,#ff3d00);filter:blur(calc(var(--t)*.025));animation:jgGira 2.2s linear infinite}
.jg-marco-fuego>img,.jg-marco-fuego>i{box-shadow:0 0 0 calc(var(--t)*.025 + 1px) #ffe0a3,0 0 calc(var(--t)*.35) #ff6d0099}
.jg-marco-escarcha::before{inset:calc(var(--t)*-.09 - 1px);background:conic-gradient(#e0f7ff,#7dd3fc,#ffffff,#38bdf8,#bae6fd,#e0f7ff)}
.jg-marco-escarcha>img,.jg-marco-escarcha>i{box-shadow:0 0 0 calc(var(--t)*.02 + 1px) #fff,0 0 calc(var(--t)*.25) #7dd3fc}
.jg-marco-escarcha::after{inset:calc(var(--t)*-.16);background:radial-gradient(circle at 12% 22%,#fff 0 2px,transparent 3px),radial-gradient(circle at 88% 18%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 78% 92%,#fff 0 2px,transparent 3px),radial-gradient(circle at 6% 70%,#e0f7ff 0 1.5px,transparent 2.5px);animation:jgTitila 2.4s ease-in-out infinite}
.jg-marco-galaxia::before{inset:calc(var(--t)*-.1 - 1px);background:radial-gradient(circle at 30% 20%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 75% 70%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 20% 80%,#fff 0 1px,transparent 1.5px),conic-gradient(#1c0b45,#7b2ff7,#22d3ee,#1c0b45,#c026d3,#1c0b45);animation:jgGira 7s linear infinite}
.jg-marco-galaxia>img,.jg-marco-galaxia>i{box-shadow:0 0 0 calc(var(--t)*.02 + 1px) #0b0320,0 0 calc(var(--t)*.3) #7b2ff799}
.jg-marco-laurel>img,.jg-marco-laurel>i{box-shadow:0 0 0 calc(var(--t)*.03 + 1px) #f4c542,0 0 0 calc(var(--t)*.045 + 2px) #a86f10}

/* Los marcos animados (juegos/marcos-animados.js): un SVG de 140×140
   encima de la foto, con su propio aro, así que ::before/::after callan.
   `--d` (en el atributo style de cada pieza) es la duración. Ninguna
   pieza animada lleva atributo transform: la animación lo reemplazaría. */
.jg-marco-anim::before,.jg-marco-anim::after{display:none}
.jg-av>.jg-av-ad{position:absolute!important;inset:-20%!important;width:auto!important;height:auto!important;margin:0!important;padding:0!important;background:none!important;border:0!important;box-shadow:none!important;flex:none!important;overflow:visible!important;z-index:2;pointer-events:none;display:block}
.jg-av-ad svg{width:100%;height:100%;display:block;overflow:visible}
/* La foto con marco dentro de las mesas (`ctx.avatar`): el hueco redondo de
   cada juego deja de recortar y de pintar su propio fondo y anillo, y el
   marco del perfil ocupa su lugar. */
.jg-con-marco{overflow:visible!important;background:none!important;box-shadow:none!important;border-radius:0!important}
.jg-con-marco>.jg-av{font-size:inherit}
/* Solo lo que tiene clase: un `<g transform>` de posición con
   transform-origin:center giraría alrededor de su caja y se iría de sitio. */
.jg-av-ad [class]{transform-box:fill-box;transform-origin:center;animation-duration:var(--d,2s);animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.jg-av-ad .g,.jg-av-ad .gr{transform-box:view-box;transform-origin:50% 50%;animation-name:jaGira;animation-timing-function:linear}
.jg-av-ad .gr{animation-direction:reverse}
.jg-av-ad .g.paso{animation-timing-function:steps(28,end)}
.jg-av-ad .l{animation-name:jaPulso}

.jg-av-ad .t{animation-name:jaTitila}
.jg-av-ad .b{animation-name:jaVaiven}
.jg-av-ad .p{animation-name:jaAparece}
.jg-av-ad .s{animation-name:jaGira;animation-timing-function:linear}
.jg-av-ad .v{animation-name:jaVoltea}
.jg-av-ad .rv{animation-name:jaReversi;animation-timing-function:linear}
.jg-av-ad .su{animation-name:jaSube;animation-timing-function:ease-out}
.jg-av-ad .dr{animation-name:jaCae;animation-timing-function:ease-in}
.jg-av-ad .z{animation-name:jaTiembla;animation-timing-function:steps(1,end)}
.jg-av-ad .hop{animation-name:jaSalta}
.jg-av-ad .ft{animation-name:jaPisada}
.jg-av-ad .hx{animation-name:jaDestello}
.jg-av-ad .wg{animation-name:jaAletea}
.jg-av-ad .pp{animation-name:jaParpadea}
.jg-av-ad .fl{animation-name:jaFluye;animation-timing-function:linear}
.jg-av-ad .fl.fr{animation-direction:reverse}
.jg-av-ad .dw{animation-name:jaDibuja}
.jg-av-ad .ex{animation-name:jaOnda;animation-timing-function:ease-out}

/* Los fondos animados de la tienda: una capa `.jg-fanim` (con tres <b>
   para lo que haga falta) encima del fondo, debajo de todo lo demás. Las
   medidas van en `em` y la letra sale de la altura del contenedor, así
   el mismo fondo vale para la muestra de 52 px y la portada de 210. */
.jg-mini-fondo,.jg-ped-muestra{position:relative;overflow:hidden}
.jg-pf-hero::before{z-index:1}
.jg-pf-hero-in{z-index:2}

.jg-fanim>b{position:absolute;display:none;font-size:clamp(3px,9cqh,20px)}
.jg-fanim::before,.jg-fanim::after{content:"";position:absolute;pointer-events:none}
/* Lluvia de estrellas: dos capas que derivan y titilan, y estrellas fugaces. */
.jg-fanim-estrellas::before{inset:-50%;background:radial-gradient(1.4px 1.4px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(1.6px 1.6px at 55% 35%,#fff,transparent),radial-gradient(1px 1px at 75% 80%,#cfe0ff,transparent),radial-gradient(1.2px 1.2px at 90% 15%,#fff,transparent) 0 0/90px 90px;animation:jfDeriva 40s linear infinite}
.jg-fanim-estrellas::after{inset:-50%;background:radial-gradient(2px 2px at 20% 40%,#fff,transparent),radial-gradient(1.6px 1.6px at 65% 75%,#ffe9a8,transparent),radial-gradient(1.8px 1.8px at 85% 30%,#d6c8ff,transparent) 0 0/150px 150px;animation:jfDeriva 70s linear infinite reverse,jfTitila 3s ease-in-out infinite}
.jg-fanim-estrellas>b{display:block;width:7em;height:.12em;border-radius:1em;background:linear-gradient(90deg,transparent,#fff);top:10%;left:70%;transform:rotate(-28deg);opacity:0;animation:jfFugaz 5s ease-in infinite}
.jg-fanim-estrellas>b:nth-child(2){top:-5%;left:40%;animation-delay:1.9s;animation-duration:6.5s}
.jg-fanim-estrellas>b:nth-child(3){top:30%;left:95%;animation-delay:3.7s;animation-duration:7.5s}

.jg-fanim-fuegos>b:nth-child(2){left:58%;top:26%;box-shadow:2.6em 0.0em 0 0.06em #7cf3ff,2.34em 1.13em 0 0.06em #a78bfa,1.62em 2.03em 0 0.06em #7cf3ff,0.58em 2.53em 0 0.06em #a78bfa,-0.58em 2.53em 0 0.06em #7cf3ff,-1.62em 2.03em 0 0.06em #a78bfa,-2.34em 1.13em 0 0.06em #7cf3ff,-2.6em 0.0em 0 0.06em #a78bfa,-2.34em -1.13em 0 0.06em #7cf3ff,-1.62em -2.03em 0 0.06em #a78bfa,-0.58em -2.53em 0 0.06em #7cf3ff,0.58em -2.53em 0 0.06em #a78bfa,1.62em -2.03em 0 0.06em #7cf3ff,2.34em -1.13em 0 0.06em #a78bfa,1.5em 0.0em 0 0em #e0fbff,1.15em 0.96em 0 0em #e0fbff,0.26em 1.48em 0 0em #e0fbff,-0.75em 1.3em 0 0em #e0fbff,-1.41em 0.51em 0 0em #e0fbff,-1.41em -0.51em 0 0em #e0fbff,-0.75em -1.3em 0 0em #e0fbff,0.26em -1.48em 0 0em #e0fbff,1.15em -0.96em 0 0em #e0fbff;animation-delay:1.1s;animation-duration:3.9s}
.jg-fanim-fuegos>b:nth-child(3){left:84%;top:46%;box-shadow:2.6em 0.0em 0 0.06em #86efac,2.34em 1.13em 0 0.06em #f472b6,1.62em 2.03em 0 0.06em #86efac,0.58em 2.53em 0 0.06em #f472b6,-0.58em 2.53em 0 0.06em #86efac,-1.62em 2.03em 0 0.06em #f472b6,-2.34em 1.13em 0 0.06em #86efac,-2.6em 0.0em 0 0.06em #f472b6,-2.34em -1.13em 0 0.06em #86efac,-1.62em -2.03em 0 0.06em #f472b6,-0.58em -2.53em 0 0.06em #86efac,0.58em -2.53em 0 0.06em #f472b6,1.62em -2.03em 0 0.06em #86efac,2.34em -1.13em 0 0.06em #f472b6,1.5em 0.0em 0 0em #fdf2f8,1.15em 0.96em 0 0em #fdf2f8,0.26em 1.48em 0 0em #fdf2f8,-0.75em 1.3em 0 0em #fdf2f8,-1.41em 0.51em 0 0em #fdf2f8,-1.41em -0.51em 0 0em #fdf2f8,-0.75em -1.3em 0 0em #fdf2f8,0.26em -1.48em 0 0em #fdf2f8,1.15em -0.96em 0 0em #fdf2f8;animation-delay:2.2s;animation-duration:3.1s}
@keyframes jfFuego{0%{transform:scale(.1);opacity:0}6%{opacity:1}45%{transform:scale(1);opacity:1}100%{transform:scale(1.15) translateY(1.4em);opacity:0}}
/* Holográfico: el arcoíris corre por debajo y un brillo cruza en diagonal. */
.jg-fanim-holo::before{inset:0;background:linear-gradient(115deg,#ff9ee6,#fff59e,#9ef0ff,#a8ffbf,#d3a8ff,#ff9ee6);background-size:300% 300%;opacity:.75;mix-blend-mode:multiply;animation:jfHolo 7s linear infinite}
.jg-fanim-holo::after{top:-50%;bottom:-50%;width:30%;left:-40%;background:linear-gradient(90deg,transparent,#ffffffcc,transparent);transform:rotate(18deg);animation:jfBrillo 3.8s ease-in-out infinite}
.jg-fanim-holo>b{display:block;inset:0;position:absolute;background:repeating-linear-gradient(115deg,#ffffff00 0 6px,#ffffff2e 6px 7px);animation:jfHolo 12s linear infinite reverse;background-size:300% 300%}
@keyframes jfHolo{to{background-position:300% 0}}
@keyframes jfBrillo{0%,20%{left:-40%}70%,100%{left:120%}}
@media(prefers-reduced-motion:reduce){.jg-av-ad [class],.jg-fanim,.jg-fanim *,.jg-fanim::before,.jg-fanim::after{animation:none!important}}
@keyframes jgMini{from{opacity:0;transform:translateY(6px) scale(.98)}}
@keyframes jgHoja{from{transform:translateY(110%)}}

/* La mini tarjeta */
.jg-mini:focus{outline:none}
.jg-mini{position:fixed;z-index:75;width:304px;max-width:calc(100vw - 16px);background:#fff;color:var(--jg-ink,#232137);border-radius:18px;box-shadow:0 22px 60px #1b123059,0 0 0 1px #1b12301a;overflow:hidden;animation:jgMini .18s ease-out;text-align:left}
.jg-mini.hoja{left:8px!important;right:8px;top:auto!important;bottom:8px;width:auto;max-width:none;animation:jgHoja .24s ease-out}
.jg-mini-quieta{position:relative;width:100%;max-width:none;animation:none;box-shadow:0 10px 30px #1b123026,0 0 0 1px #1b12301a}
.jg-mini-x{position:absolute;top:8px;right:8px;z-index:3;width:28px;height:28px;border-radius:50%;border:0;background:#0007;color:#fff;font-size:13px;cursor:pointer}
.jg-mini-fondo{height:84px}
.jg-mini-cab{position:relative;display:flex;gap:12px;align-items:flex-end;padding:0 16px;margin-top:-40px}
.jg-mini-cab .jg-av>img,.jg-mini-cab .jg-av>i{outline:3px solid #fff}
.jg-mini-id{min-width:0;padding-bottom:6px;display:flex;align-items:center;gap:6px}
.jg-mini-id b{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-mini-id small{font:600 10px inherit;color:#fff;background:var(--jg-purple,#7042df);border-radius:99px;padding:2px 7px}
.jg-mini-bio{margin:8px 16px 0;font-size:12.5px;line-height:1.45;color:#4b4760;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.jg-mini-bio.jg-nada{color:#9b97ab;font-style:italic}
.jg-nada{font-size:12.5px;color:#9b97ab;font-style:italic;line-height:1.5}
.jg-mini-vit>.jg-nada,.jg-pf-sec>.jg-nada{margin:0}
.jg-pf-sec>header .btn2,.jg-ped-nota .btn2{height:28px;padding:0 10px;font-size:12px}
.jg-mini-num{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 16px 10px}
.jg-mini-num span{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px;border-radius:12px;background:#f5f3fa;font-size:10.5px;color:#7a7590}
.jg-mini-num b{font-size:17px;color:var(--jg-ink,#232137)}
.jg-mini-vit{display:grid;gap:6px;padding:0 16px}

.jg-mini-btns{display:flex;gap:8px;padding:12px 16px 16px}
.jg-mini-btns .btn,.jg-mini-btns .btn2{flex:1;height:36px}
.jg-mini-quieta .jg-mini-vit{padding-bottom:16px}

/* Las piezas de la vitrina */
.jg-vit{display:flex;gap:10px;align-items:center;min-width:0;padding:7px 10px;border-radius:12px;background:#f6f4fb;border:1px solid #ece8f3;border-left:3px solid #c9b8f5}
.jg-vit.t-r,.jg-vit.t-s{border-left-color:#f4c542}
.jg-vit-i{flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#fff;font-size:18px;line-height:1}
.jg-vit-tx{display:flex;flex-direction:column;min-width:0}
.jg-vit-tx b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-vit-tx small{font-size:11px;color:#7a7590;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-vit-tx em{font-style:normal;font-size:11px;color:#a29db5;margin-top:2px}
.jg-vit.grande{padding:14px;border-radius:16px;gap:14px}
.jg-vit.grande .jg-vit-i{width:52px;height:52px;border-radius:14px;font-size:28px;box-shadow:0 2px 8px #1b12301a}
.jg-vit.grande .jg-vit-tx b{font-size:15px}

/* La página */
.jg-pf{max-width:940px;margin:0 auto;padding-bottom:30px}
.jg-pf-barra{display:flex;gap:8px;align-items:center;margin:4px 0 14px}
.jg-pf-barra .grow{flex:1}
.jg-pf-hero{position:relative;min-height:210px;border-radius:22px;overflow:hidden;display:flex;align-items:flex-end;padding:26px 28px;box-shadow:0 10px 30px #1b123026}
.jg-pf-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#0000004d);pointer-events:none}
.jg-pf-hero:not(.oscuro)::before{background:linear-gradient(180deg,transparent 35%,#ffffff8c)}
.jg-pf-hero-in{position:relative;display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.jg-pf-hero-in>.jg-av>img,.jg-pf-hero-in>.jg-av>i{outline:4px solid #fff}
.jg-pf-id{min-width:0;padding-bottom:4px}
.jg-pf-id h1{margin:0;font-size:32px;line-height:1.1;letter-spacing:-.5px;color:#231a33;overflow-wrap:anywhere}
.jg-pf-id p{margin:8px 0 0;max-width:560px;font-size:14px;line-height:1.5;color:#3b3450}
.jg-pf-hero.oscuro .jg-pf-id h1{color:#fff;text-shadow:0 2px 14px #0008}
.jg-pf-hero.oscuro .jg-pf-id p{color:#ffffffe0;text-shadow:0 1px 8px #0008}
.jg-pf-id p.jg-nada{font-style:italic;opacity:.75;color:inherit}
.jg-pf-num{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.jg-pf-num>div{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid #e4dfeb;box-shadow:inset 0 3px 0 var(--c)}
.jg-pf-num b{font-size:24px;line-height:1.1}.jg-pf-num b small{font-size:13px;color:#9b97ab;font-weight:600}
.jg-pf-num span{font-size:11.5px;color:#7a7590}
.jg-pf-carga{margin-top:16px;text-align:center}
.jg-pf-sec{margin-top:14px;padding:18px 20px;border-radius:18px;background:#fff;border:1px solid #e4dfeb}
.jg-pf-sec>header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.jg-pf-sec>header h2{margin:0;font-size:16px;flex:1}
.jg-pf-sec>header small{font-size:12px;color:#7a7590}
.jg-pf-vit{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.jg-pf-tablas{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.jg-pf-tablas li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:#f8f7fb;border:1px solid #eeeaf4}
.jg-pf-tablas li.p1{background:linear-gradient(90deg,#fff6d0,#fffdf3);border-color:#f2d77a}
.jg-pf-tablas li.p2{background:linear-gradient(90deg,#eef1f5,#fafbfc);border-color:#d5dbe3}
.jg-pf-tablas li.p3{background:linear-gradient(90deg,#fbeadf,#fffaf6);border-color:#ebc6a8}
.jg-pf-puesto{flex:0 0 auto;min-width:30px;text-align:center;font-weight:700;font-size:15px;color:#7a7590}
.jg-pf-tablas li.top .jg-pf-puesto{font-size:20px}
.jg-pf-tn{flex:1;min-width:0;display:flex;flex-direction:column}
.jg-pf-tn b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.jg-pf-tn small{font-size:11px;color:#7a7590}
.jg-pf-tv{font:600 12px 'IBM Plex Mono',monospace;color:#4b4760;white-space:nowrap}
.jg-pf-logros{display:grid;gap:14px}
.jg-pf-lj>header{display:flex;gap:8px;align-items:baseline;margin-bottom:7px}.jg-pf-lj>header b{font-size:13px}.jg-pf-lj>header small{font-size:11px;color:#9b97ab}
.jg-pf-lchips{display:flex;flex-wrap:wrap;gap:6px}
.jg-pf-lchip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 6px;border-radius:99px;background:#f5f3fa;border:1px solid #ebe6f3;font-size:12px;font-weight:600}
.jg-pf-lchip i{font-style:normal;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:#fff;font-size:13px}
.jg-pf-lchip.raro{background:linear-gradient(90deg,#fff6d0,#fff);border-color:#f2d77a}
@media(max-width:760px){
  .jg-pf-hero{min-height:0;padding:70px 18px 18px}
  .jg-pf-hero-in{gap:14px}
  .jg-pf-id h1{font-size:24px}
  .jg-pf-num{grid-template-columns:repeat(3,1fr)}
  .jg-pf-num>div{padding:10px 12px}.jg-pf-num b{font-size:19px}
  .jg-pf-sec{padding:14px}
  .jg-pf-barra .btn2[data-copiar]{display:none}
}

/* El editor del perfil */
.jg-modal.jg-perfil-ed{width:880px}
.jg-ped{display:grid;grid-template-columns:304px 1fr;gap:20px;margin-top:14px;align-items:start}
.jg-ped-prev{position:sticky;top:0}
.jg-ped-prev>small{display:block;margin-bottom:6px;font:600 10.5px inherit;letter-spacing:.6px;text-transform:uppercase;color:#9b97ab}
.jg-ped-tabs{display:flex;gap:4px;background:#ebe7f3;border-radius:100px;padding:4px;margin-bottom:14px}
.jg-ped-tabs button{flex:1;border:0;background:transparent;border-radius:100px;padding:7px 10px;font:600 12.5px inherit;color:#6b6679;cursor:pointer}
.jg-ped-tabs button[aria-selected=true]{background:#fff;color:var(--jg-ink,#232137);box-shadow:0 1px 4px #2a1e4418}
.jg-ped-panel[hidden]{display:none}
.jg-campo textarea{width:100%;box-sizing:border-box;resize:vertical;min-height:54px;padding:8px 10px;border:1px solid #e2e8ec;border-radius:9px;font:13px/1.4 inherit;color:inherit;background:#fff}
.jg-campo>span small{font-weight:400;color:#9b97ab;margin-left:6px}
.jg-ped-rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.jg-ped-op{display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px 8px 10px;border-radius:14px;border:2px solid #ece8f3;background:#fff;cursor:pointer;font:inherit;color:inherit;text-align:center}
.jg-ped-op:hover{border-color:#cdbff1}
.jg-ped-op.on{border-color:var(--jg-purple,#7042df);box-shadow:0 0 0 3px #7042df22}
.jg-ped-op b{font-size:12px}
.jg-ped-op small{font-size:10.5px;color:#8f8aa3;line-height:1.3}
.jg-ped-op.cerrado{cursor:not-allowed;background:#faf9fc}
.jg-ped-op.cerrado .jg-av,.jg-ped-op.cerrado .jg-ped-muestra{filter:grayscale(.7);opacity:.6}
.jg-ped-op.fondo{padding-top:10px}
.jg-ped-grupo{grid-column:1/-1;margin:10px 0 0;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#7a7490}
.jg-ped-grupo:first-child{margin-top:0}
.jg-ped-op.venta{cursor:pointer;background:linear-gradient(180deg,#fffaf0,#fff);border-color:#f3dfae}
.jg-ped-op.venta:hover{border-color:#e8b949;box-shadow:0 0 0 3px #f4c54233}
.jg-ped-op.venta .jg-av,.jg-ped-op.venta .jg-ped-muestra{filter:none;opacity:1}
.jg-ped-op .jg-ped-precio{color:#a86f10;font-weight:700}
.jg-ped-op .jg-ped-tuyo{color:#16a34a;font-weight:700}
html[data-tema=oscuro] .jg-ped-grupo{color:var(--os-tx2,#a8a3bb)}
html[data-tema=oscuro] .jg-ped-op.venta{background:linear-gradient(180deg,#2a2412,var(--os-sup2));border-color:#5c4a1c}
html[data-tema=oscuro] .jg-ped-op .jg-ped-precio{color:#f4c542}
.jg-ped-muestra{display:block;width:100%;height:52px;border-radius:10px;box-shadow:inset 0 0 0 1px #0000001a}
.jg-ped-nota{margin:0 0 10px;font-size:12.5px;color:#6b6679;line-height:1.5}

.jg-ped-vit{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;max-height:340px;overflow:auto;padding:2px}
.jg-ped-vop{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid #ece8f3;background:#fff;cursor:pointer}
.jg-ped-vop input{margin:0}
.jg-ped-vop>span:last-of-type{display:flex;flex-direction:column;min-width:0}
.jg-ped-vop b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-ped-vop small{font-size:11px;color:#7a7590;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-ped-vop.on{border-color:var(--jg-purple,#7042df);background:#f6f2ff}
.jg-ped-vop em{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--jg-purple,#7042df);color:#fff;font:700 11px/1 inherit;font-style:normal}
.jg-ped-vop .jg-vit-i{background:#f5f3fa}
@media(max-width:760px){
  .jg-ped{grid-template-columns:1fr}
  .jg-ped-prev{position:static}
  .jg-ped-vit{max-height:none}
}
@media(prefers-reduced-motion:reduce){
  .jg-av::before,.jg-av::after,.jg-av>img,.jg-av>i,.jg-mini{animation:none!important}
}
/* Y su gemelo oscuro: solo el cromo; los marcos y fondos son arte. */

html[data-tema=oscuro] .jg-pf-tablas li{background:var(--os-sup2);border-color:var(--os-borde)}
html[data-tema=oscuro] .jg-pf-tablas li.p1{background:linear-gradient(90deg,#3a3010,var(--os-sup2));border-color:#6b5a1c}
html[data-tema=oscuro] .jg-pf-tablas li.p2{background:linear-gradient(90deg,#2c3038,var(--os-sup2));border-color:#4a505c}
html[data-tema=oscuro] .jg-pf-tablas li.p3{background:linear-gradient(90deg,#3a2618,var(--os-sup2));border-color:#6b4a30}
html[data-tema=oscuro] .jg-pf-tv{color:var(--os-tx2)}
html[data-tema=oscuro] .jg-pf-lchip{background:var(--os-sup2);border-color:var(--os-borde);color:var(--os-tx)}
