.jg-un-placa{position:relative;display:flex;align-items:center;gap:7px;width:100%;box-sizing:border-box;padding:5px 8px 5px 5px;border-radius:100px;background:linear-gradient(180deg,#2d2242,#1c1428);border:1px solid #ffffff1c;box-shadow:0 6px 16px #0009;transition:box-shadow .35s,border-color .35s}
.jg-un-asiento.yo .jg-un-placa{background:linear-gradient(180deg,#3b2d55,#241a34)}
.jg-un-asiento.turno .jg-un-placa{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 0 24px color-mix(in srgb,var(--c) 55%,transparent),0 6px 16px #0009;animation:jgUnTurno 1.6s ease-in-out infinite}
@keyframes jgUnTurno{50%{box-shadow:0 0 0 3px var(--c),0 0 40px color-mix(in srgb,var(--c) 80%,transparent),0 6px 16px #0009}}
.jg-un-asiento.gana .jg-un-placa{border-color:#f2c14e;background:linear-gradient(180deg,#4a3a14,#2b2110);box-shadow:0 0 0 2px #f2c14e,0 0 34px #f2c14e88}
.jg-un-ava{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:var(--c);color:#fff;font-weight:700;font-size:12px;overflow:hidden;box-shadow:0 0 0 2px #1c1428,0 0 0 3.5px var(--c)}.jg-un-ava img{width:100%;height:100%;object-fit:cover}
.jg-un-nom{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;color:#efe8f7}
.jg-un-n{font:700 12px 'IBM Plex Mono',monospace;color:#1a1422;background:#efe8f7;border-radius:100px;min-width:22px;padding:2px 6px;box-sizing:border-box;text-align:center}
.jg-un-asiento.uno .jg-un-n{background:#d72600;color:#fff}
.jg-un-piensa{position:absolute;left:50%;top:-11px;transform:translateX(-50%);display:flex;gap:3px;padding:4px 7px;border-radius:100px;background:var(--c);box-shadow:0 2px 8px #0007}
.jg-un-piensa i{width:4px;height:4px;border-radius:50%;background:#fff;animation:jgUnPiensa 1s ease-in-out infinite}
.jg-un-piensa i:nth-child(2){animation-delay:.15s}.jg-un-piensa i:nth-child(3){animation-delay:.3s}
@keyframes jgUnPiensa{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-3px);opacity:1}}
.jg-un-abanico{position:relative;width:100%;height:40px}
.jg-un-abanico i{position:absolute;left:calc(50% - 12px);bottom:0;width:24px;height:36px;box-sizing:border-box;border-radius:4px;border:1.5px solid #fff;background:radial-gradient(ellipse at center,#e03a1c,#1b1b1f 75%);box-shadow:0 1px 4px #0007;transform-origin:50% 130%;transform:rotate(calc((var(--k) - (var(--n) - 1) / 2) * 9deg));transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.jg-un-marcas{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.jg-un-marca{font:600 10px 'IBM Plex Mono',monospace;padding:2px 7px;border-radius:100px;background:#ffffff1a;color:#d9cfe6}
.jg-un-marca.sig{background:#16304f;color:#9cc8ff}
.jg-un-marca.uno{background:#d72600;color:#fff;animation:jgUnLatido 1s ease-in-out 3}
.jg-un-marca.olvido{background:#3d3010;color:#ffd36b}
.jg-un-marca.elim{background:#3d1418;color:#ff9da6}
.jg-un-marca.moneda{background:#ffffff14;font-size:12px}.jg-un-marca.moneda.usada{opacity:.35;filter:grayscale(1)}
.jg-un-pilla{font:700 11px 'IBM Plex Mono',monospace;padding:3px 9px;border-radius:100px;border:0;background:#d72600;color:#fff;cursor:pointer;box-shadow:0 0 14px #ff3b1f88;animation:jgUnLatido .8s ease-in-out infinite}.jg-un-pilla:disabled{opacity:.5;animation:none;cursor:default}
.jg-un-tapa{display:flex;align-items:center;justify-content:center;gap:4px}.jg-un-tapa b{font-size:16px}.jg-un-tapa b.ok{color:#5fd38a}.jg-un-tapa b.no{color:#ff7a6b}
@keyframes jgUnLatido{50%{transform:scale(1.2)}}

/* La mano, en abanico. El botón se queda quieto (su sitio en el abanico)
   y lo que sube al pasar el ratón es la carta de dentro: si subiera el
   botón, el puntero se quedaría debajo y la carta temblaría. */
.jg-un-mano{position:relative;z-index:2;padding:0 16px 4px;margin-top:-18px}
.jg-un-mano.vacia{display:none}
.jg-un-mano-t{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:#efe8f7}
.jg-un-mano-t span{font:600 11px 'IBM Plex Mono',monospace;color:#a89cbc}
.jg-un-uno{font:800 12px 'IBM Plex Mono',monospace;padding:6px 14px;border-radius:100px;border:2px solid #ff7a5c;background:transparent;color:#ff7a5c;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s}.jg-un-uno.on{background:#d72600;border-color:#d72600;color:#fff;box-shadow:0 0 18px #ff3b1f88}
.jg-un-cartas{display:flex;justify-content:safe center;align-items:flex-start;padding:34px 0 22px;min-height:92px}
.jg-un-cartas .jg-un-hueco{position:relative;flex-shrink:0;padding:0;border:0;background:none;border-radius:10px;cursor:pointer;transform-origin:50% 100%;transform:translateY(var(--y,0px)) rotate(var(--r,0deg));transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.jg-un-cartas .jg-un-hueco:disabled{cursor:default}
.jg-un-cartas .jg-un-hueco.ok{transform:translateY(calc(var(--y,0px) - 10px)) rotate(var(--r,0deg))}
.jg-un-cartas .jg-un-hueco .jg-un-c{transition:transform .22s cubic-bezier(.3,1.4,.5,1),box-shadow .2s,filter .2s}
.jg-un-cartas .jg-un-hueco.ok .jg-un-c{box-shadow:0 0 0 1px #0002,0 0 16px #ffe14d4d,0 6px 14px #0007}
.jg-un-cartas .jg-un-hueco.no .jg-un-c{filter:brightness(.5) saturate(.55)}
.jg-un-cartas .jg-un-hueco:not(:disabled):hover{z-index:80!important}
.jg-un-cartas .jg-un-hueco:not(:disabled):hover .jg-un-c{transform:translateY(-22px) rotate(calc(var(--r,0deg) * -1)) scale(1.1);box-shadow:0 0 0 2px #ffe14d,0 0 22px #ffe14d88,0 16px 26px #0009}
.jg-un-cartas .jg-un-hueco.sel{z-index:81!important}
.jg-un-cartas .jg-un-hueco.sel .jg-un-c{transform:translateY(-30px) rotate(calc(var(--r,0deg) * -1)) scale(1.12);box-shadow:0 0 0 3px #ffe14d,0 0 30px #ffe14daa,0 18px 28px #0009}
.jg-un-c.nueva{animation:jgUnNueva .45s cubic-bezier(.3,1.5,.5,1) backwards}
@keyframes jgUnNueva{from{transform:translateY(-34px) scale(.6);opacity:0}}
.jg-un-anuncios .jg-un-hueco{padding:0;border:0;background:none;cursor:pointer;border-radius:8px}
.jg-un-anuncios .jg-un-hueco:not(:disabled):hover .jg-un-c{transform:translateY(-5px)}
.jg-un-anuncios .jg-un-hueco.verdad .jg-un-c{box-shadow:0 0 0 3px #5fd38a,0 4px 10px #0005}

/* El pie: lo que me toca decidir. */
.jg-un-panel{display:grid;justify-items:center;gap:10px;width:100%;max-width:780px;text-align:center}
.jg-un-fila{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
.jg-un-lbl{font:600 12px 'IBM Plex Mono',monospace;color:#a89cbc}
.jg-un-anuncios{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.jg-un-boton{font:600 13px system-ui,sans-serif;padding:9px 16px;border-radius:12px;border:1px solid #ffffff26;background:#ffffff10;color:#efe8f7;cursor:pointer;transition:transform .12s,background .15s,box-shadow .15s}
.jg-un-boton:hover:not(:disabled){background:#ffffff20;transform:translateY(-1px)}.jg-un-boton:active:not(:disabled){transform:translateY(1px)}.jg-un-boton:disabled{opacity:.45;cursor:default}
.jg-un-boton small{font-weight:400;color:#b3a8c4}
.jg-un-boton.grande{padding:11px 22px;background:linear-gradient(180deg,#ffd76a,#e8a93a);border-color:#f5c350;color:#2a1a05;box-shadow:0 6px 20px #e8a93a44}.jg-un-boton.grande:hover:not(:disabled){background:linear-gradient(180deg,#ffe28a,#f0b54a)}.jg-un-boton.grande small{color:#5a3e10}
.jg-un-boton.malo{background:linear-gradient(180deg,#f0452a,#b31f00);border-color:#f0452a;color:#fff;box-shadow:0 6px 20px #d7260044}.jg-un-boton.malo:hover:not(:disabled){background:linear-gradient(180deg,#ff5a3c,#c42300)}.jg-un-boton.malo small{color:#ffd9d0}
.jg-un-boton.suave{background:none;border-color:transparent;color:#a89cbc;box-shadow:none}
.jg-un-boton.sel{background:#3d3010;border-color:#e8b64a}
.jg-un-boton.moneda{display:grid;gap:2px;text-align:left;max-width:260px;padding:10px 14px}.jg-un-boton.moneda small{font-size:11px}
.jg-un-bcol{--k:var(--un-N);min-width:78px;padding:9px 14px;border-radius:12px;border:0;background:var(--k);color:#fff;font:700 13px system-ui,sans-serif;text-transform:capitalize;cursor:pointer;box-shadow:inset 0 -3px 0 #0003,0 4px 14px color-mix(in srgb,var(--k) 45%,transparent);transition:transform .12s,box-shadow .15s}
.jg-un-bcol.c-R{--k:var(--un-R)}.jg-un-bcol.c-A{--k:var(--un-A);color:#3a2e00}.jg-un-bcol.c-V{--k:var(--un-V)}.jg-un-bcol.c-Z{--k:var(--un-Z)}
.jg-un-bcol:hover:not(:disabled){transform:translateY(-2px)}
.jg-un-bcol.sel{box-shadow:0 0 0 3px #fff,0 0 22px var(--k)}.jg-un-bcol:disabled{opacity:.4;cursor:default}

.jg-un-hist{display:grid;gap:3px;padding:12px 18px 16px;background:#110c19;border-top:1px solid #ffffff10;font-size:12px;color:#a89cbc}.jg-un-hist:empty{display:none}
.jg-un-hist-t{font:600 10px 'IBM Plex Mono',monospace;letter-spacing:1.2px;text-transform:uppercase;color:#7d7291;margin-bottom:2px}
.jg-un-h{padding-left:8px;border-left:2px solid #ffffff18}
.jg-un-hist-t+.jg-un-h{color:#efe8f7;font-weight:600;border-left-color:#ffd76a;animation:jgUnEntra .4s ease-out}
@keyframes jgUnEntra{from{opacity:0;transform:translateX(-8px)}}

/* Lo que vuela: una capa fija sobre toda la página (fuera de .jg-uno, por
   eso repite los colores). */
.jg-un-vuelos{position:fixed;inset:0;z-index:55;pointer-events:none;overflow:hidden}
.jg-un-vuelo{position:absolute;width:0;height:0;will-change:transform}
.jg-un-vuelo>.jg-un-c{position:absolute;left:0;top:0;transform:translate(-50%,-50%);box-shadow:0 0 0 1px #0003,0 18px 30px #000a}
.jg-un-grito{position:absolute;padding:6px 14px;border-radius:100px;font:800 15px/1 system-ui,sans-serif;letter-spacing:.3px;white-space:nowrap;background:#efe8f7;color:#1a1422;box-shadow:0 8px 22px #0009}
.jg-un-grito.oro{font-size:18px;background:linear-gradient(180deg,#ffe28a,#e8a93a);color:#2a1a05;box-shadow:0 0 26px #ffd76a88,0 8px 22px #0009}
.jg-un-grito.malo{background:linear-gradient(180deg,#ff5a3c,#b31f00);color:#fff}
.jg-un-grito.bien{background:linear-gradient(180deg,#5fd38a,#1d7a3a);color:#fff}
.jg-un-grito.turno{background:#15101f;color:#ffd76a;border:1.5px solid #ffd76a;box-shadow:0 0 24px #ffd76a66}
.jg-un-grito.suave{background:#2c2140;color:#d9cfe6;font-weight:600;font-size:13px}
.jg-un-onda{--k:#c9a7ff;position:absolute;width:150px;height:150px;border-radius:50%;border:6px solid var(--k);box-shadow:0 0 30px var(--k),inset 0 0 24px var(--k)}
.jg-un-onda.c-R{--k:var(--un-R)}.jg-un-onda.c-A{--k:var(--un-A)}.jg-un-onda.c-V{--k:var(--un-V)}.jg-un-onda.c-Z{--k:var(--un-Z)}

/* En el teléfono la elipse no cabe: los asientos pasan a una tira arriba
   y el fieltro queda solo con las dos pilas. */
@media(max-width:720px){
  .jg-un-sala{height:auto;display:flex;flex-direction:column;padding:4px 0 10px}
  .jg-un-asientos{position:static;order:-1;display:flex;gap:8px;overflow-x:auto;padding:16px 12px 6px;pointer-events:auto;scrollbar-width:none}
  .jg-un-asiento,.jg-un-asientos[data-n] .jg-un-asiento{position:relative;left:auto;top:auto;transform:none;width:108px;flex-shrink:0}
  .jg-un-abanico{height:30px}.jg-un-abanico i{width:18px;height:27px;left:calc(50% - 9px)}
  .jg-un-fieltro{position:relative;inset:auto;height:290px;margin:16px 18px 8px}
  .jg-un-foco{display:none}
  .jg-un-giro{transform:scale(.8,.5)}.jg-un-sala.inv .jg-un-giro{transform:scale(-.8,.5)}
  .jg-un-mano{margin-top:0}
  .jg-un-c{width:50px;height:74px}.jg-un-c .ov em{font-size:17px}
  .jg-un-c.tope,.jg-un-mazo,.jg-un-descarte,.jg-un-baraja{width:76px;height:112px}.jg-un-c.tope .ov em{font-size:26px}
  .jg-un-pilas{gap:30px}
  .jg-un-cartas{padding:30px 0 16px;min-height:74px}
}

/* Portada del vestíbulo */
.jg-portada-uno{background:radial-gradient(ellipse at center,#3a1d4f,#1c1128 75%)}
.jg-art-uno{position:relative;display:flex}
.jg-art-uno i{position:relative;width:58px;height:86px;border-radius:9px;background:var(--t);border:3px solid #fff;box-shadow:0 8px 18px #0008;margin-left:-16px;display:grid;place-items:center;overflow:hidden}
.jg-art-uno i:first-child{margin:0;transform:rotate(-16deg) translateY(10px)}.jg-art-uno i:nth-child(2){transform:rotate(-5deg)}.jg-art-uno i:nth-child(3){transform:rotate(6deg)}.jg-art-uno i:nth-child(4){transform:rotate(17deg) translateY(10px)}
.jg-art-uno i::before{content:'';position:absolute;left:12%;right:12%;top:18%;bottom:18%;border-radius:50%;background:#fff;transform:rotate(28deg)}
.jg-art-uno i:nth-child(4)::before{background:conic-gradient(#d72600 0 25%,#0956bf 0 50%,#379711 0 75%,#e8c300 0)}
.jg-art-uno span{position:relative;font:800 22px 'IBM Plex Mono',monospace;color:var(--t)}.jg-art-uno i:nth-child(4) span{color:#fff;text-shadow:0 1px 3px #000}
.jg-art-uno b{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%) rotate(-6deg);font:900 20px 'IBM Plex Mono',monospace;letter-spacing:1px;color:#ffe14d;text-shadow:2px 2px 0 #d72600}
/* Presidente: baraja francesa sobre la misma mesa oscura que UNO */
.jg-pr-c{background:#fbfaf6;border-color:#fbfaf6;color:#1b1b1f}
.jg-pr-c.roja{color:#c8102e}
.jg-pr-c .ov{background:none;transform:none}.jg-pr-c .ov em{transform:none;color:inherit;text-shadow:none;font-size:30px}
.jg-pr-c .esq{color:inherit;text-shadow:none;display:flex;flex-direction:column;align-items:center;gap:1px}.jg-pr-c .esq s{text-decoration:none;font-size:.9em}
.jg-pr-c.dorso{background:repeating-linear-gradient(45deg,#3b1f6e 0 6px,#52309a 0 12px);border-color:#fbfaf6;color:#ffd76a}
.jg-pr-c.dorso .ov em{font-size:26px;color:#ffd76a}
.jg-pr-c.mini .ov em{font-size:16px}.jg-pr-c.tope .ov em{font-size:44px}
.jg-pr-mesa{display:flex;flex-direction:column;align-items:center;gap:10px}
.jg-pr-baza{display:flex;align-items:flex-end;justify-content:center;gap:10px;flex-wrap:wrap}
.jg-pr-grupo{display:flex;flex-direction:column;align-items:center;gap:4px}.jg-pr-grupo>.jg-un-c+.jg-un-c{margin-left:-30px}
.jg-pr-grupo{flex-direction:row;flex-wrap:wrap;justify-content:center}.jg-pr-grupo small{flex-basis:100%;text-align:center;color:#fff9;font-size:11px}
.jg-pr-grupo.vieja{opacity:.55}.jg-pr-grupo.vieja>.jg-un-c+.jg-un-c{margin-left:-20px}
.jg-pr-nueva{animation:jgPrEntra .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes jgPrEntra{from{transform:translateY(40px) scale(.7);opacity:0}}
.jg-pr-info{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;text-align:center;font-size:13px}.jg-pr-info b{font-size:15px}
.jg-pr-cambios{list-style:none;margin:4px 0 0;padding:0;font-size:12px;text-align:left}.jg-pr-cambios li.hecho{opacity:.6}.jg-pr-cambios li.anulado{text-decoration:line-through;opacity:.5}
.jg-pr-rol{background:#ffd76a;color:#1b1b1f}
.jg-pr-control{display:flex;flex-direction:column;gap:6px;margin:10px auto;max-width:900px}
.jg-pr-marcador{max-width:900px;margin:10px auto;padding:0 18px;box-sizing:border-box;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px}
.jg-pr-marcador .jg-un-hist-t{grid-column:1/-1}
/* Cada fila del marcador (Presidente y Spicy): nombre a la izquierda,
   puntos en cifra fija a la derecha. Sin esto heredaba la letra del
   navegador y se leía como un formulario. */
.jg-pr-punto{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;background:#ffffff0d;font:500 13px/1.3 "IBM Plex Sans",system-ui,sans-serif;color:#efe8f7}
.jg-pr-punto span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jg-pr-punto b{font:800 15px "IBM Plex Mono",monospace;color:#ffd76a}
.jg-pr-punto.ido{opacity:.45}.jg-pr-punto.ido span{text-decoration:line-through}
.jg-portada-presidente{background:radial-gradient(ellipse at center,#3b1f6e,#150c28 75%)}
.jg-art-pr{position:relative;display:flex;align-items:center}
.jg-art-pr>b{position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:30px;filter:drop-shadow(0 3px 4px #0008)}
.jg-art-pr i{position:relative;width:54px;height:80px;border-radius:8px;background:#fbfaf6;box-shadow:0 8px 18px #0008;margin-left:-14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;color:var(--t)}
.jg-art-pr i:first-of-type{margin:0;transform:rotate(-15deg) translateY(8px)}.jg-art-pr i:nth-of-type(2){transform:rotate(-5deg)}.jg-art-pr i:nth-of-type(3){transform:rotate(6deg)}.jg-art-pr i:nth-of-type(4){transform:rotate(16deg) translateY(8px)}
.jg-art-pr span{font:800 22px 'IBM Plex Mono',monospace}.jg-art-pr s{text-decoration:none;font-size:20px}
.jg-art-pr em{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%) rotate(-5deg);font:900 18px 'IBM Plex Mono',monospace;font-style:normal;letter-spacing:1px;color:#ffd76a;text-shadow:2px 2px 0 #7c4dff}
/* ---------- Spicy ---------- */
.jg-sp-c{--sp:#e2412b;background:#fff8ef;border-color:#fff8ef;color:var(--sp)}
.jg-sp-c .ov{background:none;transform:none}.jg-sp-c .ov em{transform:none;text-shadow:none;font-size:30px;color:inherit}
.jg-sp-c .esq{color:var(--sp);text-shadow:none;font-weight:900}
.jg-sp-c.comodin{background:linear-gradient(135deg,#e2412b,#5dac3a 50%,#6b4a2b);color:#fff}.jg-sp-c.comodin .esq{color:#fff}.jg-sp-c.comodin .ov em{font-size:15px}
.jg-sp-c.comodin.num{background:linear-gradient(135deg,#ffb400,#e2412b)}
.jg-sp-c.dorso{background:repeating-linear-gradient(-45deg,#8e1b10 0 6px,#b0281a 0 12px);border-color:#fff8ef}.jg-sp-c.dorso .ov em{font-size:26px}
.jg-sp-c.mini .ov em{font-size:16px}
.jg-sp-pila{position:relative;width:calc(62px + var(--n,1) * 6px);height:96px}
.jg-sp-pila>.jg-un-c{position:absolute;top:0}
.jg-sp-pila>.jg-un-c:nth-child(1){left:0;transform:rotate(-8deg)}.jg-sp-pila>.jg-un-c:nth-child(2){left:6px;transform:rotate(-4deg)}.jg-sp-pila>.jg-un-c:nth-child(3){left:12px;transform:rotate(3deg)}.jg-sp-pila>.jg-un-c:nth-child(4){left:18px;transform:rotate(-2deg)}.jg-sp-pila>.jg-un-c:nth-child(5){left:24px;transform:rotate(5deg)}.jg-sp-pila>.jg-un-c:nth-child(6){left:30px}
.jg-sp-dice{--sp:#e2412b;display:flex;flex-direction:column;align-items:center;padding:8px 18px;border-radius:14px;background:#0006;border:2px solid var(--sp);color:#fff;box-shadow:0 0 22px color-mix(in srgb,var(--sp) 45%,transparent)}
.jg-sp-dice small{font-size:11px;color:#fffb}.jg-sp-dice b{font:900 34px 'IBM Plex Mono',monospace;line-height:1.1}.jg-sp-dice em{font-style:normal;font-size:13px}
.jg-sp-destape{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:14px;background:#0005;animation:jgPrEntra .35s cubic-bezier(.3,1.5,.5,1)}
.jg-sp-destape.verdad{box-shadow:0 0 0 2px #5fd38a,0 0 24px #5fd38a66}.jg-sp-destape.mentira{box-shadow:0 0 0 2px #ff5a4a,0 0 24px #ff5a4a66}
.jg-sp-destape.mentira .jg-pr-info b{color:#ff8b7f}.jg-sp-destape.verdad .jg-pr-info b{color:#8ff0b0}
.jg-sp-anuncios{flex-wrap:wrap;gap:6px}
.jg-portada-spicy{background:radial-gradient(ellipse at center,#8e1b10,#240805 75%)}
.jg-art-sp{position:relative;display:flex;align-items:center}
.jg-art-sp>b{position:absolute;left:50%;top:-36px;transform:translateX(-50%) rotate(-12deg);font-size:34px;filter:drop-shadow(0 3px 4px #0008)}
.jg-art-sp i{position:relative;width:54px;height:80px;border-radius:8px;background:#fff8ef;box-shadow:0 8px 18px #0008;margin-left:-14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;color:var(--t)}
.jg-art-sp i:first-of-type{margin:0;transform:rotate(-12deg) translateY(6px)}.jg-art-sp i:nth-of-type(2){transform:rotate(0deg)}.jg-art-sp i:nth-of-type(3){transform:rotate(12deg) translateY(6px)}
.jg-art-sp span{font:800 22px 'IBM Plex Mono',monospace}.jg-art-sp s{text-decoration:none;font-size:20px}
.jg-art-sp em{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%) rotate(-4deg);font:900 18px 'IBM Plex Mono',monospace;font-style:normal;letter-spacing:2px;color:#ffcf4a;text-shadow:2px 2px 0 #b0281a}
/* ---------- Tetris ---------- */
.jg-portada-tetris{background:radial-gradient(ellipse at center,#1b3b7a,#0a0f24 75%)}
.jg-art-tt{position:relative;display:grid;grid-template-columns:repeat(6,16px);gap:2px}
.jg-art-tt i{width:16px;height:16px;border-radius:2px;box-shadow:inset 2px 2px 0 #fff5,inset -2px -2px 0 #0004}
.jg-art-tt i.p-i{background:#2fd3e8}.jg-art-tt i.p-j{background:#3b6cf6}.jg-art-tt i.p-l{background:#f59a23}.jg-art-tt i.p-o{background:#f5d432}.jg-art-tt i.p-s{background:#46d160}.jg-art-tt i.p-t{background:#b04ee8}.jg-art-tt i.p-z{background:#f0455a}.jg-art-tt i[class=""]{box-shadow:none}
.jg-portada-yemas{background:radial-gradient(ellipse at 50% 75%,#ffe2b0,#f0a040 55%,#8a4414)}
.jg-art-ym{position:relative;width:170px;height:104px}
.jg-art-ym i{position:absolute;bottom:12px;width:40px;height:54px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:inset -6px -8px 0 #0000001a,0 4px 0 #0000002a}

.sp-entradas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin:20px 0 28px}.sp-entrada{text-decoration:none!important;padding:28px;border-radius:18px;background:radial-gradient(ellipse at right,#704823,#0c1629 75%);color:#fff!important;border:1px solid #384352;transition:transform .2s}.sp-e-snake{background:radial-gradient(ellipse at right,#13615b,#0c1629 75%)}.sp-e-sortem{background:linear-gradient(90deg,#160826f2,#160826b8),url("juegos/club/sortem/cover.png") center/cover}.sp-e-sortem strong{color:#00f5ff;text-shadow:2px 2px #ff006e}.sp-e-sortem strong span{color:#fbbf24}.sp-e-bbtan{background:repeating-linear-gradient(0deg,#0000 0 3px,#0003 3px 4px),radial-gradient(ellipse at right,#3d5a12,#0c1629 75%)}.sp-e-bbtan strong{font-family:"Press Start 2P",ui-monospace,monospace;font-style:normal;font-size:22px;letter-spacing:0;color:#c4f568;text-shadow:3px 3px #1d2b06}.sp-e-bbtan strong span{color:#ff5fa2}
.sp-e-sopa{background:radial-gradient(circle at 85% 20%,#2563eb55,transparent 55%),repeating-linear-gradient(90deg,#ffffff0a 0 22px,#0000 22px 23px),repeating-linear-gradient(0deg,#ffffff0a 0 22px,#0000 22px 23px),linear-gradient(135deg,#13204a,#0d1430)}
.sp-e-sopa strong{letter-spacing:.04em;color:#e8eeff}
.sp-e-sopa strong span{color:#ffb070}.sp-e-worms{background:radial-gradient(ellipse at right,#7a3b14,#0c1629 75%)}.sp-e-worms strong span{color:#f2a33a}.sp-entrada:hover{transform:translateY(-4px)}.sp-entrada small{font-size:9px;letter-spacing:.16em;color:#abbccc}.sp-entrada strong{display:block;font-size:30px;letter-spacing:-.05em;font-style:italic;margin:14px 0}.sp-entrada strong span{float:right;color:#f6bc64}.sp-e-snake strong span{color:#58f5c0}.sp-entrada p{font-size:12px;color:#adbdd1}.sp-entrada>b{font-size:12px}
@keyframes sp-entrada{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes sp-revela{from{transform:scale(.8);filter:brightness(1.8)}to{transform:scale(1);filter:brightness(1)}}
@media(max-width:900px){.sp-layout{grid-template-columns:1fr}.sp-ranking{width:auto}.sp-hero{padding:24px}.sp-ranking ol{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}}@media(max-width:580px){.sp-layout{padding:12px;gap:16px}.sp-entradas{grid-template-columns:1fr}.sp-hud{gap:10px;padding:12px}.sp-hud b{font-size:19px}.sp-scroll{padding:8px}.sp-config>button{width:100%}.sp-ranking ol{display:block}.sp-hero .sp-link{margin-bottom:20px}.sp-hero h1{font-size:43px}}
@media(prefers-reduced-motion:reduce){.sp *,.sp-entrada{animation:none!important;transition:none!important}}

/* ============================================================
   Catan

   El tablero es un mar: el hueco `.jg-tablero` va en azul profundo con
   luz desde arriba, y la isla (un SVG) flota encima con su sombra. Los
   jugadores van en una columna a la derecha, sobre el mismo mar, y
   bajan debajo de la isla en pantallas estrechas. Las animaciones son de
   una sola vez (piezas que caen, dados que ruedan y caen, fichas de
   producción que suben) salvo las del agua, que son lentas y en bucle,
   y el latido de los sitios donde se puede construir, que es lo que
   dice «aquí» sin tener que leerlo.
   ============================================================ */
.jg-ct .jg-tablero{padding:0;overflow:hidden;place-items:stretch;background:radial-gradient(ellipse 80% 65% at 45% 35%,#2f7fbd,#17507f 58%,#0c2d4d);border-color:#15406a}
.jg-ct-mesa{display:grid;grid-template-columns:minmax(0,1fr) 250px;min-height:420px}
.jg-ct-isla{position:relative;padding:14px 12px;display:grid;place-items:center;min-width:0;overflow:hidden}
.jg-ct-isla::before{content:'';position:absolute;inset:-20%;background:repeating-radial-gradient(circle at 30% 30%,#ffffff07 0 2px,transparent 3px 28px);animation:ctDeriva 40s linear infinite;pointer-events:none}
@keyframes ctDeriva{to{transform:translate(28px,28px)}}
/* El lienzo mide lo que el SVG: las fichas que suben se colocan en % de
   él, así que siguen en su sitio aunque la isla se desplace en el móvil. */
.jg-ct-scroll{width:100%;display:grid;place-items:center}
.jg-ct-lienzo{position:relative;width:100%;max-width:100%}
.jg-ct-svg{position:relative;width:100%;height:auto;max-height:76vh;display:block;margin:0 auto;filter:drop-shadow(0 14px 22px #0008);user-select:none;-webkit-user-select:none}
.jg-ct-isla.ancha .jg-ct-svg{max-height:66vh}
.jg-ct-isla.eligiendo .ct-hex:not(.ct-mar-h) .ct-losa{filter:brightness(.82) saturate(.85)}

.ct-losa{stroke:#00000040;stroke-width:1.1;transition:filter .3s}
.ct-mar-h .ct-losa{stroke:#ffffff14;stroke-width:.8}
.ct-bisel{stroke:#ffffff3a;stroke-width:1.2;pointer-events:none}
.ct-ola{fill:none;stroke:#ffffff50;stroke-width:1.4;stroke-linecap:round;animation:ctOla 5s ease-in-out infinite alternate}
.ct-ola.b{animation-delay:-2.5s;opacity:.55}
@keyframes ctOla{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
.ct-deco{opacity:.5}
.ct-hex use{pointer-events:none}
.ct-hex{transform-box:fill-box;transform-origin:center}
.ct-hex.robado:not(.ct-mar-h) .ct-losa{filter:grayscale(.55) brightness(.72)}
.ct-hex.robado .ct-ficha{opacity:.55}
.ct-hex.brilla{animation:ctBrilla 1.7s ease-out}
@keyframes ctBrilla{0%{filter:brightness(1)}22%{filter:brightness(1.5) drop-shadow(0 0 10px #fff3a8)}100%{filter:brightness(1)}}
.ct-t-oro .ct-chispa,.ct-chispa{animation:ctChispa 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ctChispa{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}

.ct-ficha circle{fill:#f7ecd0;stroke:#a9884f;stroke-width:1.2}
.ct-ficha>circle{filter:drop-shadow(0 1.5px 1px #0005)}
.ct-ficha text{font:800 12.5px 'IBM Plex Mono',ui-monospace,monospace;text-anchor:middle;fill:#2c2418}
.ct-pips circle{fill:#2c2418;stroke:none}
.ct-ficha.roja text,.ct-ficha.roja .ct-pips circle{fill:#c0392b}

.ct-muelle{stroke:#8a6a44;stroke-width:3.2;stroke-linecap:round;fill:none}
.ct-puerto-c{fill:#f7ecd0;stroke:#6b5234;stroke-width:1.2;filter:drop-shadow(0 2px 2px #0006)}
.ct-puerto-t{font:800 8.5px 'IBM Plex Mono',ui-monospace,monospace;text-anchor:middle;fill:#3a2e22}
.ct-puerto-t2{font:800 6px 'IBM Plex Mono',ui-monospace,monospace;text-anchor:middle;fill:#3a2e22}

.ct-camino-b{stroke:#1d1a17;stroke-width:8.5;stroke-linecap:round}
.ct-camino-c{stroke-width:5.4;stroke-linecap:round}
.ct-camino.ct-nuevo line{stroke-dasharray:1;stroke-dashoffset:1;animation:ctTraza .6s ease-out forwards}
@keyframes ctTraza{to{stroke-dashoffset:0}}
.ct-pieza{transform-box:fill-box;transform-origin:50% 100%;filter:drop-shadow(0 2.5px 1.5px #0007)}
.ct-pieza.ct-nuevo{animation:ctCae .75s cubic-bezier(.3,1.5,.5,1) both}
@keyframes ctCae{0%{transform:translateY(-30px) scale(1.3);opacity:0}55%{transform:translateY(2px) scale(.92);opacity:1}100%{transform:none}}
.ct-flota{transform-box:fill-box;transform-origin:50% 80%;animation:ctMecer 3.4s ease-in-out infinite alternate}
@keyframes ctMecer{from{transform:translateY(-1px) rotate(-4deg)}to{transform:translateY(1.5px) rotate(4deg)}}

.ct-mueble{transition:transform .8s cubic-bezier(.34,1.45,.64,1);pointer-events:none}
.ct-mueble-i{filter:drop-shadow(0 4px 3px #0008);transform-box:fill-box;transform-origin:50% 100%}
.ct-mueble.salta .ct-mueble-i{animation:ctSalto .8s ease-out}
@keyframes ctSalto{0%{transform:none}40%{transform:translateY(-16px) scale(1.12)}80%{transform:translateY(1px) scale(.96)}100%{transform:none}}
#ctPirataG .ct-mueble-i{animation:ctMecer 2.6s ease-in-out infinite alternate}

.ct-hit{fill:transparent;stroke:transparent;cursor:pointer}
.ct-sitio-v .ct-anillo{fill:#ffffffb0;stroke:#fff;stroke-width:2;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:ctLate 1.1s ease-in-out infinite}
.ct-sitio-v:hover .ct-anillo{fill:#ffe066;stroke:#1d1a17}
@keyframes ctLate{0%,100%{transform:scale(.8);opacity:.75}50%{transform:scale(1.15);opacity:1}}
.ct-sitio-e .ct-hit{stroke-width:15}
.ct-sitio-e .ct-anillo{stroke:#fff;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:5 4;pointer-events:none;animation:ctHormiga .7s linear infinite}
.ct-sitio-e.agua .ct-anillo{stroke:#bdf1ff}
.ct-sitio-e:hover .ct-anillo{stroke:#ffe066;stroke-dasharray:none}
.ct-sitio-e.elegido .ct-anillo{stroke:#ffe066;stroke-width:7;stroke-dasharray:none}
@keyframes ctHormiga{to{stroke-dashoffset:-9}}
.ct-sitio-h{fill:#ffe06614;stroke:#ffe066;stroke-width:3;stroke-linejoin:round;cursor:pointer;animation:ctLateH 1.3s ease-in-out infinite}
.ct-sitio-h.agua{stroke:#9fe7ff;fill:#9fe7ff12}
.ct-sitio-h:hover,.ct-sitio-h.fijo{fill:#ffe06640;animation:none}
@keyframes ctLateH{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}

/* Los dados, arriba a la izquierda del mar. */
.jg-ct-dados{position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:10px;z-index:2;pointer-events:none}
.jg-ct-dados:empty{display:none}
.jg-ct-par{display:flex;gap:7px}
.jg-ct-dado{width:32px;height:32px;box-sizing:border-box;padding:5px;border-radius:8px;background:#fbf7ec;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);place-items:center;box-shadow:inset 0 -3px 0 #d8cdb4,0 6px 12px #0006}
.jg-ct-dado.b{background:#f6d77a;box-shadow:inset 0 -3px 0 #d0a93c,0 6px 12px #0006}
.jg-ct-dado i{width:6px;height:6px;border-radius:50%}
.jg-ct-dado i.on{background:#2a2320}
.jg-ct-par.rodando .jg-ct-dado{animation:ctRueda .5s linear infinite}
.jg-ct-par.rodando .jg-ct-dado.b{animation-duration:.43s;animation-direction:reverse}
@keyframes ctRueda{0%{transform:rotate(0)}25%{transform:rotate(90deg) translateY(-5px)}50%{transform:rotate(180deg)}75%{transform:rotate(270deg) translateY(-3px)}100%{transform:rotate(360deg)}}
.jg-ct-par.cae .jg-ct-dado{animation:ctDadoCae .85s cubic-bezier(.3,1.35,.5,1) both}
.jg-ct-par.cae .jg-ct-dado.b{animation-delay:.06s}
@keyframes ctDadoCae{0%{transform:translate(-50px,-40px) rotate(-400deg) scale(1.35);opacity:.3}70%{transform:translate(0,3px) rotate(10deg)}100%{transform:none;opacity:1}}
.jg-ct-dados b{font:800 22px 'IBM Plex Mono',ui-monospace,monospace;color:#fff;text-shadow:0 2px 8px #000a;animation:ctPop .5s cubic-bezier(.3,1.6,.5,1)}
.jg-ct-dados b.siete{color:#ff7a6b}
.jg-ct-dados small{font-size:12px;font-weight:600;color:#e6f2ff;text-shadow:0 1px 4px #000a}

/* Fichas de producción que suben de los hexágonos. */
.jg-ct-fx{position:absolute;inset:0;pointer-events:none;z-index:2}
.jg-ct-flota{position:absolute;display:flex;align-items:center;gap:2px;padding:2px 7px 2px 3px;border-radius:99px;background:#fffdf5;border:2px solid var(--c,#888);font:800 12px 'IBM Plex Mono',ui-monospace,monospace;color:#2c2418;box-shadow:0 6px 14px #0006;transform:translate(-50%,-50%);animation:ctSube 2s ease-out both;white-space:nowrap}
.jg-ct-flota .jg-ct-ico{width:19px;height:19px}
@keyframes ctSube{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}14%{opacity:1;transform:translate(-50%,-65%) scale(1.1)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-210%) scale(.95)}}

/* El cartel del centro: el siete, la carta que se juega, los logros. */
.jg-ct-banner{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.jg-ct-banner-t{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 26px;border-radius:18px;background:#1a1626e6;color:#fff;font:800 20px system-ui,sans-serif;box-shadow:0 18px 40px #0008;animation:ctBanner 1.9s cubic-bezier(.3,1.3,.5,1) both;text-align:center}
.jg-ct-banner-t small{font-size:12px;font-weight:600;color:#c9c2da}
.jg-ct-banner-t .jg-ct-ico.grande{width:46px;height:46px;filter:drop-shadow(0 3px 4px #0006)}
.jg-ct-banner-t.siete{font-size:44px;letter-spacing:-1px;background:#b0261ae8;padding:10px 34px}
.jg-ct-banner-t.turno{background:#d9822be8;font-size:22px}
.jg-ct-banner-t.logro{background:#2b5f2fe8}
@keyframes ctBanner{0%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(1.06)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.jg-ct-toasts{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;pointer-events:none;z-index:3;width:max-content;max-width:90%}
.jg-ct-toast{padding:7px 14px;border-radius:99px;background:#1a1626e0;color:#fff;font-size:12.5px;font-weight:600;box-shadow:0 8px 18px #0006;animation:ctToast 3.6s ease-out both}
@keyframes ctToast{0%{opacity:0;transform:translateY(10px)}10%,82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}

/* Los jugadores. */
.jg-ct-lado{display:grid;align-content:start;gap:8px;padding:12px;background:#08223bb8;border-left:1px solid #ffffff14}
.jg-ct-jug{--c:#888;position:relative;padding:10px 11px 9px 13px;border-radius:12px;background:#ffffff10;border:1px solid #ffffff1c;color:#e8eef5;transition:background .3s,box-shadow .3s,border-color .3s}
.jg-ct-jug::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.jg-ct-jug.on{background:#ffffff22;border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent),0 10px 22px #0006}
.jg-ct-jug.on::before{animation:ctLateBarra 1.3s ease-in-out infinite}
@keyframes ctLateBarra{0%,100%{opacity:.55}50%{opacity:1}}
.jg-ct-jug.fuera{opacity:.45}.jg-ct-jug.fuera b{text-decoration:line-through}
.jg-ct-cab{display:flex;align-items:center;gap:8px;min-width:0}
.jg-ct-cab b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-ct-cab b small{font-weight:500;color:#a9bbcd}
.jg-ct-av{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-weight:800;font-size:12px;color:#1d1a17;box-shadow:inset 0 -2px 0 #0003,0 0 0 2px var(--c);overflow:hidden}
.jg-ct-av img{width:100%;height:100%;object-fit:cover}
.jg-ct-vp{margin-left:auto;min-width:30px;height:30px;padding:0 6px;box-sizing:border-box;border-radius:9px;display:grid;place-items:center;font:800 18px 'IBM Plex Mono',ui-monospace,monospace;background:#0000003a;color:#ffe9a8}
.jg-ct-meta{height:4px;margin:7px 0 6px;border-radius:9px;background:#ffffff18;overflow:hidden}
.jg-ct-meta i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--c),#ffe066);transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.jg-ct-cifras{display:flex;flex-wrap:wrap;gap:4px 11px;font:700 11.5px 'IBM Plex Mono',ui-monospace,monospace;color:#c0cfdd}
.jg-ct-cifras span{display:inline-flex;align-items:center;gap:3px}
.jg-ct-ico{width:16px;height:16px;flex:none;vertical-align:middle}
.jg-ct-ico.col{color:var(--c)}
.jg-ct-insignias{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.jg-ct-ins{display:inline-flex;align-items:center;gap:3px;padding:2px 7px 2px 4px;border-radius:99px;background:#ffe06622;border:1px solid #ffe06655;color:#ffe9a8;font:700 11px 'IBM Plex Mono',ui-monospace,monospace;animation:ctPop .5s cubic-bezier(.3,1.6,.5,1)}
.jg-ct-ins .jg-ct-ico{width:18px;height:18px}
.jg-ct-estado{margin-top:6px;font-size:11px;font-weight:600;color:#ffd79a}
@keyframes ctPop{0%{transform:scale(.6)}60%{transform:scale(1.14)}100%{transform:none}}

/* Barra de arriba. */
.jg-ct-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.jg-ct-chip{padding:4px 10px;border-radius:99px;background:#f4efe6;color:#6a5334;font:600 11px system-ui,sans-serif;white-space:nowrap}
.jg-ct-chip.meta{background:#fff3d6;color:#8a5a0a}
.jg-ct-chip.mar{background:#dcefff;color:#1f5f94}

/* Mi mano. */
.jg-ct-mano{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;padding:14px 18px;background:#fff;border:1px solid #e4dfeb;border-top:none}
.jg-ct-mano[hidden]{display:none}
.jg-ct-mano-t{width:100%;font:700 10px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1.3px;text-transform:uppercase;color:#8a8494;margin-bottom:-4px}
.jg-ct-mano-t small{font-weight:500;letter-spacing:0;text-transform:none;margin-left:6px}
.jg-ct-cartas{display:flex;flex-wrap:wrap;gap:9px}
.jg-ct-carta{position:relative;width:62px;height:84px;box-sizing:border-box;border-radius:10px;display:grid;justify-items:center;align-content:center;gap:3px;background:linear-gradient(160deg,var(--a),var(--b));border:2px solid #fff;box-shadow:0 5px 12px #2a1e4426;color:#fff;transition:transform .15s}
.jg-ct-carta:hover{transform:translateY(-3px)}
.jg-ct-carta .jg-ct-ico{width:34px;height:34px;filter:drop-shadow(0 2px 2px #0004)}
.jg-ct-carta b{position:absolute;top:-9px;right:-9px;min-width:23px;height:23px;box-sizing:border-box;padding:0 5px;border-radius:99px;background:#1f2933;color:#fff;font:800 12px/19px 'IBM Plex Mono',ui-monospace,monospace;text-align:center;border:2px solid #fff}
.jg-ct-carta small{font:800 9px system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;text-shadow:0 1px 2px #0007}
.jg-ct-carta.cero{filter:grayscale(.85);opacity:.4}
.jg-ct-carta.pop{animation:ctCarta .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes ctCarta{0%{transform:translateY(12px) scale(.75)}55%{transform:translateY(-8px) scale(1.12)}100%{transform:none}}
.r-madera{--a:#56a45b;--b:#2b6b35}.r-arcilla{--a:#e5925e;--b:#ad4f27}.r-lana{--a:#b0df82;--b:#69a843}
.r-trigo{--a:#f6d874;--b:#d29d30}.r-mineral{--a:#b1b9c4;--b:#6c7582}.r-oro{--a:#f8dc68;--b:#c9951e}
.jg-ct-deses{display:flex;flex-wrap:wrap;gap:9px}
.jg-ct-des{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;background:linear-gradient(160deg,#fffaf0,#f4e8cc);border:1.5px solid #d9c49a;box-shadow:0 4px 10px #6b4a0a1a;max-width:250px}
.jg-ct-des>.jg-ct-ico{width:32px;height:32px}
.jg-ct-des div{display:grid;gap:1px;min-width:0}
.jg-ct-des b{font-size:12.5px;color:#3a2e22}
.jg-ct-des small{font-size:10.5px;color:#7a6a52;line-height:1.3}
.jg-ct-des.nueva{opacity:.7}
.jg-ct-des.sel{border-color:#d9822b;box-shadow:0 0 0 3px #d9822b44}
.jg-ct-jugar{flex:none;padding:6px 11px;border:0;border-radius:8px;background:#d9822b;color:#fff;font:700 12px system-ui,sans-serif;cursor:pointer;box-shadow:inset 0 -2px 0 #0003}
.jg-ct-jugar:hover{background:#c06f1d}
.jg-ct-oculto{font:600 10px 'IBM Plex Mono',ui-monospace,monospace;color:#9a8a6a}

/* El pie: construir, comerciar, tirar. */
.jg-ct .jg-pie{display:block}
.jg-ct-guia{font-size:13.5px;color:#3a3446;line-height:1.5;margin-bottom:8px}
.jg-ct-acciones{display:flex;flex-wrap:wrap;gap:8px}
.jg-ct-accion{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 9px;border-radius:12px;border:1px solid #e0dbe8;background:#fff;color:#2c2437;font:600 13px system-ui,sans-serif;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.jg-ct-accion>span{display:grid;gap:3px;text-align:left}
.jg-ct-accion small{font-size:10.5px;font-weight:600;color:#8a8494}
.jg-ct-accion:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 16px #2a1e441c;border-color:#d9822b}
.jg-ct-accion.on{border-color:#d9822b;background:#fff6e9;box-shadow:0 0 0 3px #d9822b40}
.jg-ct-accion:disabled{opacity:.4;cursor:default}
.jg-ct-accion .jg-ct-ico.pieza{width:26px;height:26px;filter:drop-shadow(0 2px 1px #0003)}
.jg-ct-accion .jg-ct-coste,.jg-ct-coste{display:inline-flex;flex-wrap:nowrap;gap:1px}
.jg-ct-coste .jg-ct-ico{width:14px;height:14px}
.jg-ct-tirar{display:inline-flex;align-items:center;gap:8px;padding:10px 20px 10px 12px;border:0;border-radius:14px;background:linear-gradient(135deg,#e8993a,#c9651c);color:#fff;font:800 15px system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 20px #c9651c55,inset 0 -3px 0 #0003;animation:ctInvita 1.6s ease-in-out infinite}
.jg-ct-tirar .jg-ct-dado{width:26px;height:26px;padding:4px;box-shadow:inset 0 -2px 0 #d8cdb4}
.jg-ct-tirar .jg-ct-dado i{width:5px;height:5px}
.jg-ct-tirar:hover:not(:disabled) .jg-ct-dado{animation:ctRueda .6s linear infinite}
.jg-ct-tirar:disabled{opacity:.5;animation:none;cursor:default}
@keyframes ctInvita{0%,100%{box-shadow:0 8px 20px #c9651c55,inset 0 -3px 0 #0003}50%{box-shadow:0 8px 30px #e8993a99,inset 0 -3px 0 #0003}}
.jg-ct-fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.jg-ct-fin{justify-content:flex-end;border-top:1px dashed #e4dfeb;padding-top:10px}
.jg-ct-link{border:0;background:none;padding:4px 2px;color:#7042df;font:600 12px system-ui,sans-serif;cursor:pointer;text-decoration:underline}
.jg-ct-tog,.jg-ct-res,.jg-ct-tab{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:10px;border:1px solid #e0dbe8;background:#fff;color:#2c2437;font:600 12.5px system-ui,sans-serif;cursor:pointer}
.jg-ct-res .jg-ct-ico{width:22px;height:22px}
.jg-ct-res small{font:700 11px 'IBM Plex Mono',ui-monospace,monospace;color:#8a8494}
.jg-ct-tog.sel,.jg-ct-res.sel,.jg-ct-tab.on{border-color:#d9822b;background:#fff6e9;box-shadow:0 0 0 2px #d9822b33}
.jg-ct-res:disabled{opacity:.35;cursor:default}
.jg-ct-comercio{margin-top:12px;padding:12px;border-radius:14px;background:#faf8fc;border:1px solid #ece7f3}
.jg-ct-tabs{display:flex;gap:6px;flex-wrap:wrap}
.jg-ct-trato-f{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.jg-ct-lbl{min-width:58px;font:700 10px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1px;text-transform:uppercase;color:#8a8494}
.jg-ct-contadores{display:flex;flex-wrap:wrap;gap:6px}
.jg-ct-contador{display:inline-flex;align-items:center;gap:3px;padding:3px 5px;border-radius:10px;background:#fff;border:1px solid #e6e1ee}
.jg-ct-contador.con{border-color:#d9822b;background:#fff6e9}
.jg-ct-contador.sin{opacity:.45}
.jg-ct-contador .jg-ct-ico{width:22px;height:22px}
.jg-ct-contador b{min-width:16px;text-align:center;font:800 13px 'IBM Plex Mono',ui-monospace,monospace;color:#2c2437}
.jg-ct-contador button{width:22px;height:22px;border:0;border-radius:6px;background:#f0ecf6;color:#2c2437;font:800 14px system-ui,sans-serif;cursor:pointer;padding:0}
.jg-ct-contador button:disabled{opacity:.3;cursor:default}
.jg-ct-trato{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid #e6e1ee;font-size:13px;color:#3a3446}
.jg-ct-trato>div:first-child{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.jg-ct-trato.entra{animation:ctEntra .45s cubic-bezier(.3,1.4,.5,1);border-color:#d9822b}
@keyframes ctEntra{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.jg-ct-cuenta{display:inline-flex;align-items:center;gap:1px;font:800 12px 'IBM Plex Mono',ui-monospace,monospace}
.jg-ct-cuenta .jg-ct-ico{width:20px;height:20px}
.jg-ct-flecha{color:#d9822b;font-weight:800}
.jg-ct-resp{font-size:12px;color:#8a8494}.jg-ct-resp.no{color:#b4232a}.jg-ct-resp.si{color:#2f7d3b;font-weight:600}
.jg-ct-props{display:grid;gap:0}
.jg-ct-panel{margin-top:12px;padding:12px;border-radius:14px;background:#fff8ec;border:1px solid #f0dcb8;font-size:13px;color:#3a3446}
.jg-ct-panel>b{display:block;margin-bottom:8px}
.jg-ct-victima{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;border:2px solid var(--c);background:#fff;color:#2c2437;font:700 13px system-ui,sans-serif;cursor:pointer}
.jg-ct-victima small{font-weight:500;color:#8a8494}
.jg-ct-victima:hover{background:color-mix(in srgb,var(--c) 15%,#fff)}

.jg-ct-hist{margin-top:12px;display:grid;gap:3px;padding:12px 16px;border-radius:12px;background:#faf8fc;border:1px solid #ece7f3;font-size:12px;color:#5a5566}
.jg-ct-hist:empty{display:none}
.jg-ct-hist-t{font:600 10px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1.2px;text-transform:uppercase;color:#8a8494;margin-bottom:2px}
.jg-ct-h{padding-left:8px;border-left:3px solid var(--c,#e4dcef)}
.jg-ct-hist-t+.jg-ct-h{color:#2c2437;font-weight:600}
.jg-ct-h.h-tirada{font-family:'IBM Plex Mono',ui-monospace,monospace}

@media(max-width:900px){
  .jg-ct-mesa{grid-template-columns:1fr}
  .jg-ct-lado{border-left:0;border-top:1px solid #ffffff14;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .jg-ct-svg,.jg-ct-isla.ancha .jg-ct-svg{max-height:none}
}
@media(max-width:600px){
  /* Un cruce tiene que caber bajo un dedo: la isla no baja de un ancho
     mínimo y se desplaza de lado si no cabe. */
  .jg-ct-isla{padding:8px 0}
  .jg-ct-scroll{overflow-x:auto;place-items:start;-webkit-overflow-scrolling:touch;padding:0 4px}
  .jg-ct-lienzo{min-width:540px;max-width:none}
  .jg-ct-isla.ancha .jg-ct-lienzo{min-width:760px}
  .jg-ct-dados{left:8px;top:6px}
  .jg-ct-carta{width:52px;height:72px}.jg-ct-carta .jg-ct-ico{width:28px;height:28px}
  .jg-ct-accion{padding:6px 9px 6px 7px;font-size:12px}
  .jg-ct-dado{width:26px;height:26px;padding:4px}.jg-ct-dado i{width:5px;height:5px}
  .jg-ct-banner-t.siete{font-size:34px}
  .jg-ct-mano{padding:12px}
  .jg-ct-chips{display:none}
}
@media(prefers-reduced-motion:reduce){.jg-ct *,.jg-ct *::before{animation:none!important;transition:none!important}}

/* Portada del vestíbulo */
.jg-portada-catan{background:radial-gradient(ellipse at 50% 45%,#48a0dc,#1a5588 70%,#0f3558)}
.jg-art-ct{width:200px;height:180px;overflow:visible;filter:drop-shadow(0 12px 16px #0008)}
.jg-art-ct-ola{animation:ctOla 4s ease-in-out infinite alternate}
.jg-art-ct-barco{transform-box:fill-box;transform-origin:50% 90%;animation:ctMecer 2.8s ease-in-out infinite alternate}
.jg-art-ct-casa{transform-box:fill-box;transform-origin:50% 100%}
.jg-oferta:hover .jg-art-ct-casa{animation:ctCae .7s cubic-bezier(.3,1.5,.5,1)}
.jg-oferta:hover .jg-art-ct-casa.b{animation-delay:.12s}
.jg-art-ct-t{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font:900 13px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:4px;color:#ffe9a8;text-shadow:0 2px 6px #0008}

/* ============================================================
   Modo oscuro

   Se enciende con `data-tema="oscuro"` en <html>: lo pone el guion
   del <head> antes de pintar (si no, la página sale blanca un
   instante) y el botón ☾/☀ de la cabecera. Sin elección guardada
   sigue al sistema (`prefers-color-scheme`); pulsar el botón la
   guarda en `localStorage` (`jg.tema`).

   Sólo se oscurece el armazón —página, tarjetas, salas, chat,
   carteles, tablas—. El arte se queda como está: las portadas ya son
   oscuras, la mesa de Flip 7 es un paño verde y las cartas son
   cartas, que en la vida real son blancas. Todo va en este bloque y
   con el prefijo `html[data-tema=oscuro]`, que gana por especificidad
   a la regla clara sin tocarla: el tema claro sigue siendo el de
   siempre, línea por línea.
   ============================================================ */
html[data-tema=oscuro]{
  color-scheme:dark;
  --jg-ink:#ebe7f5;--jg-muted:#9d96ad;
  --os-fondo:#0f0d15;--os-sup:#18151f;--os-sup2:#211d2b;--os-sup3:#2a2536;
  --os-borde:#2c2738;--os-borde2:#3a3449;--os-tx:#ebe7f5;--os-tx2:#bcb5cc;--os-tx3:#8f889f
}
html[data-tema=oscuro] body{background:var(--os-fondo);color:var(--os-tx)}
html[data-tema=oscuro] .jg-marquesina{box-shadow:0 0 0 1px var(--os-borde)}
html[data-tema=oscuro] .head{background:#0b0a10;border-bottom-color:#ffffff10}
html[data-tema=oscuro] .lead,html[data-tema=oscuro] .row-meta,html[data-tema=oscuro] .vacio,html[data-tema=oscuro] .jg-nota{color:var(--os-tx3)}

/* Pestañas, botones, campos */
html[data-tema=oscuro] .tab{color:var(--os-tx3)}
html[data-tema=oscuro] .tab.on{background:var(--os-sup3);color:#fff}
html[data-tema=oscuro] .inp,html[data-tema=oscuro] .jg-of-op select,html[data-tema=oscuro] .jg-campo input[type=text],
html[data-tema=oscuro] .esc-herramientas select{background:var(--os-sup2);border-color:var(--os-borde2);color:var(--os-tx)}
html[data-tema=oscuro] .btn2,html[data-tema=oscuro] .jg-tab,html[data-tema=oscuro] .jg-f7-anula{background:var(--os-sup2);border-color:var(--os-borde2);color:var(--os-tx2)}
html[data-tema=oscuro] .btn2:hover{border-color:#a88bff;color:#c4b1ff}
html[data-tema=oscuro] .jg-tab.on{background:#0d94882b;color:#5eead4}
html[data-tema=oscuro] .jg-rk-cats{background:var(--os-sup);border-color:var(--os-borde)}
html[data-tema=oscuro] .jg-rk-seg{background:var(--os-sup2)}
html[data-tema=oscuro] .jg-rk-seg button{color:var(--os-tx2)}
html[data-tema=oscuro] .jg-rk-seg button:hover{background:#ffffff10}
html[data-tema=oscuro] .jg-rk-seg button.on{background:#ffffff1c;color:#fff}
html[data-tema=oscuro] .mini{color:#6f687f}
html[data-tema=oscuro] .mini:hover{background:var(--os-sup3);color:var(--os-tx2)}
html[data-tema=oscuro] .mini.del:hover,html[data-tema=oscuro] .jg-pierde,html[data-tema=oscuro] .jg-castigo,
html[data-tema=oscuro] .jg-modal-err,html[data-tema=oscuro] .jg-reloj.urge,html[data-tema=oscuro] #loginError{color:#ff8a7a}

/* Superficies: tarjetas, cajas y el marco de cada juego */
html[data-tema=oscuro] .card,html[data-tema=oscuro] .login-card,html[data-tema=oscuro] .jg-oferta,html[data-tema=oscuro] .jg-lado-caja,
html[data-tema=oscuro] .jg-invita,html[data-tema=oscuro] .jg-chat,html[data-tema=oscuro] .jg-tabla-caja,html[data-tema=oscuro] .jg-modal,
html[data-tema=oscuro] .jg-barra,html[data-tema=oscuro] .jg-pie,html[data-tema=oscuro] .jg-f7-hist{background:var(--os-sup);border-color:var(--os-borde)}
html[data-tema=oscuro] .jg-tablero{background:radial-gradient(ellipse at 50% 0,#211d2b,var(--os-sup) 70%);border-color:var(--os-borde)}
html[data-tema=oscuro] .jg-mesa,html[data-tema=oscuro] .jg-lienzo{border-color:var(--os-borde)}
html[data-tema=oscuro] .row{border-bottom-color:var(--os-borde)}
html[data-tema=oscuro] .jg-oferta:hover{box-shadow:0 15px 32px #0008}
html[data-tema=oscuro] .login-card p{color:var(--os-tx2)!important}
html[data-tema=oscuro] .jg-invita,html[data-tema=oscuro] .jg-fase{color:var(--os-tx2)}
html[data-tema=oscuro] .jg-fase b,html[data-tema=oscuro] .jg-m-turno,html[data-tema=oscuro] .jg-pts,html[data-tema=oscuro] .jg-modal-t{color:var(--os-tx)}
html[data-tema=oscuro] .jg-m,html[data-tema=oscuro] .jg-reloj{color:var(--os-tx2)}

/* Vestíbulo */
html[data-tema=oscuro] .jg-filtros{background:var(--os-sup2)}
html[data-tema=oscuro] .jg-filtros button{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-filtros button[aria-pressed=true]{background:var(--os-sup3);color:var(--os-tx)}
html[data-tema=oscuro] .jg-lado-caja header,html[data-tema=oscuro] .jg-sala+.jg-sala{border-color:var(--os-borde)}
html[data-tema=oscuro] .jg-lado-n{background:#7042df33;color:#c4b1ff}
html[data-tema=oscuro] .jg-sala-ico,html[data-tema=oscuro] .jg-of-icono{background:color-mix(in srgb,var(--c) 18%,var(--os-sup));border-color:color-mix(in srgb,var(--c) 35%,var(--os-sup))}
html[data-tema=oscuro] .jg-sala-txt>.jg-sala-cupo{background:var(--os-sup3)}
html[data-tema=oscuro] .jg-of-meta span{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-of-lema{color:var(--os-tx2)}
html[data-tema=oscuro] .jg-of-op{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-of-btn{background:var(--os-sup3);color:var(--os-tx)}
html[data-tema=oscuro] .jg-of-btn:hover{background:#3a3150}
html[data-tema=oscuro] .jg-of-orbita .jg-of-btn{background:#7042df;color:#fff}
html[data-tema=oscuro] .jg-p{background:color-mix(in srgb,var(--c,#888) 18%,var(--os-sup));border-color:color-mix(in srgb,var(--c,#888) 40%,var(--os-sup))}

/* Cabecera de la partida, votos, espectador, chat */
html[data-tema=oscuro] .jg-quien-chip{background:var(--os-sup);border-color:var(--os-borde);color:var(--os-tx2)}
html[data-tema=oscuro] .jg-voto{background:var(--os-sup2);border-color:var(--os-borde2);color:var(--os-tx3)}
html[data-tema=oscuro] .jg-voto:hover,html[data-tema=oscuro] .jg-voto-n{background:#b4232a33;border-color:#b4232a66;color:#ff8a7a}
html[data-tema=oscuro] .jg-voto.on{background:#b4232a;color:#fff}
html[data-tema=oscuro] .jg-fin-exp{color:#ff8a7a}
html[data-tema=oscuro] .jg-mirando{background:#1d2a45;border-color:#2e4270;color:#b9cdf6}
html[data-tema=oscuro] .jg-chat>header,html[data-tema=oscuro] .jg-chat-form{border-color:var(--os-borde)}
html[data-tema=oscuro] .jg-chat>header small{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-chat-msg{color:var(--os-tx2)}
/* El nombre va en el color de cada uno, que se eligió pensando en un
   fondo blanco: sobre el oscuro se aclara un poco para que se lea. */
html[data-tema=oscuro] .jg-chat-msg b{color:color-mix(in srgb,var(--c,#aaa) 70%,#fff)}
html[data-tema=oscuro] .jg-chat-msg b small{background:var(--os-sup3);color:var(--os-tx3)}

/* Avisos */
html[data-tema=oscuro] .aviso,html[data-tema=oscuro] .jg-aviso{background:#2a2112;border-color:#6b532066;color:#e8cf95}
html[data-tema=oscuro] .aviso code,html[data-tema=oscuro] .aviso .jg-fin-m code{background:#ffffff14}
html[data-tema=oscuro] .jg-trampa{background:#3a1512;color:#ffb4a8}
html[data-tema=oscuro] .jg-f7-aviso{background:#2a2112;color:#e8cf95}

/* El cartel del final y los modales */
html[data-tema=oscuro] .jg-fin-gano{background:linear-gradient(160deg,#2a2144,#1d1830);border-color:#6c3ed2aa}
html[data-tema=oscuro] .jg-fin-gano .jg-fin-t{color:#c4b1ff}
html[data-tema=oscuro] .jg-fin-perdi,html[data-tema=oscuro] .jg-fin-mirando{background:linear-gradient(160deg,var(--os-sup2),var(--os-sup));border-color:var(--os-borde2)}
html[data-tema=oscuro] .jg-fin-empate{background:linear-gradient(160deg,#2c2415,#1f1a12);border-color:#e2c08d44}
html[data-tema=oscuro] .jg-fin-empate .jg-fin-t{color:#e8cf95}
html[data-tema=oscuro] .jg-fin-perdi .jg-fin-t,html[data-tema=oscuro] .jg-fin-mirando .jg-fin-t,html[data-tema=oscuro] .jg-fin-sub{color:var(--os-tx)}
html[data-tema=oscuro] .jg-fin-m{color:var(--os-tx2)}
html[data-tema=oscuro] .jg-fin-marca{border-top-color:#ffffff14}
html[data-tema=oscuro] .jg-fin-x{background:#ffffff12;color:var(--os-tx2)}
html[data-tema=oscuro] .jg-fin-x:hover{background:#ffffff22}
html[data-tema=oscuro] .jg-reglas .jg-fin-m code{background:#ffffff14}
html[data-tema=oscuro] .jg-revancha{background:#2a2144;border-color:#4b3a7a}
html[data-tema=oscuro] .jg-modal-s,html[data-tema=oscuro] .jg-color-libre,html[data-tema=oscuro] .jg-perfil-foto .btn-ghost{color:var(--os-tx2)}
html[data-tema=oscuro] .jg-perfil-av{background:var(--os-sup2);border-color:var(--os-borde2)}
html[data-tema=oscuro] .jg-campo>span{color:var(--os-tx2)}
html[data-tema=oscuro] .jg-color.on{border-color:var(--os-sup);box-shadow:0 0 0 2px var(--os-tx)}
html[data-tema=oscuro] .jg-color-libre input[type=color]{background:var(--os-sup2);border-color:var(--os-borde2)}

/* Clasificación: la tabla bajo el podio */
html[data-tema=oscuro] .jg-tabla th{border-bottom-color:var(--os-borde);color:var(--os-tx3)}
html[data-tema=oscuro] .jg-tabla td{border-bottom-color:var(--os-borde)}
html[data-tema=oscuro] .jg-barra-pc{background:var(--os-sup3)}
html[data-tema=oscuro] .jg-yo td,html[data-tema=oscuro] .jg-yo{background:#0d948818}
html[data-tema=oscuro] .jg-tabla tr.jg-rk-top:nth-child(1) td{background:#f4c54212}
html[data-tema=oscuro] .jg-tabla tr.jg-rk-top:nth-child(2) td{background:#cbd5e10d}
html[data-tema=oscuro] .jg-tabla tr.jg-rk-top:nth-child(3) td{background:#e89a5c10}

/* Escondite: las pistas de calor y el panel del visor */
html[data-tema=oscuro] .jg-calor-frio{background:#1d2a45}
html[data-tema=oscuro] .jg-calor-templado{background:#2c2715}

/* Cuadritos: el papel del tablero se oscurece con la página (los puntos

   blanca sobre blanco es ahora el que deja ver la negra sobre negro. */

html[data-tema=oscuro] .jg-cc-mios-t{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-cc-mios-n{color:var(--os-tx2)}
html[data-tema=oscuro] .jg-cc-pinta,html[data-tema=oscuro] .jg-cc-tog{background:var(--os-sup2);border-color:var(--os-borde2);color:var(--os-tx2)}
html[data-tema=oscuro] .jg-cc-pinta.sel,html[data-tema=oscuro] .jg-cc-tog.sel{background:#3a2e12;border-color:#e8b64a;color:#f2c14e}
html[data-tema=oscuro] .jg-cc-paso{background:var(--os-sup2)}
html[data-tema=oscuro] .jg-cc-lbl{color:var(--os-tx2)}

html[data-tema=oscuro] .jg-cc-mm{background:var(--os-sup);color:var(--os-tx)}

html[data-tema=oscuro] .jg-cc-hist-t{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-cc-h{border-left-color:var(--os-borde2)}
html[data-tema=oscuro] .jg-cc-hist-t+.jg-cc-h{color:var(--os-tx)}
html[data-tema=oscuro] .jg-cc-h.h-ronda,html[data-tema=oscuro] .jg-cc-h.h-anula{color:var(--os-tx3)}
/* El manual de reglas (la mesa del UNO es oscura en los dos temas) */
html[data-tema=oscuro] .jg-reglas{background:var(--os-sup);color:var(--os-tx)}
html[data-tema=oscuro] .jg-reglas-cab,html[data-tema=oscuro] .jg-reglas-tabs,html[data-tema=oscuro] .jg-reglas-pie{border-color:var(--os-borde)}

html[data-tema=oscuro] .jg-reglas-x{background:var(--os-sup3);color:var(--os-tx)}html[data-tema=oscuro] .jg-reglas-x:hover{background:#3a3150}
html[data-tema=oscuro] .jg-reglas-tabs{background:var(--os-sup2)}
html[data-tema=oscuro] .jg-reglas-tabs button{background:var(--os-sup);border-color:var(--os-borde2);color:var(--os-tx2)}

html[data-tema=oscuro] .jg-reglas-cuerpo h3,html[data-tema=oscuro] .jg-reglas-cuerpo b{color:#fff}
/* Catan: el mar y la isla se quedan como están; se oscurece la mano, el

html[data-tema=oscuro] .jg-ct-mano-t{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-ct-carta{border-color:var(--os-sup3)}
html[data-tema=oscuro] .jg-ct-carta b{border-color:var(--os-sup);background:#0b0a10}
html[data-tema=oscuro] .jg-ct-guia,html[data-tema=oscuro] .jg-ct-panel,html[data-tema=oscuro] .jg-ct-trato{color:var(--os-tx2)}
html[data-tema=oscuro] .jg-ct-accion,html[data-tema=oscuro] .jg-ct-tog,html[data-tema=oscuro] .jg-ct-res,html[data-tema=oscuro] .jg-ct-tab,
html[data-tema=oscuro] .jg-ct-contador,html[data-tema=oscuro] .jg-ct-trato,html[data-tema=oscuro] .jg-ct-victima{background:var(--os-sup2);border-color:var(--os-borde2);color:var(--os-tx)}
html[data-tema=oscuro] .jg-ct-accion small,html[data-tema=oscuro] .jg-ct-res small,html[data-tema=oscuro] .jg-ct-lbl,html[data-tema=oscuro] .jg-ct-resp,html[data-tema=oscuro] .jg-ct-victima small{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-ct-accion.on,html[data-tema=oscuro] .jg-ct-tog.sel,html[data-tema=oscuro] .jg-ct-res.sel,html[data-tema=oscuro] .jg-ct-tab.on,
html[data-tema=oscuro] .jg-ct-contador.con{background:#3a2a14;border-color:#d9822b}
html[data-tema=oscuro] .jg-ct-contador b{color:var(--os-tx)}

html[data-tema=oscuro] .jg-ct-comercio,html[data-tema=oscuro] .jg-ct-hist{background:var(--os-sup);border-color:var(--os-borde);color:var(--os-tx2)}
html[data-tema=oscuro] .jg-ct-panel{background:#2a2114;border-color:#5a4524}
html[data-tema=oscuro] .jg-ct-hist-t{color:var(--os-tx3)}
html[data-tema=oscuro] .jg-ct-hist-t+.jg-ct-h{color:var(--os-tx)}

html[data-tema=oscuro] .jg-ct-chip.mar{background:#16304a;color:#9fd0ff}

/* Sala: tablero estable y conversación lateral, sin encogerlo en móvil. */
main.jg-ancho{max-width:1480px}
.jg-partida-layout{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:24px;align-items:start}
.jg-partida-juego{min-width:0}
.jg-partida-layout>.jg-chat{position:sticky;top:20px;margin:0;display:flex;flex-direction:column;height:min(650px,calc(100dvh - 84px))}
.jg-partida-layout .jg-chat>header{flex-wrap:wrap;gap:4px}
.jg-partida-layout .jg-chat-lista{flex:1;min-height:160px;max-height:none}
.jg-partida-layout .jg-chat-form{padding:12px;gap:6px}
.jg-quien-chip{position:relative;padding-right:32px}
.jg-quien-chip .jg-voto{position:absolute;right:5px}
.jg-cr .jg-barra{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-height:116px}
.jg-cr .jg-grow{display:none}
.jg-cr .jg-fase{height:42px;line-height:20px;overflow:hidden;align-items:center}
.jg-cr .jg-marcador{min-height:32px;display:flex;flex-wrap:wrap}
.jg-cr .jg-pie{min-height:74px}
.jg-pr-c.joker{background:linear-gradient(145deg,#fff5ce,#eee2ff);border-color:#d5ab53;color:#61379a}
.jg-pr-c.joker.roja{background:linear-gradient(145deg,#fff5ce,#ffdce4);color:#b8214a}
.jg-pr-joker-t{position:absolute;bottom:13%;left:0;width:100%;text-align:center;font-size:8px;letter-spacing:1px}
.jg-solo-barra{display:flex;align-items:center;justify-content:flex-start;gap:18px;flex-wrap:wrap;margin:0 0 22px}
.jg-solo-titulo{display:grid;gap:4px}.jg-solo-titulo small{font-size:9px;letter-spacing:1.5px;color:#81909e}.jg-solo-titulo strong{font-size:26px}
.jg-solo-barra nav{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.jg-solo-barra a.btn2{display:inline-flex;align-items:center;text-decoration:none}
.jg-solo-barra .on{border-color:#0d9488;color:#0d9488;background:#e9f4f2}
.jg-solo-frame{display:block;width:100%;border:0;background:transparent;color-scheme:normal}
/* sortEm: solo el juego, a pantalla entera de la ventana (armazon pone la clase). */
html.jg-sortem,html.jg-sortem body{overflow:hidden;height:100%}
html.jg-sortem .head,html.jg-sortem .bar,html.jg-sortem .rp-fab,html.jg-sortem .jg-solo-barra{display:none!important}
html.jg-sortem #pantalla{position:fixed;inset:0;z-index:1;margin:0;max-width:none;padding:0;background:#10051f}
html.jg-sortem .jg-solo-frame{height:100%!important}
@media(max-width:1050px){.jg-partida-layout{grid-template-columns:minmax(0,1fr)}.jg-partida-layout>.jg-chat{position:static;height:300px}.jg-solo-barra nav{margin-left:0}}
/* ---------- logros ---------- */
.jg-lg{display:grid;gap:18px;max-width:980px;margin:0 auto}
.jg-lg-desafio{background:linear-gradient(135deg,#2b1f55,#6a3fd6 60%,#c0569a);color:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 10px 30px #3b2a7a33}
.jg-lg-desafio header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.jg-lg-desafio h2{margin:0;font-size:22px}
.jg-lg-desafio p{margin:0;opacity:.9}
.jg-lg-retos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.jg-lg-reto{background:#ffffff1c;border:1px solid #ffffff2e;border-radius:14px;padding:12px;display:grid;gap:8px;align-content:start}
.jg-lg-reto>small{text-transform:uppercase;letter-spacing:.08em;font-size:11px;opacity:.8;font-weight:700}
.jg-lg-reto.joya{background:#ffd36a26;border-color:#ffd36a66}
.jg-lg-reto p{margin:0;font-size:14px}
.jg-lg-rival{display:grid}
.jg-lg-rival b{font-size:17px}
.jg-lg-rival span{font-size:13px;opacity:.85}
.jg-lg-mini{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#00000026;border:0;border-radius:10px;color:inherit;padding:8px 10px;cursor:pointer;font:inherit}
.jg-lg-mini:hover{background:#00000040}
.jg-lg-mini>span:last-child{display:grid;gap:2px}
.jg-lg-mini em{font-style:normal;font-size:12px;opacity:.85}
.jg-lg-mini i{font-size:12px;color:#ffe08a}
.jg-lg-podio{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.jg-lg-podio span{display:flex;gap:6px;align-items:center;background:#ffffff1f;border-radius:999px;padding:4px 12px 4px 6px;font-size:14px}
.jg-lg-podio span.yo{background:#fff;color:#2b1f55}
.jg-lg-podio i{font-style:normal;min-width:22px;text-align:center}
.jg-lg-podio b{margin-left:4px}
.jg-lg-chips{display:flex;flex-wrap:wrap;gap:8px}
.jg-lg-chip{display:flex;align-items:center;gap:8px;border:1px solid #0000001a;background:#fff;color:var(--jg-ink);border-radius:999px;padding:6px 12px 6px 10px;cursor:pointer;font:inherit;font-size:14px;box-shadow:inset 4px 0 0 var(--c)}
.jg-lg-chip small{color:var(--jg-muted);font-weight:700}
.jg-lg-chip.on{background:var(--c);color:#fff;border-color:transparent;box-shadow:0 4px 14px #0002}
.jg-lg-chip.on small{color:#ffffffd0}
.jg-lg-juego{background:#fff;border-radius:18px;padding:16px 18px;border-top:6px solid var(--c);box-shadow:0 6px 22px #2321370f}
.jg-lg-juego>header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.jg-lg-juego h2{margin:0}
.jg-lg-juego>header span{color:var(--jg-muted);font-size:14px}
.jg-lg-lideres{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.jg-lg-lideres span{background:#f3f0fa;border-radius:999px;padding:4px 12px;font-size:14px}
.jg-lg-lideres span.yo{outline:2px solid var(--c)}
.jg-lg-lideres i{font-style:normal;margin-right:4px}
.jg-lg-lideres em{color:var(--jg-muted)}
.jg-lg-lista{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.jg-lg-lista li{display:grid;grid-template-columns:44px 1fr 120px;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:#f7f5fb;filter:saturate(.35);opacity:.85}
.jg-lg-lista li.mio{background:#fff;filter:none;opacity:1;box-shadow:inset 4px 0 0 var(--c),0 2px 10px #0000000d}
.jg-lg-ico{font-size:26px;line-height:1;display:grid;place-items:center}
.jg-lg-lista li:not(.mio) .jg-lg-ico{filter:grayscale(1)}
.jg-lg-txt{display:grid;gap:3px;min-width:0}
.jg-lg-txt>span{font-size:14px;color:var(--jg-muted)}
.jg-lg-modo,.jg-lg-ok{font-style:normal;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:2px}
.jg-lg-modo{background:#ece7fb;color:#5a3cc0}
.jg-lg-ok{background:#d9f5e3;color:#16774a}
.jg-lg-quien{display:flex;flex-wrap:wrap;gap:4px}
.jg-lg-quien i{font-style:normal;font-size:12px;background:#0000000d;border-radius:999px;padding:1px 8px}
.jg-lg-quien i.yo{background:var(--c);color:#fff}
.jg-lg-quien i.mas{font-weight:700}
.jg-lg-pct{display:grid;gap:4px;text-align:right}
.jg-lg-pct b{font-size:18px}
.jg-lg-pct small{color:var(--jg-muted);font-size:12px}
.jg-lg-barra{height:6px;border-radius:999px;background:#0000001a;overflow:hidden}
.jg-lg-barra span{display:block;height:100%;background:var(--c);border-radius:inherit}
@media (max-width:620px){.jg-lg-lista li{grid-template-columns:36px 1fr}.jg-lg-pct{grid-column:2;text-align:left}}
.jg-logro-toast{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;gap:12px;align-items:center;max-width:340px;background:linear-gradient(135deg,#2b1f55,#6a3fd6);color:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 12px 30px #0005;cursor:pointer;animation:jgLogroEntra .45s cubic-bezier(.2,1.4,.4,1)}
.jg-logro-toast.sale{transition:opacity .4s,transform .4s;opacity:0;transform:translateY(20px)}
.jg-logro-toast .i{font-size:34px}
.jg-logro-toast>span:last-child{display:grid}
.jg-logro-toast small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#ffe08a;font-weight:700}
.jg-logro-toast b{font-size:16px}
.jg-logro-toast em{font-style:normal;font-size:13px;opacity:.85}
@keyframes jgLogroEntra{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
html[data-tema=oscuro] .jg-lg-chip{background:var(--os-sup);border-color:var(--os-borde);color:var(--os-tx)}
html[data-tema=oscuro] .jg-lg-chip.on{background:var(--c);color:#fff}
html[data-tema=oscuro] .jg-lg-juego{background:var(--os-sup);box-shadow:none}
html[data-tema=oscuro] .jg-lg-lideres span{background:var(--os-sup2)}
html[data-tema=oscuro] .jg-lg-lista li{background:var(--os-sup2)}
html[data-tema=oscuro] .jg-lg-lista li.mio{background:var(--os-sup3)}
html[data-tema=oscuro] .jg-lg-modo{background:#3a2f63;color:#cdbdff}
html[data-tema=oscuro] .jg-lg-ok{background:#1c4a33;color:#9be8bd}
html[data-tema=oscuro] .jg-lg-quien i{background:#ffffff14}
html[data-tema=oscuro] .jg-lg-barra{background:#ffffff1a}
/* ===== Modo inmersivo (⛶): la sala ocupa la pantalla y el chat flota ===== */
.jg-chat-abre{display:none}
.jg-inm-btn{white-space:nowrap}
html.jg-inm,html.jg-inm body{overflow:hidden;height:100%}
html.jg-inm .head,html.jg-inm .bar,html.jg-inm .rp-fab{display:none!important}
html.jg-inm #pantalla{position:fixed;inset:0;z-index:1;overflow:auto;overscroll-behavior:contain;background:#f5f4fa;display:flex;flex-direction:column;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);margin:0;max-width:none}

html.jg-inm .jg-partida-layout .jg-chat-lista{display:flex;flex-direction:column;justify-content:flex-end;gap:3px;width:100%;min-height:0;max-height:34vh;overflow:hidden;padding:0;flex:none}

   son una tira que se desliza en vez de cuatro filas de botones. */
.jg-rk-sel{display:inline-flex;align-items:center;gap:7px;padding:7px 13px 7px 9px;border:1px solid #0000001a;border-radius:999px;background:#fff;color:var(--jg-ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,transform .15s}

.jg-rk-sel.on{background:var(--c);border-color:transparent;color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--c) 45%,transparent)}

.jg-rk-sep{align-self:center;width:100%;margin:6px 0 -2px 4px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--jg-muted);white-space:nowrap}

.jg-lg-chip.lleno small::after{content:" ★";color:#e8b64a}

/* ============================================================
   El perfil público (juegos/perfil-vista.js): la foto con su marco,
   la mini tarjeta que se abre al tocar una foto y la página
   #perfil/<uid>. Los marcos son CSS sobre `.jg-av`, que lee `--t` (el
   lado) y `--c` (el color de la persona): por eso el mismo marco vale
   para el chip de 20 px de la sala y el retrato de 116 de la página.
   Lo de fuera de la foto va en ::before (detrás) y ::after (encima).
   ============================================================ */
.jg-av{--t:40px;--c:#0d9488;position:relative;display:inline-grid;place-items:center;width:var(--t);height:var(--t);flex:0 0 auto;border-radius:50%;vertical-align:middle;isolation:isolate}
.jg-av>img,.jg-av>i{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:calc(var(--t)*.42);line-height:1;color:#fff;background:var(--c)}
.jg-av[data-perfil],[data-perfil]{cursor:pointer}
.jg-av::before,.jg-av::after{content:"";position:absolute;pointer-events:none;border-radius:50%}
.jg-av::before{z-index:0}.jg-av::after{z-index:2}
.jg-marco-nada::before,.jg-marco-nada::after{display:none}
