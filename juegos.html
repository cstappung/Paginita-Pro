/* ---------- UNO ----------
   Una carta es un <span>: esquinas, el óvalo blanco inclinado y el
   símbolo en el color de la carta; el comodín lleva la rueda de cuatro
   colores dentro del óvalo. El tamaño lo dan tres clases: normal (mano),
   `mini` (anuncios, tapas) y `tope` (el descarte). */
.jg-uno,.jg-un-vuelos{--un-R:#d72600;--un-A:#e8c300;--un-V:#379711;--un-Z:#0956bf;--un-N:#1b1b1f}
.jg-un-modo{font:600 11px 'IBM Plex Mono',monospace;border-radius:100px;padding:3px 10px;background:#3a1d17;color:#ffb4a3}.jg-un-modo:empty{display:none}
.jg-un-c{--k:var(--un-N);position:relative;display:inline-block;box-sizing:border-box;width:62px;height:92px;border-radius:9px;background:var(--k);border:3px solid #fff;box-shadow:0 0 0 1px #0002,0 4px 10px #0003;color:#fff;overflow:hidden;flex-shrink:0;vertical-align:middle;transition:transform .15s,box-shadow .15s,opacity .15s,filter .15s}
.jg-un-c.c-R{--k:var(--un-R)}.jg-un-c.c-A{--k:var(--un-A)}.jg-un-c.c-V{--k:var(--un-V)}.jg-un-c.c-Z{--k:var(--un-Z)}.jg-un-c.c-N{--k:var(--un-N)}
.jg-un-c .ov{position:absolute;left:13%;right:13%;top:17%;bottom:17%;border-radius:50%;background:#fff;transform:rotate(28deg);display:grid;place-items:center;overflow:hidden}
.jg-un-c .ov em{position:relative;transform:rotate(-28deg);font:800 22px/1 'IBM Plex Mono',monospace;font-style:normal;color:var(--k);text-shadow:1px 1px 0 #0002;white-space:nowrap}
.jg-un-c.c-N .ov{background:var(--un-N)}.jg-un-c.c-N .ov em{color:#fff;text-shadow:0 1px 3px #000}
.jg-un-c .rueda{position:absolute;inset:0;background:conic-gradient(var(--un-R) 0 25%,var(--un-Z) 0 50%,var(--un-V) 0 75%,var(--un-A) 0)}
.jg-un-c .esq{position:absolute;left:4px;top:2px;font:800 11px/1 'IBM Plex Mono',monospace;font-style:normal;color:#fff;text-shadow:0 1px 1px #0006}
.jg-un-c .esq.b{left:auto;top:auto;right:4px;bottom:2px;transform:rotate(180deg)}
.jg-un-c u{position:absolute;right:2px;top:1px;font-size:12px;text-decoration:none;filter:drop-shadow(0 1px 1px #0008)}
.jg-un-c.mentira{border-style:dashed}
.jg-un-c.dorso{background:radial-gradient(ellipse at center,#e03a1c,#1b1b1f 72%)}
.jg-un-c.dorso .ov{background:#d72600;left:10%;right:10%;top:22%;bottom:22%;transform:rotate(-24deg)}
.jg-un-c.dorso .ov em{transform:rotate(24deg);color:#ffe14d;font-size:15px;letter-spacing:-1px;text-shadow:1px 2px 0 #1b1b1f}
.jg-un-c.mini{width:36px;height:54px;border-width:2px;border-radius:6px}.jg-un-c.mini .ov em{font-size:12px}.jg-un-c.mini .esq{font-size:8px;left:2px}.jg-un-c.mini .esq.b{display:none}.jg-un-c.mini u{font-size:9px}
.jg-un-c.dorso.mini .ov em{font-size:9px}
.jg-un-c.tope{width:92px;height:136px;border-width:4px;border-radius:12px;box-shadow:0 0 0 1px #0003,0 10px 24px #0007}.jg-un-c.tope .ov em{font-size:32px}.jg-un-c.tope .esq{font-size:15px;left:6px;top:4px}.jg-un-c.tope .esq.b{right:6px;bottom:4px}
.jg-un-c.anillo-R{box-shadow:0 0 0 4px var(--un-R),0 10px 24px #0007}.jg-un-c.anillo-A{box-shadow:0 0 0 4px var(--un-A),0 10px 24px #0007}.jg-un-c.anillo-V{box-shadow:0 0 0 4px var(--un-V),0 10px 24px #0007}.jg-un-c.anillo-Z{box-shadow:0 0 0 4px var(--un-Z),0 10px 24px #0007}
.jg-un-punto{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--un-N);vertical-align:middle}
.jg-un-punto.c-R{background:var(--un-R)}.jg-un-punto.c-A{background:var(--un-A)}.jg-un-punto.c-V{background:var(--un-V)}.jg-un-punto.c-Z{background:var(--un-Z)}

/* La mesa del UNO es oscura en los dos temas, como el tapete de Flip 7:
   una sala de luz baja con el fieltro en el centro. Por eso no tiene
   gemelos en el bloque oscuro del final, y lo compartido que cae dentro
   (barra, pie, notas) se reviste aquí con `:root .jg-uno`, que pesa más
   que `html[data-tema=oscuro] .jg-barra`. */
.jg-uno{position:relative;background:#15101f;color:#efe8f7;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px #1c112840}
:root .jg-uno .jg-barra{background:#1d1529;border:0;border-bottom:1px solid #ffffff12;border-radius:0;color:#efe8f7}
:root .jg-uno .jg-fase{color:#efe8f7;font-weight:600}
:root .jg-uno .jg-pie{background:transparent;border:0;border-radius:0;justify-content:center;color:#efe8f7;min-height:64px;padding:10px 18px 20px}
:root .jg-uno .jg-nota{color:#b3a8c4}
:root .jg-uno .jg-trampa{background:#3d1418;border-left-color:#ff6b5c;color:#ffb4a8}

/* La escena: la sala (fieltro + asientos), la mano y el pie. Cuando me
   toca, la luz sube desde abajo. */
.jg-un-escena{position:relative;background:radial-gradient(ellipse 85% 65% at 50% 40%,#2b1942 0%,#180f24 58%,#0f0a17 100%);transition:box-shadow .6s}
.jg-un-escena.mia{box-shadow:inset 0 -90px 90px -60px #ffd76a38,inset 0 0 0 1px #ffd76a30}
@property --aura{syntax:'<color>';inherits:true;initial-value:#ffffff10}
.jg-un-sala{--aura:#ffffff10;position:relative;height:clamp(470px,52vw,580px);transition:--aura .8s}
.jg-un-sala[data-tinte=R]{--aura:#ff4a24}.jg-un-sala[data-tinte=A]{--aura:#ffd21f}.jg-un-sala[data-tinte=V]{--aura:#4fd12a}.jg-un-sala[data-tinte=Z]{--aura:#2f86ff}.jg-un-sala[data-tinte=N]{--aura:#c9a7ff}

/* El fieltro: una elipse verde con canto de madera. */
.jg-un-fieltro{position:absolute;inset:70px 9% 64px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 1px 1px,#ffffff0a 1px,transparent 1.5px) 0 0/5px 5px,radial-gradient(ellipse at 50% 38%,#1f7d6c 0%,#145a4f 46%,#0b3530 100%);
  box-shadow:0 0 0 9px #5c3620,0 0 0 12px #3a2014,0 0 0 13px #9a6a4655,0 28px 60px #000b,inset 0 0 70px #000a,inset 0 14px 30px #ffffff12}
.jg-un-aura{position:absolute;inset:-8%;border-radius:50%;background:radial-gradient(ellipse at center,var(--aura) 0%,transparent 62%);opacity:.3;mix-blend-mode:screen;pointer-events:none}
.jg-un-sala.pena .jg-un-aura{--aura:#ff3b1f;animation:jgUnPulso 1.1s ease-in-out infinite}
@keyframes jgUnPulso{50%{opacity:.62}}

/* El anillo del sentido: gira como corre el turno, y se da la vuelta
   (en espejo) cuando alguien juega un Reverse. */
.jg-un-giro{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;transform:scale(1,.6);opacity:0;pointer-events:none;transition:opacity .6s,transform .9s cubic-bezier(.6,0,.3,1)}
.jg-un-sala.juega .jg-un-giro{opacity:.5}
.jg-un-sala.inv .jg-un-giro{transform:scale(-1,.6)}
.jg-un-giro svg{width:100%;height:100%;overflow:visible;animation:jgUnGira 26s linear infinite}
.jg-un-giro circle{fill:none;stroke:#ffe9a8;stroke-width:1.6;stroke-dasharray:2 9;stroke-linecap:round}
.jg-un-giro polygon{fill:#ffe9a8}
@keyframes jgUnGira{to{transform:rotate(360deg)}}

/* El foco: un haz desde el centro hacia quien tiene que mover. */
.jg-un-foco{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;transition:opacity .45s}
.jg-un-foco i{position:absolute;left:0;top:-45px;height:90px;width:var(--l,100px);transform-origin:0 50%;transform:rotate(var(--a,90deg));
  background:linear-gradient(90deg,transparent 8%,color-mix(in srgb,var(--c,#ffd76a) 30%,transparent) 55%,color-mix(in srgb,var(--c,#ffd76a) 62%,transparent));
  clip-path:polygon(0 47%,100% 0,100% 100%,0 53%);filter:blur(7px);mix-blend-mode:screen;opacity:.8;transition:transform .75s cubic-bezier(.5,0,.25,1),width .75s cubic-bezier(.5,0,.25,1)}
.jg-un-foco.off{opacity:0}

/* El centro: mazo y descarte. */
.jg-un-mesa{position:relative;z-index:1;display:grid;justify-items:center;gap:16px;color:#f0eaf8}
.jg-un-aviso{display:grid;justify-items:center;gap:16px;font:600 14px 'IBM Plex Mono',monospace;color:#cfe8e0}
.jg-un-baraja{position:relative;width:92px;height:136px}
.jg-un-baraja .jg-un-c{position:absolute;left:0;top:0;animation:jgUnBaraja 1.1s ease-in-out infinite}
.jg-un-baraja .jg-un-c+.jg-un-c{animation-delay:-.55s}
@keyframes jgUnBaraja{25%{transform:translateX(-40px) rotate(-10deg)}75%{transform:translateX(40px) rotate(10deg)}}
.jg-un-pilas{display:flex;align-items:center;gap:48px}
.jg-un-mazo{position:relative;width:92px;height:136px;padding:0;border:0;background:none;cursor:default;border-radius:12px;color:inherit}
.jg-un-mazo .jg-un-c{position:absolute;left:0;top:0}
.jg-un-mazo .m3{transform:translate(-6px,6px)}.jg-un-mazo .m2{transform:translate(-3px,3px)}
.jg-un-mazo .m1{transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .25s}
.jg-un-mazo.vivo{cursor:pointer;animation:jgUnFlota 2.4s ease-in-out infinite}
.jg-un-mazo.vivo .m1{box-shadow:0 0 0 3px #ffe14d,0 0 26px #ffe14d99,0 10px 24px #0007}
.jg-un-mazo.vivo:hover .m1{transform:translateY(-9px) rotate(-4deg)}
@keyframes jgUnFlota{50%{transform:translateY(-4px)}}
.jg-un-roba-t{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translateX(-50%);font:700 11px 'IBM Plex Mono',monospace;letter-spacing:1.6px;text-transform:uppercase;color:#ffe14d;white-space:nowrap;text-shadow:0 0 10px #ffe14d99}
.jg-un-descarte{position:relative;width:92px;height:136px}
.jg-un-descarte .jg-un-c{position:absolute;left:0;top:0;transform:translate(var(--dx,0px),var(--dy,0px)) rotate(var(--g,0deg))}
.jg-un-descarte .pila{filter:brightness(.72) saturate(.85);box-shadow:0 0 0 1px #0003,0 3px 8px #0006}
.jg-un-c.arriba{z-index:2}
.jg-un-c.llega{visibility:hidden}
.jg-un-c.golpe{animation:jgUnGolpe .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes jgUnGolpe{from{scale:1.16}}
.jg-un-c.oculta{border-style:dashed}
.jg-un-c.oculta:after{content:"🎭";position:absolute;right:5px;top:5px;font-size:18px;filter:drop-shadow(0 1px 2px #000a)}
.jg-un-info{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;min-height:26px}
.jg-un-color{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:100px;background:#00000048;border:1px solid #ffffff1c;font:600 12px 'IBM Plex Mono',monospace;text-transform:capitalize;color:#f0eaf8}
.jg-un-pena{padding:4px 12px;border-radius:100px;background:#d72600;color:#fff;font:700 13px 'IBM Plex Mono',monospace;box-shadow:0 0 18px #ff3b1f88;animation:jgUnLatido 1.2s ease-in-out infinite}.jg-un-pena small{font-weight:500;opacity:.85}

/* Los asientos, en elipse alrededor del fieltro (`--x`/`--y` vienen de
   uno.js). La placa no lleva transform propio: `sacude` lo anima. */
.jg-un-asientos{position:absolute;inset:62px max(70px,7%) 50px;pointer-events:none}
.jg-un-asiento{--c:#888;position:absolute;left:var(--x);top:var(--y);width:124px;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:5px;pointer-events:auto;transition:opacity .4s,filter .4s,left .6s,top .6s}
.jg-un-asientos[data-n="8"] .jg-un-asiento,.jg-un-asientos[data-n="9"] .jg-un-asiento,.jg-un-asientos[data-n="10"] .jg-un-asiento{width:106px}
.jg-un-asiento.fuera,.jg-un-asiento.elim{opacity:.42;filter:grayscale(.85)}
.jg-un-placa{position:relative;display:flex;align-items:center;gap:7px;width:100%;box-sizing:border-box;padding:5px 8px 5px 5px;border-radius:100px;background:linear-gradient(180deg,#2d2242,#1c1428);border:1px solid #ffffff1c;box-shadow:0 6px 16px #0009;transition:box-shadow .35s,border-color .35s}
.jg-un-asiento.yo .jg-un-placa{background:linear-gradient(180deg,#3b2d55,#241a34)}
.jg-un-asiento.turno .jg-un-placa{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 0 24px color-mix(in srgb,var(--c) 55%,transparent),0 6px 16px #0009;animation:jgUnTurno 1.6s ease-in-out infinite}
@keyframes jgUnTurno{50%{box-shadow:0 0 0 3px var(--c),0 0 40px color-mix(in srgb,var(--c) 80%,transparent),0 6px 16px #0009}}
.jg-un-asiento.gana .jg-un-placa{border-color:#f2c14e;background:linear-gradient(180deg,#4a3a14,#2b2110);box-shadow:0 0 0 2px #f2c14e,0 0 34px #f2c14e88}
.jg-un-ava{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:var(--c);color:#fff;font-weight:700;font-size:12px;overflow:hidden;box-shadow:0 0 0 2px #1c1428,0 0 0 3.5px var(--c)}.jg-un-ava img{width:100%;height:100%;object-fit:cover}
.jg-un-nom{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;color:#efe8f7}
.jg-un-n{font:700 12px 'IBM Plex Mono',monospace;color:#1a1422;background:#efe8f7;border-radius:100px;min-width:22px;padding:2px 6px;box-sizing:border-box;text-align:center}
.jg-un-asiento.uno .jg-un-n{background:#d72600;color:#fff}
.jg-un-piensa{position:absolute;left:50%;top:-11px;transform:translateX(-50%);display:flex;gap:3px;padding:4px 7px;border-radius:100px;background:var(--c);box-shadow:0 2px 8px #0007}
.jg-un-piensa i{width:4px;height:4px;border-radius:50%;background:#fff;animation:jgUnPiensa 1s ease-in-out infinite}
.jg-un-piensa i:nth-child(2){animation-delay:.15s}.jg-un-piensa i:nth-child(3){animation-delay:.3s}
@keyframes jgUnPiensa{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-3px);opacity:1}}
.jg-un-abanico{position:relative;width:100%;height:40px}
.jg-un-abanico i{position:absolute;left:calc(50% - 12px);bottom:0;width:24px;height:36px;box-sizing:border-box;border-radius:4px;border:1.5px solid #fff;background:radial-gradient(ellipse at center,#e03a1c,#1b1b1f 75%);box-shadow:0 1px 4px #0007;transform-origin:50% 130%;transform:rotate(calc((var(--k) - (var(--n) - 1) / 2) * 9deg));transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.jg-un-marcas{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.jg-un-marca{font:600 10px 'IBM Plex Mono',monospace;padding:2px 7px;border-radius:100px;background:#ffffff1a;color:#d9cfe6}
.jg-un-marca.sig{background:#16304f;color:#9cc8ff}
.jg-un-marca.uno{background:#d72600;color:#fff;animation:jgUnLatido 1s ease-in-out 3}
.jg-un-marca.olvido{background:#3d3010;color:#ffd36b}
.jg-un-marca.elim{background:#3d1418;color:#ff9da6}
.jg-un-marca.moneda{background:#ffffff14;font-size:12px}.jg-un-marca.moneda.usada{opacity:.35;filter:grayscale(1)}
.jg-un-pilla{font:700 11px 'IBM Plex Mono',monospace;padding:3px 9px;border-radius:100px;border:0;background:#d72600;color:#fff;cursor:pointer;box-shadow:0 0 14px #ff3b1f88;animation:jgUnLatido .8s ease-in-out infinite}.jg-un-pilla:disabled{opacity:.5;animation:none;cursor:default}
.jg-un-tapa{display:flex;align-items:center;justify-content:center;gap:4px}.jg-un-tapa b{font-size:16px}.jg-un-tapa b.ok{color:#5fd38a}.jg-un-tapa b.no{color:#ff7a6b}
@keyframes jgUnLatido{50%{transform:scale(1.2)}}

/* La mano, en abanico. El botón se queda quieto (su sitio en el abanico)
   y lo que sube al pasar el ratón es la carta de dentro: si subiera el
   botón, el puntero se quedaría debajo y la carta temblaría. */
.jg-un-mano{position:relative;z-index:2;padding:0 16px 4px;margin-top:-18px}
.jg-un-mano.vacia{display:none}
.jg-un-mano-t{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:#efe8f7}
.jg-un-mano-t span{font:600 11px 'IBM Plex Mono',monospace;color:#a89cbc}
.jg-un-uno{font:800 12px 'IBM Plex Mono',monospace;padding:6px 14px;border-radius:100px;border:2px solid #ff7a5c;background:transparent;color:#ff7a5c;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s}.jg-un-uno.on{background:#d72600;border-color:#d72600;color:#fff;box-shadow:0 0 18px #ff3b1f88}
.jg-un-cartas{display:flex;justify-content:safe center;align-items:flex-start;padding:34px 0 22px;min-height:92px}
.jg-un-cartas .jg-un-hueco{position:relative;flex-shrink:0;padding:0;border:0;background:none;border-radius:10px;cursor:pointer;transform-origin:50% 100%;transform:translateY(var(--y,0px)) rotate(var(--r,0deg));transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.jg-un-cartas .jg-un-hueco:disabled{cursor:default}
.jg-un-cartas .jg-un-hueco.ok{transform:translateY(calc(var(--y,0px) - 10px)) rotate(var(--r,0deg))}
.jg-un-cartas .jg-un-hueco .jg-un-c{transition:transform .22s cubic-bezier(.3,1.4,.5,1),box-shadow .2s,filter .2s}
.jg-un-cartas .jg-un-hueco.ok .jg-un-c{box-shadow:0 0 0 1px #0002,0 0 16px #ffe14d4d,0 6px 14px #0007}
.jg-un-cartas .jg-un-hueco.no .jg-un-c{filter:brightness(.5) saturate(.55)}
.jg-un-cartas .jg-un-hueco:not(:disabled):hover{z-index:80!important}
.jg-un-cartas .jg-un-hueco:not(:disabled):hover .jg-un-c{transform:translateY(-22px) rotate(calc(var(--r,0deg) * -1)) scale(1.1);box-shadow:0 0 0 2px #ffe14d,0 0 22px #ffe14d88,0 16px 26px #0009}
.jg-un-cartas .jg-un-hueco.sel{z-index:81!important}
.jg-un-cartas .jg-un-hueco.sel .jg-un-c{transform:translateY(-30px) rotate(calc(var(--r,0deg) * -1)) scale(1.12);box-shadow:0 0 0 3px #ffe14d,0 0 30px #ffe14daa,0 18px 28px #0009}
.jg-un-c.nueva{animation:jgUnNueva .45s cubic-bezier(.3,1.5,.5,1) backwards}
@keyframes jgUnNueva{from{transform:translateY(-34px) scale(.6);opacity:0}}
.jg-un-anuncios .jg-un-hueco{padding:0;border:0;background:none;cursor:pointer;border-radius:8px}
.jg-un-anuncios .jg-un-hueco:not(:disabled):hover .jg-un-c{transform:translateY(-5px)}
.jg-un-anuncios .jg-un-hueco.verdad .jg-un-c{box-shadow:0 0 0 3px #5fd38a,0 4px 10px #0005}

/* El pie: lo que me toca decidir. */
.jg-un-panel{display:grid;justify-items:center;gap:10px;width:100%;max-width:780px;text-align:center}
.jg-un-fila{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
.jg-un-lbl{font:600 12px 'IBM Plex Mono',monospace;color:#a89cbc}
.jg-un-anuncios{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.jg-un-boton{font:600 13px system-ui,sans-serif;padding:9px 16px;border-radius:12px;border:1px solid #ffffff26;background:#ffffff10;color:#efe8f7;cursor:pointer;transition:transform .12s,background .15s,box-shadow .15s}
.jg-un-boton:hover:not(:disabled){background:#ffffff20;transform:translateY(-1px)}.jg-un-boton:active:not(:disabled){transform:translateY(1px)}.jg-un-boton:disabled{opacity:.45;cursor:default}
.jg-un-boton small{font-weight:400;color:#b3a8c4}
.jg-un-boton.grande{padding:11px 22px;background:linear-gradient(180deg,#ffd76a,#e8a93a);border-color:#f5c350;color:#2a1a05;box-shadow:0 6px 20px #e8a93a44}.jg-un-boton.grande:hover:not(:disabled){background:linear-gradient(180deg,#ffe28a,#f0b54a)}.jg-un-boton.grande small{color:#5a3e10}
.jg-un-boton.malo{background:linear-gradient(180deg,#f0452a,#b31f00);border-color:#f0452a;color:#fff;box-shadow:0 6px 20px #d7260044}.jg-un-boton.malo:hover:not(:disabled){background:linear-gradient(180deg,#ff5a3c,#c42300)}.jg-un-boton.malo small{color:#ffd9d0}
.jg-un-boton.suave{background:none;border-color:transparent;color:#a89cbc;box-shadow:none}
.jg-un-boton.sel{background:#3d3010;border-color:#e8b64a}
.jg-un-boton.moneda{display:grid;gap:2px;text-align:left;max-width:260px;padding:10px 14px}.jg-un-boton.moneda small{font-size:11px}
.jg-un-bcol{--k:var(--un-N);min-width:78px;padding:9px 14px;border-radius:12px;border:0;background:var(--k);color:#fff;font:700 13px system-ui,sans-serif;text-transform:capitalize;cursor:pointer;box-shadow:inset 0 -3px 0 #0003,0 4px 14px color-mix(in srgb,var(--k) 45%,transparent);transition:transform .12s,box-shadow .15s}
.jg-un-bcol.c-R{--k:var(--un-R)}.jg-un-bcol.c-A{--k:var(--un-A);color:#3a2e00}.jg-un-bcol.c-V{--k:var(--un-V)}.jg-un-bcol.c-Z{--k:var(--un-Z)}
.jg-un-bcol:hover:not(:disabled){transform:translateY(-2px)}
.jg-un-bcol.sel{box-shadow:0 0 0 3px #fff,0 0 22px var(--k)}.jg-un-bcol:disabled{opacity:.4;cursor:default}

.jg-un-hist{display:grid;gap:3px;padding:12px 18px 16px;background:#110c19;border-top:1px solid #ffffff10;font-size:12px;color:#a89cbc}.jg-un-hist:empty{display:none}
.jg-un-hist-t{font:600 10px 'IBM Plex Mono',monospace;letter-spacing:1.2px;text-transform:uppercase;color:#7d7291;margin-bottom:2px}
.jg-un-h{padding-left:8px;border-left:2px solid #ffffff18}
.jg-un-hist-t+.jg-un-h{color:#efe8f7;font-weight:600;border-left-color:#ffd76a;animation:jgUnEntra .4s ease-out}
@keyframes jgUnEntra{from{opacity:0;transform:translateX(-8px)}}

/* Lo que vuela: una capa fija sobre toda la página (fuera de .jg-uno, por
   eso repite los colores). */
.jg-un-vuelos{position:fixed;inset:0;z-index:55;pointer-events:none;overflow:hidden}
.jg-un-vuelo{position:absolute;width:0;height:0;will-change:transform}
.jg-un-vuelo>.jg-un-c{position:absolute;left:0;top:0;transform:translate(-50%,-50%);box-shadow:0 0 0 1px #0003,0 18px 30px #000a}
.jg-un-grito{position:absolute;padding:6px 14px;border-radius:100px;font:800 15px/1 system-ui,sans-serif;letter-spacing:.3px;white-space:nowrap;background:#efe8f7;color:#1a1422;box-shadow:0 8px 22px #0009}
.jg-un-grito.oro{font-size:18px;background:linear-gradient(180deg,#ffe28a,#e8a93a);color:#2a1a05;box-shadow:0 0 26px #ffd76a88,0 8px 22px #0009}
.jg-un-grito.malo{background:linear-gradient(180deg,#ff5a3c,#b31f00);color:#fff}
.jg-un-grito.bien{background:linear-gradient(180deg,#5fd38a,#1d7a3a);color:#fff}
.jg-un-grito.turno{background:#15101f;color:#ffd76a;border:1.5px solid #ffd76a;box-shadow:0 0 24px #ffd76a66}
.jg-un-grito.suave{background:#2c2140;color:#d9cfe6;font-weight:600;font-size:13px}
.jg-un-onda{--k:#c9a7ff;position:absolute;width:150px;height:150px;border-radius:50%;border:6px solid var(--k);box-shadow:0 0 30px var(--k),inset 0 0 24px var(--k)}
.jg-un-onda.c-R{--k:var(--un-R)}.jg-un-onda.c-A{--k:var(--un-A)}.jg-un-onda.c-V{--k:var(--un-V)}.jg-un-onda.c-Z{--k:var(--un-Z)}

/* En el teléfono la elipse no cabe: los asientos pasan a una tira arriba
   y el fieltro queda solo con las dos pilas. */
@media(max-width:720px){
  .jg-un-sala{height:auto;display:flex;flex-direction:column;padding:4px 0 10px}
  /* Alineados abajo: estirados al alto del más alto, tu asiento (sin
     abanico) estiraba la placa y salía un círculo en vez de una píldora.
     Cada asiento mide lo que su nombre, hasta 150 px; la columna es
     `minmax(0,1fr)` porque la implícita crecía con el nombre entero y la
     placa se montaba sobre la del vecino. */
  .jg-un-asientos{position:static;order:-1;display:flex;align-items:flex-end;gap:8px;overflow-x:auto;padding:16px 12px 6px;pointer-events:auto;scrollbar-width:none}
  .jg-un-asiento,.jg-un-asientos[data-n] .jg-un-asiento{position:relative;left:auto;top:auto;transform:none;width:auto;min-width:96px;max-width:150px;flex-shrink:0;grid-template-columns:minmax(0,1fr)}
  .jg-un-abanico{height:30px}.jg-un-abanico i{width:18px;height:27px;left:calc(50% - 9px)}
  .jg-un-fieltro{position:relative;inset:auto;height:290px;margin:16px 18px 8px}
  .jg-un-foco{display:none}
  .jg-un-giro{transform:scale(.8,.5)}.jg-un-sala.inv .jg-un-giro{transform:scale(-.8,.5)}
  .jg-un-mano{margin-top:0}
  .jg-un-c{width:50px;height:74px}.jg-un-c .ov em{font-size:17px}
  .jg-un-c.tope,.jg-un-mazo,.jg-un-descarte,.jg-un-baraja{width:76px;height:112px}.jg-un-c.tope .ov em{font-size:26px}
  .jg-un-pilas{gap:30px}
  .jg-un-cartas{padding:30px 0 16px;min-height:74px}
}

/* Portada del vestíbulo */
.jg-portada-uno{background:radial-gradient(ellipse at center,#3a1d4f,#1c1128 75%)}
.jg-art-uno{position:relative;display:flex}
.jg-art-uno i{position:relative;width:58px;height:86px;border-radius:9px;background:var(--t);border:3px solid #fff;box-shadow:0 8px 18px #0008;margin-left:-16px;display:grid;place-items:center;overflow:hidden}
.jg-art-uno i:first-child{margin:0;transform:rotate(-16deg) translateY(10px)}.jg-art-uno i:nth-child(2){transform:rotate(-5deg)}.jg-art-uno i:nth-child(3){transform:rotate(6deg)}.jg-art-uno i:nth-child(4){transform:rotate(17deg) translateY(10px)}
.jg-art-uno i::before{content:'';position:absolute;left:12%;right:12%;top:18%;bottom:18%;border-radius:50%;background:#fff;transform:rotate(28deg)}
.jg-art-uno i:nth-child(4)::before{background:conic-gradient(#d72600 0 25%,#0956bf 0 50%,#379711 0 75%,#e8c300 0)}
.jg-art-uno span{position:relative;font:800 22px 'IBM Plex Mono',monospace;color:var(--t)}.jg-art-uno i:nth-child(4) span{color:#fff;text-shadow:0 1px 3px #000}
.jg-art-uno b{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%) rotate(-6deg);font:900 20px 'IBM Plex Mono',monospace;letter-spacing:1px;color:#ffe14d;text-shadow:2px 2px 0 #d72600}
/* Presidente: baraja francesa sobre la misma mesa oscura que UNO */
.jg-pr-c{background:#fbfaf6;border-color:#fbfaf6;color:#1b1b1f}
.jg-pr-c.roja{color:#c8102e}
.jg-pr-c .ov{background:none;transform:none}.jg-pr-c .ov em{transform:none;color:inherit;text-shadow:none;font-size:30px}
.jg-pr-c .esq{color:inherit;text-shadow:none;display:flex;flex-direction:column;align-items:center;gap:1px}.jg-pr-c .esq s{text-decoration:none;font-size:.9em}
.jg-pr-c.dorso{background:repeating-linear-gradient(45deg,#3b1f6e 0 6px,#52309a 0 12px);border-color:#fbfaf6;color:#ffd76a}
.jg-pr-c.dorso .ov em{font-size:26px;color:#ffd76a}
.jg-pr-c.mini .ov em{font-size:16px}.jg-pr-c.tope .ov em{font-size:44px}
.jg-pr-mesa{display:flex;flex-direction:column;align-items:center;gap:10px}
.jg-pr-baza{display:flex;align-items:flex-end;justify-content:center;gap:10px;flex-wrap:wrap}
.jg-pr-grupo{display:flex;flex-direction:column;align-items:center;gap:4px}.jg-pr-grupo>.jg-un-c+.jg-un-c{margin-left:-30px}
.jg-pr-grupo{flex-direction:row;flex-wrap:wrap;justify-content:center}.jg-pr-grupo small{flex-basis:100%;text-align:center;color:#fff9;font-size:11px}
.jg-pr-grupo.vieja{opacity:.55}.jg-pr-grupo.vieja>.jg-un-c+.jg-un-c{margin-left:-20px}
.jg-pr-nueva{animation:jgPrEntra .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes jgPrEntra{from{transform:translateY(40px) scale(.7);opacity:0}}
.jg-pr-info{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;text-align:center;font-size:13px}.jg-pr-info b{font-size:15px}
.jg-pr-cambios{list-style:none;margin:4px 0 0;padding:0;font-size:12px;text-align:left}.jg-pr-cambios li.hecho{opacity:.6}.jg-pr-cambios li.anulado{text-decoration:line-through;opacity:.5}
.jg-pr-rol{background:#ffd76a;color:#1b1b1f}
.jg-pr-control{display:flex;flex-direction:column;gap:6px;margin:10px auto;max-width:900px}
.jg-pr-marcador{max-width:900px;margin:10px auto;padding:0 18px;box-sizing:border-box;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px}
.jg-pr-marcador .jg-un-hist-t{grid-column:1/-1}
/* Cada fila del marcador (Presidente y Spicy): nombre a la izquierda,
   puntos en cifra fija a la derecha. Sin esto heredaba la letra del
   navegador y se leía como un formulario. */
.jg-pr-punto{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;background:#ffffff0d;font:500 13px/1.3 "IBM Plex Sans",system-ui,sans-serif;color:#efe8f7}
.jg-pr-punto span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jg-pr-punto b{font:800 15px "IBM Plex Mono",monospace;color:#ffd76a}
.jg-pr-punto.ido{opacity:.45}.jg-pr-punto.ido span{text-decoration:line-through}
.jg-portada-presidente{background:radial-gradient(ellipse at center,#3b1f6e,#150c28 75%)}
.jg-art-pr{position:relative;display:flex;align-items:center}
.jg-art-pr>b{position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:30px;filter:drop-shadow(0 3px 4px #0008)}
.jg-art-pr i{position:relative;width:54px;height:80px;border-radius:8px;background:#fbfaf6;box-shadow:0 8px 18px #0008;margin-left:-14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;color:var(--t)}
.jg-art-pr i:first-of-type{margin:0;transform:rotate(-15deg) translateY(8px)}.jg-art-pr i:nth-of-type(2){transform:rotate(-5deg)}.jg-art-pr i:nth-of-type(3){transform:rotate(6deg)}.jg-art-pr i:nth-of-type(4){transform:rotate(16deg) translateY(8px)}
.jg-art-pr span{font:800 22px 'IBM Plex Mono',monospace}.jg-art-pr s{text-decoration:none;font-size:20px}
.jg-art-pr em{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%) rotate(-5deg);font:900 18px 'IBM Plex Mono',monospace;font-style:normal;letter-spacing:1px;color:#ffd76a;text-shadow:2px 2px 0 #7c4dff}
/* ---------- Spicy ---------- */
.jg-sp-c{--sp:#e2412b;background:#fff8ef;border-color:#fff8ef;color:var(--sp)}
.jg-sp-c .ov{background:none;transform:none}.jg-sp-c .ov em{transform:none;text-shadow:none;font-size:30px;color:inherit}
.jg-sp-c .esq{color:var(--sp);text-shadow:none;font-weight:900}
.jg-sp-c.comodin{background:linear-gradient(135deg,#e2412b,#5dac3a 50%,#6b4a2b);color:#fff}.jg-sp-c.comodin .esq{color:#fff}.jg-sp-c.comodin .ov em{font-size:15px}
.jg-sp-c.comodin.num{background:linear-gradient(135deg,#ffb400,#e2412b)}
.jg-sp-c.dorso{background:repeating-linear-gradient(-45deg,#8e1b10 0 6px,#b0281a 0 12px);border-color:#fff8ef}.jg-sp-c.dorso .ov em{font-size:26px}
.jg-sp-c.mini .ov em{font-size:16px}
.jg-sp-pila{position:relative;width:calc(62px + var(--n,1) * 6px);height:96px}
.jg-sp-pila>.jg-un-c{position:absolute;top:0}
.jg-sp-pila>.jg-un-c:nth-child(1){left:0;transform:rotate(-8deg)}.jg-sp-pila>.jg-un-c:nth-child(2){left:6px;transform:rotate(-4deg)}.jg-sp-pila>.jg-un-c:nth-child(3){left:12px;transform:rotate(3deg)}.jg-sp-pila>.jg-un-c:nth-child(4){left:18px;transform:rotate(-2deg)}.jg-sp-pila>.jg-un-c:nth-child(5){left:24px;transform:rotate(5deg)}.jg-sp-pila>.jg-un-c:nth-child(6){left:30px}
.jg-sp-dice{--sp:#e2412b;display:flex;flex-direction:column;align-items:center;padding:8px 18px;border-radius:14px;background:#0006;border:2px solid var(--sp);color:#fff;box-shadow:0 0 22px color-mix(in srgb,var(--sp) 45%,transparent)}
.jg-sp-dice small{font-size:11px;color:#fffb}.jg-sp-dice b{font:900 34px 'IBM Plex Mono',monospace;line-height:1.1}.jg-sp-dice em{font-style:normal;font-size:13px}
.jg-sp-destape{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:14px;background:#0005;animation:jgPrEntra .35s cubic-bezier(.3,1.5,.5,1)}
.jg-sp-destape.verdad{box-shadow:0 0 0 2px #5fd38a,0 0 24px #5fd38a66}.jg-sp-destape.mentira{box-shadow:0 0 0 2px #ff5a4a,0 0 24px #ff5a4a66}
.jg-sp-destape.mentira .jg-pr-info b{color:#ff8b7f}.jg-sp-destape.verdad .jg-pr-info b{color:#8ff0b0}
.jg-sp-anuncios{flex-wrap:wrap;gap:6px}
.jg-portada-spicy{background:radial-gradient(ellipse at center,#8e1b10,#240805 75%)}
.jg-art-sp{position:relative;display:flex;align-items:center}
.jg-art-sp>b{position:absolute;left:50%;top:-36px;transform:translateX(-50%) rotate(-12deg);font-size:34px;filter:drop-shadow(0 3px 4px #0008)}
.jg-art-sp i{position:relative;width:54px;height:80px;border-radius:8px;background:#fff8ef;box-shadow:0 8px 18px #0008;margin-left:-14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;color:var(--t)}
.jg-art-sp i:first-of-type{margin:0;transform:rotate(-12deg) translateY(6px)}.jg-art-sp i:nth-of-type(2){transform:rotate(0deg)}.jg-art-sp i:nth-of-type(3){transform:rotate(12deg) translateY(6px)}
.jg-art-sp span{font:800 22px 'IBM Plex Mono',monospace}.jg-art-sp s{text-decoration:none;font-size:20px}
.jg-art-sp em{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%) rotate(-4deg);font:900 18px 'IBM Plex Mono',monospace;font-style:normal;letter-spacing:2px;color:#ffcf4a;text-shadow:2px 2px 0 #b0281a}
/* ---------- Memazo ----------
   El escenario es un plató de concurso morado en los dos temas (es arte,
   como el paño de Flip 7). Los memes miden en `cqw`: el texto se ajusta
   una vez y cabe igual en la miniatura que en grande. */
.jg-portada-memazo{background:radial-gradient(ellipse at 50% 30%,#6b2fb8,#1d0b3a 75%)}
.jg-art-mz{position:relative;width:70%;transform:rotate(-4deg)}
.jg-art-mz .jg-mz-meme{box-shadow:10px 12px 24px #0008;border-radius:6px}
.jg-art-mz em{position:absolute;right:-10px;bottom:-26px;font:400 26px Anton,Impact,'Arial Black',sans-serif;font-style:normal;letter-spacing:1px;color:#ffd23f;text-shadow:3px 3px 0 #6b2fb8;transform:rotate(-3deg)}
.jg-mz-meme{position:relative;width:100%;container-type:inline-size;background:#fff;overflow:hidden;border-radius:4px;user-select:none}
.jg-mz-meme>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.jg-mz-caja{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;--f:var(--t)}
.jg-mz-caja>span{display:block;max-width:100%;font-size:calc(var(--f) * 1cqw);line-height:1.08;overflow-wrap:normal;white-space:pre-wrap}
.jg-mz-caja.parte>span{overflow-wrap:anywhere}
.jg-mz-c-imp>span{font-family:Anton,Impact,'Arial Black',sans-serif;text-transform:uppercase;color:#fff;-webkit-text-stroke:calc(var(--f) * .07cqw) #000;paint-order:stroke fill;text-shadow:0 0 .12em #000,0 0 .12em #000;letter-spacing:.01em}
.jg-mz-c-neg>span,.jg-mz-c-bur>span{font-family:'IBM Plex Sans',Arial,sans-serif;font-weight:700;color:#141414}
.jg-mz-c-bla>span{font-family:'IBM Plex Sans',Arial,sans-serif;font-weight:700;color:#fff}
.jg-mz-c-fin>span{font-family:Georgia,'Times New Roman',serif;font-style:italic;color:#141414}
.jg-mz-vacias .jg-mz-caja.vacia{outline:2px dashed #ff3d8b;outline-offset:-3px;background:#ff3d8b14}
.jg-mz-vacias .jg-mz-caja.vacia::after{content:attr(data-n);font:600 13px 'IBM Plex Sans',sans-serif;color:#ff3d8b;text-transform:none;-webkit-text-stroke:0;text-shadow:0 0 3px #fff}
.jg-memazo .jg-mz-reloj{font:600 14px 'IBM Plex Mono',monospace;color:#5b21b6;min-width:4.5em;text-align:right}
.jg-memazo .jg-mz-reloj.urge{color:#e11d48;animation:jgMzLate .5s ease-in-out infinite alternate}
@keyframes jgMzLate{to{transform:scale(1.12)}}
.jg-mz-fase{font-weight:600}
.jg-mz-escenario{background:radial-gradient(ellipse at 50% 0,#4a1d8f,#1c0b38 70%);border-left:1px solid #2d1458;border-right:1px solid #2d1458;padding:14px 16px 22px;color:#f3ecff;min-height:420px}
.jg-mz-asientos{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px;min-height:8px}
.jg-mz-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:99px;background:#ffffff14;border:1px solid #ffffff22;font-size:12.5px}
.jg-mz-chip.yo{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.jg-mz-chip.fuera{opacity:.4;text-decoration:line-through}
.jg-mz-chip b{font:700 13px 'IBM Plex Mono',monospace;color:#ffd23f}
.jg-mz-chip i{font-style:normal;font-size:12px}.jg-mz-chip i.ok{color:#4ade80}.jg-mz-chip i.esc{color:#c4b5fd;animation:jgMzLate .7s ease-in-out infinite alternate}
.jg-mz-ava{display:inline-flex}

/* Budokai Tenkaichi 3: la portada (aura de ki y esferas), el marco y el vestíbulo. Superficies oscuras siempre,
   como el de HaxBall: no necesitan gemelo en el bloque del tema oscuro. */
/* La portada de BT3 (ficha, tarjeta del salón, banner de novedades): el cielo de noche de las peleas con rayos que
   giran, un orbe de ki que late al centro, las siete esferas del dragón (cada una con sus estrellas, de 1 a 7)
   en órbita alrededor, y el título como el logo con un brillo que lo recorre. Mide en `cqmin` (el lado corto de
   la portada): la misma escena sirve en la tarjeta (4:3) y en el banner (ancho y bajo). */
.jg-art-bt3{position:absolute;inset:0;overflow:hidden;isolation:isolate;container-type:size;
  background:radial-gradient(ellipse 60% 55% at 50% 46%,#ff9a1f88,#ff5a0022 55%,transparent 75%),linear-gradient(170deg,#0b1a48 0%,#13225a 45%,#2a0f3a 78%,#3a1206 100%)}
.jg-art-bt3 s{position:absolute;left:50%;top:44%;width:180cqmax;height:180cqmax;margin:-90cqmax 0 0 -90cqmax;z-index:-1;
  background:repeating-conic-gradient(from 0deg,#ffffff14 0deg 2deg,transparent 2deg 10deg);
  -webkit-mask:radial-gradient(circle,transparent 6%,#000 30%,transparent 60%);mask:radial-gradient(circle,transparent 6%,#000 30%,transparent 60%)}
/* al centro, la esfera Z: una esfera de ki naranja con la Z del logo encima */
.jg-art-bt3 b{position:absolute;left:50%;top:40%;width:24cqmin;height:24cqmin;margin:-12cqmin 0 0 -12cqmin;border-radius:50%;display:grid;place-items:center;
  font:400 17cqmin/1 'Lilita One',system-ui,sans-serif;color:#e8200a;-webkit-text-stroke:.5cqmin #3a0800;text-shadow:0 .8cqmin 0 #3a0800;
  background:radial-gradient(circle at 34% 28%,#fff8d0 0 9%,#ffc23d 26%,#ff8a00 55%,#b43c00 88%);box-shadow:0 0 0 .6cqmin #ffd21f66,0 0 30px 10px #ff8a0088,inset -1.4cqmin -1.8cqmin 2.4cqmin #7a2400aa}
.jg-art-bt3 u{position:absolute;left:50%;top:40%;width:0;height:0}
.jg-art-bt3 i{position:absolute;left:-6cqmin;top:-6cqmin;width:12cqmin;height:12cqmin;border-radius:50%;
  transform:rotate(calc(var(--k) * 51.4286deg)) translateY(-27cqmin) rotate(calc(var(--k) * -51.4286deg));
  background:radial-gradient(circle at 35% 30%,#fff7c2 0 12%,#ffb526 38%,#f07800 72%,#a34400 100%);box-shadow:0 0 12px #ff9a1fbb,inset -2px -3px 5px #0004}
.jg-art-bt3 i svg{display:block;width:100%;height:100%;fill:#d61f1f;filter:drop-shadow(0 .5px 0 #7a0a0a)}
.jg-art-bt3 em{position:absolute;left:0;right:0;bottom:5%;z-index:2;display:grid;justify-items:center;font-style:normal;line-height:1;text-align:center;isolation:isolate}
/* una sombra detrás del título: se lee aunque pase una esfera o el brillo del orbe */
.jg-art-bt3 em::before{content:"";position:absolute;left:8%;right:8%;top:-18%;bottom:-25%;z-index:-1;background:radial-gradient(ellipse at 50% 60%,#05081cdd 0,#05081c88 45%,transparent 72%)}
.jg-art-bt3 em small{font:800 clamp(8px,4.4cqmin,13px) system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#fff1d6;text-shadow:0 1px 0 #000,0 0 6px #000}
.jg-art-bt3 em strong{font:400 clamp(18px,min(15cqmin,11cqw),58px)/1 'Lilita One',system-ui,sans-serif;letter-spacing:.02em;white-space:nowrap;
  background:linear-gradient(105deg,transparent 42%,#ffffffcc 50%,transparent 58%) 160% 0/250% 100% no-repeat,linear-gradient(180deg,#fffbd1,#ffe14a 38%,#ff9d00 70%,#ff5a00);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.5px #4a1300;filter:drop-shadow(0 3px 0 #1a0600) drop-shadow(0 0 12px #ff8a0088)}
@media(prefers-reduced-motion:no-preference){
  .jg-art-bt3 s{animation:jg-bt3-gira 26s linear infinite}

.jg-mkw-vest{background:linear-gradient(160deg,#0f1c3a,#1b2f63);color:#eef2ff;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.jg-mkw-vest[hidden]{display:none}
.jg-mkw-vest.jugando{flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 14px}
.jg-mkw-vest.jugando .jg-mkw-pilotos{flex:1 1 auto}
.jg-mkw-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

.jg-mkw-cab span{color:#b9c4e6;font-size:.92rem}
.jg-mkw-pilotos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.jg-mkw-piloto{background:#ffffff10;border:1px solid #ffffff22;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.jg-mkw-piloto.anf{border-color:#ffd34d;box-shadow:inset 0 0 0 1px #ffd34d55}
.jg-mkw-piloto b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jg-mkw-piloto small{color:#b9c4e6}
.jg-mkw-dar{margin-top:4px;align-self:flex-start;font-size:.8rem;border:1px solid #ffffff44;background:transparent;color:#eef2ff;border-radius:8px;padding:2px 8px;cursor:pointer}
.jg-mkw-cpu{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.jg-mkw-cpu span{color:#b9c4e6;margin-right:4px}
.jg-mkw-ficha{border:1px solid #ffffff44;background:#ffffff0d;color:#eef2ff;border-radius:999px;padding:5px 12px;cursor:pointer;font:inherit}
.jg-mkw-ficha[aria-pressed=true]{background:#ffd34d;color:#1b1400;border-color:#ffd34d;font-weight:700}
.jg-mkw-ficha:disabled{cursor:default;opacity:.75}
.jg-mkw-modos{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.jg-mkw-modo{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid #ffffff33;background:#ffffff0d;color:#eef2ff;border-radius:14px;padding:10px 12px;cursor:pointer;font:inherit}
.jg-mkw-modo b{font-size:1rem}
.jg-mkw-modo small{color:#c8d1ef;font-size:.85rem;line-height:1.3}
.jg-mkw-modo[aria-pressed=true]{border-color:#ffd34d;background:#ffd34d22;box-shadow:inset 0 0 0 1px #ffd34d}
.jg-mkw-modo:disabled{cursor:default}
.jg-mkw-modo:disabled:not([aria-pressed=true]){opacity:.6}
.jg-mkw-ultima{border:1px solid #ffd34d55;background:#ffd34d12;border-radius:14px;padding:10px 12px}
.jg-mkw-ultima ol{margin:6px 0 0;padding-left:1.4em}
.jg-mkw-ultima li{padding:2px 0}
.jg-mkw-ultima li span{margin-right:.6em}
.jg-mkw-ultima li:first-child{color:#ffd34d;font-weight:700}
.jg-mkw-pie{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.jg-mkw-empieza,.jg-mkw-vuelve{border:0;border-radius:12px;padding:10px 20px;font:800 1.05rem system-ui,sans-serif;cursor:pointer}
.jg-mkw-empieza{background:#e4202e;color:#fff}
.jg-mkw-empieza:disabled{opacity:.5;cursor:default}
.jg-mkw-vuelve{background:#ffffff1f;color:#eef2ff}
.jg-mkw-nota{margin:0;color:#d8def5;font-size:.95rem}
@media (prefers-reduced-motion:reduce){.jg-art-mkw s{animation:none}}
/* El vestíbulo de BT3, a lo Dragon Ball: el cielo de noche de las peleas (azul profundo con líneas de velocidad
   y un estallido de ki naranja arriba), títulos como el logo (Lilita One, dorado a naranja con borde oscuro),
   esferas del dragón de adorno. Siempre oscuro, como el juego: no lleva gemelo en el bloque del tema oscuro.
   Las animaciones (la llave, la corona, el duelo) parten de `--edad` (ver `recientes` en bt3.js): un repintado a
   la mitad sigue donde iba. */
.jg-bt3-escena{position:relative}
.jg-bt3-vest{--bt3-a:#ff8a00;--bt3-oro:#ffd21f;--bt3-tx:#f4f6ff;--bt3-mu:#a9b6dc;--bt3-az:#3d7bff;--bt3-panel:#0f1f4dcc;--bt3-borde:#2c4a98;
  position:relative;margin:0 0 12px;padding:20px;border-radius:20px;color:var(--bt3-tx);display:grid;gap:16px;overflow:hidden;isolation:isolate;
  background:radial-gradient(ellipse 70% 55% at 50% -8%,#ff9a1f66,#ff6a0022 45%,transparent 70%),
    repeating-conic-gradient(from 0deg at 50% 0%,#ffffff07 0deg 1.5deg,transparent 1.5deg 7deg),
    linear-gradient(170deg,#0b1a48 0%,#101c45 45%,#1d0f33 80%,#2a0f0a 100%);
  border:2px solid #22397a;box-shadow:0 0 0 1px #000 inset,0 10px 30px #0008}
.jg-bt3-vest::before{content:"";position:absolute;inset:auto -10% -40% -10%;height:60%;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,#ff6a0033,transparent 65%)}
.jg-bt3-vest[hidden]{display:none}
.jg-bt3-vest.jugando{padding:10px 14px;gap:0;background:linear-gradient(90deg,#0b1a48,#1d0f33)}
.jg-bt3-vest button:focus-visible{outline:2px solid #7fb2ff;outline-offset:2px}
.jg-bt3-logo,.jg-bt3-tit>b,.jg-bt3-vs{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-style:normal;
  background:linear-gradient(180deg,#fffbd1 0%,#ffe14a 38%,#ff9d00 70%,#ff5a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:1.5px #4a1300;filter:drop-shadow(0 3px 0 #1a0600) drop-shadow(0 0 14px #ff8a0066)}
.jg-bt3-esferas{display:inline-flex;gap:4px;vertical-align:middle}
.jg-bt3-esferas i{width:16px;height:16px;border-radius:50%;position:relative;flex:none;
  background:radial-gradient(circle at 35% 30%,#fff7c2 0 12%,#ffb526 40%,#f07800 75%,#a34400 100%);box-shadow:0 0 8px #ff9a1f88}
.jg-bt3-esferas i::after{content:"★";position:absolute;inset:0;display:grid;place-items:center;color:#d61f1f;font-size:9px;line-height:1}
/* el duelo: la pantalla de versus */
.jg-bt3-versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:14px}
.jg-bt3-versus>.jg-bt3-vs{align-self:center}
.jg-bt3-hueco{visibility:hidden}
.jg-bt3-luchador{position:relative;display:grid;justify-items:center;align-content:start;gap:6px;padding:18px 12px 14px;border-radius:16px;text-align:center;min-width:0;
  background:linear-gradient(180deg,#16306e,#0c1a42);border:2px solid var(--bt3-borde);box-shadow:inset 0 1px 0 #ffffff1a}
.jg-bt3-luchador.anf{border-color:var(--bt3-a);box-shadow:inset 0 1px 0 #ffffff1a,0 0 26px #ff8a0055}
.jg-bt3-luchador.yo b{color:var(--bt3-oro)}
.jg-bt3-luchador.vacio{border-style:dashed;opacity:.7;background:#0c1a4280}
.jg-bt3-luchador b{font:800 17px/1.2 system-ui,sans-serif;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jg-bt3-luchador b em{font-weight:500;font-size:12px;color:var(--bt3-mu)}
.jg-bt3-ava{width:68px;height:68px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font:400 30px 'Lilita One',system-ui,sans-serif;color:#fff;
  background:var(--c,#3a4f8f);border:3px solid #ffffff33;box-shadow:0 0 0 3px #0b1a48}
.jg-bt3-luchador.anf .jg-bt3-ava{border-color:var(--bt3-oro)}
.jg-bt3-rol{font:800 11px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--bt3-mu)}
.jg-bt3-luchador.anf .jg-bt3-rol{color:#ffc061}
.jg-bt3-estado{font-size:13px;color:#ffc061}.jg-bt3-estado.ok{color:#7cf0b6}
.jg-bt3-hacer{margin-top:2px;padding:5px 12px;border-radius:999px;border:1px solid #ffffff33;background:#ffffff12;color:var(--bt3-tx);font:700 12px system-ui,sans-serif;cursor:pointer}
.jg-bt3-hacer:hover{border-color:var(--bt3-a);color:#ffc061}
.jg-bt3-vs{font-size:44px;line-height:1;letter-spacing:.02em;padding:0 4px;transform:skew(-8deg)}
.jg-bt3-reglas{display:grid;gap:10px;padding:12px 14px;border-radius:14px;background:#06102bb3;border:1px solid #1f3878}
.jg-bt3-reglas>div{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.jg-bt3-veto>.jg-bt3-nota{flex:1 1 220px}
.jg-bt3-vetados{flex:1 1 100%;min-width:0;font-size:13px;color:var(--bt3-tx)}
.jg-bt3-vetados>summary{cursor:pointer;color:#ffc061;font-weight:700;width:max-content;max-width:100%}
.jg-bt3-vetados ul{margin:8px 0 4px;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px;max-height:260px;overflow:auto}
.jg-bt3-vetados li{display:flex;gap:8px;align-items:baseline;min-width:0}
.jg-bt3-vetados li>i{flex:none;min-width:44px;font:800 11px system-ui,sans-serif;font-style:normal;color:#ff9d00;text-align:center;padding:1px 4px;border-radius:6px;background:#ff8a0022}
.jg-bt3-vetados li>span{min-width:0;overflow-wrap:anywhere}
.jg-bt3-vetados small{display:block;color:var(--bt3-mu)}.jg-bt3-vetados small.no{color:#ff7b7b}
/* «Ver la tier list» (bt3.js, vetoHtml): una fila por tier con su color, como la imagen; lo vetado, apagado y con candado */
.jg-bt3-tl-filas{display:grid;gap:4px;margin:8px 0 4px;max-height:520px;overflow:auto;border-radius:10px}
.jg-bt3-tl-fila{display:grid;grid-template-columns:76px 1fr;gap:6px;align-items:stretch;background:#0b1430;border-radius:8px}
.jg-bt3-tl-fila>b{display:grid;place-content:center;text-align:center;border-radius:8px 0 0 8px;background:var(--tc);color:#1a1424;font:800 15px system-ui,sans-serif;padding:6px 2px}
.jg-bt3-tl-fila>b small{display:block;font:700 10px system-ui,sans-serif;color:#1a1424aa;margin-top:2px}
.jg-bt3-tl-fila.no>b{filter:saturate(.35) brightness(.75)}
.jg-bt3-tl .jg-bt3-tl-fila ul{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:6px 6px 6px 0;max-height:none;overflow:visible}
.jg-bt3-tl .jg-bt3-tl-fila li{display:inline-flex;flex-direction:column;gap:0;padding:4px 8px;border-radius:7px;background:#1d2b52;border:1px solid #33497f;font-size:12px;line-height:1.3;max-width:220px}
.jg-bt3-tl .jg-bt3-tl-fila li.no{opacity:.45;background:#151c33;border-color:#262f4a}
.jg-bt3-tl .jg-bt3-tl-fila li .cand{font-size:10px;margin-right:2px}
.jg-bt3-tl .jg-bt3-tl-fila li small{font-size:10.5px}
@media(max-width:560px){.jg-bt3-tl-fila{grid-template-columns:52px 1fr}.jg-bt3-tl-fila>b{font-size:12px}}
.jg-bt3-et{min-width:130px;font:800 11px system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--bt3-mu)}
.jg-bt3-fichas{display:flex;flex-wrap:wrap;gap:6px}
.jg-bt3-ficha{padding:6px 13px;border-radius:999px;border:1px solid #2f4d9c;background:#132a63;color:var(--bt3-tx);font:700 13px system-ui,sans-serif;cursor:pointer;font-variant-numeric:tabular-nums}
.jg-bt3-ficha[aria-pressed=true]{background:linear-gradient(180deg,#ffd21f,#ff8a00);border-color:#ffb300;color:#2a0d00;box-shadow:0 0 12px #ff8a0066}
.jg-bt3-ficha:not([disabled]):not([aria-pressed=true]):hover{border-color:var(--bt3-a)}
.jg-bt3-ficha[disabled]{cursor:default}.jg-bt3-ficha[disabled]:not([aria-pressed=true]){opacity:.5}
.jg-bt3-pie{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.jg-bt3-empieza{padding:12px 30px;border:3px solid #3a1000;border-radius:14px;cursor:pointer;color:#2a0d00;
  font:400 22px/1 'Lilita One',system-ui,sans-serif;letter-spacing:.03em;text-transform:uppercase;
  background:linear-gradient(180deg,#fff27a 0%,#ffd21f 30%,#ff9d00 65%,#ff6a00 100%);box-shadow:0 5px 0 #3a1000,0 0 28px #ff8a0077}
.jg-bt3-empieza:hover:not([disabled]){filter:brightness(1.08)}
.jg-bt3-empieza:active:not([disabled]){transform:translateY(3px);box-shadow:0 2px 0 #3a1000,0 0 20px #ff8a0066}
.jg-bt3-empieza[disabled]{background:#26345e;border-color:#18234a;color:#7f8bb3;box-shadow:none;cursor:default}
.jg-bt3-nota{margin:0;font-size:13px;color:var(--bt3-mu);max-width:70ch}
.jg-bt3-nota b{color:var(--bt3-tx)}
.jg-bt3-nota.jg-bt3-corte{color:#ffd27a;margin-bottom:6px}
.jg-bt3-franja{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:14px}
.jg-bt3-vivo{font-weight:800;color:#ff5d5d}
.jg-bt3-vuelve{margin-left:auto;padding:5px 10px;border-radius:8px;border:1px solid #ffffff33;background:transparent;color:var(--bt3-mu);font:600 12px system-ui,sans-serif;cursor:pointer}
.jg-bt3-privado{padding:18px;border-radius:14px;background:#0b1a48;color:#a9b6dc}
@media(max-width:560px){.jg-bt3-versus{grid-template-columns:1fr}.jg-bt3-vs{justify-self:center;font-size:32px}.jg-bt3-et{min-width:0;width:100%}}
@media(prefers-reduced-motion:no-preference){.jg-bt3-luchador.anf .jg-bt3-ava{animation:jg-bt3-aura 2.4s ease-in-out infinite}}
@keyframes jg-bt3-aura{50%{box-shadow:0 0 0 3px #0b1a48,0 0 22px 4px #ff9a1faa}}
/* el marcador y la revancha del duelo */
.jg-bt3-marcador{margin:-4px 0 0;text-align:center;font-size:15px;color:var(--bt3-mu)}
.jg-bt3-marcador span{display:inline-block;margin:0 12px;font:400 30px 'Lilita One',system-ui,sans-serif;color:var(--bt3-oro);font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #3a1000,0 0 14px #ff8a0088}
.jg-bt3-marcador small{display:block;font-size:12px}
.jg-bt3-revancha{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 14px;padding:10px 14px;border-radius:14px;background:#06102b99;border:1px dashed #3d5db0}
.jg-bt3-revancha.lista{border:1px solid var(--bt3-oro);box-shadow:0 0 18px #ffd21f44}
.jg-bt3-rev{padding:8px 18px;border-radius:999px;border:2px solid #ffb300;background:#1b2f66;color:var(--bt3-oro);font:400 16px 'Lilita One',system-ui,sans-serif;letter-spacing:.02em;cursor:pointer}
.jg-bt3-rev:hover{background:#22397a}.jg-bt3-rev.no{border-color:#56689c;color:var(--bt3-mu);font:700 13px system-ui,sans-serif}
/* En el celular la revancha queda fija abajo y grande: se pide con el pulgar sin buscarla bajo el vestíbulo (sticky no
   servía: solo se pega mientras su caja se ve). Debajo de los carteles (60) y el manual (80). */
@media (max-width:700px){.jg-bt3-revancha{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;background:#06102bf2;box-shadow:0 -6px 24px #000a}
  .jg-bt3-rev{flex:1 1 100%;padding:14px 20px;font-size:20px}.jg-bt3-rev.no{font-size:15px}}
/* el torneo: título, inscritos, la pelea actual */
.jg-bt3-tit{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.jg-bt3-tit>b{font-size:30px;line-height:1.05}
.jg-bt3-tit>span{font-size:13px;color:var(--bt3-mu)}
.jg-bt3-inscritos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
/* La llave antes de empezar (bt3.js, atarPrevia): las peleas de la primera ronda; el organizador arrastra o toca. */
.jg-bt3-previa{display:grid;gap:10px}
.jg-bt3-previa header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.jg-bt3-previa header b{font:400 18px 'Lilita One',system-ui,sans-serif;color:var(--bt3-oro)}
.jg-bt3-previa header span{flex:1;min-width:200px;font-size:13px;color:var(--bt3-mu)}

.jg-bt3-lugar[draggable=true],.jg-bt3-lugar.bye[tabindex]{cursor:grab}
.jg-bt3-lugar+.jg-bt3-lugar{border-top:1px solid #24407f}
.jg-bt3-lugar.bye{color:var(--bt3-mu);font-style:italic;font-weight:500;min-height:38px}
.jg-bt3-lugar.arrastra{opacity:.4}
.jg-bt3-lugar.sobre,.jg-bt3-lugar.elegido{background:#ff8a0033;box-shadow:inset 0 0 0 2px var(--bt3-a);border-radius:8px}
.jg-bt3-lugar:focus-visible{outline:2px solid #7fb2ff;outline-offset:-2px;border-radius:8px}
.jg-bt3-inscritos li{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:linear-gradient(180deg,#16306e,#0c1a42);border:1px solid var(--bt3-borde);min-width:0}
.jg-bt3-inscritos li.yo{border-color:#ffd21f88}.jg-bt3-inscritos li.yo>span{color:var(--bt3-oro)}
.jg-bt3-inscritos .jg-bt3-ava{grid-row:span 2;width:40px;height:40px;font-size:18px;border-width:2px;box-shadow:none}
.jg-bt3-inscritos li>span{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jg-bt3-inscritos li{position:relative}
/* (el que organiza tiene tres líneas: nombre, «Organiza» y su disco; la foto ocupa las tres) */
.jg-bt3-inscritos li>:not(.jg-bt3-ava):not(.jg-bt3-echa){grid-column:2}
.jg-bt3-inscritos li:has(.jg-bt3-org) .jg-bt3-ava{grid-row:span 3}
/* la CPU del torneo: un lente de scouter con su nivel (1 a 5) */
.jg-bt3-ava.cpu{position:relative;background:radial-gradient(circle at 40% 35%,#9dffb0 0 10%,#22c55e 35%,#065f2c 80%);border-color:#86efac;overflow:hidden}
.jg-bt3-ava.cpu i{position:absolute;inset:18% 12% 30% 12%;border-radius:40% 40% 20% 20%;background:linear-gradient(180deg,#ffffff66,#ffffff00)}
.jg-bt3-ava.cpu small{position:absolute;right:-2px;bottom:-2px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;display:grid;place-items:center;
  font:400 11px/1 'Lilita One',system-ui,sans-serif;color:#ffd21f;background:#052e16;border:1.5px solid #86efac}
.jg-bt3-slot .jg-bt3-ava.cpu small{min-width:12px;height:12px;font-size:8px;border-width:1px}
.jg-bt3-inscritos li.cpu{border-color:#22c55e66}
.jg-bt3-inscritos li:has(.jg-bt3-echa){padding-right:44px}
.jg-bt3-nivel{font-style:normal;font-size:12px;color:#86efac}
.jg-bt3-nivel select{max-width:100%;padding:4px 6px;border-radius:8px;border:1px solid #22c55e88;background:#052e16;color:#dcfce7;font:600 12px system-ui,sans-serif}
.jg-bt3-libres{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;border-radius:12px;border:1px dashed #22c55e88;background:#052e1655;font-size:13px}
.jg-bt3-libres small{color:var(--bt3-mu)}
.jg-bt3-libres .jg-bt3-ficha{border-color:#22c55e88;background:#0b3d22}
/* mirar la pelea en vivo (bt3-directo.js) */
.jg-bt3-ver{padding:8px 16px;border-radius:999px;border:2px solid #ff5d5d;background:#3a0f1a;color:#fff;font:400 15px 'Lilita One',system-ui,sans-serif;letter-spacing:.02em;cursor:pointer;box-shadow:0 0 14px #ff5d5d55}
.jg-bt3-ver:hover{background:#5a1525}
.jg-bt3-tele{margin:0 0 12px;border-radius:18px;overflow:hidden;border:2px solid #ff5d5d;background:#000;box-shadow:0 0 30px #ff5d5d33}
.jg-bt3-tele header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(90deg,#3a0f1a,#0b1a48);color:#fff;font:400 16px 'Lilita One',system-ui,sans-serif}
.jg-bt3-tele header i{font-style:normal;color:#ffd21f}
.jg-bt3-tele header button{width:32px;height:32px;border-radius:8px;border:1px solid #ffffff33;background:#ffffff14;color:#fff;cursor:pointer}
.jg-bt3-tele header{flex-wrap:wrap;row-gap:6px}
.jg-bt3-tele-son{margin-left:auto;display:flex;align-items:center;gap:6px}
.jg-bt3-tele-son input{width:90px;accent-color:#ffd21f}
.jg-bt3-tele-cal{font:600 11px system-ui,sans-serif;color:#ffffffa0;font-variant-numeric:tabular-nums;white-space:nowrap}
/* En pantalla completa (⛶): el video ocupa toda la pantalla, sin deformarse (la imagen tiene la forma de la ventana del que
   pelea), y la barra de arriba flota encima y se esconde sola; vuelve al mover el mouse (bt3.js, .mueve). Antes el
   video seguía con el tope de 58vh y la forma 16:9 de la sala: quedaba chico en medio de la pantalla. */
.jg-bt3-tele:fullscreen{display:flex;flex-direction:column;margin:0;border:0;border-radius:0;box-shadow:none;background:#000}
.jg-bt3-tele:fullscreen header{position:absolute;top:0;left:0;right:0;z-index:2;background:linear-gradient(#000d,#0000);opacity:0;transition:opacity .3s}
.jg-bt3-tele.mueve:fullscreen header{opacity:1}
.jg-bt3-tele:fullscreen .jg-bt3-tele-video{flex:1;width:100%;height:100%;max-height:none;aspect-ratio:auto}
.jg-bt3-tele:fullscreen video{width:100%;height:100%;object-fit:contain}
.jg-bt3-tele:fullscreen:not(.mueve){cursor:none}
.jg-bt3-tele-video{position:relative;aspect-ratio:16/9;max-height:58vh;margin:0 auto;display:grid;place-items:center}
.jg-bt3-tele video{width:100%;height:100%;object-fit:contain;background:#000}
.jg-bt3-tele-video p{position:absolute;margin:0;padding:10px 14px;border-radius:10px;background:#000c;color:#fff}
.jg-bt3-tele:fullscreen{display:flex;flex-direction:column;border:0;border-radius:0}.jg-bt3-tele:fullscreen .jg-bt3-tele-video{flex:1;aspect-ratio:auto}
.jg-bt3-echa{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:8px;border:1px solid #ff5d5d66;
  background:#ff5d5d1a;color:#ff8f8f;font-size:14px;line-height:1;cursor:pointer}
.jg-bt3-echa:hover{background:#ff5d5d40;color:#fff}
.jg-bt3-echar .jg-bt3-ficha{border-color:#ff5d5d66;background:#3a1530}
.jg-bt3-echar .jg-bt3-ficha:hover{border-color:#ff5d5d}
.jg-bt3-inscritos i{font-style:normal}.jg-bt3-org{font-style:normal;font-size:12px;color:#ffc061}
.jg-bt3-actual{display:grid;gap:8px;justify-items:center;text-align:center;padding:16px;border-radius:16px;background:#06102bcc;border:2px solid #ff8a0088;box-shadow:0 0 30px #ff8a0033,inset 0 0 30px #3d7bff22}
.jg-bt3-mini{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:800}
.jg-bt3-mini .jg-bt3-vs{font-size:30px}
.jg-bt3-mano{font-size:13px;color:var(--bt3-mu)}.jg-bt3-mano summary{cursor:pointer}.jg-bt3-mano .jg-bt3-fichas{margin-top:8px;justify-content:center}
/* «🏆 Dar la victoria» del anfitrión/organizador (bt3.js, darVictoria): una pastilla dorada que se despliega */
.jg-bt3-dar{text-align:center}
.jg-bt3-dar summary{display:inline-block;list-style:none;padding:5px 12px;border-radius:999px;border:1px solid #ffd21f66;background:#ffd21f14;color:var(--bt3-oro);font:700 12px system-ui,sans-serif;cursor:pointer}
.jg-bt3-dar summary::-webkit-details-marker{display:none}
.jg-bt3-dar summary:hover,.jg-bt3-dar[open] summary{border-color:var(--bt3-oro);background:#ffd21f26}
.jg-bt3-dar .jg-bt3-fichas{margin-top:8px;justify-content:center}
.jg-bt3-ficha.seguro,.jg-bt3-echa.seguro{background:linear-gradient(180deg,#ffd21f,#ff8a00);border-color:#ffd21f;color:#1a0a00}
.jg-bt3-franja .jg-bt3-dar{flex:1 1 100%}
.jg-bt3-pendiente{display:grid;gap:6px;justify-items:center;text-align:center}
/* la llave: pirámide de rondas unidas por líneas (ver pintaTorneo en bt3.js) */
.jg-bt3-llave{--ln:#3a5aa8;--hueco:38px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);column-gap:var(--hueco);overflow-x:auto;padding:12px 4px 8px}
.jg-bt3-ronda{display:flex;flex-direction:column;min-width:0}
.jg-bt3-ronda h4{margin:0 0 4px;text-align:center;font:400 15px 'Lilita One',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#ffc061;text-shadow:0 2px 0 #1a0600}
.jg-bt3-ronda ol{list-style:none;margin:0;padding:0;flex:1;display:flex;flex-direction:column}
.jg-bt3-par{position:relative;flex:1;display:flex;align-items:center;padding:9px 0;min-height:72px}
.jg-bt3-par>div{width:100%}
.jg-bt3-ronda:not(.copa) .jg-bt3-par::after{content:"";position:absolute;right:calc(var(--hueco) / -2);width:calc(var(--hueco) / 2);border:0 solid var(--ln);border-right-width:2px}
.jg-bt3-ronda:not(.copa) .jg-bt3-par:nth-child(odd)::after{top:50%;bottom:0;border-top-width:2px;border-top-right-radius:8px}
.jg-bt3-ronda:not(.copa) .jg-bt3-par:nth-child(even)::after{top:0;bottom:50%;border-bottom-width:2px;border-bottom-right-radius:8px}
.jg-bt3-ronda.final .jg-bt3-par::after{bottom:auto!important;height:0;border-right-width:0!important;border-radius:0!important}
.jg-bt3-ronda:not(:first-child) .jg-bt3-par::before{content:"";position:absolute;left:calc(var(--hueco) / -2);width:calc(var(--hueco) / 2);top:50%;border-top:2px solid var(--ln)}
.jg-bt3-par.listo::after{border-color:var(--bt3-a)!important;filter:drop-shadow(0 0 4px #ff8a00aa)}
.jg-bt3-par.lleno::before{border-color:var(--bt3-a);filter:drop-shadow(0 0 4px #ff8a00aa)}
.jg-bt3-caja{position:relative;display:grid;border-radius:10px;background:linear-gradient(180deg,#14296099,#0b1838);border:2px solid #24407f;font-size:13px;box-shadow:0 3px 0 #050c22}
.jg-bt3-slot{position:relative;display:flex;align-items:center;gap:7px;padding:6px 10px 6px 7px;font-weight:600;min-width:0}
.jg-bt3-nom{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jg-bt3-slot .jg-bt3-ava{flex:none;width:24px;height:24px;font-size:12px;border-width:2px;box-shadow:none}
.jg-bt3-slot .jg-bt3-ava.vacia{background:#1b2c5c;color:#6f7da6;border-style:dashed}
.jg-bt3-slot.gana .jg-bt3-ava{border-color:var(--bt3-oro);box-shadow:0 0 10px #ffd21faa}
.jg-bt3-slot+.jg-bt3-slot{border-top:1px solid #ffffff14}
.jg-bt3-slot.gana{color:var(--bt3-oro);font-weight:800;background:linear-gradient(90deg,#ff8a0040,transparent)}
/* el que perdió queda con la carta rajada: dos grietas cruzadas, su foto en gris */
.jg-bt3-slot.pierde{color:#6f7da6;text-decoration:line-through;
  background-image:linear-gradient(118deg,transparent 46%,#ffffff2e 47%,#ffffff2e 48%,transparent 49%),linear-gradient(62deg,transparent 63%,#ffffff1f 64%,transparent 65%)}
.jg-bt3-slot.pierde .jg-bt3-ava{filter:grayscale(1) brightness(.55)}
.jg-bt3-slot.vacio,.jg-bt3-slot.bye{color:#6f7da6;font-style:italic;font-weight:500}
.jg-bt3-caja.vivo{border-color:#ff5d5d;box-shadow:0 3px 0 #050c22,0 0 16px #ff5d5d55}.jg-bt3-caja.sigue{border-color:var(--bt3-a)}
.jg-bt3-caja em{position:absolute;top:-9px;right:8px;padding:1px 7px;border-radius:6px;font:400 10px 'Lilita One',system-ui,sans-serif;font-style:normal;letter-spacing:.08em;background:var(--bt3-a);color:#2a0d00}
.jg-bt3-caja.vivo em{background:#ff5d5d;color:#fff}
.jg-bt3-copa{position:relative;display:grid;justify-items:center;gap:2px;padding:12px 10px;border-radius:14px;border:2px dashed #2f4d9c;text-align:center;color:#6f7da6;overflow:hidden;isolation:isolate}
.jg-bt3-trofeo{font-size:30px;filter:grayscale(1);opacity:.45}
.jg-bt3-campeon{position:relative;display:inline-block;margin:20px 0 4px}
.jg-bt3-campeon .jg-bt3-ava{width:60px;height:60px;font-size:26px;border-color:var(--bt3-oro);box-shadow:0 0 0 3px #0b1838,0 0 26px #ffd21fcc}
.jg-bt3-campeon .jg-bt3-trofeo{position:absolute;right:-12px;bottom:-6px;font-size:22px;filter:drop-shadow(0 0 8px #ffd21f);opacity:1;margin:0}
.jg-bt3-corona{position:absolute;left:0;right:0;top:-26px;text-align:center;font-size:26px;line-height:1;filter:drop-shadow(0 2px 0 #3a1000) drop-shadow(0 0 8px #ffd21f)}
.jg-bt3-copa b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 17px 'Lilita One',system-ui,sans-serif}
.jg-bt3-rayos{position:absolute;inset:-60%;z-index:-1;opacity:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,#ffd21f55 0deg 8deg,transparent 8deg 20deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 62%);mask:radial-gradient(circle,#000 20%,transparent 62%)}
.jg-bt3-copa.gana{border:2px solid var(--bt3-oro);background:radial-gradient(circle at 50% 35%,#ff8a0055,#0b1838 75%);box-shadow:0 0 24px #ffd21f55;color:var(--bt3-oro)}

.jg-bt3-copa.gana .jg-bt3-rayos{opacity:.6}
.jg-bt3-copa.gana b{-webkit-text-stroke:.5px #3a1000;text-shadow:0 2px 0 #3a1000}
/* los carteles de arriba: quién ganó, quién avanza, el campeón */
.jg-bt3-avisos{position:absolute;inset:0;z-index:5;pointer-events:none;display:grid;place-items:start center;padding-top:56px;overflow:hidden}
.jg-bt3-anuncio{display:grid;justify-items:center;gap:2px;padding:12px 28px;border-radius:16px;text-align:center;max-width:90%;
  background:linear-gradient(180deg,#14296ef2,#0a1640f2);border:3px solid var(--bt3-oro,#ffd21f);box-shadow:0 10px 40px #000a,0 0 40px #ff8a0077;
  color:#fff;animation:jg-bt3-cartel 3.6s cubic-bezier(.2,.9,.3,1.2) both}
.jg-bt3-anuncio small,.jg-bt3-anuncio b,.jg-bt3-anuncio>span{position:relative;z-index:7}   /* el texto encima de la explosión */
.jg-bt3-anuncio small{font:800 12px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ffe3b0;text-shadow:0 1px 0 #000,0 0 8px #000}
.jg-bt3-anuncio b{font:400 30px/1.1 'Lilita One',system-ui,sans-serif;color:#ffd21f;-webkit-text-stroke:1px #3a1000;text-shadow:0 3px 0 #1a0600,0 0 18px #ff8a00}
.jg-bt3-anuncio>span{font-size:14px;color:#fff;text-shadow:0 1px 0 #000}
.jg-bt3-anuncio.pierde{border-color:#6f7da6;box-shadow:0 10px 40px #000a}.jg-bt3-anuncio.pierde b{color:#dbe4ff;text-shadow:0 3px 0 #0a1238}
.jg-bt3-anuncio.campeon{padding:18px 40px;animation-duration:6.5s;border-width:4px;background:radial-gradient(circle at 50% 30%,#ff8a00cc,#7a2a00 55%,#1a0b2e 100%)}
.jg-bt3-anuncio.campeon b{font-size:42px}
.jg-bt3-caras{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:4px}
.jg-bt3-caras .vs{font:400 22px 'Lilita One',system-ui,sans-serif;color:#ffd21f;transform:skew(-8deg);text-shadow:0 2px 0 #3a1000}
.jg-bt3-caras .jg-bt3-ava{width:64px;height:64px;font-size:28px}
.jg-bt3-caras .g .jg-bt3-ava{border-color:#ffd21f;animation:jg-bt3-aura-gana 1.4s .25s ease-out both}
@keyframes jg-bt3-aura-gana{0%{box-shadow:0 0 0 3px #0b1a48}40%{box-shadow:0 0 0 3px #0b1a48,0 0 40px 14px #ffd21fcc;transform:scale(1.12)}100%{box-shadow:0 0 0 3px #0b1a48,0 0 18px 4px #ffd21f88;transform:none}}
.jg-bt3-caras .p{position:relative}
.jg-bt3-caras .p .jg-bt3-ava{animation:jg-bt3-ava-revienta 1s .1s both}
.jg-bt3-caras .p .jg-bt3-boom{left:50%}
@keyframes jg-bt3-ava-revienta{0%{transform:none}10%,22%{transform:translateX(-5px) rotate(-4deg)}16%,28%{transform:translateX(5px) rotate(4deg)}
  32%{transform:scale(1.25);filter:brightness(3)}42%,70%{transform:scale(0) rotate(40deg);opacity:0}
  100%{transform:scale(.86);opacity:.38;filter:grayscale(1) brightness(.7)}}
.jg-bt3-coronado{position:relative;margin:26px 0 6px;isolation:isolate}
.jg-bt3-coronado .jg-bt3-ava{width:96px;height:96px;font-size:44px;border:4px solid #ffd21f;box-shadow:0 0 0 4px #3a1000,0 0 40px 10px #ffd21fcc;animation:jg-bt3-trofeo 1.1s .1s cubic-bezier(.3,1.6,.5,1) both}
.jg-bt3-coronado .jg-bt3-rayos{inset:-120%;opacity:.8;animation:jg-bt3-gira 10s linear infinite}
.jg-bt3-coronado .jg-bt3-anuncio-corona{position:absolute;left:0;right:0;top:-40px;text-align:center;z-index:2}
.jg-bt3-anuncio-corona{font-size:46px;line-height:1;animation:jg-bt3-cae-corona 1.2s .25s cubic-bezier(.3,1.5,.5,1) both}
@keyframes jg-bt3-cartel{0%{opacity:0;transform:scale(.4) rotate(-4deg);filter:blur(6px)}10%{opacity:1;transform:scale(1.08);filter:none}16%{transform:scale(1)}86%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-16px) scale(.96)}}
@keyframes jg-bt3-cae-corona{0%{opacity:0;transform:translateY(-70px) rotate(-30deg)}60%{opacity:1;transform:translateY(6px) rotate(8deg)}100%{transform:none}}
/* las animaciones de la llave (retraso negativo = la edad: si se repinta, sigue donde iba) */
.jg-bt3-par.recien::after{animation:jg-bt3-linea 1.2s calc(.35s - var(--edad,0s)) both}
@keyframes jg-bt3-linea{0%{border-color:var(--ln);filter:none}50%{filter:drop-shadow(0 0 10px #ffd21f)}100%{border-color:var(--bt3-a);filter:drop-shadow(0 0 4px #ff8a00aa)}}
.jg-bt3-slot.recien.gana{animation:jg-bt3-gana 1.3s calc(0s - var(--edad,0s)) ease-out both}
@keyframes jg-bt3-gana{0%{background:#ffd21f;color:#2a0d00;transform:scale(1)}25%{transform:scale(1.07);box-shadow:0 0 22px #ffd21f}100%{transform:none}}
.jg-bt3-slot.recien.pierde{animation:jg-bt3-revienta 1.3s calc(0s - var(--edad,0s)) both}
@keyframes jg-bt3-revienta{0%{color:#fff;text-decoration-color:transparent;transform:none;background-color:transparent}
  8%,16%{transform:translateX(-5px) rotate(-1.5deg)}12%,20%{transform:translateX(5px) rotate(1.5deg)}
  24%{transform:scale(1.08);background-color:#fff8;filter:brightness(2.2)}30%{transform:scale(.92);background-color:#ff6a0055;filter:brightness(1.4)}
  100%{color:#6f7da6;text-decoration-color:currentColor;transform:none;background-color:transparent;filter:none}}
.jg-bt3-slot.recien.pierde .jg-bt3-ava{animation:jg-bt3-ava-cae 1.3s calc(0s - var(--edad,0s)) both}
@keyframes jg-bt3-ava-cae{0%,22%{filter:none;transform:none}26%{filter:brightness(3);transform:scale(1.3)}34%{transform:scale(.6) rotate(-20deg)}100%{filter:grayscale(1) brightness(.55);transform:none}}
/* la explosión: un fogonazo y esquirlas de carta (azules con canto naranja) y chispas doradas */
.jg-bt3-boom{position:absolute;left:22px;top:50%;width:0;height:0;pointer-events:none;z-index:6}
.jg-bt3-boom s{position:absolute;left:-34px;top:-34px;width:68px;height:68px;border-radius:50%;opacity:0;transform:scale(calc(var(--k,1)));
  background:radial-gradient(circle,#fff 0 12%,#fff6b0 22%,#ffd21f 34%,#ff6a00cc 52%,transparent 70%);animation:jg-bt3-fogonazo .75s calc(.3s - var(--edad,0s)) ease-out both}
@keyframes jg-bt3-fogonazo{0%{opacity:0;transform:scale(calc(.2 * var(--k,1)))}18%{opacity:1;transform:scale(calc(1 * var(--k,1)))}100%{opacity:0;transform:scale(calc(2.6 * var(--k,1)))}}
.jg-bt3-boom b{position:absolute;left:-7px;top:-5px;width:14px;height:10px;opacity:0;clip-path:polygon(0 30%,62% 0,100% 58%,38% 100%);
  background:linear-gradient(135deg,#3d63c4,#0b1838 55%,#ff8a00);animation:jg-bt3-esquirla 1.15s calc(.32s - var(--edad,0s)) cubic-bezier(.12,.75,.3,1) both}
.jg-bt3-boom b:nth-of-type(3n){width:6px;height:6px;left:-3px;top:-3px;clip-path:circle(50%);background:#ffd21f;box-shadow:0 0 6px #ffd21f}
.jg-bt3-boom b:nth-of-type(4n){width:18px;height:12px;background:linear-gradient(135deg,#ffe14a,#ff6a00)}
@keyframes jg-bt3-esquirla{0%{opacity:1;transform:translate(0,0) rotate(0) scale(var(--s))}75%{opacity:1}
  100%{opacity:0;transform:translate(calc(var(--x) * var(--k,1)),calc(var(--y) * var(--k,1) + 22px)) rotate(var(--r)) scale(var(--s))}}
.jg-bt3-slot.llega{animation:jg-bt3-llega .9s calc(.7s - var(--edad,0s)) cubic-bezier(.2,.9,.3,1.3) both}
@keyframes jg-bt3-llega{0%{opacity:0;transform:translateX(-30px);text-shadow:0 0 0 transparent}60%{opacity:1;text-shadow:0 0 14px #ffd21f;background:#ff8a0055}100%{transform:none}}
.jg-bt3-copa.corona{animation:jg-bt3-copa-brilla 2.4s calc(.4s - var(--edad,0s)) both}
@keyframes jg-bt3-copa-brilla{0%{box-shadow:0 0 0 #ffd21f00}30%{box-shadow:0 0 60px 10px #ffd21fcc}100%{box-shadow:0 0 24px #ffd21f55}}
.jg-bt3-copa.corona .jg-bt3-campeon .jg-bt3-ava{animation:jg-bt3-trofeo 1.2s calc(.3s - var(--edad,0s)) cubic-bezier(.3,1.6,.5,1) both}
@keyframes jg-bt3-trofeo{0%{opacity:0;transform:translateY(-40px) scale(.3)}100%{opacity:1;transform:none}}
.jg-bt3-copa.corona .jg-bt3-corona{animation:jg-bt3-cae-corona 1.1s calc(1.2s - var(--edad,0s)) cubic-bezier(.3,1.5,.5,1) both}
.jg-bt3-copa.corona b{animation:jg-bt3-llega 1s calc(1.5s - var(--edad,0s)) both}
@media(prefers-reduced-motion:no-preference){.jg-bt3-copa.gana .jg-bt3-rayos{animation:jg-bt3-gira 14s linear infinite}}
@keyframes jg-bt3-gira{to{transform:rotate(360deg)}}
.jg-bt3-luchador .jg-bt3-boom{left:50%;top:52px}
.jg-bt3-luchador.revienta{animation:jg-bt3-carta-revienta 1.4s calc(0s - var(--edad,0s)) both}
@keyframes jg-bt3-carta-revienta{0%{transform:none}6%,14%{transform:translateX(-7px) rotate(-1deg)}10%,18%{transform:translateX(7px) rotate(1deg)}
  24%{filter:brightness(2.2);transform:scale(1.03)}32%{filter:grayscale(.8) brightness(.6);transform:scale(.97)}100%{filter:none;transform:none}}
.jg-bt3-luchador.revienta .jg-bt3-ava{animation:jg-bt3-ava-golpe 1.4s calc(0s - var(--edad,0s)) both}
@keyframes jg-bt3-ava-golpe{0%,22%{filter:none;transform:none}26%{filter:brightness(3);transform:scale(1.25)}36%{filter:grayscale(1);transform:scale(.8) rotate(-12deg)}100%{filter:none;transform:none}}
.jg-bt3-luchador.brilla{animation:jg-bt3-brilla 3s calc(0s - var(--edad,0s)) ease-out both}
@keyframes jg-bt3-brilla{0%{box-shadow:0 0 0 #ffd21f00}20%{box-shadow:0 0 50px 8px #ffd21fcc;border-color:#ffd21f;transform:scale(1.03)}100%{transform:none}}
/* el comienzo de una pelea (presentaPelea en bt3.js): fijo a la pantalla, encima del marco del juego. Las dos
   fotos entran por los lados, chocan a los 0,5 s (destello y temblor) y cae «¡A PELEAR!»; dura 2,7 s */
.jg-bt3-choque{position:fixed;inset:0;z-index:75;pointer-events:none;overflow:hidden;isolation:isolate;
  background:radial-gradient(ellipse at 50% 45%,#0b1a48cc,#000000e6 75%);animation:jg-bt3-choque-capa 2.7s ease both}
@keyframes jg-bt3-choque-capa{0%{opacity:0}8%{opacity:1}86%{opacity:1}100%{opacity:0}}
.jg-bt3-choque .jg-bt3-rayos{position:absolute;inset:-40%;opacity:0;z-index:-1;animation:jg-bt3-gira 9s linear infinite,jg-bt3-aparece .4s .5s both}
@keyframes jg-bt3-aparece{to{opacity:.2}}
.jg-bt3-choque>.l,.jg-bt3-choque>.r{position:absolute;top:40%;display:grid;justify-items:center;gap:10px;transform:translateY(-50%)}
